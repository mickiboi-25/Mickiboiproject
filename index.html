      // Submit Pop-up Modal IN / OUT Transaction
      function submitModalTransaction(kind) {
        const type = kind || state.activeTxKind || 'incoming';
        const isOut = type === 'outgoing';
        const staffWh = getStaffAssignedWarehouse();
        const domWh = document.getElementById('modalTxWarehouse')?.value;
        const warehouse = isWarehouseScoped()
          ? staffWh
          : (domWh || state.transactionWarehouse || 'Gudang Utama');
        const dateInput = document.getElementById('modalTxDate')?.value || state.transactionDate || new Date().toISOString().split('T')[0];
        const partyInput = document.getElementById('modalTxParty')?.value || state.transactionParty || '';
        const refInput = document.getElementById('modalTxRef')?.value || state.transactionRef || '';
        const notesInput = document.getElementById('modalTxNotes')?.value || state.transactionNotes || '';

        const lineProducts = (state.transactionLines || []).map(l => ({
        const txNo = generateCustomTransactionNo(isOut ? 'out' : 'in', dateInput);
        const totalQty = lineProducts.reduce((s, l) => s + Number(l.qty), 0);
        const currentUser = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');

        // Apply Stock Mutatations
        lineProducts.forEach(line => {
          if (!line.product.stocks || typeof line.product.stocks !== 'object') line.product.stocks = {};
          const matchedKey = Object.keys(line.product.stocks).find(k => k.trim().toLowerCase() === warehouse.trim().toLowerCase()) || warehouse;
          const curStock = Number(line.product.stocks[matchedKey]) || 0;
          if (isOut) {
            line.product.stocks[matchedKey] = Math.max(0, curStock - Number(line.qty));
          } else {
            line.product.stocks[matchedKey] = curStock + Number(line.qty);
          }
          // Ledger entry
          store.stockLedger.unshift({
            id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
            date: getNowFormatted(),
            productId: line.product.id,
            warehouse,
            type: isOut ? 'OUT' : 'IN',
            qty: Number(line.qty),
            balanceAfter: line.product.stocks[matchedKey],
            refNo: txNo,
            user: currentUser,
            notes: notesInput || (isOut ? `Keluar ke ${partyInput || 'Customer'}` : `Masuk dari ${partyInput || 'Supplier'}`)
          });
        });

        // Add Transaction record
        const newTx = {
          id: 'TX' + Date.now(),
          transaction_no: txNo,
          no: txNo,
          type: isOut ? 'Barang Keluar' : 'Barang Masuk',
          date: getNowFormatted(),
          warehouse,
          items: lineProducts.length,
          qty: totalQty,
          user: currentUser,
          status: 'Posted',
          party: partyInput,
          refNo: refInput,
          notes: notesInput,
          photo: state.transactionPhoto || '',
          details: lineProducts.map(l => ({
            productId: l.product.id,
            name: l.product.name,
            sku: l.product.sku,
            qty: Number(l.qty),
            unit: l.product.unit
          }))
        };

        store.transactions.unshift(newTx);
        addAuditLog('POST', `Transaksi ${isOut ? 'OUT' : 'IN'}`, txNo, `Mencatat ${lineProducts.length} barang (${totalQty} unit) di ${warehouse}`);
        updateNotifBadge();
        saveStore(); // Pastikan tersimpan ke LocalStorage secara persisten

        // Granular Cloud Sync: Kirim langsung transaksi ini secara atomik (Anti-Overwrite)
        syncGranularTransaction(newTx, lineProducts.map(l => ({
          id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
          date: getNowFormatted(),
          productId: l.product.id,
          warehouse,
          type: isOut ? 'OUT' : 'IN',
          qty: Number(l.qty),
          balanceAfter: l.product.stocks[warehouse] || 0,
          refNo: txNo,
          user: currentUser,
          notes: notesInput || (isOut ? `Keluar ke ${partyInput || 'Customer'}` : `Masuk dari ${partyInput || 'Supplier'}`)
        })));

        // Reset lines
        state.transactionLines = [];
        state.transactionParty = '';
        state.transactionRef = '';
        state.transactionNotes = '';
        state.transactionPhoto = '';

        // Show Success Modal
        openModal(`
          <div class="modal-body">
            <div class="success-visual">${icon('check')}</div>
            <div class="success-copy">
              <h2 id="modalTitle">Transaksi Berhasil Disimpan</h2>
              <p>Stok gudang telah diperbarui secara otomatis.</p>
            </div>
            <div class="receipt">
              <div class="receipt-row"><span>Nomor Transaksi</span><strong>${txNo}</strong></div>
              <div class="receipt-row"><span>Jenis Transaksi</span><strong>${isOut ? 'Barang Keluar' : 'Barang Masuk'}</strong></div>
              <div class="receipt-row"><span>Lokasi Gudang</span><strong>${warehouse}</strong></div>
              <div class="receipt-row"><span>Pihak Terkait</span><strong>${partyInput || '-'}</strong></div>
              <div class="receipt-row"><span>Total Kuantitas</span><strong>${totalQty} unit (${lineProducts.length} SKU)</strong></div>
              <div class="receipt-row"><span>Status</span><strong style="color:var(--brand-600)">Posted</strong></div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" onclick="window.print()">${icon('printer')} Cetak Bukti</button>
            <button class="btn btn-primary" data-action="close-modal">Selesai</button>
          </div>
        `);
        render();
      }

        submitModalTransaction(kind);

      function executeNewTransfer() {
        if (!hasActionPerm('transfer_create')) {
          return showToast('Akses Dibatasi', 'Role Anda tidak memiliki izin untuk membuat transfer gudang.', true);
        }
        const fromWh = document.getElementById('trfFrom')?.value || state.transferFromWarehouse;
        const toWh = document.getElementById('trfTo')?.value || state.transferToWarehouse;
        const refNo = (document.getElementById('trfRef')?.value ?? state.transferRefNo ?? '').trim();
        const notes = (document.getElementById('trfNotes')?.value ?? state.transferNotes ?? '').trim();

        if (!fromWh || !toWh) {
          return showToast('Gudang Belum Dipilih', 'Pilih gudang asal dan gudang tujuan.', true);
        }
        if (fromWh === toWh) {
          return showToast('Rute Tidak Valid', 'Gudang asal dan gudang tujuan harus berbeda.', true);
        }

        const lines = (state.transferLines || []).map(l => {
          const prod = store.products.find(p => p.id === l.productId);
          return prod ? { productId: prod.id, sku: prod.sku, name: prod.name, unit: prod.unit, qty: Number(l.qty || 0), prod } : null;
        }).filter(Boolean);

        if (lines.length === 0) {
          return showToast('Daftar Kosong', 'Tambahkan minimal 1 barang untuk ditransfer.', true);
        }

        for (const l of lines) {
          const avail = getProductWarehouseStock(l.prod, fromWh);
          if (l.qty <= 0 || l.qty > avail) {
            return showToast('Stok Tidak Cukup', `Stok ${l.name} di ${fromWh} hanya ${avail} ${l.unit}.`, true);
          }
        }

        const trfNo = generateCustomTransactionNo('transfer');
        const dateStr = getNowFormatted();
        const user = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');
        const totalQty = lines.reduce((s, l) => s + l.qty, 0);
        const ledgerEntries = [];

        lines.forEach(l => {
          if (!l.prod.stocks) l.prod.stocks = {};
          l.prod.stocks[fromWh] = Math.max(0, Number(l.prod.stocks[fromWh] || 0) - l.qty);
          const entry = {
            id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
            date: dateStr,
            productId: l.productId,
            warehouse: fromWh,
            type: 'TRANSFER_OUT',
            qty: l.qty,
            balanceAfter: l.prod.stocks[fromWh],
            refNo: trfNo,
            user,
            notes: `Transfer ke ${toWh}`
          };
          store.stockLedger.unshift(entry);
          ledgerEntries.push(entry);
        });

        const cleanLines = lines.map(({ prod, ...rest }) => rest);
        const trfObj = {
          id: 'TRF' + Date.now(),
          no: trfNo,
          date: dateStr,
          fromWarehouse: fromWh,
          toWarehouse: toWh,
          items: cleanLines.length,
          qty: totalQty,
          user,
          status: 'In Transit',
          refNo,
          notes,
          photo: state.transferPhoto || '',
          lines: cleanLines
        };
        store.transfers.unshift(trfObj);

        const txRecord = {
          id: 'TX' + Date.now(),
          transaction_no: trfNo,
          no: trfNo,
          type: 'Transfer Gudang',
          date: dateStr,
          warehouse: `${fromWh} → ${toWh}`,
          party: toWh,
          refNo,
          notes,
          photo: state.transferPhoto || '',
          items: cleanLines.length,
          qty: totalQty,
          user,
          status: 'In Transit',
          details: cleanLines
        };
        store.transactions.unshift(txRecord);

        addAuditLog('TRANSFER', 'Transfer Gudang', trfNo, `Mengirim ${totalQty} unit (${cleanLines.length} SKU) dari ${fromWh} ke ${toWh}`);
        syncGranularTransaction(txRecord, ledgerEntries);
        saveStore();
        closeModal();
        showToast('Transfer Dikirim', `Surat jalan ${trfNo} (${totalQty} unit) berstatus In Transit ke ${toWh}.`);
        render();
      }

      function executeReceiveTransfer(transferId) {
        if (!hasActionPerm('transfer_receive')) {
          return showToast('Akses Dibatasi', 'Role Anda tidak memiliki izin untuk menerima transfer barang.', true);
        }
        const checkbox = document.getElementById('confirmReceiveCheckbox');
        if (!checkbox || !checkbox.checked) {
          return showToast('Konfirmasi Diperlukan', 'Centang kotak konfirmasi penerimaan fisik terlebih dahulu.', true);
        }

        const trf = store.transfers.find(t => t.id === transferId);
        if (!trf) return;

        trf.status = 'Posted';
        const user = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');

        // Update corresponding transaction in transactions list
        const tx = store.transactions.find(t => t.no === trf.no);
        if (tx) tx.status = 'Posted';

        // Add stocks to destination warehouse & log ledger
        (trf.lines || []).forEach(line => {
          const prod = store.products.find(p => p.id === line.productId);
          if (prod) {
            if (!prod.stocks[trf.toWarehouse]) prod.stocks[trf.toWarehouse] = 0;
            prod.stocks[trf.toWarehouse] += Number(line.qty);

            store.stockLedger.unshift({
              id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
              date: getNowFormatted(),
              productId: prod.id,
              warehouse: trf.toWarehouse,
              type: 'TRANSFER_IN',
              qty: line.qty,
              balanceAfter: prod.stocks[trf.toWarehouse],
              refNo: trf.no,
              user,
              notes: `Penerimaan transfer dari ${trf.fromWarehouse}`
            });
          }
        });

        addAuditLog('RECEIVE', 'Transfer Gudang', trf.no, `Menerima transfer ${trf.qty} unit di ${trf.toWarehouse}`);
        saveStore();
        closeModal();
        showToast('Barang Diterima', `Stok ${trf.toWarehouse} telah bertambah ${trf.qty} unit.`);
        render();
      }

      function executeSaveOpname() {
        const wh = document.getElementById('activeOpnameWh')?.value;
        const notes = document.getElementById('activeOpnameNotes')?.value || 'Opname berkala';
        const inputs = document.querySelectorAll('.opname-phys-input');
        const user = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');
        const isStaff = !hasActionPerm('opname_approve');

        let totalDiff = 0;
        let diffCount = 0;
        const opNo = generateCustomTransactionNo('opname');
        const opItems = [];

        inputs.forEach(inp => {
          const pid = inp.dataset.prodId;
          const sys = Number(inp.dataset.sys || 0);
          const phys = Number(inp.value || 0);
          const diff = phys - sys;
          const name = inp.dataset.name || '';
          const sku = inp.dataset.sku || '';
          const unit = inp.dataset.unit || 'unit';

          opItems.push({ productId: pid, name, sku, unit, sys, phys, diff });

          if (diff !== 0) {
            totalDiff += diff;
            diffCount++;
            // If admin, mutate stock and write to stock ledger immediately.
            // If staff, stock is untouched until Admin approves.
            if (!isStaff) {
              const prod = store.products.find(p => p.id === pid);
              if (prod) {
                prod.stocks[wh] = phys;
                store.stockLedger.unshift({
                  id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
                  date: getNowFormatted(),
                  productId: prod.id,
                  warehouse: wh,
                  type: diff > 0 ? 'ADJUSTMENT_PLUS' : 'ADJUSTMENT_MINUS',
                  qty: Math.abs(diff),
                  balanceAfter: phys,
                  refNo: opNo,
                  user,
                  notes: `Penyesuaian stok opname (${diff > 0 ? '+' : ''}${diff} ${prod.unit})`
                });
              }
            }
          }
        });

        const initialStatus = isStaff ? 'Menunggu Persetujuan' : 'Posted';

        store.opnames.unshift({
          id: 'OP' + Date.now(),
          transaction_no: opNo,
          no: opNo,
          date: getNowFormatted(),
          warehouse: wh,
          itemsCount: inputs.length,
          totalDiff,
          user,
          status: initialStatus,
          notes,
          items: opItems,
          createdByStaff: isStaff,
          approvedBy: isStaff ? null : user,
          approvalDate: isStaff ? null : getNowFormatted()
        });

        if (!isStaff) {
          store.transactions.unshift({
            id: 'TX' + Date.now(),
            transaction_no: opNo,
            no: opNo,
            type: 'Stok Opname',
            date: getNowFormatted(),
            warehouse: wh,
            items: inputs.length,
            qty: totalDiff,
            user,
            status: 'Posted',
            refNo: opNo,
            notes
          });

      function approveOpname(opId) {
        if (!hasActionPerm('opname_approve')) {
          return showToast('Akses Dibatasi', 'Role Anda tidak memiliki izin untuk menyetujui stok opname.', true);
        }
        const op = store.opnames.find(x => x.id === opId);
        if (!op) return;
        if (op.status === 'Posted') {
          return showToast('Sudah Diposting', 'Sesi opname ini sudah disetujui sebelumnya.');
        }

        const adminUser = state.currentUser ? state.currentUser.name : 'Administrator';
        const wh = op.warehouse;
        let diffCount = 0;

        (op.items || []).forEach(item => {
          const physVal = item.phys !== undefined ? Number(item.phys) : Number(item.physicalQty || 0);
          if (item.diff !== 0) {
            diffCount++;
            const prod = store.products.find(p => p.id === item.productId || (item.sku && p.sku === item.sku));
            if (prod) {
              if (!prod.stocks[wh]) prod.stocks[wh] = 0;
              prod.stocks[wh] = physVal;
              store.stockLedger.unshift({
                id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
                date: getNowFormatted(),
                productId: prod.id,
                warehouse: wh,
                type: item.diff > 0 ? 'ADJUSTMENT_PLUS' : 'ADJUSTMENT_MINUS',
                qty: Math.abs(item.diff),
                balanceAfter: physVal,
                refNo: op.no,
                user: adminUser,
                notes: `Persetujuan stok opname ${op.no}`
              });
            }
          }
        });

        op.status = 'Posted';
        op.approvedBy = adminUser;
        op.approvalDate = getNowFormatted();

        if (!store.transactions.some(t => t.no === op.no)) {
          store.transactions.unshift({
            id: 'TX' + Date.now(),
            transaction_no: op.no,
            no: op.no,
            type: 'Stok Opname',
            date: op.date,
            warehouse: wh,
            items: op.itemsCount,
            qty: op.totalDiff,
            user: op.user,
            status: 'Posted',
            refNo: op.no,
            notes: op.notes
          });
        }

        addAuditLog('OPNAME_APPROVED', 'Stok Opname', op.no, `Admin (${adminUser}) menyetujui opname di ${wh} (${diffCount} SKU disesuaikan)`);
        saveStore();
        closeModal();
        showToast('Opname Disetujui', `Stok opname ${op.no} disetujui & saldo stok di ${wh} telah diperbarui.`);
        render();
      }

      function executeSaveEditOpname() {
        const opId = document.getElementById('editOpnameId')?.value;
        const op = store.opnames.find(x => x.id === opId);
        if (!op) return;

        const newDate = document.getElementById('editOpnameDate')?.value || op.date;
        const newNotes = document.getElementById('editOpnameNotes')?.value || '';
        const user = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');
        const isPosted = op.status === 'Posted';

        // 1. Revert previous stock adjustment made by this opname (only if already posted)
        if (isPosted) {
          (op.items || []).forEach(it => {
            const prod = store.products.find(p => p.id === it.productId || (it.sku && p.sku === it.sku));
            if (prod && it.diff !== 0) {
              if (!prod.stocks[op.warehouse]) prod.stocks[op.warehouse] = 0;
              prod.stocks[op.warehouse] -= Number(it.diff || 0);
            }
          });
        }

        // 2. Read new inputs & apply new adjustment
        let newTotalDiff = 0;
        const newItems = [];
        const inputs = document.querySelectorAll('.opname-edit-phys-input');

        inputs.forEach(inp => {
          const idx = Number(inp.dataset.idx);
          const it = op.items[idx];
          if (!it) return;
          const sysVal = it.sys !== undefined ? Number(it.sys) : Number(it.systemQty || 0);
          const newPhys = Number(inp.value || 0);
          const newDiff = newPhys - sysVal;
          newTotalDiff += newDiff;

          newItems.push({
            productId: it.productId,
            name: it.name,
            sku: it.sku,
            unit: it.unit,
            sys: sysVal,
            phys: newPhys,
            systemQty: sysVal,
            physicalQty: newPhys,
            diff: newDiff
          });

          if (isPosted) {
            const prod = store.products.find(p => p.id === it.productId || (it.sku && p.sku === it.sku));
            if (prod) {
              prod.stocks[op.warehouse] = newPhys;
              if (newDiff !== 0) {
                store.stockLedger.unshift({
                  id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
                  date: getNowFormatted(),
                  productId: prod.id,
                  warehouse: op.warehouse,
                  type: newDiff > 0 ? 'ADJUSTMENT_PLUS' : 'ADJUSTMENT_MINUS',
                  qty: Math.abs(newDiff),
                  balanceAfter: newPhys,
                  refNo: op.no,
                  user,
                  notes: `Koreksi edit stok opname (${newDiff > 0 ? '+' : ''}${newDiff} ${prod.unit})`
                });
              }
            }
          }
        });

        // 3. Update opname record
        op.date = newDate;
        op.notes = newNotes;
        op.items = newItems;
        op.totalDiff = newTotalDiff;

        // Update in transactions list if present
        const tx = store.transactions.find(t => t.no === op.no);
        if (tx) {
          tx.date = newDate;
          tx.qty = newTotalDiff;
          tx.notes = newNotes;
        }

        addAuditLog('UPDATE', 'Stok Opname', op.no, `Memperbarui sesi opname di ${op.warehouse} (Total selisih baru: ${newTotalDiff > 0 ? '+' : ''}${newTotalDiff} unit)`);
        saveStore();
        closeModal();
        showToast('Opname Diperbarui', `Sesi ${op.no} berhasil diperbarui dan saldo fisik telah disesuaikan.`);
        render();
      }

      function confirmExecuteDeleteOpname(opId) {
        if (!hasActionPerm('opname_approve')) {
          return showToast('Akses Dibatasi', 'Role Anda tidak memiliki izin untuk menghapus sesi stok opname.', true);
        }
        const idx = store.opnames.findIndex(x => x.id === opId);
        if (idx === -1) return;

        const op = store.opnames[idx];
        const user = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');

        // Rollback stock adjustments only if opname was actually posted
        if (op.status === 'Posted') {
          (op.items || []).forEach(it => {
            const prod = store.products.find(p => p.id === it.productId);
            if (prod && it.diff !== 0) {
              if (!prod.stocks[op.warehouse]) prod.stocks[op.warehouse] = 0;
              prod.stocks[op.warehouse] -= it.diff; // revert to original sys

              store.stockLedger.unshift({
                id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
                date: getNowFormatted(),
                productId: prod.id,
                warehouse: op.warehouse,
                type: it.diff > 0 ? 'ADJUSTMENT_MINUS' : 'ADJUSTMENT_PLUS',
                qty: Math.abs(it.diff),
                balanceAfter: prod.stocks[op.warehouse],
                refNo: `CANCEL-${op.no}`,
                user,
                notes: `Rollback penghapusan opname ${op.no}`
              });
            }
          });
        }

        store.opnames.splice(idx, 1);

        // Remove from transactions list if exists
        const txIdx = store.transactions.findIndex(t => t.no === op.no);
        if (txIdx !== -1) store.transactions.splice(txIdx, 1);

        markRecordDeleted('opnames', op.id, op.no || op.transaction_no);
        markRecordDeleted('transactions', op.no, op.transaction_no || op.id);
        removeOfflineQueueItem(op.no);
        removeOfflineQueueItem(op.id);

        addAuditLog('DELETE', 'Stok Opname', op.no, `Menghapus sesi opname ${op.no} (${op.status}) di ${op.warehouse}`);
        saveStore();
        closeModal();
        showToast('Stok Opname Dihapus', `Sesi ${op.no} telah dihapus dari sistem.`);
        render();
      }

      function executeSaveCategory() {
        const id = document.getElementById('catFormId')?.value;
        const code = document.getElementById('catFormCode')?.value.trim().toUpperCase();
        const name = document.getElementById('catFormName')?.value.trim();
        const desc = document.getElementById('catFormDesc')?.value.trim();

        if (!name) {
          return showToast('Validasi Gagal', 'Nama kategori wajib diisi.', true);
        }

        // Duplicate name check
        const dup = store.categories.find(c => c.name.toLowerCase() === name.toLowerCase() && c.id !== id);
        if (dup) {
          return showToast('Nama Duplikat', `Kategori "${name}" sudah ada. Gunakan nama lain.`, true);
        }

        if (id) {
          const cat = store.categories.find(c => c.id === id);
          if (cat) {
            const oldName = cat.name;
            cat.code = code || name.slice(0, 3).toUpperCase();
            cat.name = name;
            cat.description = desc;

            // Synchronize product category if renamed
            if (oldName !== name) {
              store.products.forEach(p => {
                if (p.category === oldName) p.category = name;
              });
            }

            addAuditLog('UPDATE', 'Kategori Barang', cat.code, `Memperbarui kategori: ${name}`);
            showToast('Kategori Diperbarui', `Kategori "${name}" berhasil disimpan.`);
          }
        } else {
          const newId = 'CAT' + String(store.categories.length + 1).padStart(2, '0');
          const finalCode = code || name.slice(0, 3).toUpperCase();
          store.categories.push({
            id: newId,
            code: finalCode,
            name,
            description: desc
          });
          addAuditLog('CREATE', 'Kategori Barang', finalCode, `Menambahkan kategori baru: ${name}`);
          showToast('Kategori Ditambahkan', `Kategori "${name}" berhasil dibuat.`);
        }

        saveStore();
        closeModal();
        render();
      }

      function executeDeleteCategory(catId) {
        const cat = store.categories.find(c => c.id === catId);
        if (!cat) return;

        const usingProducts = store.products.filter(p => p.category === cat.name);
        if (usingProducts.length > 0) {
          return openModal(`

      function executeSaveProduct() {
        const id = document.getElementById('prodFormId')?.value;
        const sku = document.getElementById('prodFormSku')?.value.trim();
        const barcode = document.getElementById('prodFormBarcode')?.value.trim() || sku;
        const name = document.getElementById('prodFormName')?.value.trim();
        const category = document.getElementById('prodFormCat')?.value;
        const unit = document.getElementById('prodFormUnit')?.value;
        const minVal = Math.max(0, Number(document.getElementById('prodFormMin')?.value) || 0);
        const active = document.getElementById('prodFormActive')?.value === 'true';

        if (!sku || !name) {
          return showToast('Validasi Gagal', 'SKU dan Nama Barang wajib diisi.', true);
        }

        // Duplicate SKU check
        const dupSku = store.products.find(p => p.sku.toLowerCase() === sku.toLowerCase() && p.id !== id);
        if (dupSku) {
          return showToast('SKU Duplikat', `SKU "${sku}" sudah digunakan oleh barang ${dupSku.name}. Gunakan SKU lain.`, true);
        }

        if (id) {
          const p = store.products.find(x => x.id === id);
          if (p) {
            p.sku = sku;
            p.barcode = barcode;
            p.name = name;
            p.category = category;
            p.unit = unit;
            p.min = minVal;
            p.minStock = minVal;
            p.active = active;
            p.photo = state.productPhoto || '';
            p.foto = state.productPhoto || '';
            addAuditLog('UPDATE', 'Master Barang', sku, `Memperbarui barang: ${name}`);
            showToast('Barang Diperbarui', `Data barang ${name} berhasil disimpan.`);
          }
        } else {
          const newId = 'P' + String(store.products.length + 1).padStart(3, '0');
          const initialStocks = {};
          store.warehouses.forEach(w => { initialStocks[w.name] = 0; });
          store.products.push({
            id: newId,
            sku,
            barcode,
            name,
            category,
            unit,
            min: minVal,
            minStock: minVal,
            stocks: initialStocks,
            active,
            photo: state.productPhoto || '',
            foto: state.productPhoto || ''

          addAuditLog('CREATE', 'Master Barang', sku, 'Menambahkan barang baru: ' + name);
          showToast('Barang Ditambahkan', 'Barang ' + name + ' berhasil dibuat.');
        }

        state.productPhoto = '';
        saveStore();
        closeModal();
        render();
      }

      function executeSaveEditTransaction() {
        if (!hasActionPerm('tx_edit_delete')) {
          return showToast('Akses Dibatasi', 'Role Anda tidak memiliki hak akses untuk mengubah transaksi.', true);
        }
        const txNo = document.getElementById('editTxNo')?.value || state.editTxTargetNo;
        const tx = store.transactions.find(t => t.no === txNo);
        if (!tx) return;

        const newDate = document.getElementById('editTxDate')?.value.trim() || state.editTxDate;
        const newWh = document.getElementById('editTxWarehouse')?.value || state.editTxWarehouse;
        const newParty = document.getElementById('editTxParty')?.value.trim() ?? state.editTxParty;
        const newRef = document.getElementById('editTxRef')?.value.trim() ?? state.editTxRef;
        const newNotes = document.getElementById('editTxNotes')?.value.trim() ?? state.editTxNotes;

        const lineProducts = (state.editTxLines || []).map(l => ({
          ...l,
          product: store.products.find(p => p.id === l.productId)
        })).filter(l => l.product && Number(l.qty) > 0);

        if (!lineProducts.length) {
          return showToast('Form Belum Lengkap', 'Tambahkan minimal 1 barang dengan kuantitas lebih dari 0.', true);
        }

        const isOut = tx.type === 'Barang Keluar';
        const isIn = tx.type === 'Barang Masuk';
        const user = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');
        const oldWh = tx.warehouse;
        const oldLines = tx.details && tx.details.length > 0
          ? tx.details
          : (tx.productId ? [{ productId: tx.productId, qty: tx.qty, name: tx.productName || 'Barang' }] : []);

        // Snapshot original stock state before rollback in case validation fails
        const originalStockSnapshot = {};
        store.products.forEach(p => {
          originalStockSnapshot[p.id] = { ...p.stocks };
        });

        // 1. Rollback old stock impact
        oldLines.forEach(l => {
          const prod = store.products.find(p => p.id === l.productId || p.sku === l.sku);
          if (prod && oldWh) {
            if (!prod.stocks[oldWh]) prod.stocks[oldWh] = 0;
            if (isIn) {
              prod.stocks[oldWh] = Math.max(0, prod.stocks[oldWh] - Number(l.qty));
            } else if (isOut) {
              prod.stocks[oldWh] += Number(l.qty);
            }
          }
        });

        // 2. Validate new outgoing stock if negative stock is rejected
        if (isOut && store.settings.rejectNegativeStock) {
          for (const line of lineProducts) {
            const avail = line.product.stocks[newWh] || 0;
            if (line.qty > avail) {
              // Restore from snapshot
              store.products.forEach(p => {
                p.stocks = { ...originalStockSnapshot[p.id] };
              });
              return showToast('Stok Tidak Mencukupi', `Barang ${line.product.name} hanya memiliki stok ${avail} ${line.product.unit} di ${newWh}.`, true);
            }
          }
        }

        // 3. Apply new stock changes & create ledger entries
        const newDetails = [];
        let newTotalQty = 0;

        lineProducts.forEach(line => {
          const qty = Number(line.qty);
          newTotalQty += qty;
          if (!line.product.stocks[newWh]) line.product.stocks[newWh] = 0;

          if (isIn) {
            line.product.stocks[newWh] += qty;
          } else if (isOut) {
            line.product.stocks[newWh] -= qty;
          }

          newDetails.push({
            productId: line.product.id,
            name: line.product.name,
            sku: line.product.sku,
            qty,
            unit: line.product.unit
          });

          store.stockLedger.unshift({
            id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
            date: getNowFormatted(),
            productId: line.product.id,
            warehouse: newWh,
            type: isIn ? 'IN' : 'OUT',
            qty,
            balanceAfter: line.product.stocks[newWh],
            refNo: tx.no,
            user,
            notes: `Penyesuaian edit transaksi ${tx.no} (${newWh})`
          });
        });

        // 4. Update transaction document
        if (newDate) {
          tx.date = newDate.includes('-')
            ? (() => {
              const parts = newDate.split('-');
              return `${parts[2]}/${parts[1]}/${parts[0]} ${new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace(':', '.')}`;
            })()
            : newDate;
        }
        tx.warehouse = newWh;
        tx.party = newParty;
        tx.refNo = newRef;
        tx.notes = newNotes;
        tx.photo = state.editTxPhoto || '';
        tx.qty = newTotalQty;
        tx.items = newDetails.length;
        tx.details = newDetails;

        addAuditLog('UPDATE_TX', tx.type, tx.no, `Memperbarui transaksi ${tx.no}: ${newDetails.length} SKU (${newTotalQty} unit) di ${newWh}`);
        saveStore();
        closeModal();
        showToast('Transaksi Berhasil Diperbarui', `Data transaksi ${tx.no} dan stok barang telah disesuaikan.`);
        render();
      }

      function confirmExecuteDeleteTransaction(txIdOrNo) {
        if (!hasActionPerm('tx_edit_delete')) {
          return showToast('Akses Dibatasi', 'Role Anda tidak memiliki hak akses untuk menghapus transaksi.', true);
        }
        const txIndex = store.transactions.findIndex(t => t.no === txIdOrNo || t.id === txIdOrNo || t.transaction_no === txIdOrNo);
        if (txIndex === -1) return;
        const tx = store.transactions[txIndex];
        const user = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');

        // Rollback stocks
        const lines = tx.details && tx.details.length > 0
          ? tx.details
          : (tx.productId ? [{ productId: tx.productId, qty: tx.qty, name: tx.productName || 'Barang' }] : []);

        lines.forEach(line => {
          const prod = store.products.find(p => p.id === line.productId || p.sku === line.sku);
          if (prod && tx.warehouse) {
            if (prod.stocks[tx.warehouse] === undefined) prod.stocks[tx.warehouse] = 0;
            if (tx.type === 'Barang Masuk') {
              // Rollback incoming: decrease stock
              prod.stocks[tx.warehouse] = Math.max(0, prod.stocks[tx.warehouse] - Number(line.qty));
              store.stockLedger.unshift({
                id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
                date: getNowFormatted(),
                productId: prod.id,
                warehouse: tx.warehouse,
                type: 'ADJUSTMENT_MINUS',
                qty: Number(line.qty),
                balanceAfter: prod.stocks[tx.warehouse],
                refNo: `DEL-${tx.no}`,
                user,
                notes: `Rollback penghapusan transaksi ${tx.no}`
              });
            } else if (tx.type === 'Barang Keluar') {
              // Rollback outgoing: restore stock
              prod.stocks[tx.warehouse] += Number(line.qty);
              store.stockLedger.unshift({
                id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
                date: getNowFormatted(),
                productId: prod.id,
                warehouse: tx.warehouse,
                type: 'ADJUSTMENT_PLUS',
                qty: Number(line.qty),
                balanceAfter: prod.stocks[tx.warehouse],
                refNo: `DEL-${tx.no}`,
                user,
                notes: `Rollback pengembalian stok transaksi ${tx.no}`
              });
            }
          }
        });

        // Catat di tombstone agar tidak dibangkitkan kembali oleh sinkronisasi cloud
        markRecordDeleted('transactions', tx.no, tx.transaction_no || tx.id);
        removeOfflineQueueItem(tx.no);
        removeOfflineQueueItem(tx.transaction_no);
        removeOfflineQueueItem(tx.id);

        store.transactions.splice(txIndex, 1);
        addAuditLog('DELETE_TX', tx.type, tx.no, `Menghapus transaksi ${tx.no} (${tx.qty} unit di ${tx.warehouse}) & rollback saldo stok`);
        saveStore();
        closeModal();
        showToast('Transaksi Dihapus', `Transaksi ${tx.no} telah dihapus dan saldo stok telah disesuaikan.`);
        render();
      }

      window.confirmExecuteDeleteTransaction = confirmExecuteDeleteTransaction;

      function executeSaveEditTransfer() {
        if (!hasActionPerm('tx_edit_delete')) {
          return showToast('Akses Dibatasi', 'Role Anda tidak memiliki hak akses untuk mengubah transfer.', true);
        }
        const trfId = document.getElementById('editTrfId')?.value || state.editTransferId;
        const trf = store.transfers.find(t => t.id === trfId);
        if (!trf) return;

        const newFromWh = document.getElementById('editTrfFrom')?.value || state.editTransferFrom;
        const newToWh = document.getElementById('editTrfTo')?.value || state.editTransferTo;
        const newDate = document.getElementById('editTrfDate')?.value.trim() || state.editTransferDate;
        const newRef = document.getElementById('editTrfRef')?.value.trim() ?? state.editTransferRef;
        const newNotes = document.getElementById('editTrfNotes')?.value.trim() ?? state.editTransferNotes;

        if (newFromWh === newToWh) {
          return showToast('Rute Tidak Valid', 'Gudang asal dan gudang tujuan tidak boleh sama.', true);
        }

        const lineItems = (state.editTransferLines || []).map(l => ({
          ...l,
          product: store.products.find(p => p.id === l.productId)
        })).filter(l => l.product && Number(l.qty) > 0);

        if (!lineItems.length) {
          return showToast('Form Belum Lengkap', 'Tambahkan minimal 1 barang dengan kuantitas lebih dari 0.', true);
        }

        const user = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');
        const oldFromWh = trf.fromWarehouse;
        const oldToWh = trf.toWarehouse;
        const oldStatus = trf.status;
        const oldLines = trf.lines && trf.lines.length > 0 ? trf.lines : [{ productId: trf.productId, qty: trf.qty }];

        // Snapshot original stocks
        const originalStockSnapshot = {};
        store.products.forEach(p => {
          originalStockSnapshot[p.id] = { ...p.stocks };
        });

        // 1. Rollback old transfer stocks
        oldLines.forEach(l => {
          const prod = store.products.find(p => p.id === l.productId || p.sku === l.sku);
          if (prod) {
            if (!prod.stocks[oldFromWh]) prod.stocks[oldFromWh] = 0;
            if (!prod.stocks[oldToWh]) prod.stocks[oldToWh] = 0;

            if (oldStatus === 'In Transit') {
              prod.stocks[oldFromWh] += Number(l.qty);
            } else if (oldStatus === 'Posted') {
              prod.stocks[oldFromWh] += Number(l.qty);
              prod.stocks[oldToWh] = Math.max(0, prod.stocks[oldToWh] - Number(l.qty));
            }
          }
        });

        // 2. Validate new stock in newFromWh
        if (store.settings.rejectNegativeStock) {
          for (const line of lineItems) {
            const avail = line.product.stocks[newFromWh] || 0;
            if (line.qty > avail) {
              // Revert to snapshot
              store.products.forEach(p => {
                p.stocks = { ...originalStockSnapshot[p.id] };
              });
              return showToast('Stok Tidak Mencukupi', `Barang ${line.product.name} hanya memiliki stok ${avail} ${line.product.unit} di ${newFromWh}.`, true);
            }
          }
        }

        // 3. Apply new transfer stock adjustments
        const newLinesToSave = [];
        let newTotalQty = 0;

        lineItems.forEach(line => {
          const qty = Number(line.qty);
          newTotalQty += qty;
          if (!line.product.stocks[newFromWh]) line.product.stocks[newFromWh] = 0;
          if (!line.product.stocks[newToWh]) line.product.stocks[newToWh] = 0;

          if (oldStatus === 'In Transit') {
            line.product.stocks[newFromWh] -= qty;
            store.stockLedger.unshift({
              id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
              date: getNowFormatted(),
              productId: line.product.id,
              warehouse: newFromWh,
              type: 'TRANSFER_OUT',
              qty,
              balanceAfter: line.product.stocks[newFromWh],
              refNo: trf.no,
              user,
              notes: `Koreksi edit transfer dikirim ke ${newToWh}`
            });
          } else if (oldStatus === 'Posted') {
            line.product.stocks[newFromWh] -= qty;
            line.product.stocks[newToWh] += qty;
            store.stockLedger.unshift({
              id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
              date: getNowFormatted(),
              productId: line.product.id,
              warehouse: newFromWh,
              type: 'TRANSFER_OUT',
              qty,
              balanceAfter: line.product.stocks[newFromWh],
              refNo: trf.no,
              user,
              notes: `Koreksi edit transfer dipindahkan ke ${newToWh}`
            });
            store.stockLedger.unshift({
              id: 'L' + (Date.now() + 1) + Math.random().toString(36).substr(2, 4),
              date: getNowFormatted(),
              productId: line.product.id,
              warehouse: newToWh,
              type: 'TRANSFER_IN',
              qty,
              balanceAfter: line.product.stocks[newToWh],
              refNo: trf.no,
              user,
              notes: `Koreksi edit transfer diterima dari ${newFromWh}`
            });
          }

          newLinesToSave.push({
            productId: line.product.id,
            name: line.product.name,
            sku: line.product.sku,
            qty,
            unit: line.product.unit
          });
        });

        // 4. Update transfer document
        if (newDate) {
          trf.date = newDate.includes('-')
            ? (() => {
              const parts = newDate.split('-');
              return `${parts[2]}/${parts[1]}/${parts[0]} ${new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace(':', '.')}`;
            })()
            : newDate;
        }
        trf.fromWarehouse = newFromWh;
        trf.toWarehouse = newToWh;
        trf.refNo = newRef;
        trf.notes = newNotes;
        trf.photo = state.editTransferPhoto || '';
        trf.qty = newTotalQty;
        trf.items = newLinesToSave.length;
        trf.lines = newLinesToSave;

        // 5. Update linked transaction in store.transactions
        const tx = store.transactions.find(t => t.no === trf.no);
        if (tx) {
          tx.warehouse = `${newFromWh} → ${newToWh}`;
          tx.fromWarehouse = newFromWh;
          tx.toWarehouse = newToWh;
          tx.date = trf.date;
          tx.refNo = newRef;
          tx.notes = newNotes;
          tx.photo = state.editTransferPhoto || '';
          tx.qty = newTotalQty;
          tx.items = newLinesToSave.length;
          tx.details = newLinesToSave;
        }

        addAuditLog('UPDATE_TRANSFER', 'Transfer Gudang', trf.no, `Memperbarui transfer ${trf.no}: ${newLinesToSave.length} SKU (${newTotalQty} unit) dari ${newFromWh} ke ${newToWh}`);
        saveStore();
        closeModal();
        showToast('Transfer Berhasil Diperbarui', `Surat jalan ${trf.no} dan mutasi stok antar gudang telah disesuaikan.`);
        render();
      }

      function executeSaveDamaged() {
        const wh = document.getElementById('dmgWarehouse')?.value;
        const prodId = document.getElementById('dmgProduct')?.value;
        const qty = Number(document.getElementById('dmgQty')?.value || 0);
        const issueType = document.getElementById('dmgIssueType')?.value;
        const action = document.getElementById('dmgAction')?.value;
        const refNo = document.getElementById('dmgRef')?.value.trim();
        const notes = document.getElementById('dmgNotes')?.value.trim();

        if (qty <= 0) {
          return showToast('Validasi Gagal', 'Jumlah unit rusak harus lebih dari 0.', true);
        }

        const prod = store.products.find(p => p.id === prodId);
        if (!prod) {
          return showToast('Pilih Barang', 'Pilih barang yang rusak terlebih dahulu.', true);
        }

        const currentStock = prod.stocks[wh] || 0;
        if (qty > currentStock) {
          return showToast('Stok Tidak Cukup', `Stok ${prod.name} di ${wh} hanya ada ${currentStock} ${prod.unit}.`, true);
        }

        // Deduct from stock
        prod.stocks[wh] -= qty;

        const dmgNo = generateCustomTransactionNo('damaged');
        const user = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');

        const newDmg = {
          id: 'DMG' + Date.now(),
          transaction_no: dmgNo,
          no: dmgNo,
          date: getNowFormatted(),
          productId: prod.id,
          productName: prod.name,
          sku: prod.sku,
          warehouse: wh,
          qty,
          unit: prod.unit,
          issueType,
          action,
          refNo,
          notes,
          photo: state.damagedPhoto || '',
          user,
          status: 'Dikonfirmasi'
        };

        if (!store.damagedItems) store.damagedItems = [];
        store.damagedItems.unshift(newDmg);

        // Ledger Entry
        store.stockLedger.unshift({
          id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
          date: getNowFormatted(),
          productId: prod.id,
          warehouse: wh,
          type: 'DAMAGE_OUT',
          qty,
          balanceAfter: prod.stocks[wh],
          refNo: dmgNo,
          user,
          notes: `Barang bermasalah: ${issueType} (${action})`
        });

        addAuditLog('DAMAGE', 'Barang Bermasalah', dmgNo, `Mencatat ${qty} ${prod.unit} ${prod.name} bermasalah di ${wh}: ${issueType}`);
        state.damagedPhoto = '';
        saveStore();
        closeModal();
        showToast('Laporan Tersimpan', `Barang bermasalah ${dmgNo} berhasil dicatat. Stok ${wh} telah dipotong.`);
        render();
      }

      function executeSaveWarehouse() {
        const id = document.getElementById('whFormId')?.value;
        const code = document.getElementById('whFormCode')?.value.trim().toUpperCase();
        const name = document.getElementById('whFormName')?.value.trim();
        const address = document.getElementById('whFormAddress')?.value.trim();
        const active = document.getElementById('whFormActive') ? document.getElementById('whFormActive').value === 'true' : true;

        if (!code || !name) {
          return showToast('Validasi Gagal', 'Kode dan Nama Gudang wajib diisi.', true);
        }

        // Check duplicate name or code
        const dup = store.warehouses.find(w => (w.name.toLowerCase() === name.toLowerCase() || w.code.toLowerCase() === code.toLowerCase()) && w.id !== id);
        if (dup) {
          return showToast('Duplikasi Terdeteksi', `Gudang dengan nama "${name}" atau kode "${code}" sudah terdaftar.`, true);
        }

        if (id) {
          const w = store.warehouses.find(x => x.id === id);
          if (w) {
            const oldName = w.name;
            w.code = code;
            w.name = name;
            w.address = address;
            w.active = active;

            // Synchronize product stocks keys if renamed
            if (oldName !== name) {
              store.products.forEach(p => {
                if (p.stocks[oldName] !== undefined) {
                  p.stocks[name] = p.stocks[oldName];
                  delete p.stocks[oldName];
                }
              });

              // Synchronize user assignments
              store.users.forEach(u => {
                if (u.warehouse === oldName) u.warehouse = name;
              });

              // Synchronize state current warehouse
              if (state.transactionWarehouse === oldName) state.transactionWarehouse = name;
            }

            addAuditLog('UPDATE', 'Gudang', code, `Memperbarui data gudang: ${name}`);
            showToast('Gudang Diperbarui', `Data gudang ${name} berhasil disimpan.`);
          }
        } else {
          const newId = 'W' + String(store.warehouses.length + 1).padStart(2, '0');
          store.warehouses.push({ id: newId, code, name, address, active: true });
          store.products.forEach(p => {
            if (p.stocks[name] === undefined) p.stocks[name] = 0;
          });
          addAuditLog('CREATE', 'Gudang', code, `Menambahkan gudang baru: ${name}`);
          showToast('Gudang Ditambahkan', `Gudang ${name} berhasil dibuat.`);
        }

        saveStore();
        closeModal();
        render();
      }

      function confirmExecuteDeleteWarehouse(whId) {
        const idx = store.warehouses.findIndex(x => x.id === whId);
        if (idx === -1) return;
        const w = store.warehouses[idx];

        // Clean up stock keys from products
        store.products.forEach(p => {
          delete p.stocks[w.name];
        });

        // Reassign users if they were assigned to this warehouse
        const fallbackWh = store.warehouses.find(x => x.id !== whId)?.name || 'Gudang Utama';
        store.users.forEach(u => {
          if (u.warehouse === w.name) u.warehouse = fallbackWh;
        });

        markRecordDeleted('warehouses', w.id, w.code || w.name);
        store.warehouses.splice(idx, 1);
        addAuditLog('DELETE', 'Gudang', w.code, `Menghapus gudang: ${w.name} (${w.code})`);
        saveStore();
        closeModal();
        showToast('Gudang Dihapus', `Gudang "${w.name}" berhasil dihapus dari sistem.`);

      function applyRolePreset(preset) {
        const menuCbs = Array.from(document.querySelectorAll('.role-menu-cb'));
        const actionCbs = Array.from(document.querySelectorAll('.role-action-cb'));
        let menus = [];
        let actions = [];
        if (preset === 'all') {
          menus = [...ALL_ROLE_MENU_IDS];
          actions = [...ALL_ROLE_ACTION_IDS];
        } else if (preset === 'supervisor') {
          menus = ['dashboard', 'incoming', 'outgoing', 'damaged', 'transfer', 'opname', 'stock', 'stockcard', 'barcodes', 'reports', 'products', 'categories'];
          actions = ['tx_create_in', 'tx_create_out', 'tx_edit_delete', 'damaged_manage', 'transfer_create', 'transfer_receive', 'opname_create', 'opname_approve', 'master_manage', 'report_export', 'barcode_print', 'ai_chat'];
        } else if (preset === 'staff') {
          menus = [...DEFAULT_ROLE_DEFINITIONS.STAFF.menus];
          actions = [...DEFAULT_ROLE_DEFINITIONS.STAFF.actions];
        } else {
          menus = ['dashboard', 'stock', 'stockcard', 'reports'];
          actions = ['report_export'];
        }
        menuCbs.forEach(cb => { cb.checked = menus.includes(cb.value); });
        actionCbs.forEach(cb => { cb.checked = actions.includes(cb.value); });
      }

      function executeSaveRole() {
        if (!isPrimaryAdminUser()) {
          return showToast('Akses Ditolak', 'Hanya Admin Utama yang dapat menyimpan role.', true);
        }
        const origId = document.getElementById('roleFormOriginalId')?.value.trim().toUpperCase();
        const name = document.getElementById('roleFormName')?.value.trim();
        let code = document.getElementById('roleFormCode')?.value.trim().toUpperCase().replace(/[^A-Z0-9_]/g, '_');
        if (!code && name) {
          code = name.toUpperCase().replace(/[^A-Z0-9]+/g, '_').replace(/^_|_$/g, '');
        }
        const desc = document.getElementById('roleFormDesc')?.value.trim();
        const menus = Array.from(document.querySelectorAll('.role-menu-cb:checked')).map(cb => cb.value);
        const actions = Array.from(document.querySelectorAll('.role-action-cb:checked')).map(cb => cb.value);

        if (!name || !code) {
          return showToast('Validasi Gagal', 'Nama Role dan Kode Role wajib diisi.', true);
        }
        if (code === 'ADMIN' && origId !== 'ADMIN') {
          return showToast('Kode Dilarang', 'Kode ADMIN adalah role sistem permanen.', true);
        }
        if (menus.length === 0) {
          return showToast('Pilih Menu', 'Minimal pilih 1 menu agar role dapat masuk ke aplikasi.', true);
        }

        const defs = getRoleDefinitions();
        if (!origId && defs[code]) {
          return showToast('Kode Duplikat', `Role dengan kode "${code}" sudah ada.`, true);
        }
        const targetId = origId || code;
        defs[targetId] = {
          id: targetId,
          name,
          desc: desc || 'Role kustom yang diatur oleh Admin Utama.',
          badge: targetId === 'STAFF' ? 'neutral' : 'warning',
          isSystem: targetId === 'STAFF',
          isAdmin: false,
          menus,
          actions
        };

        saveRoleDefinitions(defs);
        addAuditLog('UPDATE', 'Role & Hak Akses', targetId, `Mengatur role ${name} (${menus.length} menu, ${actions.length} izin aksi)`);
        saveStore();
        closeModal();
        render();
        showToast('Role Disimpan', `Konfigurasi role "${name}" berhasil diperbarui.`);
      }

      function deleteCustomRole(roleId) {
        if (!isPrimaryAdminUser()) {
          return showToast('Akses Ditolak', 'Hanya Admin Utama yang dapat menghapus role.', true);
        }
        const code = String(roleId || '').toUpperCase();
        if (code === 'ADMIN' || code === 'STAFF') {
          return showToast('Tidak Dapat Dihapus', 'Role bawaan sistem tidak dapat dihapus.', true);
        }
        const defs = getRoleDefinitions();
        const target = defs[code];
        if (!target) return;

        const usedBy = store.users.filter(u => String(u.role || '').toUpperCase() === code);
        if (usedBy.length > 0) {
          return showToast('Role Sedang Dipakai', `Masih ada ${usedBy.length} pengguna dengan role ${target.name}. Pindahkan role mereka terlebih dahulu.`, true);
        }

        delete defs[code];
        saveRoleDefinitions(defs);
        addAuditLog('DELETE', 'Role & Hak Akses', code, `Menghapus role kustom: ${target.name}`);
        saveStore();
        render();
        showToast('Role Dihapus', `Role "${target.name}" berhasil dihapus.`);
      }

      function executeSaveUser() {
        const id = document.getElementById('userFormId')?.value;
        const name = document.getElementById('userFormName')?.value.trim();
        const username = document.getElementById('userFormUsername')?.value.trim().toLowerCase();
        const role = document.getElementById('userFormRole')?.value;
        const warehouse = document.getElementById('userFormWh')?.value;
        const password = document.getElementById('userFormPassword')?.value.trim();
        const active = document.getElementById('userFormActive') ? document.getElementById('userFormActive').value === 'true' : true;

        if (!name || !username) {
          return showToast('Validasi Gagal', 'Nama Lengkap dan Username wajib diisi.', true);
        }

        // Duplicate username check
        const dup = store.users.find(u => u.username.toLowerCase() === username.toLowerCase() && u.id !== id);
        if (dup) {
          return showToast('Username Duplikat', `Username "${username}" sudah digunakan pengguna lain.`, true);
        }

        if (id) {
          const u = store.users.find(x => x.id === id);
          if (u) {
            u.name = name;
            u.username = username;
            u.role = role;
            u.warehouse = warehouse;
            u.active = active;
            if (password) {
              u.password = password;
            }
            if (state.currentUser && state.currentUser.id === id) {
              state.currentUser = u;
              state.role = role;
              saveSession(u);
            }
            addAuditLog('UPDATE', 'Pengguna', username, `Memperbarui akun pengguna: ${name}`);
            showToast('Pengguna Diperbarui', `Akun ${name} berhasil disimpan.`);
          }
        } else {
          if (!password) {
            return showToast('Validasi Gagal', 'Kata sandi awal wajib diisi untuk pengguna baru.', true);
          }
          const newId = 'U' + String(store.users.length + 1).padStart(2, '0');
          const code = name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
          const newUser = {
            id: newId,
            username,
            code,
            name,
            role,
            warehouse,
            password,
            active: true,
            lastLogin: '-'
          };
          store.users.push(newUser);
          addAuditLog('CREATE', 'Pengguna', username, `Menambahkan pengguna baru: ${name} (${role})`);
          showToast('Pengguna Ditambahkan', `Akun ${name} (${username}) berhasil didaftarkan.`);
        }

        saveStore();
        closeModal();
        render();
      }

      function openDeleteUserModal(userId) {

        if (u.id === 'U01' || u.username.toLowerCase() === 'admin') {

      function confirmExecuteDeleteUser(userId) {
        const idx = store.users.findIndex(x => x.id === userId);
        if (idx === -1) return;
        const u = store.users[idx];

        if (u.id === 'U01' || u.username.toLowerCase() === 'admin') {
          return showToast('Aksi Ditolak', 'Admin utama dilindungi dan tidak dapat dihapus demi keamanan sistem.', true);
        }

        if (state.currentUser && (state.currentUser.id === u.id || state.currentUser.username === u.username)) {
          return showToast('Aksi Ditolak', 'Tidak dapat menghapus akun yang sedang aktif digunakan.', true);
        }

        markRecordDeleted('users', u.id, u.username);
        store.users.splice(idx, 1);
        addAuditLog('DELETE', 'Pengguna', u.username, `Menghapus akun pengguna: ${u.name} (@${u.username})`);
        saveStore();
        closeModal();
        showToast('Pengguna Dihapus', `Akun ${u.name} (@${u.username}) telah berhasil dihapus.`);
        render();
      }

      async function migrateSheetsNow() {
        if (!isAppsScriptEnv && !storedSheetsUrl) {
          return showToast('Perhatian', 'Simpan URL Web App Google Sheets terlebih dahulu.', true);
        }
        showToast('Memproses Migrasi…', 'Memperbarui database dan memisahkan kolom stok per gudang…');

        if (isAppsScriptEnv) {
          google.script.run
            .withSuccessHandler(function (res) {
              if (typeof res === 'string') {
                try { res = JSON.parse(res); } catch (e) { }
              }
              if (res && res.status === 'success') {
                showToast('Migrasi Berhasil!', res.message || 'Seluruh kolom berhasil dipisahkan menjadi kolom baru.');
                syncFromGoogleSheets(true);
              } else {
                showToast('Gagal Migrasi', res?.message || 'Gagal memigrasikan database.', true);
              }
            })
            .withFailureHandler(function (err) {
              showToast('Koneksi Gagal', 'Gagal memigrasikan database: ' + (err?.message || err), true);
            })
            .apiMigrate();
          return;
        }

        try {
          const url = storedSheetsUrl + (storedSheetsUrl.includes('?') ? '&' : '?') + 'action=migrate&t=' + Date.now();
          const res = await fetch(url);
          const data = await res.json();
          if (data && data.status === 'success') {
            showToast('Migrasi Berhasil!', data.message || 'Seluruh kolom JSON berhasil dipisahkan menjadi kolom baru.');
            syncFromGoogleSheets(true);
          } else {
            showToast('Gagal Migrasi', data?.message || 'Gagal memigrasikan database.', true);
          }
        } catch (e) {
          showToast('Koneksi Gagal', 'Pastikan URL Web App aktif dan kode code.gs versi terbaru sudah diterapkan di Google Sheets.', true);
        }
      }

      async function testAndSaveSheetsUrl() {
        const input = document.getElementById('modalSheetsUrlInput') || document.getElementById('cfgSheetsUrl');
        const url = input?.value.trim() || '';

        if (!url) {
          storedSheetsUrl = '';
          try { localStorage.removeItem(SHEETS_URL_KEY); } catch (e) { }
          currentSheetsStatus = 'unconfigured';
          updateSheetsStatusUI();
          showToast('URL Dihapus', 'URL integrasi Google Sheets telah dihapus.');
          closeModal();
          render();
          return;
        }

        if (!url.startsWith('https://script.google.com/macros/s/')) {
          return showToast('URL Tidak Valid', 'URL Web App harus diawali dengan https://script.google.com/macros/s/...', true);
        }

        showToast('Menguji Koneksi…', 'Menghubungi Google Apps Script Web App…');

        try {
          const testUrl = url + (url.includes('?') ? '&' : '?') + 'action=ping&t=' + Date.now();
          const res = await fetch(testUrl);
          const data = await res.json();

          if (data && data.status === 'success') {
            storedSheetsUrl = url;
            try { localStorage.setItem(SHEETS_URL_KEY, url); } catch (e) { }
            if (store.settings) store.settings.googleSheetsUrl = url;
            currentSheetsStatus = 'connected';
            const now = new Date();
            lastSheetsSyncTime = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            updateSheetsStatusUI();
            showToast('Koneksi Sukses!', 'Google Spreadsheet berhasil terhubung. Melakukan sinkronisasi data…');
            closeModal();
            syncFromGoogleSheets(true);
          } else {
            throw new Error(data?.message || 'Gagal merespons');
          }
        } catch (e) {
          storedSheetsUrl = url;
          try { localStorage.setItem(SHEETS_URL_KEY, url); } catch (err) { }
          if (store.settings) store.settings.googleSheetsUrl = url;
          currentSheetsStatus = 'connected';
          updateSheetsStatusUI();
          closeModal();
          showToast('URL Disimpan', 'URL Web App tersimpan. Menginisialisasi sinkronisasi cloud…');
          syncFromGoogleSheets(true);
        }
      }

      async function testGeminiApiKey() {
        const provSelect = document.getElementById('cfgAiProvider');
        const baseUrlInput = document.getElementById('cfgAiBaseUrl');
        const keyInput = document.getElementById('cfgGeminiKey');
        const modelInput = document.getElementById('cfgGeminiModel');
        const feedbackEl = document.getElementById('geminiTestFeedback');

        const provider = provSelect ? provSelect.value : (store.settings.aiProvider || 'gemini');
        const baseUrl = baseUrlInput ? baseUrlInput.value.trim() : (store.settings.aiBaseUrl || '');
        const key = keyInput ? keyInput.value.trim() : '';
        const provMeta = AI_PROVIDER_PRESETS[provider] || AI_PROVIDER_PRESETS.gemini;
        const model = (modelInput ? modelInput.value.trim() : '') || provMeta.defaultModel || 'gemini-2.5-flash';

        if (!key) {
          if (feedbackEl) {
            feedbackEl.style.display = 'block';
            feedbackEl.style.background = '#fef2f2';
            feedbackEl.style.color = '#991b1b';
            feedbackEl.style.border = '1px solid #fecaca';
            feedbackEl.innerHTML = 'Masukkan API Key terlebih dahulu sebelum melakukan tes koneksi.';
          }
          return showToast('Tes Gagal', 'API Key masih kosong.', true);
        }

        if (provider === 'custom' && !baseUrl) {
          return showToast('Tes Gagal', 'Masukkan Base URL endpoint kustom terlebih dahulu.', true);
        }

        if (feedbackEl) {
          feedbackEl.style.display = 'block';
          feedbackEl.style.background = '#f0fdf4';
          feedbackEl.style.color = '#166534';
          feedbackEl.style.border = '1px solid #bbf7d0';
          feedbackEl.innerHTML = 'Menghubungkan ke ' + escapeHtml(provMeta.label) + ' (' + escapeHtml(model) + ')...';
        }
        showToast('Menguji Koneksi', 'Menghubungkan ke ' + provMeta.label + '...');

        const onTestSuccess = function(res) {
          if (res && res.status === 'success') {
            if (feedbackEl) {
              feedbackEl.style.display = 'block';
              feedbackEl.style.background = '#f0fdf4';
              feedbackEl.style.color = '#166534';
              feedbackEl.style.border = '1px solid #bbf7d0';
              feedbackEl.innerHTML = '<strong>Koneksi Berhasil!</strong> ' + escapeHtml(res.message || 'API AI aktif dan siap digunakan.');
            }
            showToast('Koneksi Sukses', res.message || 'API Key valid!');
          } else {
            const errMsg = (res && res.message) || 'Koneksi gagal. Periksa kembali API Key, Model, atau Base URL Anda.';
            if (feedbackEl) {
              feedbackEl.style.display = 'block';
              feedbackEl.style.background = '#fef2f2';
              feedbackEl.style.color = '#991b1b';
              feedbackEl.style.border = '1px solid #fecaca';
              feedbackEl.innerHTML = '<strong>Koneksi Gagal:</strong> ' + escapeHtml(errMsg);
            }
            showToast('Koneksi Gagal', errMsg, true);
          }
        };

        const onTestFail = function(err) {
          const errMsg = err && err.message ? err.message : String(err);
          if (feedbackEl) {
            feedbackEl.style.display = 'block';
            feedbackEl.style.background = '#fef2f2';
            feedbackEl.style.color = '#991b1b';
            feedbackEl.style.border = '1px solid #fecaca';
            feedbackEl.innerHTML = '<strong>Error Sistem:</strong> ' + escapeHtml(errMsg);
          }
          showToast('Error', errMsg, true);
        };

        const fallbackToServerTest = function(fetchErr) {
          if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
              .withSuccessHandler(onTestSuccess)
              .withFailureHandler(onTestFail)
              .apiTestGeminiKey(key, model, provider, baseUrl);
          } else if (storedSheetsUrl) {
            fetch(storedSheetsUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'testGeminiKey', apiKey: key, model: model, provider: provider, baseUrl: baseUrl })
            })
            .then(r => r.json())
            .then(onTestSuccess)
            .catch(onTestFail);
          } else {
            onTestFail(fetchErr);
          }
        };

        if (provider !== 'gemini') {
          const endpoint = resolveAiEndpointClient(provider, baseUrl);
          fetch(endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + key
            },
            body: JSON.stringify({
              model: model,
              messages: [
                { role: 'system', content: 'Tes koneksi singkat.' },
                { role: 'user', content: 'Jawab satu kata: BERHASIL' }
              ],
              max_tokens: 16
            })
          })
          .then(r => r.json())
          .then(json => {
            if (json && json.choices && json.choices.length > 0) {
              onTestSuccess({ status: 'success', message: `Koneksi ${provMeta.label} (${model}) berhasil & API Key valid!` });
            } else {
              const errMsg = (json && json.error && (json.error.message || json.error)) || 'Koneksi gagal. Periksa kembali API Key atau nama model.';
              onTestSuccess({ status: 'error', message: String(errMsg) });
            }
          })
          .catch(fallbackToServerTest);
          return;
        }

        // Uji koneksi langsung via browser fetch ke Google Generative Language API
        const testApi = function(mdl) {
          return fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(mdl)}:generateContent?key=${encodeURIComponent(key)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: "Tes koneksi. Jawab persis: 'BERHASIL'" }] }] })
          });
        };

        testApi(model)
          .then(async r => {
            if (r.status === 404 && model !== 'gemini-1.5-flash') {
              return testApi('gemini-1.5-flash');
            }
            return r;
          })
          .then(r => r.json())
          .then(json => {
            if (json && json.candidates && json.candidates.length > 0) {
              onTestSuccess({ status: 'success', message: `Koneksi Google Gemini (${model}) berhasil & API Key valid!` });
            } else {
              const errMsg = (json && json.error && json.error.message) || 'Koneksi gagal. Periksa kembali API Key Anda.';
              onTestSuccess({ status: 'error', message: errMsg });
            }
          })
          .catch(fallbackToServerTest);
      }

      function executeSavePassword() {
        const userId = document.getElementById('pwTargetUserId')?.value;
        const newPw = document.getElementById('newPasswordInput')?.value.trim();
        const confirmPw = document.getElementById('confirmPasswordInput')?.value.trim();

        if (!newPw) {
          return showToast('Validasi Gagal', 'Kata sandi baru tidak boleh kosong.', true);
        }
        if (newPw !== confirmPw) {
          return showToast('Kata Sandi Tidak Cocok', 'Konfirmasi kata sandi baru tidak sama.', true);
        }

        const user = store.users.find(u => u.id === userId);
        if (!user) return;

        user.password = newPw;
        if (state.currentUser && state.currentUser.id === userId) {
          state.currentUser.password = newPw;
          saveSession(state.currentUser);
        }

        addAuditLog('UPDATE_PW', 'Pengguna', user.username, `Mengubah kata sandi akun ${user.name}`);
        saveStore();
        closeModal();
        showToast('Kata Sandi Diperbarui', `Kata sandi untuk akun @${user.username} berhasil diganti.`);
      }
