        }
        function recordQuestion(q) {
          const list = loadFAQ();
          const key = q.trim().toLowerCase();
          const idx = list.findIndex(x => x.key === key);
          if (idx >= 0) { list[idx].count++; list[idx].last = Date.now(); }
          else { list.push({ key, text: q.trim(), count: 1, last: Date.now() }); }
          list.sort((a, b) => b.count - a.count);
          saveFAQ(list.slice(0, MAX_HISTORY));
          return list;
        }
        function getTopFAQ(n = 5) {
          return loadFAQ().slice(0, n);
        }

        // Shortcut suggestions
        const DEFAULT_SUGGESTIONS = [
          'Stok apa yang hampir habis?',
          'Barang apa yang paling banyak keluar bulan ini?',
          'Berapa total nilai stok saat ini?',
          'Produk mana yang belum pernah keluar?',
          'Gudang mana yang paling banyak aktivitasnya?',
        ];

        function getSuggestions() {
          const faq = getTopFAQ(3).map(x => x.text);
          // Gabung FAQ dengan default, hilangkan duplikat
          const all = [...faq, ...DEFAULT_SUGGESTIONS];
          const seen = new Set();
          return all.filter(s => { const k = s.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 5);
        }

        // Analisis engine inventori
        function analyzeQuery(q) {
          const Q = (q || '').trim().toLowerCase();
          if (!Q) return 'Silakan ketik pertanyaan Anda tentang stok atau panduan aplikasi.';

          const products = store.products || [];
          const transactions = store.transactions || [];
          const transfers = store.transfers || [];
          const warehouses = store.warehouses || [];
          const categories = store.categories || [];
          const damagedItems = store.damagedItems || [];
          const opnames = store.opnames || [];
          const currentUser = (state && state.currentUser && state.currentUser.name) || 'Kak';
          const bizName = (store.settings && store.settings.businessName) || 'StokKita';

          function getStock(p, wh) {
            if (!p.stocks || typeof p.stocks !== 'object') return 0;
            if (!wh || wh === 'Semua Gudang') return Object.values(p.stocks).reduce((s, v) => s + Number(v || 0), 0);
            return Number(p.stocks[wh] || 0);
          }
          function formatRp(n) { return 'Rp\u00A0' + rupiah.format(Math.round(n || 0)); }

          function renderQuickButtons(buttons) {
            if (!buttons || !buttons.length) return '';
            return `<div class="ai-quick-grid">${buttons.map(b => `<button type="button" class="ai-quick-btn" data-q="${escapeHtml(b.q)}">${b.label}</button>`).join('')}</div>`;
          }

          // 1. SALAM & PERCAKAPAN UMUM (GREETINGS)
          if (/^(hi|hai|halo|hello|hey|hei|pagi|siang|sore|malam|assalamu|sampurasun|tes|test|oi|woi|halo\s*bot|selamat)/i.test(Q)) {
            const critCount = products.filter(p => getStock(p, 'Semua Gudang') <= (p.min || 5) && p.active !== false).length;
            const critBadge = critCount > 0 ? `<span class="ai-badge danger">${critCount} Stok Kritis</span>` : `<span class="ai-badge success">Stok Aman</span>`;
            return `<b>Halo ${escapeHtml(currentUser)}!</b> Senang menyapa Anda di <b>${escapeHtml(bizName)}</b>.<br><br>` +
              `Status inventori saat ini: ${critBadge} dari total <b>${products.length}</b> jenis produk terdaftar.<br>` +
              `Ada yang bisa saya bantu analisiskan hari ini? Silakan ketik pertanyaan atau pilih pintasan berikut:` +
              renderQuickButtons([
                { label: 'Stok Kritis', q: 'Stok apa yang hampir habis?' },
                { label: 'Produk Terlaris', q: 'Barang apa yang paling banyak keluar?' },
                { label: 'Total Nilai Stok', q: 'Berapa total nilai stok saat ini?' },
                { label: 'Cek Gudang', q: 'Ringkasan stok per gudang' }
              ]);
          }

          // 2. TERIMA KASIH
          if (/terima\s*kasih|makasih|thanks|thank\s*you|tengkyu|matur\s*nuwun|nuhun|tq/i.test(Q)) {
            return `<b>Sama-sama, ${escapeHtml(currentUser)}.</b><br>Senang bisa membantu kelancaran operasional inventori Anda. Jika butuh data lain, silakan tanyakan kapan saja!` +
              renderQuickButtons([
                { label: 'Ringkasan Stok', q: 'Ringkasan inventori' },
                { label: 'Transaksi Terakhir', q: 'Transaksi terbaru' }
              ]);
          }

          // 3. APRESIASI / OKE / SIP
          if (/^(ok|oke|sip|siap|mantap|keren|bagus|good|baik|yoi|siaap)$/i.test(Q)) {
            return `<b>Siap, ${escapeHtml(currentUser)}.</b> Asisten siap membantu pengecekan data inventori.`;
          }

          // 4. IDENTITAS & KEMAMPUAN BOT
          if (/siapa\s*(kamu|anda)|nama\s*kamu|bisa\s*apa|fungsi\s*(kamu|bot|ai)|kamu\s*siapa/i.test(Q)) {
            return ` <b>Asisten AI StokKita</b><br>` +
              `Saya adalah asisten analitik yang terhubung langsung dengan database inventori <b>${escapeHtml(bizName)}</b> secara real-time.<br><br>` +
              `Saya dapat membantu Anda:<br>` +
              `• <b>Analisis Cepat:</b> Menghitung nilai stok, mendeteksi barang kritis, produk terlaris, dan dead stock.<br>` +
              `• <b>Pencarian Barang:</b> Cari saldo stok barang spesifik per gudang cukup dengan mengetik nama atau SKU.<br>` +
              `• <b>Panduan Aplikasi:</b> Panduan langkah demi langkah penggunaan fitur (barang masuk, keluar, opname, barcode).<br><br>` +
              `Coba pilih menu di bawah ini:` +
              renderQuickButtons([
                { label: 'Stok Kritis', q: 'Stok apa yang hampir habis?' },
                { label: 'Nilai Aset Stok', q: 'Total nilai stok?' },
                { label: 'Produk Slow Moving', q: 'Produk mana yang belum pernah keluar?' }
              ]);
          }

          // 5. PANDUAN PENGGUNAAN / SOP FITUR APLIKASI (HOW-TO)
          if (/cara\s*(input|catat|tambah|buat)?\s*barang\s*masuk|penerimaan\s*barang|supplier/i.test(Q)) {
            return `<b>Panduan Mencatat Barang Masuk:</b><br>` +
              `1. Buka menu <b>Barang Masuk</b>.<br>` +
              `2. Klik tombol <b>+ Tambah Transaksi</b>.<br>` +
              `3. Pilih <b>Gudang Tujuan</b> dan masukkan nama <b>Supplier</b>.<br>` +
              `4. Pilih produk dan masukkan kuantitas (Qty) yang diterima.<br>` +
              `5. Anda dapat melampirkan foto surat jalan/faktur melalui galeri atau kamera HP.<br>` +
              `6. Klik <b>Simpan Transaksi</b>. Saldo stok gudang otomatis bertambah!` +
              renderQuickButtons([
                { label: 'Cara Barang Keluar', q: 'Bagaimana cara catat barang keluar?' },
                { label: 'Lihat Transaksi Terakhir', q: 'Transaksi terbaru' }
              ]);
          }

          if (/cara\s*(input|catat|tambah|buat)?\s*barang\s*keluar|pengeluaran\s*barang|penjualan|surat\s*jalan/i.test(Q)) {
            return `<b>Panduan Mencatat Barang Keluar:</b><br>` +
              `1. Buka menu <b>Barang Keluar</b>.<br>` +
              `2. Klik tombol <b>+ Tambah Transaksi</b>.<br>` +
              `3. Pilih <b>Gudang Asal</b> dan masukkan nama <b>Pelanggan / Customer</b>.<br>` +
              `4. Tambahkan produk yang ingin dikeluarkan. Sistem otomatis mengecek kecukupan saldo stok.<br>` +
              `5. Klik <b>Simpan Transaksi</b>. Saldo stok akan langsung berkurang dan kartu stok terupdate otomatis!` +
              renderQuickButtons([
                { label: 'Cara Transfer Stok', q: 'Bagaimana cara transfer stok antar gudang?' },
                { label: 'Stok Kritis', q: 'Stok apa yang hampir habis?' }
              ]);
          }

          if (/cara\s*(tambah|buat|input|masukkan|bikin)\s*(barang|produk|item|master)/i.test(Q) && !(/masuk|keluar/i.test(Q))) {
            return `<b>Panduan Menambah Produk Baru:</b><br>` +
              `1. Masuk ke menu <b>Master Barang</b> di bilah sisi kiri.<br>` +
              `2. Klik tombol <b>+ Tambah Produk</b> di pojok kanan atas.<br>` +
              `3. Masukkan <b>SKU</b> (kode unik), <b>Nama Barang</b>, <b>Kategori</b>, <b>Satuan</b>, dan <b>Batas Minimum Stok</b>.<br>` +
              `4. Masukkan stok awal untuk masing-masing gudang serta harga satuan.<br>` +
              `5. Klik <b>Simpan Produk</b>. Produk langsung tersinkronisasi ke Google Sheets!` +
              renderQuickButtons([
                { label: 'Cara Cetak Barcode', q: 'Bagaimana cara cetak label barcode?' },
                { label: 'Cara Input Barang Masuk', q: 'Bagaimana cara catat barang masuk?' }
              ]);
          }

          if (/cara\s*(transfer|pindah\s*gudang|mutasi\s*antar\s*gudang|mutasi\s*stok)/i.test(Q)) {
            return `<b>Panduan Transfer Antar Gudang:</b><br>` +
              `1. Buka menu <b>Transfer Stok</b>.<br>` +
              `2. Klik tombol <b>+ Buat Transfer</b>.<br>` +
              `3. Pilih <b>Gudang Asal</b> (pengirim) dan <b>Gudang Tujuan</b> (penerima).<br>` +
              `4. Masukkan daftar barang dan jumlah yang ingin dipindahkan.<br>` +
              `5. Simpan mutasi. Sistem akan otomatis memotong stok dari gudang asal dan menambahkannya ke gudang tujuan.` +
              renderQuickButtons([
                { label: 'Ringkasan Gudang', q: 'Ringkasan stok per gudang' }
              ]);
          }

          if (/cara\s*(opname|stok\s*opname|audit\s*stok|hitung\s*fisik)/i.test(Q)) {
            return `<b>Panduan Stok Opname:</b><br>` +
              `1. Buka menu <b>Stok Opname</b>.<br>` +
              `2. Klik tombol <b>+ Buat Opname Baru</b> dan pilih gudang yang akan diaudit.<br>` +
              `3. Masukkan jumlah <b>Stok Fisik</b> riil hasil hitungan fisik di gudang.<br>` +
              `4. Kolom selisih akan otomatis menghitung selisih surplus (hijau) atau minus (merah).<br>` +
              `5. Simpan opname untuk menyesuaikan saldo stok pembukuan sistem.` +
              renderQuickButtons([
                { label: 'Cek Hasil Opname Terakhir', q: 'Hasil stok opname' }
              ]);
          }

          if (/cara\s*cetak\s*(barcode|qr|label)|print\s*label|print\s*barcode/i.test(Q)) {
            return `<b>Panduan Cetak Label Barcode dan QR Code:</b><br>` +
              `1. Buka menu <b>Barcode Center</b> dari menu samping, ATAU klik ikon barcode pada baris produk di Master Barang.<br>` +
              `2. Pilih jenis kode: <b>Barcode (Code 128)</b> atau <b>QR Code</b>.<br>` +
              `3. Pilih ukuran stiker / kertas (misal: 40x30 mm, 50x30 mm, atau A4 multi-label).<br>` +
              `4. Klik tombol <b>Cetak Label</b> untuk mencetak ke printer thermal stiker atau printer biasa.` +
              renderQuickButtons([
                { label: 'Panduan Scanner HP', q: 'Tips scanner kamera barcode' }
              ]);
          }

          if (/kamera|scan\s*(barcode|qr)|scanner|izin\s*kamera|kamera\s*error/i.test(Q)) {
            return `<b>Panduan Scanner Barcode dan Kamera HP:</b><br>` +
              `• <b>Scanner Kamera HP:</b> Saat berada di form transaksi atau pencarian, klik tombol hijau <b>'Buka Kamera (Tab Baru)'</b>. Tab baru bebas dari pembatasan sandbox Google Apps Script sehingga kamera langsung aktif tanpa kendala.<br>` +
              `• <b>Scanner Fisik USB / Bluetooth:</b> Cukup colokkan scanner ke laptop/PC. Letakkan kursor pada kolom pencarian lalu tembak barcode barang. Kode akan langsung terbaca otomatis!` +
              renderQuickButtons([
                { label: 'Cetak Label Barcode', q: 'Bagaimana cara cetak label barcode?' }
              ]);
          }

          if (/cara\s*(tambah|buat)?\s*(user|pengguna|staf|akun)|ganti\s*password|ganti\s*role/i.test(Q)) {
            return `<b>Panduan Kelola Pengguna:</b><br>` +
              `1. Masuk menggunakan akun berlevel <b>ADMIN</b>, lalu klik menu <b>Pengguna</b>.<br>` +
              `2. Klik tombol <b>+ Tambah Pengguna</b>.<br>` +
              `3. Isi nama lengkap, username, dan kata sandi baru.<br>` +
              `4. Tentukan peran: <b>ADMIN</b> (kontrol penuh) atau <b>STAFF</b> (hanya operasional input/output gudang).<br>` +
              `5. Tentukan akses gudang yang diizinkan untuk staf tersebut.` +
              renderQuickButtons([
                { label: 'Ganti Sandi Akun', q: 'Bagaimana cara ganti password?' }
              ]);
          }

          if (/cara\s*(ekspor|export|unduh|download)\s*(excel|laporan|csv|xlsx)/i.test(Q)) {
            return `<b>Panduan Ekspor Laporan Excel:</b><br>` +
              `• Di seluruh tabel utama (Master Barang, Barang Masuk, Barang Keluar, Opname, Audit Log), terdapat tombol hijau <b>Ekspor Excel</b>.<br>` +
              `• Klik tombol tersebut untuk mengunduh berkas spreadsheet asli berformat <b>.xlsx</b> yang rapi dan siap dicetak atau dilaporkan ke manajemen.` +
              renderQuickButtons([
                { label: 'Total Nilai Stok', q: 'Berapa total nilai stok saat ini?' }
              ]);
          }

          // 6. TOTAL NILAI / VALUASI / ASET STOK
          if (/nilai\s*stok|total\s*nilai|valuasi|aset|modal|investasi|omset|uang\s*stok/i.test(Q)) {
            const total = products.reduce((sum, p) => {
              const qty = getStock(p, 'Semua Gudang');
              const harga = Number(p.price || p.harga || 0);
              return sum + qty * harga;
            }, 0);
            const totalQty = products.reduce((s, p) => s + getStock(p, 'Semua Gudang'), 0);

            let whRows = warehouses.map(w => {
              const wQty = products.reduce((s, p) => s + getStock(p, w.name), 0);
              const wVal = products.reduce((s, p) => s + getStock(p, w.name) * Number(p.price || p.harga || 0), 0);
              return `<tr><td>${escapeHtml(w.name)}</td><td><b>${rupiah.format(wQty)}</b> unit</td><td>${formatRp(wVal)}</td></tr>`;
            }).join('');

            return `<strong>Valuasi dan Nilai Aset Stok</strong><br>` +
              `• Total Jenis Produk: <b>${products.length}</b> macam<br>` +
              `• Total Fisik Stok: <b>${rupiah.format(totalQty)}</b> unit<br>` +
              `• Total Nilai Aset: <b style="color:var(--brand-700);font-size:14px">${formatRp(total)}</b><br><br>` +
              `<b>Rincian Valuasi Per Gudang:</b>` +
              `<table class="ai-data-table"><thead><tr><th>Gudang</th><th>Total Unit</th><th>Nilai Aset</th></tr></thead><tbody>${whRows}</tbody></table>` +
              renderQuickButtons([
                { label: 'Stok Kritis', q: 'Stok apa yang hampir habis?' },
                { label: 'Produk Terlaris', q: 'Barang apa yang paling banyak keluar?' }
              ]);
          }

          // 7. STOK HAMPIR HABIS / KRITIS / REORDER
          if (/hampir\s*habis|kritis|minim|menipis|low\s*stock|rendah|kurang|reorder|perlu\s*beli|pesan\s*lagi/i.test(Q)) {
            const low = products.filter(p => {
              const qty = getStock(p, 'Semua Gudang');
              const min = Number(p.min || p.minStock || 0);
              return qty <= (min > 0 ? min : 5) && p.active !== false;
            }).sort((a, b) => getStock(a, 'Semua Gudang') - getStock(b, 'Semua Gudang'));

            if (!low.length) {
              return `<b>Semua Stok Aman Terkendali.</b><br>` +
                `Saat ini tidak ada produk yang berada di bawah batas minimum stok.` +
                renderQuickButtons([
                  { label: 'Cek Nilai Stok', q: 'Total nilai stok saat ini?' },
                  { label: 'Cek Dead Stock', q: 'Produk yang belum pernah keluar' }
                ]);
            }

            const rows = low.slice(0, 10).map(p => {
              const totalQ = getStock(p, 'Semua Gudang');
              const badgeClass = totalQ === 0 ? 'danger' : 'info';
              const label = totalQ === 0 ? 'Habis (0)' : `${totalQ} ${escapeHtml(p.unit || 'pcs')}`;
              return `<tr><td><b>${escapeHtml(p.name || p.nama)}</b><br><small style="color:var(--ink-500)">SKU: ${escapeHtml(p.sku || '-')}</small></td>` +
                `<td><span class="ai-badge ${badgeClass}">${label}</span></td><td>${escapeHtml(p.min || 0)}</td></tr>`;
            }).join('');

            return `<b>Ditemukan ${low.length} Produk dengan Stok Kritis:</b><br>` +
              `<small>Disarankan untuk segera membuat pesanan pembelian (Barang Masuk).</small>` +
              `<table class="ai-data-table"><thead><tr><th>Produk</th><th>Sisa Stok</th><th>Batas Min</th></tr></thead><tbody>${rows}</tbody></table>` +
              renderQuickButtons([
                { label: 'Panduan Input Barang Masuk', q: 'Cara input barang masuk' },
                { label: 'Produk Stok Nol', q: 'Barang apa yang stoknya nol?' }
              ]);
          }

          // 8. STOK KOSONG / STOK NOL
          if (/stok\s*(nol|habis|kosong|0)|barang\s*(habis|kosong)|out\s*of\s*stock/i.test(Q)) {
            const empty = products.filter(p => getStock(p, 'Semua Gudang') <= 0 && p.active !== false);
            if (!empty.length) {
              return `<b>Tidak ada produk dengan stok kosong.</b> Semua produk masih memiliki persediaan.` +
                renderQuickButtons([
                  { label: 'Cek Stok Menipis', q: 'Stok apa yang hampir habis?' }
                ]);
            }
            const rows = empty.slice(0, 10).map(p =>
              `<tr><td><b>${escapeHtml(p.name || p.nama)}</b></td><td>${escapeHtml(p.sku || '-')}</td><td>${escapeHtml(p.category || 'Umum')}</td></tr>`
            ).join('');
            return `<b>Terdapat ${empty.length} Produk Habis Total:</b>` +
              `<table class="ai-data-table"><thead><tr><th>Nama Barang</th><th>SKU</th><th>Kategori</th></tr></thead><tbody>${rows}</tbody></table>` +
              renderQuickButtons([
                { label: 'Cara Input Restock', q: 'Cara input barang masuk' }
              ]);
          }

          // 9. PRODUK TERLARIS / FAST MOVING
          if (/terlaris|paling\s*(laku|banyak\s*keluar|laris|populer)|fast\s*moving|top\s*(produk|barang|penjualan)|juara/i.test(Q)) {
            const outTx = transactions.filter(t => (t.type || '').toLowerCase().includes('keluar'));
            const counter = {};
            const unitMap = {};
            outTx.forEach(t => {
              const nama = t.nama_barang || t.name || t.product || '';
              const qty = Number(t.qty || t.quantity || 1);
              if (nama) {
                counter[nama] = (counter[nama] || 0) + qty;
                if (t.satuan || t.unit) unitMap[nama] = t.satuan || t.unit;
              }
            });
            const sorted = Object.entries(counter).sort((a, b) => b[1] - a[1]).slice(0, 7);
            if (!sorted.length) return 'Belum ada riwayat transaksi barang keluar yang tercatat untuk dianalisis.';

            const rows = sorted.map(([n, q], idx) => {
              const medali = `${idx + 1}.`;
              return `<tr><td>${medali} <b>${escapeHtml(n)}</b></td><td><b style="color:var(--brand-700)">${rupiah.format(q)}</b> ${escapeHtml(unitMap[n] || 'unit')}</td></tr>`;
            }).join('');

            return `<strong>Peringkat Produk Terlaris (Paling Banyak Keluar):</strong>` +
              `<table class="ai-data-table"><thead><tr><th>Nama Produk</th><th>Total Keluar</th></tr></thead><tbody>${rows}</tbody></table>` +
              renderQuickButtons([
                { label: 'Cek Ketersediaan Stok', q: 'Stok apa yang hampir habis?' },
                { label: 'Cek Barang Macet', q: 'Produk mana yang belum pernah keluar?' }
              ]);
          }

          // 10. PRODUK SLOW MOVING / DEAD STOCK
          if (/slow\s*moving|dead\s*stock|barang\s*mati|tidak\s*laku|belum\s*(pernah\s*)?keluar|mengendap|diam|macet/i.test(Q)) {
            const outNames = new Set(transactions.filter(t => (t.type || '').toLowerCase().includes('keluar')).map(t => (t.nama_barang || t.name || '').toLowerCase()));
            const slow = products.filter(p => !outNames.has((p.name || p.nama || '').toLowerCase()) && p.active !== false && getStock(p, 'Semua Gudang') > 0);

            if (!slow.length) {
              return '<b>Semua produk aktif yang memiliki stok sudah pernah mencatat transaksi keluar.</b> Inventori bergerak dengan baik.';
            }

            const trappedValue = slow.reduce((sum, p) => sum + getStock(p, 'Semua Gudang') * Number(p.price || p.harga || 0), 0);

            const rows = slow.slice(0, 8).map(p => {
              const q = getStock(p, 'Semua Gudang');
              const val = q * Number(p.price || p.harga || 0);
              return `<tr><td><b>${escapeHtml(p.name || p.nama)}</b></td><td>${q} ${escapeHtml(p.unit || 'unit')}</td><td>${formatRp(val)}</td></tr>`;
            }).join('');

            return `<b>Ditemukan ${slow.length} Produk Slow Moving (Belum Pernah Keluar):</b><br>` +
              `Total dana yang mengendap: <b style="color:var(--danger)">${formatRp(trappedValue)}</b><br>` +
              `<table class="ai-data-table"><thead><tr><th>Produk</th><th>Stok</th><th>Nilai Tertahan</th></tr></thead><tbody>${rows}</tbody></table>` +
              `<em>Saran: Buat promo atau program bundling untuk mempercepat perputaran produk di atas.</em>` +
              renderQuickButtons([
                { label: 'Cek Produk Terlaris', q: 'Produk paling banyak keluar' }
              ]);
          }

          // 11. STATUS & RINGKASAN GUDANG
          if (/gudang|warehouse|lokasi\s*stok|cabang/i.test(Q)) {
            if (!warehouses.length) return 'Belum ada master data gudang yang didaftarkan.';
            const rows = warehouses.map(w => {
              const totalStok = products.reduce((s, p) => s + getStock(p, w.name), 0);
              const jenis = products.filter(p => getStock(p, w.name) > 0).length;
              return `<tr><td><b>${escapeHtml(w.name)}</b><br><small style="color:var(--ink-500)">${escapeHtml(w.address || 'Gudang Fisik')}</small></td>` +
                `<td><b>${rupiah.format(totalStok)}</b> unit</td><td>${jenis} jenis</td></tr>`;
            }).join('');
            return `<strong>Ringkasan Kapasitas Seluruh Gudang (${warehouses.length} Gudang):</strong>` +
              `<table class="ai-data-table"><thead><tr><th>Gudang</th><th>Total Unit</th><th>Item Berstok</th></tr></thead><tbody>${rows}</tbody></table>` +
              renderQuickButtons([
                { label: 'Cara Transfer Gudang', q: 'Cara transfer antar gudang' },
                { label: 'Nilai Aset per Gudang', q: 'Total nilai stok saat ini?' }
              ]);
          }

          // 12. TRANSAKSI TERBARU
          if (/transaksi\s*terbaru|aktivitas\s*terbaru|terakhir\s*(masuk|keluar)|riwayat\s*transaksi|mutasi\s*terbaru/i.test(Q)) {
            const recent = transactions.slice(0, 5);
            if (!recent.length) return 'Belum ada transaksi barang yang tercatat.';
            const rows = recent.map(t => {
              const isOut = String(t.type || '').toLowerCase().includes('keluar');
              const badge = isOut ? '<span class="ai-badge danger">KELUAR</span>' : '<span class="ai-badge success">MASUK</span>';
              return `<tr><td>${badge}<br><small>${escapeHtml(t.transaction_no || t.no || '-')}</small></td>` +
                `<td><b>${escapeHtml(t.nama_barang || t.name || '-')}</b><br><small>${t.qty || 1} ${escapeHtml(t.satuan || 'Pcs')}</small></td>` +
                `<td><small>${escapeHtml(t.date || '-')}</small></td></tr>`;
            }).join('');
            return `<strong>5 Transaksi Mutasi Terkini:</strong>` +
              `<table class="ai-data-table"><thead><tr><th>Tipe & No</th><th>Barang</th><th>Tanggal</th></tr></thead><tbody>${rows}</tbody></table>` +
              renderQuickButtons([
                { label: 'Catat Barang Masuk', q: 'Cara input barang masuk' },
                { label: 'Catat Barang Keluar', q: 'Cara input barang keluar' }
              ]);
          }

          // 13. STOK OPNAME & SELISIH
          if (/opname|selisih|audit|cek\s*fisik/i.test(Q)) {
            if (!opnames.length) return 'Belum ada riwayat sesi stok opname yang disimpan.';
            const recentOp = opnames.slice(0, 5);
            const rows = recentOp.map(op => {
              const diff = Number(op.selisih || 0);
              const diffColor = diff === 0 ? 'var(--ink-500)' : (diff > 0 ? '#15803d' : '#b91c1c');
              const diffSign = diff > 0 ? `+${diff}` : `${diff}`;
              return `<tr><td><b>${escapeHtml(op.transaction_no || op.no || '-')}</b><br><small>${escapeHtml(op.warehouse || '-')}</small></td>` +
                `<td>${escapeHtml(op.nama_barang || op.name || '-')}</td>` +
                `<td style="color:${diffColor};font-weight:700">${diffSign}</td></tr>`;
            }).join('');
            return `<strong>Riwayat Hasil Stok Opname Terkini:</strong>` +
              `<table class="ai-data-table"><thead><tr><th>No & Gudang</th><th>Barang</th><th>Selisih</th></tr></thead><tbody>${rows}</tbody></table>` +
              renderQuickButtons([
                { label: 'Panduan Cara Opname', q: 'Cara stok opname' }
              ]);
          }

          // 14. BARANG RUSAK / CACAT
          if (/rusak|damaged|cacat|hilang|retur/i.test(Q)) {
            if (!damagedItems.length) return 'Tidak ada catatan barang rusak atau cacat dalam sistem.';
            const rows = damagedItems.slice(0, 5).map(d =>
              `<tr><td><b>${escapeHtml(d.productName || d.name || '-')}</b></td><td>${d.qty || 1}</td><td>${escapeHtml(d.issueType || d.notes || 'Rusak')}</td></tr>`
            ).join('');
            return `<strong>Catatan Barang Rusak atau Bermasalah:</strong>` +
              `<table class="ai-data-table"><thead><tr><th>Produk</th><th>Qty</th><th>Keterangan</th></tr></thead><tbody>${rows}</tbody></table>`;
          }

          // 15. KATEGORI BARANG
          if (/kategori|category|kelompok\s*barang/i.test(Q)) {
            if (!categories.length) return 'Belum ada kategori yang terdaftar.';
            const rows = categories.map(c => {
              const count = products.filter(p => (p.category || p.kategori || '').toLowerCase() === (c.name || '').toLowerCase()).length;
              return `<tr><td><b>${escapeHtml(c.name)}</b></td><td><b>${count}</b> produk</td></tr>`;
            }).join('');
            return `<strong>Daftar Kategori Produk (${categories.length}):</strong>` +
              `<table class="ai-data-table"><thead><tr><th>Kategori</th><th>Jumlah Item</th></tr></thead><tbody>${rows}</tbody></table>`;
          }

          // 16. PENCARIAN CERDAS BARANG SPESIFIK (SMART FUZZY SEARCH)
          let cleanQ = Q;
          let prevQ = '';
          while (cleanQ !== prevQ) {
            prevQ = cleanQ;
            cleanQ = cleanQ.replace(/^(stok|berapa|cek|cari|ada|apakah\s*ada|info|harga|produk|barang|lihat|tolong|mau\s*tanya)\s*/i, '').trim();
          }
          if (cleanQ.length >= 2) {
            const matches = products.filter(p => {
              const n = (p.name || p.nama || '').toLowerCase();
              const s = (p.sku || '').toLowerCase();
              const b = (p.barcode || '').toLowerCase();
              const c = (p.category || '').toLowerCase();
              return n.includes(cleanQ) || s.includes(cleanQ) || b.includes(cleanQ) || c.includes(cleanQ) ||
                cleanQ.split(/\s+/).every(word => n.includes(word) || s.includes(word));
            });

            if (matches.length === 1) {
              const p = matches[0];
              const totalStok = getStock(p, 'Semua Gudang');
              const minStok = Number(p.min || p.minStock || 0);
              const isCrit = totalStok <= (minStok > 0 ? minStok : 5);
              const badge = isCrit ? `<span class="ai-badge danger">Stok Kritis</span>` : `<span class="ai-badge success">Stok Aman</span>`;

              const whBreakdown = Object.entries(p.stocks || {}).map(([wh, val]) =>
                `• ${escapeHtml(wh)}: <b>${val}</b> ${escapeHtml(p.unit || 'unit')}`
              ).join('<br>') || 'Stok belum dialokasikan ke gudang.';

              const hargaVal = Number(p.price || p.harga || 0);

              return `<div class="ai-prod-card">` +
                `<div class="ai-prod-title">${escapeHtml(p.name || p.nama)}</div>` +
                `<div class="ai-prod-meta">SKU: <code>${escapeHtml(p.sku || '-')}</code> • Kategori: <b>${escapeHtml(p.category || 'Umum')}</b></div>` +
                `<div style="margin:8px 0;display:flex;align-items:center;gap:8px">` +
                `<span style="font-size:16px;font-weight:800;color:var(--brand-700)">${totalStok} ${escapeHtml(p.unit || 'pcs')}</span> ${badge}` +
                `</div>` +
                `<div style="font-size:12px;margin:6px 0;color:var(--ink-700);line-height:1.6">` +
                `<b>Sebaran Gudang:</b><br>${whBreakdown}<br>` +
                `Harga Satuan: <b>${formatRp(hargaVal)}</b> (Nilai Aset: <b>${formatRp(totalStok * hargaVal)}</b>)` +
                `</div>` +
                `</div>` +
                renderQuickButtons([
                  { label: 'Cek Barang Kritis Lainnya', q: 'Stok apa yang hampir habis?' },
                  { label: 'Ringkasan Gudang', q: 'Ringkasan stok per gudang' }
                ]);
            } else if (matches.length > 1) {
              const rows = matches.slice(0, 6).map(p => {
                const totalQ = getStock(p, 'Semua Gudang');
                const isCrit = totalQ <= Number(p.min || 5);
                const color = isCrit ? 'color:var(--danger)' : 'color:var(--brand-700)';
                return `<tr><td><b>${escapeHtml(p.name || p.nama)}</b><br><small>SKU: ${escapeHtml(p.sku || '-')}</small></td>` +
                  `<td><b style="${color}">${totalQ}</b> ${escapeHtml(p.unit || 'unit')}</td><td>${escapeHtml(p.category || '-')}</td></tr>`;
              }).join('');

              return `<b>Ditemukan ${matches.length} produk yang cocok dengan pencarian "${escapeHtml(cleanQ)}":</b>` +
                `<table class="ai-data-table"><thead><tr><th>Produk</th><th>Stok</th><th>Kategori</th></tr></thead><tbody>${rows}</tbody></table>` +
                `<small style="color:var(--ink-500)">Ketik nama barang yang lebih spesifik untuk melihat rincian per gudang.</small>`;
            }
          }

          // 17. SMART CONTEXTUAL FALLBACK
          const critCount = products.filter(p => getStock(p, 'Semua Gudang') <= (p.min || 5) && p.active !== false).length;
          return ` <b>Saya siap membantu Anda seputar stok ${escapeHtml(bizName)}!</b><br><br>` +
            `Saya belum menemukan jawaban langsung untuk kata kunci <em>"${escapeHtml(q)}"</em>.<br>` +
            `Coba tanyakan dengan salah satu topik berikut:` +
            renderQuickButtons([
              { label: 'Stok Kritis (' + critCount + ')', q: 'Stok apa yang hampir habis?' },
              { label: 'Produk Terlaris', q: 'Barang apa yang paling banyak keluar?' },
              { label: 'Total Nilai Stok', q: 'Berapa total nilai stok saat ini?' },
              { label: 'Ringkasan Gudang', q: 'Ringkasan stok per gudang' },
              { label: 'Cara Input Barang', q: 'Cara input barang masuk' }
            ]);
        }

        // Chat history
        let chatHistory = [];
        let panelOpen = false;

        function timeNow() {
          return new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        }

        function appendMessage(text, role) {
          const msgEl = document.createElement('div');
          msgEl.className = 'aichat-msg ' + role;
          const contentHtml = role === 'user' ? escapeHtml(text) : text;
          msgEl.innerHTML = `<div class="aichat-bubble">${contentHtml}</div><div class="aichat-msg-time">${timeNow()}</div>`;
          const msgsEl = document.getElementById('aiChatMessages');
          msgsEl.appendChild(msgEl);
          msgsEl.scrollTop = msgsEl.scrollHeight;
          return msgEl;
        }

        function showTyping() {
          const el = document.createElement('div');
          el.className = 'aichat-typing';
          el.id = 'aiTypingIndicator';
          el.innerHTML = '<span></span><span></span><span></span>';
          const msgsEl = document.getElementById('aiChatMessages');
          msgsEl.appendChild(el);
          msgsEl.scrollTop = msgsEl.scrollHeight;
        }

        function hideTyping() {
          const el = document.getElementById('aiTypingIndicator');
          if (el) el.remove();
        }

        function formatAiResponse(raw) {
          if (!raw) return '';
          let t = String(raw);
          // Escape HTML tags to prevent XSS
          t = t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          // Code blocks ```code```
          t = t.replace(/```([\s\S]*?)```/g, '<pre style="background:#0f172a;color:#f8fafc;padding:8px 10px;border-radius:6px;font-size:11px;overflow-x:auto;margin:6px 0;"><code>$1</code></pre>');
          // Inline code `code`
          t = t.replace(/`([^`]+)`/g, '<code style="background:#f1f5f9;color:#0f172a;padding:1px 4px;border-radius:4px;font-size:11px;">$1</code>');
          // Markdown bold **text**
          t = t.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          // Markdown italic *text*
          t = t.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
          // Headings ### and ##
          t = t.replace(/^### (.*$)/gim, '<div style="font-weight:700;font-size:13px;margin:8px 0 3px;color:#1e293b;">$1</div>');
          t = t.replace(/^## (.*$)/gim, '<div style="font-weight:700;font-size:14px;margin:10px 0 4px;color:#0f172a;">$1</div>');
          // Bullet list items
          t = t.replace(/^[\*\-] (.*$)/gim, '<div style="display:flex;gap:6px;margin:3px 0;align-items:flex-start;"><span style="color:#3b82f6;font-size:13px;line-height:1.2;">•</span><span>$1</span></div>');
          // Numbered list items
          t = t.replace(/^(\d+)\. (.*$)/gim, '<div style="display:flex;gap:6px;margin:3px 0;align-items:flex-start;"><span style="font-weight:600;color:#3b82f6;font-size:11px;line-height:1.4;">$1.</span><span>$2</span></div>');
          // Multiple newlines to spaced separation
          t = t.replace(/\n{2,}/g, '<div style="height:6px;"></div>');
          t = t.replace(/\n/g, '<br>');
          return t;
        }

        function sendChat(q) {
          if (!q || !q.trim()) return;
          const query = q.trim();
          recordQuestion(query);
          appendMessage(query, 'user');
          chatHistory.push({ role: 'user', text: query });

          showTyping();

          // Ambil penyedia AI, Base URL, API Key dan model dari Settings atau Local Storage
          const aiProvider = ((store.settings && store.settings.aiProvider) || localStorage.getItem('stokkita_ai_provider') || 'gemini').toLowerCase();
          const aiBaseUrl = (store.settings && store.settings.aiBaseUrl) || localStorage.getItem('stokkita_ai_base_url') || '';
          const customApiKey = (store.settings && store.settings.geminiApiKey) || localStorage.getItem('stokkita_gemini_api_key') || '';
          const provMeta = AI_PROVIDER_PRESETS[aiProvider] || AI_PROVIDER_PRESETS.gemini;
          const customModel = (store.settings && store.settings.geminiModel) || provMeta.defaultModel || 'gemini-2.5-flash';
          const hasGeminiKey = !!(customApiKey || (store.settings && store.settings.hasGeminiKey));

          if (hasGeminiKey) {
            // Bangun konteks stok realtime yang komprehensif
            let stockContext = '';
            try {
              const products = store.products || [];
              const warehouses = store.warehouses || [];
              const transactions = store.transactions || [];

              let totalUnits = 0;
              let totalValuation = 0;
              const habisList = [];
              const kritisList = [];
              const amanList = [];

              products.forEach(p => {
                const total = Object.values(p.stocks || {}).reduce((s, v) => s + Number(v || 0), 0);
                const minStock = p.minStock || p.min || 0;
                const buyPrice = Number(p.buyPrice || p.buy || 0);
                const sellPrice = Number(p.sellPrice || p.price || 0);
                totalUnits += total;
                totalValuation += total * buyPrice;

                const itemInfo = `${p.name} (SKU: ${p.sku}, Kat: ${p.category || '-'}, Stok: ${total} ${p.unit || 'pcs'}, Min: ${minStock}, Beli: Rp${buyPrice.toLocaleString('id-ID')}, Jual: Rp${sellPrice.toLocaleString('id-ID')})`;
                if (total <= 0) habisList.push(itemInfo);
                else if (total <= minStock) kritisList.push(itemInfo);
                else amanList.push(itemInfo);
              });

              stockContext += `=== RINGKASAN INVENTORI REALTIME ===\n`;
              stockContext += `Waktu Analisis: ${new Date().toLocaleString('id-ID')}\n`;
              stockContext += `Total SKU Terdaftar: ${products.length}\n`;
              stockContext += `Total Unit Fisik: ${totalUnits.toLocaleString('id-ID')} unit\n`;
              stockContext += `Total Valuasi Aset Stok: Rp ${totalValuation.toLocaleString('id-ID')}\n`;
              stockContext += `Daftar Gudang (${warehouses.length}): ${warehouses.map(w => w.name).join(', ') || 'Utama'}\n\n`;

              stockContext += `[1. STOK HABIS (0 QTY) - ${habisList.length} SKU]\n`;
              if (habisList.length > 0) {
                stockContext += habisList.slice(0, 20).map(x => '- ' + x).join('\n') + '\n';
                if (habisList.length > 20) stockContext += `...dan ${habisList.length - 20} SKU habis lainnya.\n`;
              } else {
                stockContext += 'Tidak ada stok yang habis (0).\n';
              }
              stockContext += '\n';

              stockContext += `[2. STOK KRITIS (<= MINIMAL) - ${kritisList.length} SKU]\n`;
              if (kritisList.length > 0) {
                stockContext += kritisList.slice(0, 20).map(x => '- ' + x).join('\n') + '\n';
                if (kritisList.length > 20) stockContext += `...dan ${kritisList.length - 20} SKU kritis lainnya.\n`;
              } else {
                stockContext += 'Semua stok berada di atas batas minimal.\n';
              }
              stockContext += '\n';

              stockContext += `[3. SAMPLE STOK AMAN - ${amanList.length} SKU]\n`;
              if (amanList.length > 0) {
                stockContext += amanList.slice(0, 15).map(x => '- ' + x).join('\n') + '\n';
                if (amanList.length > 15) stockContext += `...dan ${amanList.length - 15} SKU lainnya.\n`;
              }
              stockContext += '\n';

              // Riwayat 10 transaksi terakhir
              const recentTx = transactions.slice(0, 10);
              if (recentTx.length > 0) {
                stockContext += `[4. 10 TRANSAKSI TERAKHIR]\n`;
                recentTx.forEach(t => {
                  stockContext += `- No: ${t.no} | Tgl: ${t.date} | Jenis: ${t.type} | Gudang: ${t.warehouse} | Qty: ${t.qty} | Pihak: ${t.party || '-'} | Status: ${t.status}\n`;
                });
              }
            } catch (ctxErr) {
              stockContext = 'Gagal membangun konteks stok: ' + ctxErr.message;
            }

            // Eksekusi pemanggilan Gemini AI langsung dari browser jika API key tersedia di client
            const tone = (store.settings && store.settings.geminiTone) || localStorage.getItem('stokkita_gemini_tone') || 'casual';
            const userCustomPrompt = ((store.settings && store.settings.geminiCustomPrompt) !== undefined ? store.settings.geminiCustomPrompt : (localStorage.getItem('stokkita_gemini_prompt') || '')).trim();

            let toneInstruction = '';
            if (tone === 'casual') {
              toneInstruction = "ATURAN GAYA BICARA:\n" +
                "- Gunakan Bahasa Indonesia sehari-hari yang santai, luwes, ramah, dan manusiawi (seperti mengobrol langsung dengan rekan kerja / admin toko).\n" +
                "- Jawab dengan SINGKAT, JELAS, dan LANGSUNG PADA INTI DATA tanpa bertele-tele.\n" +
                "- Hindari basa-basi pembuka dan penutup yang panjang (jangan mengulang 'Berdasarkan data inventori yang tercatat...').\n" +
                "- Jika ditanya stok barang tertentu, langsung sebutkan jumlahnya, satuannya, lokasinya di gudang mana, dan statusnya (aman/kritis/habis).\n" +
                "- Gunakan teks tebal **angka/nama** dan format poin yang rapi agar mudah dibaca sekilas.\n";
            } else if (tone === 'formal') {
              toneInstruction = "ATURAN GAYA BICARA:\n" +
                "- Gunakan Bahasa Indonesia yang formal, profesional, dan terstruktur.\n" +
                "- Sajikan ringkasan data, poin rekomendasi, dan tabel jika relevan.\n";
            }

            if (userCustomPrompt) {
              toneInstruction += `\nINSTRUKSI KHUSUS DARI PENGGUNA:\n${userCustomPrompt}\n`;
            }

            const sysPrompt = "Anda adalah Asisten Inventori untuk aplikasi 'StokKita'.\n\n" +
              toneInstruction + "\n" +
              `[DATA INVENTORI REALTIME TERKINI]:\n${stockContext}\n\n` +
              `[PERTANYAAN PENGGUNA]:\n${query}`;

            const executeDirectGemini = function(keyToUse, modelToUse) {
              const callEndpoint = function(mdl) {
                return fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(mdl)}:generateContent?key=${encodeURIComponent(keyToUse)}`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    contents: [{ parts: [{ text: sysPrompt }] }],
                    generationConfig: { maxOutputTokens: 1500, temperature: 0.3 }
                  })
                });
              };

              callEndpoint(modelToUse)
                .then(async res => {
                  if (res.status === 404 && modelToUse !== 'gemini-1.5-flash') {
                    return callEndpoint('gemini-1.5-flash');
                  }
                  return res;
                })
                .then(r => r.json())
                .then(data => {
                  hideTyping();
                  if (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
                    const answerText = data.candidates[0].content.parts.map(p => p.text).join('\n');
                    appendMessage(formatAiResponse(answerText), 'bot');
                    chatHistory.push({ role: 'bot', text: answerText });
                  } else {
                    const errMsg = (data && data.error && data.error.message) || 'Respon tidak valid dari server AI.';
                    appendMessage('<b>Gemini AI:</b> ' + escapeHtml(errMsg) + '<br><small>Mengalihkan ke analisis lokal sebagai fallback...</small>', 'bot');
                    const answer = analyzeQuery(query);
                    appendMessage(answer, 'bot');
                    chatHistory.push({ role: 'bot', text: answer });
                  }
                  renderFAQChips();
                })
                .catch(err => {
                  hideTyping();
                  console.error('Direct Gemini Fetch Error:', err);
                  appendMessage('Gagal terhubung ke AI (' + escapeHtml(err.message) + '). Menggunakan analisis lokal...', 'bot');
                  const answer = analyzeQuery(query);
                  appendMessage(answer, 'bot');
                  chatHistory.push({ role: 'bot', text: answer });
                  renderFAQChips();
                });
            };

            const callServerBackend = function() {
              if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                  .withSuccessHandler(function (result) {
                    hideTyping();
                    if (result && result.status === 'success' && result.answer) {
                      const formatted = formatAiResponse(result.answer);
                      appendMessage(formatted, 'bot');
                      chatHistory.push({ role: 'bot', text: result.answer });
                    } else if (result && result.status === 'fallback') {
                      const answer = analyzeQuery(query);
                      appendMessage(answer, 'bot');
                      chatHistory.push({ role: 'bot', text: answer });
                    } else {
                      const errMsg = (result && result.message) || 'Respons tidak valid dari server.';
                      appendMessage('<b>' + escapeHtml(provMeta.label) + ':</b> ' + escapeHtml(errMsg) + '<br><small>Mengalihkan ke analisis lokal sebagai fallback...</small>', 'bot');
                      const answer = analyzeQuery(query);
                      appendMessage(answer, 'bot');
                      chatHistory.push({ role: 'bot', text: answer });
                    }
                    renderFAQChips();
                  })
                  .withFailureHandler(function (err) {
                    hideTyping();
                    console.error('AI API Call Error:', err);
                    appendMessage('Koneksi ke server AI gagal. Menggunakan analisis lokal...', 'bot');
                    const answer = analyzeQuery(query);
                    appendMessage(answer, 'bot');
                    chatHistory.push({ role: 'bot', text: answer });
                    renderFAQChips();
                  })
                  .apiAskGemini(query, stockContext, customApiKey, customModel, tone, userCustomPrompt, aiProvider, aiBaseUrl);
              } else if (storedSheetsUrl) {
                fetch(storedSheetsUrl, {
                  method: 'POST',
                  headers: { 'Content-Type': 'text/plain' },
                  body: JSON.stringify({
                    action: 'askGemini',
                    query: query,
                    stockContext: stockContext,
                    apiKey: customApiKey,
                    model: customModel,
                    provider: aiProvider,
                    baseUrl: aiBaseUrl,
                    tone: tone,
                    prompt: userCustomPrompt
                  })
                })
                  .then(r => r.json())
                  .then(result => {
                    hideTyping();
                    if (result && result.status === 'success' && result.answer) {
                      const formatted = formatAiResponse(result.answer);
                      appendMessage(formatted, 'bot');
                      chatHistory.push({ role: 'bot', text: result.answer });
                    } else {
                      const answer = analyzeQuery(query);
                      appendMessage(answer, 'bot');
                      chatHistory.push({ role: 'bot', text: answer });
                    }
                    renderFAQChips();
                  })
                  .catch(() => {
                    hideTyping();
                    const answer = analyzeQuery(query);
                    appendMessage(answer, 'bot');
                    chatHistory.push({ role: 'bot', text: answer });
                    renderFAQChips();
                  });
              } else {
                hideTyping();
                const answer = analyzeQuery(query);
                appendMessage(answer, 'bot');
                chatHistory.push({ role: 'bot', text: answer });
                renderFAQChips();
              }
            };

            const executeDirectOpenAICompatible = function(endpoint, keyToUse, modelToUse) {
              const sysOnly = "Anda adalah Asisten Inventori untuk aplikasi 'StokKita'.\n\n" + toneInstruction;
              const userMsg = `[DATA INVENTORI REALTIME TERKINI]:\n${stockContext}\n\n[PERTANYAAN PENGGUNA]:\n${query}`;
              fetch(endpoint, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': 'Bearer ' + keyToUse
                },
                body: JSON.stringify({
                  model: modelToUse,
                  messages: [
                    { role: 'system', content: sysOnly },
                    { role: 'user', content: userMsg }
                  ],
                  temperature: 0.3,
                  max_tokens: 1500
                })
              })
                .then(r => r.json())
                .then(data => {
                  hideTyping();
                  if (data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) {
                    const answerText = String(data.choices[0].message.content);
                    appendMessage(formatAiResponse(answerText), 'bot');
                    chatHistory.push({ role: 'bot', text: answerText });
                    renderFAQChips();
                  } else {
                    const errMsg = (data && data.error && (data.error.message || data.error)) || 'Respon tidak valid dari server AI.';
                    appendMessage('<b>' + escapeHtml(provMeta.label) + ':</b> ' + escapeHtml(String(errMsg)) + '<br><small>Mengalihkan ke analisis lokal sebagai fallback...</small>', 'bot');
                    const answer = analyzeQuery(query);
                    appendMessage(answer, 'bot');
                    chatHistory.push({ role: 'bot', text: answer });
                    renderFAQChips();
                  }
                })
                .catch(err => {
                  console.warn('Direct external AI fetch failed, trying server fallback:', err);
                  callServerBackend();
                });
            };

            if (customApiKey) {
              if (aiProvider !== 'gemini') {
                const endpoint = resolveAiEndpointClient(aiProvider, aiBaseUrl);
                if (endpoint) {
                  executeDirectOpenAICompatible(endpoint, customApiKey, customModel);
                } else {
                  callServerBackend();
                }
              } else {
                executeDirectGemini(customApiKey, customModel);
              }
            } else {
              callServerBackend();
            }
          } else {
            // Belum ada Gemini Key: gunakan analisis lokal
            setTimeout(() => {
              try {
                hideTyping();
                const answer = analyzeQuery(query);
                appendMessage(answer, 'bot');
                chatHistory.push({ role: 'bot', text: answer });
                renderFAQChips();
              } catch (err) {
                hideTyping();
                console.error('AI Chat Error:', err);
                appendMessage('Maaf, ada kendala saat menganalisis: ' + escapeHtml(err.message), 'bot');
              }
            }, 80 + Math.random() * 50);
          }
        }

        function renderFAQChips() {
          const container = document.getElementById('aiFAQChips');
          if (!container) return;
          const suggestions = getSuggestions();
          const faqTop = getTopFAQ(3).map(x => x.text.toLowerCase());
          container.innerHTML = suggestions.map(s =>
            `<button class="faq-chip${faqTop.includes(s.toLowerCase()) ? ' hot' : ''}" data-q="${s.replace(/"/g, '&quot;')}">${s}</button>`
          ).join('');
        }

        function openPanel() {
          panelOpen = true;
          const panel = document.getElementById('aiChatPanel');
          const chatBtn = document.getElementById('aiChatBtn');
          if (panel) panel.classList.add('open');
          if (chatBtn) chatBtn.classList.add('is-hidden');
          document.getElementById('aiChatInput').focus();

          const hasGem = !!((store.settings && store.settings.geminiApiKey) || (store.settings && store.settings.hasGeminiKey) || localStorage.getItem('stokkita_gemini_api_key'));
          const provKey = ((store.settings && store.settings.aiProvider) || localStorage.getItem('stokkita_ai_provider') || 'gemini').toLowerCase();
          const provLabel = (AI_PROVIDER_PRESETS[provKey] || AI_PROVIDER_PRESETS.gemini).label;
          const modelName = (store.settings && store.settings.geminiModel) || (AI_PROVIDER_PRESETS[provKey] && AI_PROVIDER_PRESETS[provKey].defaultModel) || 'gemini-2.5-flash';
          const subEl = document.getElementById('aiChatSubtitle');
          if (subEl) {
            subEl.textContent = hasGem ? `${provLabel} (${modelName}) • Online` : 'Analisis Stok: Siap';
          }

          // Tampilkan pesan selamat datang jika kosong
          if (chatHistory.length === 0) {
            const bizName = (store.settings && store.settings.businessName) || 'Bisnis Anda';
            const aiMode = hasGem
              ? `<b>Mode ${escapeHtml(provLabel)} Aktif (<code>${escapeHtml(modelName)}</code>)</b>: Menganalisis inventori secara langsung.`
              : `<b>Mode Analisis Lokal</b>: Hubungkan API Key AI di menu <b>Pengaturan</b> untuk analisis mendalam bertenaga AI.`;
            appendMessage(`Halo! Saya <b>Asisten StokKita</b>.<br>Saya dapat menganalisis status stok, barang kritis, valuasi, dan mutasi <b>${escapeHtml(bizName)}</b> secara realtime.<br><div style="margin-top:6px;padding:6px 10px;background:#f8fafc;border-radius:6px;border:1px solid #e2e8f0;font-size:11px;">${aiMode}</div><br>Silakan ajukan pertanyaan atau klik saran cepat di atas.`, 'bot');
          }
        }

        function closePanel() {
          panelOpen = false;
          const panel = document.getElementById('aiChatPanel');
          const chatBtn = document.getElementById('aiChatBtn');
          if (panel) panel.classList.remove('open');
          if (chatBtn) chatBtn.classList.remove('is-hidden');
        }

        // DOM builder
        function buildChatWidget() {
          const hasGem = !!((store.settings && store.settings.geminiApiKey) || (store.settings && store.settings.hasGeminiKey) || localStorage.getItem('stokkita_gemini_api_key'));
          const provKey = ((store.settings && store.settings.aiProvider) || localStorage.getItem('stokkita_ai_provider') || 'gemini').toLowerCase();
          const provLabel = (AI_PROVIDER_PRESETS[provKey] || AI_PROVIDER_PRESETS.gemini).label;
          const modelName = (store.settings && store.settings.geminiModel) || (AI_PROVIDER_PRESETS[provKey] && AI_PROVIDER_PRESETS[provKey].defaultModel) || 'gemini-2.5-flash';

          // Chat Panel
          const panel = document.createElement('div');
          panel.id = 'aiChatPanel';
          panel.setAttribute('role', 'dialog');
          panel.setAttribute('aria-label', 'Asisten AI StokKita');
          panel.innerHTML = `
            <div class="aichat-header">
              <div class="aichat-avatar" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              </div>
              <div class="aichat-title">
                <strong>Asisten AI StokKita</strong>
                <span id="aiChatSubtitle">${hasGem ? `Gemini AI (${modelName}) • Online` : 'Analisis Stok: Siap'}</span>
              </div>
              <button class="aichat-close-btn" id="aiChatClearBtn" title="Bersihkan chat" aria-label="Bersihkan riwayat chat" style="margin-right:2px;background:none;border:none;cursor:pointer;color:#94a3b8;padding:4px;border-radius:6px;display:inline-flex;align-items:center;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
              </button>
              <button class="aichat-close-btn" id="aiChatCloseBtn" aria-label="Tutup chat">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
              </button>
            </div>
            <div class="aichat-faq-bar">
              <p>Pertanyaan Populer</p>
              <div class="faq-chips" id="aiFAQChips"></div>
            </div>
            <div class="aichat-messages" id="aiChatMessages"></div>
            <div class="aichat-input-row">
              <textarea id="aiChatInput" placeholder="Tanyakan tentang stok, barang, laporan…" rows="1" aria-label="Pesan ke AI"></textarea>
              <button id="aiChatSendBtn" aria-label="Kirim pesan">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-11 11M22 2l-7 20-4-9-9-4 20-7z"/></svg>
              </button>
            </div>
          `;

          // Floating Button
          const btn = document.createElement('button');
          btn.id = 'aiChatBtn';
          btn.setAttribute('aria-label', 'Buka Asisten AI StokKita');
          btn.title = 'Asisten Analisis Stok';
          btn.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              <circle cx="9" cy="11" r="1" fill="currentColor" stroke="none"/>
              <circle cx="12" cy="11" r="1" fill="currentColor" stroke="none"/>
              <circle cx="15" cy="11" r="1" fill="currentColor" stroke="none"/>
            </svg>
          `;

          document.body.appendChild(panel);
          document.body.appendChild(btn);

          // Render FAQ chips
          renderFAQChips();

          // Events
          btn.addEventListener('click', () => panelOpen ? closePanel() : openPanel());
          document.getElementById('aiChatCloseBtn').addEventListener('click', closePanel);
          const clearBtn = document.getElementById('aiChatClearBtn');
          if (clearBtn) {
            clearBtn.addEventListener('click', () => {
              chatHistory = [];
              const msgBox = document.getElementById('aiChatMessages');
              if (msgBox) msgBox.innerHTML = '';
              openPanel();
            });
          }

          document.getElementById('aiChatSendBtn').addEventListener('click', () => {
            const inp = document.getElementById('aiChatInput');
            sendChat(inp.value.trim());
            inp.value = '';
            inp.style.height = 'auto';
          });

          document.getElementById('aiChatInput').addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              const inp = e.target;
              sendChat(inp.value.trim());
              inp.value = '';
              inp.style.height = 'auto';
            }
          });

          // Auto-resize textarea
          document.getElementById('aiChatInput').addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 90) + 'px';
          });

          // FAQ chip clicks (delegasi)
          document.getElementById('aiFAQChips').addEventListener('click', e => {
            const chip = e.target.closest('.faq-chip');
            if (chip) sendChat(chip.dataset.q);
          });

          // Quick action buttons inside bot bubble (delegasi)
          document.getElementById('aiChatMessages').addEventListener('click', e => {
            const btn = e.target.closest('.ai-quick-btn');
            if (btn && btn.dataset.q) sendChat(btn.dataset.q);
          });
        }

        // Tunggu DOM siap
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', buildChatWidget);
        } else {
          buildChatWidget();
        }

      })();

    })();
  </script>
</body>

</html>
