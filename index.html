      function buildStockMovementChart(period, filteredTx, customFrom, customTo) {
        const now = new Date();
        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const monthsShort = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
        const dayKey = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
        const monthKey = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`;
        const fmtDay = (dt) => `${dt.getDate()} ${monthsShort[dt.getMonth()]}`;
        const fmtFullDay = (dt) => `${dt.getDate()} ${monthsShort[dt.getMonth()]} ${dt.getFullYear()}`;
        const fmtMonth = (dt) => `${monthsShort[dt.getMonth()]} ${dt.getFullYear()}`;

        const txList = Array.isArray(filteredTx) ? filteredTx : (store.transactions || []);
        const buckets = [];
        const bucketMap = {};
        let title = 'Pergerakan Stok';
        let subtitle = 'Perbandingan unit masuk dan keluar dari transaksi tercatat';
        let peakLabel = 'Puncak';

        const addTxToBucket = (idx, t) => {
          if (idx === undefined || !buckets[idx]) return;
          const tp = String(t.type || '').toLowerCase();
          const qty = Number(t.qty || 0);
          if (tp.includes('masuk') || tp === 'in') {
            buckets[idx].inQty += qty;
            buckets[idx].txCount += 1;
          } else if (tp.includes('keluar') || tp === 'out') {
            buckets[idx].outQty += qty;
            buckets[idx].txCount += 1;
          }
        };

        if (period === 'today') {
          title = 'Pergerakan Stok Hari Ini';
          subtitle = `Distribusi unit masuk dan keluar per 4 jam (${fmtFullDay(todayStart)})`;
          peakLabel = 'Puncak Sesi';
          const slots = [
            { key: '0', label: '00:00', fullLabel: '00:00 – 03:59' },
            { key: '1', label: '04:00', fullLabel: '04:00 – 07:59' },
            { key: '2', label: '08:00', fullLabel: '08:00 – 11:59' },
            { key: '3', label: '12:00', fullLabel: '12:00 – 15:59' },
            { key: '4', label: '16:00', fullLabel: '16:00 – 19:59' },
            { key: '5', label: '20:00', fullLabel: '20:00 – 23:59' }
          ];
          slots.forEach((s, i) => {
            bucketMap[s.key] = i;
            buckets.push({ label: s.label, fullLabel: s.fullLabel, inQty: 0, outQty: 0, txCount: 0 });
          });
          txList.forEach(t => {
            const m = String(t.date || '').match(/(\d{1,2}):(\d{2})/);
            const hour = m ? Math.min(23, Math.max(0, Number(m[1]))) : 12;
            const slotIdx = Math.floor(hour / 4);
            addTxToBucket(bucketMap[String(slotIdx)], t);
          });
        } else {
          let startDate = new Date(todayStart.getFullYear(), todayStart.getMonth(), 1);
          let endDate = new Date(todayStart);

          if (period === '7days') {
            title = 'Pergerakan Stok 7 Hari Terakhir';
            subtitle = 'Perbandingan unit masuk dan keluar harian (7 hari terakhir)';
            peakLabel = 'Puncak Harian';
            startDate = new Date(todayStart);
            startDate.setDate(startDate.getDate() - 6);
          } else if (period === '30days') {
            title = 'Pergerakan Stok 30 Hari Terakhir';
            subtitle = 'Perbandingan unit masuk dan keluar harian (30 hari terakhir)';
            peakLabel = 'Puncak Harian';
            startDate = new Date(todayStart);
            startDate.setDate(startDate.getDate() - 29);
          } else if (period === 'this-month') {
            title = `Pergerakan Stok Bulan ${monthsShort[now.getMonth()]} ${now.getFullYear()}`;
            subtitle = 'Perbandingan unit masuk dan keluar harian sepanjang bulan ini';
            peakLabel = 'Puncak Harian';
            startDate = new Date(now.getFullYear(), now.getMonth(), 1);
            endDate = new Date(todayStart);
          } else if (period === 'custom') {
            const parsedDates = txList.map(t => parseDateStr(t.date)).filter(Boolean).sort((a, b) => a - b);
            startDate = customFrom ? new Date(customFrom + 'T00:00:00') : (parsedDates[0] || new Date(todayStart.getFullYear(), todayStart.getMonth(), 1));
            endDate = customTo ? new Date(customTo + 'T00:00:00') : (parsedDates[parsedDates.length - 1] || new Date(todayStart));
            if (startDate > endDate) { const tmp = startDate; startDate = endDate; endDate = tmp; }
            title = 'Pergerakan Stok Periode Kustom';
            subtitle = `Periode ${fmtFullDay(startDate)} – ${fmtFullDay(endDate)}`;
          } else {
            title = 'Pergerakan Stok Semua Waktu';
            subtitle = 'Tren unit masuk dan keluar berdasarkan seluruh transaksi tercatat';
            const parsedDates = txList.map(t => parseDateStr(t.date)).filter(Boolean).sort((a, b) => a - b);
            if (parsedDates.length > 0) {
              startDate = new Date(parsedDates[0].getFullYear(), parsedDates[0].getMonth(), parsedDates[0].getDate());
              endDate = new Date(parsedDates[parsedDates.length - 1].getFullYear(), parsedDates[parsedDates.length - 1].getMonth(), parsedDates[parsedDates.length - 1].getDate());
              if (endDate < todayStart) endDate = new Date(todayStart);
            } else {
              startDate = new Date(todayStart);
              startDate.setDate(startDate.getDate() - 6);
            }
          }

          const spanDays = Math.max(1, Math.round((endDate - startDate) / 86400000) + 1);
          if (spanDays <= 35) {
            peakLabel = 'Puncak Harian';
            for (let dt = new Date(startDate); dt <= endDate; dt.setDate(dt.getDate() + 1)) {
              const k = dayKey(dt);
              bucketMap[k] = buckets.length;
              buckets.push({ label: fmtDay(dt), fullLabel: fmtFullDay(dt), inQty: 0, outQty: 0, txCount: 0 });
            }
            txList.forEach(t => {
              const d = parseDateStr(t.date);
              if (d) addTxToBucket(bucketMap[dayKey(d)], t);
            });
          } else if (spanDays <= 140) {
            peakLabel = 'Puncak Mingguan';
            const weekStarts = [];
            for (let dt = new Date(startDate); dt <= endDate; dt.setDate(dt.getDate() + 7)) {
              const ws = new Date(dt);
              const we = new Date(dt);
              we.setDate(we.getDate() + 6);
              if (we > endDate) we.setTime(endDate.getTime());
              weekStarts.push({ ws, we });
              buckets.push({
                label: fmtDay(ws),
                fullLabel: `${fmtDay(ws)} – ${fmtFullDay(we)}`,
                inQty: 0,
                outQty: 0,
                txCount: 0
              });
            }
            txList.forEach(t => {
              const d = parseDateStr(t.date);
              if (!d) return;
              const dDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
              const idx = weekStarts.findIndex(w => dDay >= w.ws && dDay <= w.we);
              if (idx >= 0) addTxToBucket(idx, t);
            });
          } else {
            peakLabel = 'Puncak Bulanan';
            const cur = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
            const endM = new Date(endDate.getFullYear(), endDate.getMonth(), 1);
            while (cur <= endM) {
              const k = monthKey(cur);
              bucketMap[k] = buckets.length;
              buckets.push({ label: fmtMonth(cur), fullLabel: fmtMonth(cur), inQty: 0, outQty: 0, txCount: 0 });
              cur.setMonth(cur.getMonth() + 1);
            }
            txList.forEach(t => {
              const d = parseDateStr(t.date);
              if (d) addTxToBucket(bucketMap[monthKey(d)], t);
            });
          }
        }

        const incoming = buckets.map(b => b.inQty);
        const outgoing = buckets.map(b => b.outQty);
        const sumIn = incoming.reduce((a, b) => a + b, 0);
        const sumOut = outgoing.reduce((a, b) => a + b, 0);
        const net = sumIn - sumOut;
        const peak = Math.max(...incoming, ...outgoing, 0);

        const summaryHtml = `
          <div class="chart-summary-strip">
            <div class="chart-kpi">
              <span class="chart-kpi-label">Total Masuk</span>
              <span class="chart-kpi-val" style="color:#166e56">+${rupiah.format(sumIn)} unit</span>
            </div>
            <div class="chart-kpi">
              <span class="chart-kpi-label">Total Keluar</span>
              <span class="chart-kpi-val" style="color:#a9650a">-${rupiah.format(sumOut)} unit</span>
            </div>
            <div class="chart-kpi">
              <span class="chart-kpi-label">Selisih Bersih</span>
              <span class="chart-kpi-val" style="color:${net >= 0 ? '#166e56' : '#b42318'}">${net >= 0 ? '+' : ''}${rupiah.format(net)} unit</span>
            </div>
            <div class="chart-kpi">
              <span class="chart-kpi-label">${peakLabel}</span>
              <span class="chart-kpi-val">${rupiah.format(peak)} unit</span>
            </div>
          </div>
        `;

        if (peak === 0 || buckets.length === 0) {
          const rangeText = buckets.length > 1 ? `${buckets[0].fullLabel} – ${buckets[buckets.length - 1].fullLabel}` : (buckets[0]?.fullLabel || '');
          return {
            title,
            subtitle,
            html: `${summaryHtml}<div style="height:170px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink-500);font-size:13px;padding:16px;background:var(--ink-50,#f7f9f8);border-radius:10px;border:1px dashed var(--ink-200)">Belum ada transaksi barang masuk atau keluar pada periode ini${rangeText ? ` (${rangeText})` : ''}.</div>`
          };
        }

        const rawStep = Math.ceil(peak / 4);
        const step = rawStep <= 5 ? Math.max(1, rawStep) : Math.ceil(rawStep / 5) * 5;
        const max = step * 4;
        const ticks = [0, step, step * 2, step * 3, max];

        const width = 700, height = 210, padX = 12, padY = 12;
        const n = buckets.length;
        const xForSvg = (i) => n === 1 ? width / 2 : padX + (i / (n - 1)) * (width - padX * 2);
        const yForSvg = (v) => height - padY - (v / max) * (height - padY * 2);
        const point = (v, i) => `${xForSvg(i)},${yForSvg(v)}`;

        const xPctFor = (i) => n === 1 ? 50 : (padX / width) * 100 + (i / (n - 1)) * (((width - padX * 2) / width) * 100);
        const yBottomPctFor = (v) => ((padY + (v / max) * (height - padY * 2)) / height) * 100;
        const colWidthPct = n <= 1 ? 24 : Math.max(2.6, Math.min(14, 92 / n));

        const labelEvery = n <= 10 ? 1 : Math.ceil(n / 7);
        const showPointTag = n <= 12;

        const html = `
          ${summaryHtml}
          <div class="chart-stage">
            <div class="chart-yaxis" aria-hidden="true">
              ${ticks.map(v => `<span>${rupiah.format(v)}</span>`).join('')}
            </div>
            <div class="chart-plot-area">
              <svg class="chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-label="${escapeHtml(title)}">
                <defs>
                  <linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#299979" stop-opacity=".28"/>
                    <stop offset="1" stop-color="#299979" stop-opacity="0"/>
                  </linearGradient>
                  <linearGradient id="areaGradientOut" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#e0a33d" stop-opacity=".16"/>
                    <stop offset="1" stop-color="#e0a33d" stop-opacity="0"/>
                  </linearGradient>
                </defs>
                ${ticks.map(v => {
                  const y = yForSvg(v);
                  return `<line class="chart-grid" x1="0" x2="${width}" y1="${y}" y2="${y}"/>`;
                }).join('')}
                ${n > 1 ? `<path class="chart-area" d="M ${point(incoming[0], 0)} ${incoming.slice(1).map((v, i) => `L ${point(v, i + 1)}`).join(' ')} L ${xForSvg(n - 1)},${height - padY} L ${xForSvg(0)},${height - padY} Z"/>` : ''}
                ${n > 1 ? `<path fill="url(#areaGradientOut)" d="M ${point(outgoing[0], 0)} ${outgoing.slice(1).map((v, i) => `L ${point(v, i + 1)}`).join(' ')} L ${xForSvg(n - 1)},${height - padY} L ${xForSvg(0)},${height - padY} Z"/>` : ''}
                ${n > 1 ? `<polyline class="chart-line-in" points="${incoming.map(point).join(' ')}"/><polyline class="chart-line-out" points="${outgoing.map(point).join(' ')}"/>` : ''}
              </svg>
              <div class="chart-cols">
                ${buckets.map((b, i) => {
                  const leftPct = xPctFor(i);
                  const inPct = yBottomPctFor(b.inQty);
                  const outPct = yBottomPctFor(b.outQty);
                  const bNet = b.inQty - b.outQty;
                  const edgeClass = leftPct < 15 ? ' edge-left' : (leftPct > 85 ? ' edge-right' : '');
                  const showDots = n <= 16 || b.inQty > 0 || b.outQty > 0;
                  return `
                    <div class="chart-col${edgeClass}" tabindex="0" style="left:${leftPct.toFixed(2)}%;width:${colWidthPct.toFixed(2)}%" aria-label="${escapeHtml(b.fullLabel)}: Masuk ${b.inQty}, Keluar ${b.outQty}">
                      <span class="chart-col-guide"></span>
                      ${showDots ? `<span class="chart-dot out" style="bottom:${outPct.toFixed(2)}%"></span><span class="chart-dot in" style="bottom:${inPct.toFixed(2)}%"></span>` : ''}
                      ${showPointTag && b.inQty > 0 ? `<span class="chart-point-tag" style="bottom:${inPct.toFixed(2)}%">+${rupiah.format(b.inQty)}</span>` : ''}
                      <div class="chart-tooltip">
                        <div style="font-weight:700;margin-bottom:3px;border-bottom:1px solid rgba(255,255,255,0.14);padding-bottom:3px">${escapeHtml(b.fullLabel)}</div>
                        <div style="display:flex;justify-content:space-between;gap:12px"><span>Masuk</span><strong style="color:#6ee7b7">+${rupiah.format(b.inQty)} unit</strong></div>
                        <div style="display:flex;justify-content:space-between;gap:12px"><span>Keluar</span><strong style="color:#fcd34d">-${rupiah.format(b.outQty)} unit</strong></div>
                        <div style="display:flex;justify-content:space-between;gap:12px;margin-top:2px;padding-top:2px;border-top:1px solid rgba(255,255,255,0.12)"><span>Selisih</span><strong>${bNet >= 0 ? '+' : ''}${rupiah.format(bNet)} unit</strong></div>
                        <div style="font-size:10px;color:#94a3b8;margin-top:2px">${b.txCount} transaksi tercatat</div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
          <div class="chart-xaxis" aria-hidden="true">
            ${buckets.map((b, i) => {
              const isVisible = i === 0 || i === n - 1 || (i % labelEvery === 0 && (n - 1 - i) >= Math.ceil(labelEvery * 0.6));
              if (!isVisible) return '';
              const leftPct = xPctFor(i);
              return `<span class="chart-xlabel" style="left:${leftPct.toFixed(2)}%">${escapeHtml(b.label)}</span>`;
            }).join('')}
          </div>
        `;

        return { title, subtitle, html };
      }

      function staffDashboardPage() {
        const staffWarehouse = (state.currentUser && state.currentUser.warehouse && state.currentUser.warehouse !== 'Semua Gudang') ? state.currentUser.warehouse : 'Gudang Utama';
        const staffName = state.currentUser ? state.currentUser.name : 'Staf Gudang';
        const firstName = staffName.split(' ')[0] || staffName;
        const myTransactions = store.transactions.filter(t => t.user === staffName || t.warehouse === staffWarehouse);
        const myOutToday = myTransactions.filter(t => t.type === 'Barang Keluar').reduce((s, t) => s + (t.qty || 0), 0);
        const criticalStaff = store.products.filter(p => p.active && stockState(p, staffWarehouse)[0] !== 'Aman').length;
        const todayStr = formatTodayIndonesian();

        const staffSubtitleHtml = `
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px">
            <span style="display:inline-flex;align-items:center;gap:5px;background:var(--brand-50);color:var(--brand-700);border:1px solid var(--brand-200);padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600">
              ${icon('calendar')} ${todayStr}
            </span>
            <span style="color:var(--ink-500);font-size:13px">Siap mencatat aktivitas operasional ${staffWarehouse}.</span>
          </div>
        `;

        return `${toolbar(`Halo, ${firstName}`, staffSubtitleHtml, `<button class="btn btn-primary" data-route="outgoing">${icon('out')} Catat barang keluar</button>`)}
          <div class="stats-grid">
            <article class="card stat-card"><div class="stat-top"><span class="stat-label">Transaksi Keluar Saya</span><span class="stat-icon">${icon('out')}</span></div><div class="stat-value">${myTransactions.filter(t => t.type === 'Barang Keluar').length}</div><div class="stat-meta">${myOutToday} unit barang keluar</div></article>
            <article class="card stat-card" style="--accent:var(--danger);--accent-soft:var(--danger-soft)"><div class="stat-top"><span class="stat-label">Stok Kritis</span><span class="stat-icon">${icon('box')}</span></div><div class="stat-value">${criticalStaff}</div><div class="stat-meta">di ${staffWarehouse}</div></article>
          </div>
          <div class="dashboard-grid">
            <article class="card"><div class="card-header"><div class="card-title"><h3>Cari Stok Cepat</h3><p>${staffWarehouse}</p></div></div><div class="card-body">
              <div class="input-wrap">${icon('search', 'input-icon')}<input class="control with-icon" id="staffQuickSearch" placeholder="Ketik nama atau SKU barang…"></div>
              <div class="alert-list" id="staffQuickList" style="margin-top:15px">
                ${store.products.slice(0, 5).map(p => `<div class="alert-row"><span class="product-thumb">${p.name.slice(0, 2).toUpperCase()}</span><span class="row-main"><strong>${p.name}</strong><small>${p.sku}</small></span><span class="row-value"><strong>${p.stocks[staffWarehouse] || 0} ${p.unit}</strong>${badge(stockState(p, staffWarehouse)[0])}</span></div>`).join('')}
              </div>
            </div></article>
            <article class="card"><div class="card-header"><div class="card-title"><h3>Riwayat Transaksi Saya</h3><p>Catatan terakhir</p></div></div><div class="card-body"><div class="activity-list">
              ${myTransactions.slice(0, 4).map(t => `<div class="activity-row"><span class="activity-icon">${icon(t.type === 'Barang Masuk' ? 'in' : (t.type === 'Transfer' ? 'transfer' : 'out'))}</span><span class="row-main"><strong>${t.no}</strong><small>${t.items} barang · ${t.qty} unit</small></span><span class="row-value"><small>${t.date.split(' ')[1] || t.date}</small></span></div>`).join('') || '<div style="padding:15px;text-align:center;color:var(--ink-500);font-size:12px">Belum ada transaksi.</div>'}
            </div></div></article>
          </div>`;
      }

      function stockPage() {
        const staffWh = (state.currentUser && state.currentUser.warehouse && state.currentUser.warehouse !== 'Semua Gudang') ? state.currentUser.warehouse : 'Gudang Utama';
        const allowedWarehouse = isWarehouseScoped() ? staffWh : state.stockWarehouse;
        const filtered = store.products.filter(p => {
          const text = `${p.name} ${p.sku} ${p.barcode || ''} ${p.category}`.toLowerCase();
          const status = stockState(p, allowedWarehouse)[0];
          const matchesText = text.includes(state.stockQuery.toLowerCase());
          const matchesStatus = state.stockStatus === 'Semua Status' || state.stockStatus === status;
          return matchesText && matchesStatus;
        });

        const warehouseOptions = isWarehouseScoped()
          ? [staffWh]
          : ['Semua Gudang', ...store.warehouses.map(w => w.name)];

        return `${toolbar('Stok Saat Ini', 'Pantau saldo barang dan mutasi secara real-time.', `
          <button class="btn btn-secondary" data-action="export-current-stock">${icon('download')}<span class="btn-label-hide">Ekspor Excel</span></button>
          <button class="btn btn-primary" data-action="refresh">${icon('refresh')}<span class="btn-label-hide">Perbarui</span></button>`)}
          <div class="card filters">
            <div class="field grow"><label for="stockSearch">Cari barang</label><div class="input-wrap" style="position:relative">${icon('search', 'input-icon')}<input id="stockSearch" class="control with-icon" value="${state.stockQuery}" placeholder="Nama, SKU, barcode, atau kategori…" style="padding-right:75px"><button type="button" class="btn btn-secondary btn-sm" style="position:absolute;right:4px;top:4px;bottom:4px;padding:0 8px;gap:4px;font-size:11px" data-action="open-barcode-scanner" data-context="stockSearch" title="Scan Barcode untuk cari">${icon('scan')} Scan</button></div></div>
            <div class="field half-mobile"><label for="stockWarehouse">Gudang</label><select id="stockWarehouse" class="control">${warehouseOptions.map(x => `<option value="${x}" ${allowedWarehouse === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
            <div class="field half-mobile"><label for="stockStatus">Status</label><select id="stockStatus" class="control">${['Semua Status', 'Aman', 'Menipis', 'Habis'].map(x => `<option value="${x}" ${state.stockStatus === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
          </div>
          <article class="card">
            <div class="table-wrap desktop-table"><table><thead><tr><th>Barang</th><th>Kategori</th>${allowedWarehouse === 'Semua Gudang' ? store.warehouses.map(w => `<th>${w.name.replace('Gudang ', '')}</th>`).join('') : ''}<th>Total Stok</th><th>Minimum</th><th>Status</th><th>Kartu Stok</th></tr></thead><tbody>
              ${filtered.map(p => {
          const st = stockState(p, allowedWarehouse);
          const thumbHtml = `<span class="product-thumb">${p.name.slice(0, 2).toUpperCase()}</span>`;
          return `<tr>
                  <td><div class="cell-product">${thumbHtml}<span><strong>${p.name}</strong><span>${p.sku}</span></span></div></td>
                  <td>${p.category}</td>
                  ${allowedWarehouse === 'Semua Gudang' ? store.warehouses.map(w => `<td class="qty">${p.stocks[w.name] || 0}</td>`).join('') : ''}
                  <td><span class="qty">${rupiah.format(totalStock(p, allowedWarehouse))}</span> <span class="muted">${p.unit}</span></td>
                  <td>${getProductMin(p)} ${p.unit}</td>
                  <td>${badge(st[0])}</td>
                  <td><button class="icon-btn" style="width:32px;height:32px" data-action="view-stock-card" data-id="${p.id}" title="Buka kartu stok ${p.name}">${icon('eye')}</button></td>
                </tr>`;
        }).join('') || `<tr><td colspan="10">${emptyState('search', 'Barang tidak ditemukan', 'Coba ubah kata kunci atau filter pencarian.')}</td></tr>`}
            </tbody></table></div>
            <div class="mobile-records">${filtered.map(p => {
          const st = stockState(p, allowedWarehouse);
          const thumbHtml = `<span class="product-thumb">${p.name.slice(0, 2).toUpperCase()}</span>`;
          return `<div class="mobile-record"><div class="mobile-record-head"><div class="cell-product">${thumbHtml}<span><strong>${p.name}</strong><span>${p.sku}</span></span></div>${badge(st[0])}</div><div class="mobile-record-grid"><div><span>Gudang</span><strong>${allowedWarehouse}</strong></div><div><span>Stok</span><strong>${totalStock(p, allowedWarehouse)} ${p.unit}</strong></div><div><span>Kategori</span><strong>${p.category}</strong></div><div><span>Minimum</span><strong>${getProductMin(p)} ${p.unit}</strong></div></div><button class="btn btn-secondary btn-sm" style="margin-top:6px" data-action="view-stock-card" data-id="${p.id}">${icon('eye')} Kartu Stok</button></div>`;
        }).join('')}</div>
            <div class="table-footer"><span>Menampilkan ${filtered.length} dari ${store.products.length} barang</span><div class="pagination"><button class="page-btn active">1</button></div></div>
          </article>`;
      }

      function stockCardPage() {
        const staffWh = (state.currentUser && state.currentUser.warehouse && state.currentUser.warehouse !== 'Semua Gudang') ? state.currentUser.warehouse : 'Gudang Utama';
        const allowedWarehouse = isWarehouseScoped() ? staffWh : (state.stockCardWarehouse || 'Semua Gudang');

        const activeProducts = store.products.filter(p => p.active !== false);
        if (activeProducts.length === 0) {
          return `${toolbar('Kartu Stok', 'Buku mutasi pergerakan barang.', '')}
            <div class="card" style="padding:40px;text-align:center;">${emptyState('package', 'Belum Ada Barang', 'Silakan tambahkan data produk terlebih dahulu di Master Barang.')}</div>`;
        }

        let selProdId = state.stockCardProductId;
        let prod = activeProducts.find(p => p.id === selProdId);
        if (!prod) {
          prod = activeProducts[0];
          selProdId = prod.id;
          state.stockCardProductId = selProdId;
        }

        const period = state.stockCardPeriod || 'all';
        const dFrom = state.stockCardDateFrom;
        const dTo = state.stockCardDateTo;
        const periodLabels = {
          all: 'Semua Waktu',
          today: 'Hari Ini',
          '7days': '7 Hari Terakhir',
          '30days': '30 Hari Terakhir',
          'this-month': 'Bulan Ini',
          custom: 'Rentang Kustom'
        };

        const whOptions = isWarehouseScoped()
          ? [staffWh]
          : ['Semua Gudang', ...store.warehouses.map(w => w.name)];

        // Get full ledger for this product sorted chronologically (oldest to newest)
        const rawLedger = (store.stockLedger || []).filter(l => l.productId === prod.id);
        const sortedChronologicalLedger = [...rawLedger].sort((a, b) => parseDateTimeToSort(a.date) - parseDateTimeToSort(b.date));

        // Filter by warehouse
        const whLedger = allowedWarehouse === 'Semua Gudang'
          ? sortedChronologicalLedger
          : sortedChronologicalLedger.filter(l => l.warehouse === allowedWarehouse);

        // Anchor historical opening balance from actual live stock so >90-day ledger pruning never drifts balances
        const actualLiveStock = totalStock(prod, allowedWarehouse);
        const netLedgerDelta = whLedger.reduce((sum, l) => {
          const plus = ['IN', 'TRANSFER_IN', 'ADJUSTMENT_PLUS', 'OPENING'].includes(l.type);
          const minus = ['OUT', 'TRANSFER_OUT', 'DAMAGE', 'DAMAGE_OUT', 'ADJUSTMENT_MINUS'].includes(l.type);
          const q = Number(l.qty || 0);
          return sum + (plus ? q : (minus ? -q : 0));
        }, 0);
        const historicalBaseBalance = whLedger.length > 0 ? (actualLiveStock - netLedgerDelta) : actualLiveStock;

        let runningBalance = historicalBaseBalance;
        let saldoAwal = historicalBaseBalance;
        let totalMasuk = 0;
        let totalKeluar = 0;
        const processedRows = [];

        whLedger.forEach(l => {
          const isPlus = ['IN', 'TRANSFER_IN', 'ADJUSTMENT_PLUS', 'OPENING'].includes(l.type);
          const isMinus = ['OUT', 'TRANSFER_OUT', 'DAMAGE', 'DAMAGE_OUT', 'ADJUSTMENT_MINUS'].includes(l.type);
          const qty = Number(l.qty || 0);

          const inPeriod = isTxInPeriod(l.date, period, dFrom, dTo);

          if (!inPeriod && period !== 'all') {
            const txTime = parseDateTimeToSort(l.date);
            let periodStartTime = 0;
            const now = new Date();
            if (period === 'today') {
              const s = new Date(now.getFullYear(), now.getMonth(), now.getDate());
              periodStartTime = s.getTime();
            } else if (period === '7days') {
              periodStartTime = now.getTime() - (7 * 86400000);
            } else if (period === '30days') {
              periodStartTime = now.getTime() - (30 * 86400000);
            } else if (period === 'this-month') {
              const s = new Date(now.getFullYear(), now.getMonth(), 1);
              periodStartTime = s.getTime();
            } else if (period === 'custom' && dFrom) {
              periodStartTime = new Date(dFrom + 'T00:00:00').getTime();
            }
            if (txTime < periodStartTime) {
              if (isPlus) saldoAwal += qty;
              else if (isMinus) saldoAwal -= qty;
            }
          }

          if (isPlus) runningBalance += qty;
          else if (isMinus) runningBalance -= qty;

          if (inPeriod) {
            if (isPlus) totalMasuk += qty;
            if (isMinus) totalKeluar += qty;

            processedRows.push({
              id: l.id,
              date: l.date,
              warehouse: l.warehouse,
              type: l.type,
              qtyIn: isPlus ? qty : 0,
              qtyOut: isMinus ? qty : 0,
              balance: runningBalance,
              refNo: l.refNo || '-',
              user: l.user || 'Sistem',
              notes: l.notes || '',
              photo: l.photo || ''
            });
          }
        });

        const displayRows = [...processedRows].reverse();
        const saldoAkhir = (period === 'all') ? runningBalance : (saldoAwal + totalMasuk - totalKeluar);
        const currentPhysStock = totalStock(prod, allowedWarehouse);
        const [stStateName, stBadgeClass] = stockState(prod, allowedWarehouse);

        const typeBadge = (type) => {
          switch (type) {
            case 'IN': return '<span class="badge success">Barang Masuk</span>';
            case 'OUT': return '<span class="badge danger">Barang Keluar</span>';
            case 'TRANSFER_IN': return '<span class="badge info">Transfer Masuk</span>';
            case 'TRANSFER_OUT': return '<span class="badge warning">Transfer Keluar</span>';
            case 'DAMAGE': return '<span class="badge danger">Barang Rusak</span>';
            case 'OPNAME':
            case 'ADJUSTMENT_PLUS':
            case 'ADJUSTMENT_MINUS': return '<span class="badge neutral">Penyesuaian Opname</span>';
            case 'OPENING': return '<span class="badge neutral">Saldo Awal</span>';
            default: return `<span class="badge neutral">${escapeHtml(type)}</span>`;
          }
        };

        const prodPhoto = prod.photo || prod.foto || '';

        return `${toolbar('Kartu Stok Barang', 'Buku besar mutasi fisik barang dan rincian transaksi masuk / keluar.', `
          <button class="btn btn-secondary" data-action="print-stock-card">${icon('printer')} Cetak Kartu Stok</button>
          <button class="btn btn-primary" data-action="export-stock-card">${icon('download')} Ekspor Excel (.xlsx)</button>
        `)}
          <div class="card filters" style="display:grid;grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));gap:12px;margin-bottom:16px;">
            <div class="field" style="grid-column:span 2;min-width:260px;">
              <label for="stockCardProductSelect">Pilih Barang *</label>
              <div style="display:flex;gap:8px;">
                <select id="stockCardProductSelect" class="control" style="font-weight:600;flex:1;">
                  ${activeProducts.map(p => `
                    <option value="${p.id}" ${p.id === prod.id ? 'selected' : ''}>${escapeHtml(p.name)} [${escapeHtml(p.sku)}] Total: ${totalStock(p)} ${escapeHtml(p.unit)}</option>
                  `).join('')}
                </select>
                <button type="button" class="btn btn-secondary" data-action="open-barcode-scanner" data-context="stockCard" style="flex:none;gap:5px;white-space:nowrap;" title="Scan Barcode untuk beralih barang">
                  ${icon('scan')} Scan
                </button>
              </div>
            </div>
            <div class="field">
              <label for="stockCardWhSelect">Lokasi Gudang</label>
              <select id="stockCardWhSelect" class="control">
                ${whOptions.map(w => `<option value="${w}" ${allowedWarehouse === w ? 'selected' : ''}>${w}</option>`).join('')}
              </select>
            </div>
            <div class="field">
              <label for="stockCardPeriodSelect">Periode Mutasi</label>
              <select id="stockCardPeriodSelect" class="control">
                <option value="all" ${period === 'all' ? 'selected' : ''}>Semua Waktu</option>
                <option value="today" ${period === 'today' ? 'selected' : ''}>Hari Ini</option>
                <option value="7days" ${period === '7days' ? 'selected' : ''}>7 Hari Terakhir</option>
                <option value="30days" ${period === '30days' ? 'selected' : ''}>30 Hari Terakhir</option>
                <option value="this-month" ${period === 'this-month' ? 'selected' : ''}>Bulan Ini</option>
                <option value="custom" ${period === 'custom' ? 'selected' : ''}>Kustom Tanggal…</option>
              </select>
            </div>
            ${period === 'custom' ? `
              <div class="field">
                <label for="stockCardDateFrom">Dari Tanggal</label>
                <input type="date" id="stockCardDateFrom" class="control" value="${state.stockCardDateFrom || ''}">
              </div>
              <div class="field">
                <label for="stockCardDateTo">Sampai Tanggal</label>
                <input type="date" id="stockCardDateTo" class="control" value="${state.stockCardDateTo || ''}">
              </div>
            ` : ''}
          </div>

          <!-- Product Details Card -->
          <div class="card" style="padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;">
            <div style="display:flex;align-items:center;gap:16px;min-width:240px;">
              ${prodPhoto ? `
                <img src="${escapeHtml(prodPhoto)}" alt="${escapeHtml(prod.name)}" style="width:58px;height:58px;object-fit:cover;border-radius:10px;border:1px solid var(--ink-200);cursor:pointer;" data-action="view-photo" data-photo="${escapeHtml(prodPhoto)}" data-title="Foto Produk: ${escapeHtml(prod.name)}" title="Klik untuk memperbesar">
              ` : `
                <div class="avatar" style="width:58px;height:58px;font-size:20px;border-radius:12px;background:var(--brand-50);color:var(--brand-700);border:1px solid var(--brand-200);">${escapeHtml(prod.name.slice(0, 2).toUpperCase())}</div>
              `}
              <div>
                <div style="display:flex;align-items:center;gap:8px;">
                  <h2 style="margin:0;font-size:18px;">${escapeHtml(prod.name)}</h2>
                  <span class="badge ${stBadgeClass}" style="font-size:11px;">${stStateName}</span>
                </div>
                <div style="margin-top:4px;font-size:12px;color:var(--ink-500);">
                  SKU: <strong>${escapeHtml(prod.sku)}</strong> · Kategori: <strong>${escapeHtml(prod.category)}</strong> · Satuan: <strong>${escapeHtml(prod.unit)}</strong> · Batas Min: <strong>${getProductMin(prod)} ${escapeHtml(prod.unit)}</strong>
                </div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
              ${store.warehouses.map(w => `
                <div style="padding:6px 12px;background:var(--surface);border:1px solid var(--ink-200);border-radius:8px;font-size:11px;">
                  <span style="color:var(--ink-500);display:block;">${escapeHtml(w.name)}</span>
                  <strong style="font-size:13px;color:var(--ink-900);">${prod.stocks[w.name] || 0} ${escapeHtml(prod.unit)}</strong>
                </div>
              `).join('')}
              <div style="padding:6px 14px;background:var(--brand-50);border:1px solid var(--brand-200);border-radius:8px;font-size:11px;">
                <span style="color:var(--brand-700);display:block;font-weight:600;">Total Fisik</span>
                <strong style="font-size:14px;color:var(--brand-700);">${currentPhysStock} ${escapeHtml(prod.unit)}</strong>
              </div>
            </div>
          </div>

          <!-- Summary Metric Cards -->
          <div class="stats-grid" style="grid-template-columns:repeat(4, minmax(0, 1fr));margin-bottom:16px;">
            <article class="card stat-card" style="--accent:var(--ink-600);--accent-soft:var(--ink-100);">
              <div class="stat-top"><span class="stat-label">Saldo Awal</span><span class="stat-icon">${icon('box')}</span></div>
              <div class="stat-value" style="font-size:22px;">${rupiah.format(saldoAwal)} <small style="font-size:12px;color:var(--ink-500);">${escapeHtml(prod.unit)}</small></div>
              <div class="stat-meta">Sebelum periode terpilih</div>
            </article>
            <article class="card stat-card" style="--accent:var(--brand-600);--accent-soft:var(--brand-50);">
              <div class="stat-top"><span class="stat-label">Total Masuk (+)</span><span class="stat-icon">${icon('in')}</span></div>
              <div class="stat-value" style="font-size:22px;color:var(--brand-600);">+${rupiah.format(totalMasuk)} <small style="font-size:12px;color:var(--ink-500);">${escapeHtml(prod.unit)}</small></div>
              <div class="stat-meta">Barang Masuk & Transfer In</div>
            </article>
            <article class="card stat-card" style="--accent:var(--danger);--accent-soft:var(--danger-soft);">
              <div class="stat-top"><span class="stat-label">Total Keluar (-)</span><span class="stat-icon">${icon('out')}</span></div>
              <div class="stat-value" style="font-size:22px;color:var(--danger);">-${rupiah.format(totalKeluar)} <small style="font-size:12px;color:var(--ink-500);">${escapeHtml(prod.unit)}</small></div>
              <div class="stat-meta">Penjualan, Transfer Out, Rusak</div>
            </article>
            <article class="card stat-card" style="--accent:var(--info);--accent-soft:var(--info-soft);">
              <div class="stat-top"><span class="stat-label">Saldo Akhir Periode</span><span class="stat-icon">${icon('check')}</span></div>
              <div class="stat-value" style="font-size:22px;color:var(--info);">${rupiah.format(saldoAkhir)} <small style="font-size:12px;color:var(--ink-500);">${escapeHtml(prod.unit)}</small></div>
              <div class="stat-meta">Saldo pada akhir periode</div>
            </article>
          </div>

          <!-- Transaction Table Card -->
          <article class="card" id="stockCardPrintSection">
            <div class="card-header">
              <div class="card-title">
                <h3>Buku Besar Mutasi Stok</h3>
                <p>Riwayat kronologis mutasi untuk ${escapeHtml(prod.name)} (${allowedWarehouse}) · ${periodLabels[period] || period}</p>
              </div>
              <span class="badge neutral">${displayRows.length} Baris Mutasi</span>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Waktu / Tanggal</th>
                    <th>Lokasi Gudang</th>
                    <th>Jenis Mutasi</th>
                    <th>No Referensi</th>
                    <th style="text-align:right;">Masuk (+)</th>
                    <th style="text-align:right;">Keluar (-)</th>
                    <th style="text-align:right;">Saldo Berjalan</th>
                    <th>Petugas</th>
                    <th>Keterangan & Bukti</th>
                  </tr>
                </thead>
                <tbody>
                  ${displayRows.length === 0 ? `
                    <tr><td colspan="9" style="padding:40px;text-align:center;color:var(--ink-500);">
                      ${emptyState('clipboard', 'Belum Ada Mutasi', 'Tidak ada transaksi untuk barang ini pada rentang filter yang dipilih.')}
                    </td></tr>
                  ` : displayRows.map(r => `
                    <tr>
                      <td><small style="font-weight:600;">${r.date}</small></td>
                      <td><span class="badge neutral">${escapeHtml(r.warehouse)}</span></td>
                      <td>${typeBadge(r.type)}</td>
                      <td>
                        <strong>${escapeHtml(r.refNo)}</strong>
                      </td>
                      <td style="text-align:right;">
                        ${r.qtyIn > 0 ? `<strong style="color:var(--brand-600);font-size:13px;">+${rupiah.format(r.qtyIn)}</strong>` : '<span style="color:var(--ink-300);">-</span>'}
                      </td>
                      <td style="text-align:right;">
                        ${r.qtyOut > 0 ? `<strong style="color:var(--danger);font-size:13px;">-${rupiah.format(r.qtyOut)}</strong>` : '<span style="color:var(--ink-300);">-</span>'}
                      </td>
                      <td style="text-align:right;">
                        <strong class="qty" style="font-size:14px;color:var(--ink-950);">${rupiah.format(r.balance)}</strong> <small style="color:var(--ink-500);">${escapeHtml(prod.unit)}</small>
                      </td>
                      <td><small>${escapeHtml(r.user)}</small></td>

      // Live Graphic Renderer (JsBarcode & QRCode)
      function renderBarcodePreviewGraphics() {
        const isCustom = state.barcodeTab === 'custom';
        const codeType = state.barcodeType || 'barcode';

        let codeText = '';
        if (isCustom) {
          codeText = (state.barcodeCustomText || '').trim();
        } else {
          const selId = (state.barcodeSelectedProductIds || [])[0];
          const p = store.products.find(x => x.id === selId);
          if (p) codeText = p.sku || p.barcode || p.id;
        }

        if (!codeText) return;

        if (codeType === 'barcode') {
          const svgEl = document.getElementById('barcodePreviewGraphic');
          if (svgEl && typeof JsBarcode === 'function') {
            try {
              JsBarcode(svgEl, codeText, {
                format: 'CODE128',
                width: 2,
                height: 48,
                displayValue: false,
                margin: 0
              });
            } catch (err) {
              console.warn('JsBarcode render fallback:', err);
              renderSvgBarcodeFallback(svgEl, codeText);
            }
          }
        } else if (codeType === 'qrcode') {
          const container = document.getElementById('qrcodePreviewContainer');
          const canvasEl = document.getElementById('qrcodePreviewGraphic');
          let rendered = false;

          // 1. Primary: qrcode-generator (Pure vector SVG with clean margin)
          if (typeof qrcode === 'function') {
            try {
              const qr = qrcode(0, 'M');
              qr.addData(codeText);
              qr.make();
              if (container) {
                container.innerHTML = qr.createSvgTag(3.5, 4);
                const svg = container.querySelector('svg');
                if (svg) {
                  svg.style.maxWidth = '110px';
                  svg.style.maxHeight = '110px';
                  svg.style.display = 'block';
                  svg.style.margin = '0 auto';
                }
                rendered = true;
              }
            } catch (err) {
              console.warn('qrcode-generator error:', err);
            }
          }

          // 2. Secondary: QRious canvas with white quiet zone
          if (!rendered && canvasEl && typeof QRious === 'function') {
            try {
              new QRious({
                element: canvasEl,
                value: codeText,
                size: 110,
                padding: 6,
                level: 'M'
              });
              rendered = true;
            } catch (err) {
              console.warn('QRious render error:', err);
            }
          }
        }
      }

      // Clean SVG Barcode Fallback if CDN delayed
      function renderSvgBarcodeFallback(svgEl, text) {
        if (!svgEl) return;
        svgEl.innerHTML = '';
        let hash = 0;
        for (let i = 0; i < text.length; i++) hash = (hash << 5) - hash + text.charCodeAt(i);
        let barsHtml = '';
        let x = 10;
        for (let i = 0; i < 40; i++) {
          const isBar = (Math.abs(hash * (i + 1)) % 10) > 3;
          const w = (i % 3 === 0) ? 3 : 2;
          if (isBar) {
            barsHtml += `<rect x="${x}" y="2" width="${w}" height="44" fill="#000" />`;
          }
          x += w + 1;
        }
        svgEl.setAttribute('viewBox', `0 0 ${x + 10} 48`);
        svgEl.innerHTML = barsHtml;
      }

      // Generate & Print Barcode Labels (Supports combining multiple labels in 1 page!)
      function printBarcodeLabels() {
        const isCustom = state.barcodeTab === 'custom';
        const codeType = state.barcodeType || 'barcode';
        const textUnder = state.barcodeTextDisplay || 'code';
        const printMode = state.barcodePrintMode || 'sheet';
        const labelWidth = Number(state.barcodeLabelWidth || 84);
        const labelHeight = Number(state.barcodeLabelHeight || 48);
        const labelQty = Math.max(1, Number(state.barcodeLabelQty || 1));

        let itemsToPrint = [];
        if (isCustom) {
          const txt = (state.barcodeCustomText || '').trim();
          if (!txt) return showToast('Peringatan', 'Silakan ketik teks kode kustom terlebih dahulu.', true);
          itemsToPrint.push({
            name: txt,
            sku: txt,
            barcode: txt,
            price: 0,
            unit: 'PCS',
            qty: labelQty
          });
        } else {
          const selIds = state.barcodeSelectedProductIds || [];
          if (!selIds.length) return showToast('Peringatan', 'Silakan pilih minimal 1 barang untuk dicetak.', true);
          itemsToPrint = selIds.map(id => {
            const p = store.products.find(x => x.id === id);
            return p ? {
              name: p.name,
              sku: p.sku || p.id,
              barcode: p.barcode || p.sku || p.id,
              price: p.buyPrice || 0,
              unit: p.unit || 'PCS',
              qty: labelQty
            } : null;
          }).filter(Boolean);
        }

        // Generate printable container
        let printContainer = document.getElementById('printableBarcodeLabels');
        if (!printContainer) {
          printContainer = document.createElement('div');
          printContainer.id = 'printableBarcodeLabels';
          document.body.appendChild(printContainer);
        }

        printContainer.className = printMode === 'sheet' ? 'printable-sheet-grid' : 'printable-individual';

        let labelsHtml = '';
        let labelIndex = 0;

        itemsToPrint.forEach(item => {
          for (let q = 0; q < item.qty; q++) {
            labelIndex++;
            const codeText = item.barcode || item.sku || item.name;
            const svgId = `printBarcodeSvg_${labelIndex}`;
            const qrBoxId = `printQrBox_${labelIndex}`;
            const canvasId = `printQrCanvas_${labelIndex}`;

            // Sheet mode: no page-break-after, allow multiple labels per page!
            const breakStyle = printMode === 'sheet'
              ? 'page-break-inside:avoid;break-inside:avoid;page-break-after:auto;break-after:auto;margin:1.5mm;'
              : 'page-break-after:always;break-after:page;margin:0 auto;';

            labelsHtml += `
              <div class="print-label-item" style="width:${labelWidth}mm;height:${labelHeight}mm;${breakStyle}display:inline-flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;padding:2.5mm;text-align:center;overflow:hidden;border:1px dashed #bbb;background:#fff;border-radius:4px;">
                <div style="font-size:7.5pt;font-weight:800;letter-spacing:0.5px;color:#444;text-transform:uppercase;margin-bottom:0.8mm;">
                  ${escapeHtml(store.settings?.companyName || 'STOKKITA')}
                </div>
                <div style="font-size:9.5pt;font-weight:700;color:#000;line-height:1.2;margin-bottom:1.2mm;max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                  ${escapeHtml(item.name)}
                </div>

                <div style="display:flex;justify-content:center;align-items:center;margin:0.8mm 0;min-height:16mm;">
                  ${codeType === 'barcode' ? `
                    <svg id="${svgId}" style="max-width:95%;height:16mm;"></svg>
                  ` : `
                    <div id="${qrBoxId}" style="display:flex;justify-content:center;align-items:center;">
                      <canvas id="${canvasId}" style="max-width:22mm;max-height:22mm;"></canvas>
                    </div>
                  `}
                </div>

                ${textUnder !== 'none' ? `
                  <div style="font-size:8pt;font-weight:700;font-family:monospace;margin-top:0.8mm;color:#111;">
                    ${textUnder === 'code' ? escapeHtml(codeText) : ''}
                    ${textUnder === 'name' ? escapeHtml(item.name) : ''}
                    ${textUnder === 'both' ? `${escapeHtml(item.sku || codeText)} · ${escapeHtml(item.name)}` : ''}
                  </div>
                ` : ''}

                ${item.price ? `
                  <div style="font-size:8.5pt;font-weight:800;color:#111;margin-top:0.4mm;">
                    Rp ${rupiah.format(item.price)}
                  </div>
                ` : ''}
              </div>
            `;
          }
        });

        printContainer.innerHTML = labelsHtml;

        // Render graphics onto generated SVG/Canvas
        labelIndex = 0;
        itemsToPrint.forEach(item => {
          for (let q = 0; q < item.qty; q++) {
            labelIndex++;
            const codeText = item.barcode || item.sku || item.name;
            if (codeType === 'barcode') {
              const svgEl = document.getElementById(`printBarcodeSvg_${labelIndex}`);
              if (svgEl && typeof JsBarcode === 'function') {
                try {
                  JsBarcode(svgEl, codeText, {
                    format: 'CODE128',
                    width: 2,
                    height: 44,
                    displayValue: false,
                    margin: 0
                  });
                } catch (e) {
                  renderSvgBarcodeFallback(svgEl, codeText);
                }
              }
            } else if (codeType === 'qrcode') {
              const qrBoxEl = document.getElementById(`printQrBox_${labelIndex}`);
              const canvasEl = document.getElementById(`printQrCanvas_${labelIndex}`);
              let qrRendered = false;

              // 1. Vector SVG (Print razor sharp with clean margin)
              if (qrBoxEl && typeof qrcode === 'function') {
                try {
                  const qr = qrcode(0, 'M');
                  qr.addData(codeText);
                  qr.make();
                  qrBoxEl.innerHTML = qr.createSvgTag(2.5, 3);
                  const svg = qrBoxEl.querySelector('svg');
                  if (svg) {
                    svg.style.maxWidth = '22mm';
                    svg.style.maxHeight = '22mm';
                    svg.style.display = 'block';
                  }
                  qrRendered = true;
                } catch (err) {
                  console.warn('Print QR generator error:', err);
                }
              }

              // 2. Canvas fallback
              if (!qrRendered && canvasEl && typeof QRious === 'function') {
                try {
                  new QRious({
                    element: canvasEl,
                    value: codeText,
                    size: 90,
                    padding: 4,
                    level: 'M'
                  });
                } catch (e) { }
              }
            }
          }
        });

        // Trigger print after brief graphic rendering delay
        setTimeout(() => {
          isPrintingBarcodes = true;
          window.print();
        }, 140);
      }

      // Download Single Label as High-Resolution PNG
      function downloadBarcodeLabel() {
        const isCustom = state.barcodeTab === 'custom';
        const codeType = state.barcodeType || 'barcode';
        const textUnder = state.barcodeTextDisplay || 'code';
        const labelWidthMm = Number(state.barcodeLabelWidth || 84);
        const labelHeightMm = Number(state.barcodeLabelHeight || 48);

        let item = null;
        if (isCustom) {
          const txt = (state.barcodeCustomText || '').trim();
          if (!txt) return showToast('Peringatan', 'Ketik teks kode terlebih dahulu.', true);
          item = { name: txt, sku: txt, barcode: txt, price: 0, unit: 'PCS' };
        } else {
          const selId = (state.barcodeSelectedProductIds || [])[0];
          item = store.products.find(p => p.id === selId);
          if (!item) return showToast('Peringatan', 'Silakan pilih minimal 1 barang untuk didownload.', true);
        }

        const codeText = item.barcode || item.sku || item.name;

        // Render onto 300 DPI high-res canvas
        const scale = 4; // High-res scale factor
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(labelWidthMm * scale);
        canvas.height = Math.round(labelHeightMm * scale);
        const ctx = canvas.getContext('2d');

        // White background
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Border
        ctx.strokeStyle = '#cccccc';
        ctx.lineWidth = Math.round(1.5 * scale);
        ctx.strokeRect(scale * 2, scale * 2, canvas.width - (scale * 4), canvas.height - (scale * 4));

        // Header: Company Name
        ctx.fillStyle = '#475569';
        ctx.font = `bold ${Math.round(8 * scale)}px Inter, Arial, sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText((store.settings?.companyName || 'STOKKITA').toUpperCase(), canvas.width / 2, Math.round(10 * scale));

        // Product Name
        ctx.fillStyle = '#0f172a';
        ctx.font = `bold ${Math.round(10 * scale)}px Inter, Arial, sans-serif`;
        const maxTextWidth = canvas.width - (scale * 8);
        ctx.fillText(item.name, canvas.width / 2, Math.round(18 * scale), maxTextWidth);

        const finalizeAndDownload = (imgElement, codeW, codeH) => {
          if (imgElement) {
            const cx = (canvas.width - codeW) / 2;
            const cy = Math.round(20 * scale);
            ctx.drawImage(imgElement, cx, cy, codeW, codeH);
          }

          // Text Under Code
          if (textUnder !== 'none') {
            ctx.fillStyle = '#1e293b';
            ctx.font = `bold ${Math.round(8.5 * scale)}px monospace, monospace`;
            let displayTxt = '';
            if (textUnder === 'code') displayTxt = codeText;
            else if (textUnder === 'name') displayTxt = item.name;
            else if (textUnder === 'both') displayTxt = `${item.sku || codeText} · ${item.name}`;
            ctx.fillText(displayTxt, canvas.width / 2, Math.round(canvas.height - (item.buyPrice || item.price ? 12 * scale : 6 * scale)), maxTextWidth);
          }

          // Price & Unit
          const pr = item.buyPrice || item.price;
          if (pr) {
            ctx.fillStyle = '#125646';
            ctx.font = `bold ${Math.round(9 * scale)}px Inter, Arial, sans-serif`;
            ctx.fillText(`Rp ${rupiah.format(pr)} / ${item.unit || 'PCS'}`, canvas.width / 2, canvas.height - Math.round(5 * scale));
          }

          // Trigger download
          canvas.toBlob(blob => {
            if (!blob) return;
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const safeName = (item.sku || item.name || 'label').replace(/[^a-zA-Z0-9_-]/g, '_');
            a.download = `Label_${safeName}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 4000);
            showToast('Label Diunduh', `Gambar label ${item.name} berhasil disimpan.`);
          }, 'image/png');
        };

        if (codeType === 'barcode') {
          const barCanvas = document.createElement('canvas');
          try {
            JsBarcode(barCanvas, codeText, {
              format: 'CODE128',
              width: 2.2 * (scale / 3),
              height: 48 * (scale / 3),
              displayValue: false,
              margin: 0
            });
            const bWidth = Math.min(canvas.width - (scale * 12), barCanvas.width);
            const bHeight = Math.round(18 * scale);
            finalizeAndDownload(barCanvas, bWidth, bHeight);
          } catch (e) {
            finalizeAndDownload(null, 0, 0);
          }
        } else {
          let qrDataUrl = '';
          if (typeof qrcode === 'function') {
            try {
              const qr = qrcode(0, 'M');
              qr.addData(codeText);
              qr.make();
              qrDataUrl = qr.createDataURL(4, 4);
            } catch (e) { }
          }
          if (!qrDataUrl && typeof QRious === 'function') {
            try {
              const qr = new QRious({ value: codeText, size: 160, padding: 8, level: 'M' });
              qrDataUrl = qr.toDataURL();
            } catch (e) { }
          }

          if (qrDataUrl) {
            const qrImg = new Image();
            qrImg.onload = () => {
              const qrSize = Math.round(23 * scale);
              finalizeAndDownload(qrImg, qrSize, qrSize);
            };
            qrImg.src = qrDataUrl;
          } else {
            finalizeAndDownload(null, 0, 0);
          }
        }
      }

      // Download All Selected Labels Combined into 1 Printable Sheet Grid Image (PNG)
      function downloadBarcodeSheet() {
        const isCustom = state.barcodeTab === 'custom';
        const codeType = state.barcodeType || 'barcode';
        const textUnder = state.barcodeTextDisplay || 'code';
        const labelWidthMm = Number(state.barcodeLabelWidth || 84);
        const labelHeightMm = Number(state.barcodeLabelHeight || 48);

        const selIds = state.barcodeSelectedProductIds || [];
        if (!selIds.length) return showToast('Peringatan', 'Silakan pilih minimal 1 barang.', true);

        const items = selIds.map(id => store.products.find(p => p.id === id)).filter(Boolean);
        if (!items.length) return;

        showToast('Menyiapkan Lembar', `Menggabungkan ${items.length} label barcode ke dalam 1 halaman PNG...`);

        // Standard sheet width 1654px (~200 DPI A4)
        const sheetWidth = 1654;
        const scale = 2.5;
        const itemW = Math.round(labelWidthMm * scale);
        const itemH = Math.round(labelHeightMm * scale);
        const gap = Math.round(4 * scale);
        const cols = Math.max(1, Math.floor((sheetWidth - gap * 2) / (itemW + gap)));
        const rows = Math.ceil(items.length / cols);
        const sheetHeight = Math.max(1200, (rows * (itemH + gap)) + 120);

        const canvas = document.createElement('canvas');
        canvas.width = sheetWidth;
        canvas.height = sheetHeight;
        const ctx = canvas.getContext('2d');

        // White background
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Header Title
        ctx.fillStyle = '#125646';
        ctx.font = 'bold 22px Inter, Arial, sans-serif';
        ctx.fillText(`LEMBAR LABEL BARCODE STOKKITA: ${items.length} ITEM`, 24, 38);
        ctx.fillStyle = '#64748b';
        ctx.font = '12px Inter, Arial, sans-serif';
        ctx.fillText(`Digenerate otomatis pada ${new Date().toLocaleString('id-ID')} · Mode: ${codeType === 'barcode' ? 'Barcode (Code 128)' : 'QR Code'}`, 24, 58);
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(24, 70);
        ctx.lineTo(sheetWidth - 24, 70);
        ctx.stroke();

        items.forEach((item, idx) => {
          const col = idx % cols;
          const row = Math.floor(idx / cols);
          const x = 24 + (col * (itemW + gap));
          const y = 85 + (row * (itemH + gap));
          const codeText = item.barcode || item.sku || item.name;

          ctx.save();
          ctx.translate(x, y);

          // Card
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, itemW, itemH);
          ctx.strokeStyle = '#cbd5e1';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(0, 0, itemW, itemH);

          // Header
          ctx.fillStyle = '#64748b';
          ctx.font = `bold ${Math.round(7.5 * scale)}px Inter, Arial, sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText((store.settings?.companyName || 'STOKKITA').toUpperCase(), itemW / 2, Math.round(9 * scale));

          // Name
          ctx.fillStyle = '#0f172a';
          ctx.font = `bold ${Math.round(9.5 * scale)}px Inter, Arial, sans-serif`;
          ctx.fillText(item.name, itemW / 2, Math.round(17 * scale), itemW - 20);

          // Code
          if (codeType === 'barcode') {
            const barCanvas = document.createElement('canvas');
            try {
              JsBarcode(barCanvas, codeText, { format: 'CODE128', width: 2, height: 40, displayValue: false, margin: 0 });
              const bWidth = Math.min(itemW - 20, barCanvas.width);
              const bHeight = Math.round(18 * scale);
              ctx.drawImage(barCanvas, (itemW - bWidth) / 2, Math.round(20 * scale), bWidth, bHeight);
            } catch (e) { }
          } else {
            let qrDataUrl = '';
            if (typeof qrcode === 'function') {
              try { const qr = qrcode(0, 'M'); qr.addData(codeText); qr.make(); qrDataUrl = qr.createDataURL(4, 4); } catch (e) { }
            }
            if (!qrDataUrl && typeof QRious === 'function') {
              try { const qr = new QRious({ value: codeText, size: 120, padding: 6, level: 'M' }); qrDataUrl = qr.toDataURL(); } catch (e) { }
            }
            if (qrDataUrl) {
              const img = new Image();
              img.src = qrDataUrl;
              const qrSize = Math.round(22 * scale);
              ctx.drawImage(img, (itemW - qrSize) / 2, Math.round(20 * scale), qrSize, qrSize);
            }
          }

          if (textUnder !== 'none') {
            ctx.fillStyle = '#1e293b';
            ctx.font = `bold ${Math.round(8 * scale)}px monospace, monospace`;
            ctx.fillText(codeText, itemW / 2, Math.round(itemH - 12 * scale), itemW - 16);
          }

          if (item.buyPrice) {
            ctx.fillStyle = '#125646';
            ctx.font = `bold ${Math.round(8.5 * scale)}px Inter, Arial, sans-serif`;
            ctx.fillText(`Rp ${rupiah.format(item.buyPrice)} / ${item.unit || 'PCS'}`, itemW / 2, itemH - Math.round(4 * scale));
          }

          ctx.restore();
        });

        canvas.toBlob(blob => {
          if (!blob) return;
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `Lembar_Label_StokKita_${items.length}_Item.png`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 4000);
          showToast('Lembar Label Diunduh', `Gambar lembaran ${items.length} label berhasil disimpan.`);
        }, 'image/png');
      }

      function getFilteredReportData() {
        const type = state.reportType || 'current-stock';
        const wh = state.reportWarehouse || 'Semua Gudang';
        const cat = state.reportCategory || 'Semua Kategori';
        const q = (state.reportQuery || '').toLowerCase();
        const period = state.reportPeriod || 'all';
        const dFrom = state.reportDateFrom;
        const dTo = state.reportDateTo;

        let headers = [];
        let rows = [];
        let title = '';
        let totalUnits = 0;

        if (type === 'current-stock') {
          title = 'Laporan Saldo Stok Saat Ini';
          const whNames = store.warehouses.map(w => w.name);
          headers = ['SKU', 'Nama Barang', 'Kategori', 'Satuan', ...whNames, 'Total Stok', 'Minimum', 'Status'];
          const filtered = store.products.filter(p => {
            const matchCat = cat === 'Semua Kategori' || p.category === cat;
            const matchQ = `${p.name} ${p.sku} ${p.category}`.toLowerCase().includes(q);
            return p.active && matchCat && matchQ;
          });
          rows = filtered.map(p => {
            const tot = totalStock(p);
            totalUnits += tot;
            return [
              p.sku,
              p.name,
              p.category,
              p.unit,
              ...whNames.map(wn => p.stocks[wn] || 0),
              tot,
              getProductMin(p),
              stockState(p)[0]
            ];
          });
        } else if (type === 'stock-card') {
          title = 'Laporan Kartu Stok & Mutasi';
          headers = ['Waktu', 'Barang', 'Lokasi Gudang', 'Jenis Mutasi', 'Kuantitas', 'Saldo Berjalan', 'No Referensi', 'Petugas', 'Catatan'];
          const list = store.stockLedger.filter(l => {
            const p = store.products.find(x => x.id === l.productId);
            const pName = p ? p.name : '';
            const matchWh = wh === 'Semua Gudang' || l.warehouse === wh;
            const matchPeriod = isTxInPeriod(l.date, period, dFrom, dTo);
            const matchQ = `${pName} ${l.type} ${l.refNo || ''} ${l.user || ''} ${l.notes || ''}`.toLowerCase().includes(q);
            return matchWh && matchPeriod && matchQ;
          });
          rows = list.map(l => {
            const p = store.products.find(x => x.id === l.productId);
            totalUnits += Number(l.qty || 0);
            return [
              l.date,
              p ? `${p.name} (${p.sku})` : l.productId,
              l.warehouse,
              l.type,
              l.qty,
              l.balanceAfter,
              l.refNo || '-',
              l.user || 'Admin',
              l.notes || '-'
            ];
          });
        } else if (type === 'incoming') {
          title = 'Laporan Penerimaan Barang Masuk';
          headers = ['No Transaksi', 'Waktu', 'Gudang Tujuan', 'Supplier', 'Rincian Barang', 'Total Qty', 'No Surat Jalan', 'Petugas', 'Status'];

            const matchWh = wh === 'Semua Gudang' || t.warehouse === wh;
            const matchPeriod = isTxInPeriod(t.date, period, dFrom, dTo);
            const text = `${t.no} ${t.party || ''} ${t.refNo || ''} ${t.user || ''} ${(t.details || []).map(d => d.name).join(' ')}`.toLowerCase();
            return matchWh && matchPeriod && text.includes(q);

            return [t.no, t.date, t.warehouse, t.party || '-', details, t.qty, t.refNo || '-', t.user || 'Admin', t.status || 'Posted'];
          });
        } else if (type === 'outgoing') {
          title = 'Laporan Pengeluaran Barang Keluar';
          headers = ['No Transaksi', 'Waktu', 'Gudang Asal', 'Tujuan / Penerima', 'Rincian Barang', 'Total Qty', 'No Referensi', 'Petugas', 'Status'];
          const list = store.transactions.filter(t => t.type === 'Barang Keluar').filter(t => {
            const matchWh = wh === 'Semua Gudang' || t.warehouse === wh;
            const matchPeriod = isTxInPeriod(t.date, period, dFrom, dTo);
            const text = `${t.no} ${t.party || ''} ${t.refNo || ''} ${t.user || ''} ${(t.details || []).map(d => d.name).join(' ')}`.toLowerCase();
            return matchWh && matchPeriod && text.includes(q);
          });
          rows = list.map(t => {
            totalUnits += Number(t.qty || 0);
            const details = (t.details || []).map(d => `${d.name} (${d.qty} ${d.unit || 'unit'})`).join(', ') || '-';
            return [t.no, t.date, t.warehouse, t.party || '-', details, t.qty, t.refNo || '-', t.user || 'Admin', t.status || 'Posted'];
          });
        } else if (type === 'damaged') {
          title = 'Laporan Barang Bermasalah & Rusak';
          headers = ['No Tiket', 'Waktu Lapor', 'Nama Barang', 'SKU', 'Lokasi Gudang', 'Qty Rusak', 'Satuan', 'Jenis Masalah', 'Tindakan', 'No Bukti', 'Pelapor', 'Status'];
          const list = (store.damagedItems || []).filter(item => {
            const matchWh = wh === 'Semua Gudang' || item.warehouse === wh;
            const matchPeriod = isTxInPeriod(item.date, period, dFrom, dTo);
            const text = `${item.no} ${item.productName} ${item.sku} ${item.issueType} ${item.action} ${item.user}`.toLowerCase();
            return matchWh && matchPeriod && text.includes(q);
          });
          rows = list.map(item => {
            totalUnits += Number(item.qty || 0);
            return [item.no, item.date, item.productName, item.sku, item.warehouse, item.qty, item.unit, item.issueType, item.action, item.refNo || '-', item.user, item.status || 'Dikonfirmasi'];
          });
        } else if (type === 'transfer') {
          title = 'Laporan Transfer Antar Gudang';
          headers = ['No Transfer', 'Waktu', 'Gudang Asal', 'Gudang Tujuan', 'Rincian Barang', 'Total Qty', 'No Surat Jalan', 'Petugas', 'Status'];
          const list = store.transfers.filter(tr => {
            const matchWh = wh === 'Semua Gudang' || tr.fromWarehouse === wh || tr.toWarehouse === wh;
            const matchPeriod = isTxInPeriod(tr.date, period, dFrom, dTo);
            const text = `${tr.no} ${tr.fromWarehouse} ${tr.toWarehouse} ${tr.refNo || ''} ${tr.user}`.toLowerCase();
            return matchWh && matchPeriod && text.includes(q);
          });
          rows = list.map(tr => {
            totalUnits += Number(tr.qty || 0);
            const linesSummary = (tr.lines || []).map(l => `${l.name || 'Barang'} (${l.qty} ${l.unit || 'unit'})`).join(', ') || `${tr.items} jenis`;
            return [tr.no, tr.date, tr.fromWarehouse, tr.toWarehouse, linesSummary, tr.qty, tr.refNo || '-', tr.user, tr.status];
          });
        } else if (type === 'opname') {
          title = 'Laporan Hasil Stok Opname';
          headers = ['No Sesi', 'Waktu Sesi', 'Gudang Diperiksa', 'Jumlah SKU', 'Total Selisih Bersih', 'Petugas', 'Status', 'Catatan'];
          const list = store.opnames.filter(op => {
            const matchWh = wh === 'Semua Gudang' || op.warehouse === wh;
            const matchPeriod = isTxInPeriod(op.date, period, dFrom, dTo);
            const text = `${op.no} ${op.warehouse} ${op.notes || ''} ${op.user}`.toLowerCase();
            return matchWh && matchPeriod && text.includes(q);
          });
          rows = list.map(op => {
            totalUnits += Math.abs(Number(op.totalDiff || 0));
            return [op.no, op.date, op.warehouse, `${op.itemsCount} SKU`, `${op.totalDiff > 0 ? '+' : ''}${op.totalDiff} unit`, op.user, op.status, op.notes || '-'];
          });
        } else if (type === 'audit') {
          title = 'Log Jejak Audit Pengguna & Sistem';
          headers = ['Waktu', 'Pengguna', 'Aksi', 'Entitas', 'Referensi', 'Deskripsi Aktivitas'];
          const list = store.auditLogs.filter(a => {
            const matchPeriod = isTxInPeriod(a.time, period, dFrom, dTo);
            const text = `${a.time} ${a.user} ${a.action} ${a.entity} ${a.ref} ${a.description}`.toLowerCase();
            return matchPeriod && text.includes(q);
          });
          rows = list.map(a => [a.time, a.user, a.action, a.entity, a.ref, a.description]);
        } else if (type === 'slow-moving') {
          title = 'Laporan Analisis Slow Moving & Dead Stock';
          headers = ['SKU', 'Nama Barang', 'Kategori', 'Gudang', 'Stok Saat Ini', 'Satuan', 'Estimasi Nilai Aset (Rp)', 'Terakhir Keluar', 'Hari Tidak Bergerak', 'Total Keluar (Periode)', 'Status Analisis'];
          const thresholdDays = Number(state.reportSlowThreshold || 60);
          const nowMs = Date.now();

          const activeProds = store.products.filter(p => {
            const matchCat = cat === 'Semua Kategori' || p.category === cat;
            const matchQ = `${p.name} ${p.sku} ${p.category}`.toLowerCase().includes(q);
            return p.active !== false && matchCat && matchQ;
          });

          let deadCount = 0;
          let slowCount = 0;
          let totalAssetStuck = 0;

          const itemsAnalysis = activeProds.map(p => {
            const currentStock = totalStock(p, wh);

            let lastOutTime = 0;
            let lastOutDateStr = 'Belum Ada';
            let recentOutQty = 0;

            (store.transactions || []).forEach(t => {
              const isOut = t.type === 'Barang Keluar' || (t.type || '').toLowerCase().includes('keluar');
              if (isOut) {
                if (wh !== 'Semua Gudang' && t.warehouse !== wh) return;
                let matchedQty = 0;
                if (Array.isArray(t.details) && t.details.length > 0) {
                  t.details.forEach(d => {
                    if (d.productId === p.id || d.sku === p.sku || d.name === p.name) {
                      matchedQty += Number(d.qty || 0);
                    }
                  });
                } else if (t.productId === p.id || t.sku === p.sku || t.product === p.name || t.name === p.name) {
                  matchedQty += Number(t.qty || 0);
                }

                if (matchedQty > 0) {
                  const tTime = parseDateTimeToSort(t.date);
                  if (tTime > lastOutTime) {
                    lastOutTime = tTime;
                    lastOutDateStr = t.date;
                  }
                  if (isTxInPeriod(t.date, period, dFrom, dTo)) {
                    recentOutQty += matchedQty;
                  }
                }
              }
            });

            const daysWithoutOut = lastOutTime > 0 ? Math.floor((nowMs - lastOutTime) / (1000 * 60 * 60 * 24)) : 999;
            const unitPrice = Number(p.buyPrice || p.price || 0);
            const assetValue = currentStock * unitPrice;

            let status = 'Fast Moving / Sehat';
            if (currentStock <= 0) {
              status = 'Stok Kosong';
            } else if (lastOutTime === 0 || daysWithoutOut >= 90) {
              status = 'Dead Stock (Stok Mati)';
              deadCount++;
              totalAssetStuck += assetValue;
            } else if (daysWithoutOut >= thresholdDays || (currentStock > 10 && recentOutQty < (currentStock * 0.15))) {
              status = 'Slow Moving (Lambat)';
              slowCount++;
              totalAssetStuck += assetValue;
            }

            return {
              product: p,
              currentStock,
              assetValue,
              lastOutDateStr,
              daysWithoutOut: daysWithoutOut === 999 ? 'Belum Pernah' : `${daysWithoutOut} hari`,
              daysCount: daysWithoutOut,
              recentOutQty,
              status
            };
          });

          // Urutkan barang yang paling lama tidak bergerak di atas
          itemsAnalysis.sort((a, b) => b.daysCount - a.daysCount);

          rows = itemsAnalysis.map(x => {
            totalUnits += x.currentStock;
            return [
              x.product.sku,
              x.product.name,
              x.product.category,
              wh,
              x.currentStock,
              x.product.unit,
              rupiah.format(x.assetValue),
              x.lastOutDateStr,
              x.daysWithoutOut,
              x.recentOutQty,
              x.status
            ];
          });

          return {
            title, headers, rows, totalUnits, count: rows.length,
            periodLabel: `Ambang Batas: ${thresholdDays} Hari Tidak Keluar`,
            deadCount, slowCount, totalAssetStuck
          };
        }

        let periodLabel = 'Semua Waktu';
        if (type === 'current-stock') {
          periodLabel = 'Real-Time / Saldo Terkini';
        } else if (period === 'today') {
          periodLabel = 'Hari Ini';
        } else if (period === '7days') {
          periodLabel = '7 Hari Terakhir';
        } else if (period === '30days') {
          periodLabel = '30 Hari Terakhir';
        } else if (period === 'this-month') {
          periodLabel = 'Bulan Ini';
        } else if (period === 'custom') {
          periodLabel = `${dFrom || 'Awal'} s/d ${dTo || 'Akhir'}`;
        }

        return { title, headers, rows, totalUnits, count: rows.length, periodLabel };
      }

                  const previewMenus = (r.isAdmin ? ALL_ROLE_MENU_IDS : (r.menus || [])).slice(0, 5).map(m => menuLabelMap[m] || m);

                  const previewActions = (r.isAdmin ? ALL_ROLE_ACTION_IDS : (r.actions || [])).slice(0, 4).map(a => actionLabelMap[a] || a);

                        }
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </article>`;
      }
