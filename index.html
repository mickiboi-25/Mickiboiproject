<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StokKita">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#176b57" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10261f" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Aplikasi inventori stok multi gudang untuk UMKM - Responsive & Mobile Ready">
  <title>StokKita — Inventori Multi Gudang</title>
  <style>
    :root {
      --brand-50: #eefaf6;
      --brand-100: #d8f3e9;
      --brand-200: #b3e6d4;
      --brand-500: #21876d;
      --brand-600: #176b57;
      --brand-700: #125646;
      --ink-950: #14201d;
      --ink-800: #293834;
      --ink-600: #61706c;
      --ink-500: #7b8985;
      --ink-300: #c9d1ce;
      --ink-200: #dde3e1;
      --ink-100: #eef1f0;
      --surface: #ffffff;
      --canvas: #f5f7f6;
      --danger: #c93c4a;
      --danger-soft: #fff0f1;
      --warning: #a9650a;
      --warning-soft: #fff7e7;
      --info: #2d68bb;
      --info-soft: #edf5ff;
      --shadow-sm: 0 1px 2px rgba(20, 32, 29, .06);
      --shadow-md: 0 10px 30px rgba(20, 32, 29, .09);
      --radius-sm: 8px;
      --radius: 14px;
      --radius-lg: 20px;
      --sidebar: 252px;
      --topbar: 76px;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    [data-theme="dark"],
    body.dark-mode {
      --brand-50: #10261f;
      --brand-100: #16382e;
      --brand-200: #1a4d3f;
      --brand-500: #26a283;
      --brand-600: #33b895;
      --brand-700: #4bd9b3;
      --ink-950: #edf3f0;
      --ink-800: #cfded8;
      --ink-600: #9cb1aa;
      --ink-500: #7b928a;
      --ink-300: #3b5049;
      --ink-200: #263832;
      --ink-100: #182823;
      --surface: #15221e;
      --canvas: #0c1613;
      --danger: #e25c6a;
      --danger-soft: #38191c;
      --warning: #e09838;
      --warning-soft: #382811;
      --info: #4c8fee;
      --info-soft: #122842;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, .4);
      --shadow-md: 0 10px 30px rgba(0, 0, 0, .5);
    }

    [data-theme="dark"] .icon-btn {
      background: var(--surface);
      border-color: var(--ink-200);
      color: var(--ink-800);
    }

    [data-theme="dark"] .btn-secondary {
      background: var(--surface);
      border-color: var(--ink-200);
      color: var(--ink-800);
    }

    [data-theme="dark"] .btn-secondary:hover {
      background: var(--ink-100);
      border-color: var(--ink-300);
    }

    [data-theme="dark"] .topbar {
      background: rgba(21, 34, 30, 0.94);
      border-color: var(--ink-200);
    }

    [data-theme="dark"] .card {
      background: var(--surface);
      border-color: var(--ink-200);
    }

    [data-theme="dark"] .control {
      background: var(--ink-100);
      color: var(--ink-950);
      border-color: var(--ink-200);
    }

    [data-theme="dark"] .control:focus {
      background: var(--surface);
      border-color: var(--brand-500);
    }

    [data-theme="dark"] .filters {
      background: var(--surface);
      border-color: var(--ink-200);
    }

    [data-theme="dark"] .table-wrap table thead th {
      background: var(--ink-100);
      color: var(--ink-600);
      border-color: var(--ink-200);
    }

    [data-theme="dark"] .table-wrap table tbody tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    [data-theme="dark"] .receipt {
      background: var(--ink-100);
      border-color: var(--ink-200);
    }

    [data-theme="dark"] .item-search,
    [data-theme="dark"] .line-item {
      background: var(--ink-100);
      border-color: var(--ink-200);
    }

    [data-theme="dark"] .product-suggestions-dropdown {
      background: var(--surface);
      border-color: var(--ink-200);
    }

    [data-theme="dark"] .product-suggestion-item:hover {
      background: var(--brand-100);
    }

    [data-theme="dark"] .modal {
      background: var(--surface);
      color: var(--ink-950);
      border-color: var(--ink-200);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink-950);
      background: var(--canvas);
      font: 14px/1.5 var(--font);
      -webkit-font-smoothing: antialiased;
      transition: background-color .2s ease, color .2s ease;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    svg {
      display: block;
    }

    .icon {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .hidden {
      display: none !important;
    }

    .app-shell {
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 50;
      width: var(--sidebar);
      padding: 24px 16px;
      color: #dceae5;
      background: #123e35;
      display: flex;
      flex-direction: column;
      transition: transform .25s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 10px 24px;
      color: #fff;
    }

    .brand-mark {
      width: 39px;
      height: 39px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #123e35;
      background: #baf0dc;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .45);
    }

    .brand-copy strong {
      display: block;
      font-size: 18px;
      line-height: 1.1;
      letter-spacing: -.4px;
    }

    .brand-copy span {
      display: block;
      margin-top: 4px;
      color: #a9c4bb;
      font-size: 11px;
    }

    .nav-scroll {
      overflow-y: auto;
      flex: 1;
      padding-right: 0;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    .sidebar,
    .nav-scroll {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    .sidebar::-webkit-scrollbar,
    .nav-scroll::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    .nav-label {
      margin: 16px 11px 7px;
      color: #83a69a;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .nav-item {
      width: 100%;
      min-height: 43px;
      border: 0;
      border-radius: 10px;
      padding: 10px 11px;
      display: flex;
      align-items: center;
      gap: 11px;
      color: #bfd2cc;
      background: transparent;
      text-align: left;
      transition: background .15s, color .15s;
    }

    .nav-item:hover {
      color: #fff;
      background: rgba(255, 255, 255, .07);
    }

    .nav-item.active {
      color: #fff;
      background: rgba(186, 240, 220, .14);
      box-shadow: inset 3px 0 #8ce0c1;
    }

    .nav-item .icon {
      width: 19px;
      height: 19px;
      flex: none;
    }

    .nav-item span {
      flex: 1;
      font-weight: 600;
    }

    .nav-badge {
      flex: none !important;
      padding: 1px 7px;
      border-radius: 99px;
      color: #173f36;
      background: #baf0dc;
      font-size: 10px;
    }

    .sidebar-footer {
      margin-top: 16px;
      padding: 13px;
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 12px;
      background: rgba(0, 0, 0, .08);
    }

    .sidebar-footer .sync {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: #70dbb4;
      box-shadow: 0 0 0 4px rgba(112, 219, 180, .1);
    }

    .sidebar-footer small {
      display: block;
      margin-top: 5px;
      color: #88a99e;
    }

    .main {
      min-height: 100vh;
      margin-left: var(--sidebar);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 35;
      height: var(--topbar);
      padding: 0 30px;
      display: flex;
      align-items: center;
      gap: 18px;
      border-bottom: 1px solid var(--ink-200);
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(14px);
    }

    .mobile-menu {
      display: none;
    }

    .page-heading {
      min-width: 0;
      flex: 1;
    }

    .page-heading h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
      letter-spacing: -.35px;
    }

    .page-heading p {
      margin: 3px 0 0;
      color: var(--ink-600);
      font-size: 12px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--ink-200);
      border-radius: 11px;
      display: grid;
      place-items: center;
      color: var(--ink-600);
      background: #fff;
      transition: all .15s ease;
    }

    .icon-btn:hover {
      border-color: var(--ink-300);
      color: var(--brand-600);
      background: var(--brand-50);
    }

    .icon-btn .icon {
      width: 19px;
      height: 19px;
    }

    .notification {
      position: relative;
    }

    .notification-badge {
      position: absolute;
      right: -3px;
      top: -4px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      display: grid;
      place-items: center;
      border: 2px solid #fff;
      border-radius: 99px;
      color: #fff;
      background: var(--danger);
      font-size: 9px;
      font-weight: 800;
    }

    .profile-button {
      border: 0;
      padding: 5px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: background .15s;
    }

    .profile-button:hover {
      background: var(--ink-100);
    }

    .avatar {
      width: 37px;
      height: 37px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(145deg, var(--brand-500), var(--brand-700));
      font-weight: 800;
    }

    .profile-copy strong,
    .profile-copy span {
      display: block;
    }

    .profile-copy strong {
      font-size: 12px;
    }

    .profile-copy span {
      color: var(--ink-500);
      font-size: 11px;
    }

    .profile-button .chevron {
      width: 14px;
      height: 14px;
      color: var(--ink-500);
    }

    .content {
      max-width: 1560px;
      margin: 0 auto;
      padding: 26px 30px 70px;
    }

    .page-toolbar {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .toolbar-copy h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      letter-spacing: -.45px;
    }

    .toolbar-copy p {
      margin: 5px 0 0;
      color: var(--ink-600);
    }

    .toolbar-actions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 40px;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 9px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 700;
      font-size: 13px;
      transition: transform .1s, box-shadow .15s, background .15s;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: .55;
      box-shadow: none;
    }

    .btn .icon {
      width: 17px;
      height: 17px;
    }

    .btn-primary {
      color: #fff;
      background: var(--brand-600);
      box-shadow: 0 4px 12px rgba(23, 107, 87, .18);
    }

    .btn-primary:hover {
      background: var(--brand-700);
    }

    .btn-secondary {
      color: var(--ink-800);
      border-color: var(--ink-200);
      background: #fff;
    }

    .btn-secondary:hover {
      border-color: var(--ink-300);
      background: #fafbfb;
    }

    .btn-danger {
      color: var(--danger);
      border-color: #f1c9ce;
      background: #fff;
    }

    .btn-danger:hover {
      background: var(--danger-soft);
    }

    .btn-ghost {
      color: var(--brand-600);
      background: transparent;
    }

    .btn-ghost:hover {
      background: var(--brand-50);
    }

    .btn-sm {
      min-height: 34px;
      padding: 7px 11px;
      font-size: 12px;
    }

    .btn-block {
      width: 100%;
    }

    .card {
      border: 1px solid var(--ink-200);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .card-header {
      min-height: 59px;
      padding: 16px 19px;
      border-bottom: 1px solid var(--ink-100);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-title {
      min-width: 0;
    }

    .card-title h3 {
      margin: 0;
      font-size: 15px;
      letter-spacing: -.15px;
    }

    .card-title p {
      margin: 3px 0 0;
      color: var(--ink-500);
      font-size: 11px;
    }

    .card-body {
      padding: 19px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat-card {
      position: relative;
      overflow: hidden;
      padding: 18px;
    }

    .stat-card::after {
      content: "";
      position: absolute;
      right: -22px;
      bottom: -27px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--accent-soft, var(--brand-50));
    }

    .stat-top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .stat-label {
      color: var(--ink-600);
      font-size: 12px;
      font-weight: 600;
    }

    .stat-icon {
      width: 39px;
      height: 39px;
      flex: none;
      border-radius: 11px;
      display: grid;
      place-items: center;
      color: var(--accent, var(--brand-600));
      background: var(--accent-soft, var(--brand-50));
    }

    .stat-icon .icon {
      width: 19px;
      height: 19px;
    }

    .stat-value {
      position: relative;
      z-index: 1;
      margin-top: 11px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -.8px;
    }

    .stat-meta {
      position: relative;
      z-index: 1;
      margin-top: 3px;
      color: var(--ink-500);
      font-size: 11px;
    }

    .trend {
      font-weight: 700;
    }

    .trend.up {
      color: var(--brand-600);
    }

    .trend.down {
      color: var(--danger);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.65fr) minmax(310px, .85fr);
      gap: 18px;
    }

    .stack {
      display: grid;
      gap: 18px;
    }

    .chart-wrap {
      height: 260px;
      position: relative;
    }

    .chart-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .chart-grid {
      stroke: #edf0ef;
      stroke-width: 1;
    }

    .chart-label {
      fill: #82908c;
      font-size: 10px;
    }

    .chart-line-in {
      fill: none;
      stroke: #299979;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .chart-line-out {
      fill: none;
      stroke: #e0a33d;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .chart-area {
      fill: url(#areaGradient);
      opacity: .6;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--ink-600);
      font-size: 11px;
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend i {
      width: 8px;
      height: 8px;
      border-radius: 99px;
    }

    .alert-list,
    .activity-list {
      display: grid;
    }

    .alert-row,
    .activity-row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px 0;
      border-bottom: 1px solid var(--ink-100);
    }

    .alert-row:first-child,
    .activity-row:first-child {
      padding-top: 0;
    }

    .alert-row:last-child,
    .activity-row:last-child {
      padding-bottom: 0;
      border: 0;
    }

    .product-thumb {
      width: 39px;
      height: 39px;
      flex: none;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: var(--brand-700);
      background: var(--brand-50);
      font-size: 11px;
      font-weight: 800;
    }

    .row-main {
      min-width: 0;
      flex: 1;
    }

    .row-main strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }

    .row-main small {
      display: block;
      margin-top: 2px;
      color: var(--ink-500);
      font-size: 10px;
    }

    .row-value {
      flex: none;
      text-align: right;
    }

    .row-value strong {
      display: block;
      font-size: 12px;
    }

    .row-value small {
      display: block;
      color: var(--ink-500);
      font-size: 10px;
    }

    .activity-icon {
      width: 35px;
      height: 35px;
      flex: none;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--brand-600);
      background: var(--brand-50);
    }

    .activity-icon .icon {
      width: 16px;
      height: 16px;
    }

    .bars {
      display: grid;
      gap: 15px;
    }

    .bar-item {
      display: grid;
      grid-template-columns: minmax(90px, 1fr) 2fr 44px;
      align-items: center;
      gap: 10px;
    }

    .bar-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      font-weight: 600;
    }

    .bar-track {
      height: 8px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--ink-100);
    }

    .bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--brand-500), #73ccb0);
    }

    .bar-value {
      color: var(--ink-600);
      text-align: right;
      font-size: 11px;
      font-weight: 700;
    }

    .filters {
      padding: 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .field {
      min-width: 0;
    }

    .field.grow {
      flex: 1;
      min-width: 220px;
    }

    .field label {
      display: block;
      margin: 0 0 6px;
      color: var(--ink-600);
      font-size: 11px;
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      width: 17px;
      height: 17px;
      color: var(--ink-500);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .control {
      width: 100%;
      height: 40px;
      padding: 8px 11px;
      border: 1px solid var(--ink-200);
      border-radius: 9px;
      color: var(--ink-950);
      background: #fff;
      outline: none;
      transition: border .15s, box-shadow .15s;
    }

    .control.with-icon {
      padding-left: 36px;
    }

    .control:focus {
      border-color: var(--brand-500);
      box-shadow: 0 0 0 3px rgba(33, 135, 109, .11);
    }

    .control::placeholder {
      color: #9ca8a4;
    }

    textarea.control {
      height: auto;
      min-height: 86px;
      resize: vertical;
    }

    select.control {
      padding-right: 32px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 13px 15px;
      border-bottom: 1px solid var(--ink-100);
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: var(--ink-500);
      background: #fafbfb;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    td {
      font-size: 12px;
    }

    tbody tr:hover {
      background: #fcfdfd;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .cell-product {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 180px;
    }

    .cell-product strong,
    .cell-product span {
      display: block;
    }

    .cell-product strong {
      font-size: 12px;
    }

    .cell-product span {
      color: var(--ink-500);
      font-size: 10px;
    }

    .qty {
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .muted {
      color: var(--ink-500);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .badge.success {
      color: #176b57;
      background: #e8f7f1;
    }

    .badge.warning {
      color: #99600e;
      background: #fff4dd;
    }

    .badge.danger {
      color: #b32f3d;
      background: #ffeaec;
    }

    .badge.info {
      color: #2b64ae;
      background: #eaf3ff;
    }

    .badge.neutral {
      color: #67736f;
      background: #edf0ef;
    }

    .table-footer {
      padding: 12px 15px;
      border-top: 1px solid var(--ink-100);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--ink-500);
      font-size: 11px;
    }

    .pagination {
      display: flex;
      gap: 5px;
    }

    .page-btn {
      width: 30px;
      height: 30px;
      border: 1px solid var(--ink-200);
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--ink-600);
      background: #fff;
    }

    .page-btn.active {
      color: #fff;
      border-color: var(--brand-600);
      background: var(--brand-600);
    }

    .form-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 18px;
      align-items: start;
    }

    .form-section {
      padding: 19px;
    }

    .form-section+.form-section {
      border-top: 1px solid var(--ink-100);
    }

    .section-heading {
      margin-bottom: 15px;
    }

    .section-heading h3 {
      margin: 0;
      font-size: 14px;
    }

    .section-heading p {
      margin: 3px 0 0;
      color: var(--ink-500);
      font-size: 11px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .span-2 {
      grid-column: span 2;
    }

    .item-editor {
      border: 1px solid var(--ink-200);
      border-radius: 11px;
      overflow: hidden;
    }

    .item-search {
      padding: 12px;
      background: #fafbfb;
      border-bottom: 1px solid var(--ink-200);
      position: relative;
    }

    .product-search-box {
      position: relative;
      width: 100%;
    }

    .product-suggestions-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      z-index: 99;
      max-height: 250px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid var(--ink-200);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(11, 24, 20, 0.12);
    }

    .product-suggestion-item {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--ink-100);
      transition: background .12s;
    }

    .product-suggestion-item:last-child {
      border-bottom: 0;
    }

    .product-suggestion-item:hover,
    .product-suggestion-item.active {
      background: #e8f7f1;
    }

    .product-suggestion-info {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .product-suggestion-info strong {
      font-size: 12px;
      color: var(--ink-900);
    }

    .product-suggestion-info small {
      font-size: 10px;
      color: var(--ink-500);
      margin-top: 1px;
    }

    .product-suggestion-stock {
      text-align: right;
      font-size: 11px;
      color: var(--ink-600);
      white-space: nowrap;
    }

    .product-suggestion-stock strong {
      font-size: 12px;
      color: var(--brand-700);
    }

    .line-item {
      padding: 12px;
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 100px 110px 36px;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--ink-100);
    }

    .line-item:last-child {
      border-bottom: 0;
    }

    .line-product strong,
    .line-product small {
      display: block;
    }

    .line-product strong {
      font-size: 12px;
    }

    .line-product small {
      margin-top: 2px;
      color: var(--ink-500);
      font-size: 10px;
    }

    .mini-label {
      display: none;
      color: var(--ink-500);
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .remove-line {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--danger);
      background: var(--danger-soft);
      transition: background .15s;
    }

    .remove-line:hover {
      background: #ffd6da;
    }

    .summary-card {
      position: sticky;
      top: calc(var(--topbar) + 18px);
      overflow: hidden;
    }

    .summary-hero {
      padding: 20px;
      color: #fff;
      background: linear-gradient(135deg, #176b57, #0f4a3d);
    }

    .summary-hero small {
      color: #b9ddd1;
    }

    .summary-hero strong {
      display: block;
      margin-top: 4px;
      font-size: 21px;
    }

    .summary-list {
      padding: 8px 18px;
    }

    .summary-row {
      padding: 11px 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--ink-100);
      font-size: 12px;
    }

    .summary-row:last-child {
      border: 0;
    }

    .summary-row span {
      color: var(--ink-500);
    }

    .summary-actions {
      padding: 14px 18px 18px;
      display: grid;
      gap: 8px;
    }

    .notice {
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 11px;
    }

    .notice.info {
      color: #285b9b;
      background: var(--info-soft);
    }

    .notice.warning {
      color: #8a570d;
      background: var(--warning-soft);
    }

    .notice.danger {
      color: #a82e3b;
      background: var(--danger-soft);
    }

    .notice .icon {
      width: 17px;
      height: 17px;
      flex: none;
      margin-top: 1px;
    }

    .report-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .report-card {
      padding: 18px;
      transition: border .15s, transform .15s, box-shadow .15s;
      cursor: pointer;
    }

    .report-card:hover {
      transform: translateY(-2px);
      border-color: var(--brand-200);
      box-shadow: var(--shadow-md);
    }

    .report-icon {
      width: 42px;
      height: 42px;
      margin-bottom: 14px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--brand-600);
      background: var(--brand-50);
    }

    .report-icon .icon {
      width: 20px;
      height: 20px;
    }

    .report-card h3 {
      margin: 0;
      font-size: 14px;
    }

    .report-card p {
      min-height: 36px;
      margin: 6px 0 14px;
      color: var(--ink-600);
      font-size: 11px;
    }

    .report-link {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--brand-600);
      font-size: 11px;
      font-weight: 800;
    }

    .warehouse-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .warehouse-card {
      padding: 18px;
    }

    .warehouse-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .warehouse-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--brand-600);
      background: var(--brand-50);
    }

    .warehouse-icon .icon {
      width: 21px;
      height: 21px;
    }

    .warehouse-card h3 {
      margin: 14px 0 3px;
      font-size: 14px;
    }

    .warehouse-card>p {
      min-height: 35px;
      margin: 0;
      color: var(--ink-500);
      font-size: 11px;
    }

    .warehouse-stats {
      margin-top: 15px;
      padding-top: 14px;
      border-top: 1px solid var(--ink-100);
      display: flex;
      gap: 24px;
    }

    .warehouse-stats strong,
    .warehouse-stats span {
      display: block;
    }

    .warehouse-stats strong {
      font-size: 16px;
    }

    .warehouse-stats span {
      color: var(--ink-500);
      font-size: 10px;
    }

    .empty-state {
      padding: 45px 20px;
      text-align: center;
    }

    .empty-icon {
      width: 54px;
      height: 54px;
      margin: 0 auto 12px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: var(--brand-600);
      background: var(--brand-50);
    }

    .empty-icon .icon {
      width: 26px;
      height: 26px;
    }

    .empty-state h3 {
      margin: 0;
      font-size: 14px;
    }

    .empty-state p {
      max-width: 380px;
      margin: 6px auto 0;
      color: var(--ink-500);
      font-size: 11px;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(11, 24, 20, .52);
      opacity: 0;
      visibility: hidden;
      transition: .2s;
    }

    .overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      position: fixed;
      z-index: 90;
      left: 50%;
      top: 50%;
      width: min(600px, calc(100% - 28px));
      max-height: calc(100vh - 28px);
      overflow: auto;
      border-radius: 17px;
      background: #fff;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .2);
      transform: translate(-50%, -46%) scale(.98);
      opacity: 0;
      visibility: hidden;
      transition: .2s;
    }

    .modal.modal-lg {
      width: min(840px, calc(100% - 28px));
    }

    .modal.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      visibility: visible;
    }

    .modal-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--ink-100);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 17px;
    }

    .modal-header p {
      margin: 3px 0 0;
      color: var(--ink-500);
      font-size: 11px;
    }

    .modal-body {
      padding: 20px;
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--ink-100);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      background: #fafbfb;
      position: sticky;
      bottom: 0;
      z-index: 2;
    }

    .success-visual {
      width: 70px;
      height: 70px;
      margin: 5px auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--brand-500);
      box-shadow: 0 0 0 10px var(--brand-50);
    }

    .success-visual .icon {
      width: 34px;
      height: 34px;
    }

    .success-copy {
      text-align: center;
    }

    .success-copy h2 {
      margin: 0;
      font-size: 20px;
    }

    .success-copy p {
      margin: 6px 0 18px;
      color: var(--ink-500);
    }

    .receipt {
      padding: 14px;
      border: 1px dashed var(--ink-300);
      border-radius: 10px;
      background: #fafbfb;
    }

    .receipt-row {
      padding: 6px 0;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      font-size: 11px;
    }

    .receipt-row span {
      color: var(--ink-500);
    }

    .toast-stack {
      position: fixed;
      z-index: 110;
      right: 20px;
      bottom: 20px;
      display: grid;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      width: min(360px, calc(100vw - 28px));
      padding: 12px 14px;
      border: 1px solid var(--ink-200);
      border-radius: 11px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #fff;
      box-shadow: var(--shadow-md);
      animation: toast-in .25s ease;
      pointer-events: auto;
    }

    .toast.toast-error {
      border-color: #fbd0d5;
      background: #fffbfb;
    }

    .toast.toast-error .icon {
      color: var(--danger);
    }

    .toast .icon {
      width: 18px;
      height: 18px;
      flex: none;
      color: var(--brand-600);
      margin-top: 1px;
    }

    .toast strong {
      display: block;
      font-size: 12px;
    }

    .toast p {
      margin: 2px 0 0;
      color: var(--ink-500);
      font-size: 10px;
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
    }

    /* Login Screen & Auth UI */
    .login-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at top right, #1d6d59 0%, #104337 45%, #08241e 100%);
      color: #fff;
      overflow-y: auto;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      padding: 36px 30px 28px;
      background: #ffffff;
      color: var(--ink-950);
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
      animation: modal-in 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
    }

    .login-brand .brand-mark {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: var(--brand-500);
      color: #fff;
      margin-bottom: 12px;
      box-shadow: 0 8px 20px rgba(33, 135, 109, 0.3);
      display: grid;
      place-items: center;
    }

    .login-brand h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--brand-700);
    }

    .login-brand p {
      margin: 4px 0 0;
      color: var(--ink-500);
      font-size: 12px;
    }

    .login-form {
      display: grid;
      gap: 16px;
    }

    .login-form .field label {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
      display: block;
    }

    .login-form .control {
      height: 44px;
      font-size: 13px;
    }

    .pw-input-wrap {
      position: relative;
    }

    .pw-toggle-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 0;
      padding: 6px;
      color: var(--ink-500);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }

    .pw-toggle-btn:hover {
      color: var(--ink-800);
      background: var(--ink-100);
    }

    .btn-login {
      height: 46px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
      width: 100%;
    }

    .login-footer-security {
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      color: var(--ink-500);
    }

    @keyframes loginShake {

      0%,
      100% {
        transform: translateX(0);
      }

      20%,
      60% {
        transform: translateX(-6px);
      }

      40%,
      80% {
        transform: translateX(6px);
      }
    }

    .input-error {
      border-color: var(--danger) !important;
      box-shadow: 0 0 0 3px rgba(201, 60, 74, 0.2) !important;
    }

    /* Topbar Logout Button & Sidebar User Chip */
    .logout-btn-top {
      border-color: #fee2e2;
      color: var(--danger);
      background: #fff5f5;
    }

    .logout-btn-top:hover {
      background: #fee2e2;
      border-color: #fca5a5;
    }

    .sidebar-user-card {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sidebar-user-info {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .sidebar-user-info .avatar {
      width: 32px;
      height: 32px;
      font-size: 12px;
      flex: none;
    }

    .sidebar-user-text {
      min-width: 0;
    }

    .sidebar-user-text strong {
      display: block;
      font-size: 12px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-user-text span {
      display: block;
      font-size: 10px;
      color: #a0bfb5;
    }

    .sidebar-logout-icon-btn {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 8px;
      background: rgba(201, 60, 74, 0.2);
      color: #ff9da6;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      flex: none;
    }

    .sidebar-logout-icon-btn:hover {
      background: var(--danger);
      color: #fff;
    }

    .cat-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--brand-50);
      color: var(--brand-700);
      font-weight: 600;
      font-size: 11px;
    }

    .mobile-bottom-nav {
      display: none;
    }

    .sidebar-backdrop {
      display: none;
    }

    /* Google Sheets Status Pill */
    .sheets-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      background: var(--surface);
      border: 1px solid var(--ink-200);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-800);
      cursor: pointer;
      transition: all .2s ease;
    }

    .sheets-status-pill:hover {
      border-color: var(--brand-500);
      background: var(--brand-50);
    }

    .sheets-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      flex-shrink: 0;
    }

    .sheets-status-dot.connected {
      background: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, .5);
    }

    .sheets-status-dot.syncing {
      background: #3b82f6;
      box-shadow: 0 0 8px rgba(59, 130, 246, .5);
      animation: pulseSync 1s infinite alternate;
    }

    .sheets-status-dot.error {
      background: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, .5);
    }

    @keyframes pulseSync {
      0% {
        opacity: 0.4;
        transform: scale(0.85);
      }

      100% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .spinning svg,
    svg.spinning,
    .icon-btn.spinning svg,
    .icon-btn.spinning .icon {
      animation: spin 0.75s linear infinite;
    }

    .icon-btn.refresh-cloud-btn {
      color: var(--brand-600);
      position: relative;
    }

    .icon-btn.refresh-cloud-btn:hover {
      background: var(--brand-50);
      color: var(--brand-700);
    }

    /* Responsive Application Layout (Unified & Pure Responsive) */
    .app-shell {
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      max-width: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--canvas);
      overflow-x: hidden;
    }

    .sidebar-close-btn {
      display: none;
    }

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'stokkita_inventory_app_v2';
      const rupiah = new Intl.NumberFormat('id-ID');
      const icon = (name, className = 'icon') => `<svg class="${className}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

      // Data Awal Bersih (Bebas dari Data Demo)
      const defaultData = {
        categories: [],
        products: [],
        warehouses: [
          { id: 'W01', code: 'GDG-01', name: 'Gudang Utama', address: '', active: true }
        ],
        users: [
          { id: 'U01', username: 'admin', code: 'ADM', name: 'Administrator', role: 'ADMIN', warehouse: 'Semua Gudang', password: 'admin', active: true, lastLogin: '' }
        ],
        transactions: [],
        damagedItems: [],
        transfers: [],
        opnames: [],
        stockLedger: [],
        auditLogs: [],
        settings: {
          businessName: 'StokKita Inventori',
          phone: '',
          address: '',
          timezone: 'Asia/Jakarta (WIB)',
          rejectNegativeStock: true,
          autoLogoutEnabled: true,
          autoLogoutMinutes: 15
        }
      };

      // Inisialisasi Data Store Langsung dari Database Cloud (Tanpa Menyimpan Database di LocalStorage)
      function loadStore() {
        try {
          // Bersihkan cache data demo lama dari localStorage jika ada
          localStorage.removeItem(STORAGE_KEY);
        } catch (e) { }

        return JSON.parse(JSON.stringify(defaultData));
      }

      const store = loadStore();

      const SHEETS_URL_KEY = 'stokkita_sheets_url_v2';

      // Google Sheets Realtime State & Environment Detection
      const isAppsScriptEnv = (typeof google !== 'undefined' && google && google.script && typeof google.script.run !== 'undefined');
      const defaultSheetsUrl = 'https://script.google.com/macros/s/AKfycbz_SAMPLE_DEPLOYMENT_ID/exec';
      let storedSheetsUrl = '';
      try {
        storedSheetsUrl = (localStorage.getItem(SHEETS_URL_KEY) || (store.settings && store.settings.googleSheetsUrl) || '').trim();
      } catch (e) { }

      let currentSheetsStatus = (isAppsScriptEnv || storedSheetsUrl) ? 'idle' : 'unconfigured';
      let lastSheetsSyncTime = null;
      let sheetsSyncTimer = null;

      function parseDateTimeToSort(str) {
        if (!str) return 0;
        if (typeof str === 'number') return str;
        const s = String(str).trim();
        const dmyMatch = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})(?:\s+(\d{1,2})[:\.](\d{1,2})(?:[:\.](\d{1,2}))?)?/);
        if (dmyMatch) {
          const day = parseInt(dmyMatch[1], 10);
          const month = parseInt(dmyMatch[2], 10) - 1;
          const year = parseInt(dmyMatch[3], 10);
          const hour = dmyMatch[4] ? parseInt(dmyMatch[4], 10) : 0;
          const min = dmyMatch[5] ? parseInt(dmyMatch[5], 10) : 0;
          const sec = dmyMatch[6] ? parseInt(dmyMatch[6], 10) : 0;
          return new Date(year, month, day, hour, min, sec).getTime();
        }
        const ymdMatch = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})(?:\s+(\d{1,2})[:\.](\d{1,2})(?:[:\.](\d{1,2}))?)?/);
        if (ymdMatch) {
          const year = parseInt(ymdMatch[1], 10);
          const month = parseInt(ymdMatch[2], 10) - 1;
          const day = parseInt(ymdMatch[3], 10);
          const hour = ymdMatch[4] ? parseInt(ymdMatch[4], 10) : 0;
          const min = ymdMatch[5] ? parseInt(ymdMatch[5], 10) : 0;
          const sec = ymdMatch[6] ? parseInt(ymdMatch[6], 10) : 0;
          return new Date(year, month, day, hour, min, sec).getTime();
        }
        const fallback = new Date(s).getTime();
        return isNaN(fallback) ? 0 : fallback;
      }

      function sortLatestFirst(list) {
        if (!Array.isArray(list)) return [];
        return [...list].sort((a, b) => {
          const timeA = parseDateTimeToSort(a.date || a.time || a.createdAt || a.approvalDate || '');
          const timeB = parseDateTimeToSort(b.date || b.time || b.createdAt || b.approvalDate || '');
          if (timeA !== timeB) return timeB - timeA;
          return String(b.transaction_no || b.no || b.id || '').localeCompare(String(a.transaction_no || a.no || a.id || ''), undefined, { numeric: true });
        });
      }

      function updateSheetsStatusUI() {
        const dot = document.getElementById('sheetsStatusDot');
        const text = document.getElementById('sheetsStatusText');
        const syncEl = document.getElementById('syncTime');
        const refreshBtn = document.getElementById('topRefreshBtn');
        if (refreshBtn) {
          if (currentSheetsStatus === 'syncing') {
            refreshBtn.classList.add('spinning');
          } else {
            refreshBtn.classList.remove('spinning');
          }
        }
        if (!dot || !text) return;

        dot.className = 'sheets-status-dot';
        if (!isAppsScriptEnv && !storedSheetsUrl) {
          dot.classList.add('error');
          text.textContent = 'Hubungkan Sheets';
          if (syncEl) syncEl.textContent = 'Mode Lokal (Google Sheets Belum Terhubung)';
        } else if (currentSheetsStatus === 'syncing') {
          dot.classList.add('syncing');
          text.textContent = 'Menyinkronkan…';
          if (syncEl) syncEl.textContent = 'Menyinkronkan ke Google Spreadsheet…';
        } else if (currentSheetsStatus === 'connected' || currentSheetsStatus === 'idle') {
          dot.classList.add('connected');
          if (isAppsScriptEnv) {
            text.textContent = lastSheetsSyncTime ? `Cloud (${lastSheetsSyncTime})` : 'Cloud Aktif';
            if (syncEl) syncEl.textContent = `Tersinkron Langsung Google Apps Script ${lastSheetsSyncTime || ''}`;
          } else {
            text.textContent = lastSheetsSyncTime ? `Sheets (${lastSheetsSyncTime})` : 'Sheets Aktif';
            if (syncEl) syncEl.textContent = `Tersinkron Google Sheets ${lastSheetsSyncTime || ''}`;
          }
        } else if (currentSheetsStatus === 'error') {
          dot.classList.add('error');
          text.textContent = 'Gagal Sinkron';
          if (syncEl) syncEl.textContent = 'Gagal terhubung ke Google Sheets. Periksa kembali URL database Anda.';
        }
      }

      function applyFetchedSpreadsheetData(d, isManual) {
        if (!d) return;
        if (Array.isArray(d.categories)) {
          store.categories = d.categories.map(c => ({
            ...c,
            description: c.description || c.desc || ''
          }));
        }
        if (Array.isArray(d.warehouses) && d.warehouses.length > 0) {
          store.warehouses = d.warehouses;
        }
        if (Array.isArray(d.products)) {
          store.products = d.products.map(p => {
            const min = p.min !== undefined ? Number(p.min) : (p.minStock !== undefined ? Number(p.minStock) : 0);
            const active = p.active !== undefined ? (p.active === true || p.active === 'true' || p.active === 1 || p.active === '1') : true;
            return {
              ...p,
              min,
              minStock: min,
              active,
              stocks: (p.stocks && typeof p.stocks === 'object') ? p.stocks : {}
            };
          });
        }
        if (Array.isArray(d.users) && d.users.length > 0) {
          store.users = d.users.map(u => ({
            ...u,
            role: String(u.role || 'STAFF').trim().toUpperCase(),
            username: String(u.username || '').trim().toLowerCase(),
            active: u.active !== undefined ? (u.active === true || u.active === 'true' || u.active === 1 || u.active === '1') : true
          }));
        }
        if (Array.isArray(d.transactions)) {
          store.transactions = sortLatestFirst(d.transactions.map(t => {
            const no = t.transaction_no || t.no || '';
            return { ...t, transaction_no: no, no };
          }));
        }
        if (Array.isArray(d.transfers)) {
          store.transfers = sortLatestFirst(d.transfers.map(tr => {
            const no = tr.transaction_no || tr.no || '';
            return { ...tr, transaction_no: no, no };
          }));
        }
        if (Array.isArray(d.opnames)) {
          store.opnames = sortLatestFirst(d.opnames.map(op => {
            const no = op.transaction_no || op.no || '';
            return {
              ...op,
              transaction_no: no,
              no,
              itemsCount: op.itemsCount !== undefined ? op.itemsCount : (op.itemsChecked || (op.items ? op.items.length : 0)),
              totalDiff: op.totalDiff !== undefined ? op.totalDiff : (op.differenceTotal || 0),
              items: op.items || op.lines || []
            };
          }));
        }
        if (Array.isArray(d.damagedItems)) {
          store.damagedItems = sortLatestFirst(d.damagedItems.map(dmg => {
            const no = dmg.transaction_no || dmg.no || '';
            return { ...dmg, transaction_no: no, no };
          }));
        }
        if (Array.isArray(d.stockLedger)) store.stockLedger = sortLatestFirst(d.stockLedger);
        if (Array.isArray(d.auditLogs)) store.auditLogs = sortLatestFirst(d.auditLogs);
        if (d.settings && typeof d.settings === 'object' && Object.keys(d.settings).length) {
          store.settings = { ...store.settings, ...d.settings };
        }

        currentSheetsStatus = 'connected';
        const now = new Date();
        lastSheetsSyncTime = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        updateSheetsStatusUI();

        // Seluruh data kini disimpan di Google Sheets, tidak lagi disimpan ke localStorage
        if (isManual) showToast('Sinkronisasi Sukses', 'Seluruh data berhasil diambil langsung dari database Google Spreadsheet.');
        render();
      }

      async function syncFromGoogleSheets(isManual = false) {
        if (!isAppsScriptEnv && !storedSheetsUrl) {
          if (isManual) openSheetsConfigModal();
          return;
        }

        currentSheetsStatus = 'syncing';
        updateSheetsStatusUI();

        // Jika berjalan langsung di dalam Web App Google Apps Script
        if (isAppsScriptEnv) {
          google.script.run
            .withSuccessHandler(function (result) {
              if (typeof result === 'string') {
                try { result = JSON.parse(result); } catch (e) { }
              }
              if (result && result.status === 'success' && result.data) {
                applyFetchedSpreadsheetData(result.data, isManual);
              } else {
                currentSheetsStatus = 'error';
                updateSheetsStatusUI();
                if (isManual) showToast('Koneksi Gagal', result?.message || 'Gagal memuat data dari Spreadsheet.', true);
              }
            })
            .withFailureHandler(function (err) {
              console.warn('Gagal memuat dari Google Apps Script:', err);
              currentSheetsStatus = 'error';
              updateSheetsStatusUI();
              if (isManual) showToast('Koneksi Gagal', 'Gagal memuat: ' + (err?.message || err), true);
            })
            .apiReadAll();
          return;
        }

        // Jika berjalan di browser lokal/eksternal via HTTP Fetch
        try {
          const fetchUrl = storedSheetsUrl + (storedSheetsUrl.includes('?') ? '&' : '?') + 'action=readAll&t=' + Date.now();
          const response = await fetch(fetchUrl);
          const result = await response.json();

          if (result && result.status === 'success' && result.data) {
            applyFetchedSpreadsheetData(result.data, isManual);
          } else {
            throw new Error(result?.message || 'Data tidak valid');
          }
        } catch (err) {
          console.warn('Gagal memuat dari Google Sheets:', err);
          currentSheetsStatus = 'error';
          updateSheetsStatusUI();
          if (isManual) {
            const errStr = err.toString();
            const isCorsOrAuth = errStr.includes('Unexpected token') || errStr.includes('Failed to fetch') || errStr.includes('NetworkError');
            const msg = isCorsOrAuth
              ? 'Tidak dapat mengakses Google Sheets. Pastikan deployment Web App diatur ke "Who has access: Anyone (Siapa saja)".'
              : 'Tidak dapat menghubungi Google Sheets. Periksa URL Web App Anda.';
            showToast('Koneksi Gagal', msg, true);
          }
        }
      }

      function triggerGoogleSheetsSync() {
        if (!isAppsScriptEnv && !storedSheetsUrl) return;
        currentSheetsStatus = 'syncing';
        updateSheetsStatusUI();

        clearTimeout(sheetsSyncTimer);
        sheetsSyncTimer = setTimeout(async () => {
          // Jika berjalan di dalam Google Apps Script langsung
          if (isAppsScriptEnv) {
            google.script.run
              .withSuccessHandler(function (res) {
                currentSheetsStatus = 'connected';
                const now = new Date();
                lastSheetsSyncTime = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                updateSheetsStatusUI();
              })
              .withFailureHandler(function (err) {
                console.error('Gagal menyimpan via google.script.run:', err);
                currentSheetsStatus = 'error';
                updateSheetsStatusUI();
              })
              .apiSaveAll(JSON.stringify(store));
            return;
          }

          // Jika via HTTP fetch (eksternal)
          try {
            await fetch(storedSheetsUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'saveAll', data: store })
            });

            currentSheetsStatus = 'connected';
            const now = new Date();
            lastSheetsSyncTime = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            updateSheetsStatusUI();
          } catch (err) {
            console.error('Gagal menyimpan ke Google Sheets:', err);
            currentSheetsStatus = 'error';
            updateSheetsStatusUI();
          }
        }, 600);
      }

      function syncGranularTransaction(transaction, ledgerEntries) {
        if (!isAppsScriptEnv && !storedSheetsUrl) return;

        const payload = {
          action: 'appendTransaction',
          data: {
            transaction,
            ledgerEntries: ledgerEntries || []
          }
        };

        if (isAppsScriptEnv) {
          google.script.run
            .withSuccessHandler(function(res) {
              if (res && res.status === 'success') {
                currentSheetsStatus = 'connected';
                const now = new Date();
                lastSheetsSyncTime = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                updateSheetsStatusUI();
              }
            })
            .withFailureHandler(function(err) {
              console.warn('Granular sync gagal, fallback ke queue saveAll:', err);
              triggerGoogleSheetsSync();
            })
            .apiAppendTransaction(payload.data);
          return;
        }

        if (storedSheetsUrl) {
          fetch(storedSheetsUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          })
          .then(r => r.json())
          .then(res => {
            if (res && res.status === 'success') {
              currentSheetsStatus = 'connected';
              const now = new Date();
              lastSheetsSyncTime = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
              updateSheetsStatusUI();
            }
          })
          .catch(err => {
            console.warn('Granular fetch gagal, fallback ke saveAll:', err);
            triggerGoogleSheetsSync();
          });
        }
      }

      // Generator Nomor Transaksi Kustom
      function generateCustomTransactionNo(type, dateInput = null) {
        const settings = store.settings || {};
        let prefix = 'TRX';
        let counter = 1;

        if (type === 'in' || type === 'incoming') {
          prefix = settings.txPrefixIn || 'IN';
          counter = (store.transactions || []).filter(t => (t.type || '').toLowerCase().includes('masuk')).length + 1;
        } else if (type === 'out' || type === 'outgoing') {
          prefix = settings.txPrefixOut || 'OUT';
          counter = (store.transactions || []).filter(t => (t.type || '').toLowerCase().includes('keluar')).length + 1;
        } else if (type === 'transfer') {
          prefix = settings.txPrefixTransfer || 'TRF';
          counter = (store.transfers || []).length + 1;
        } else if (type === 'opname') {
          prefix = settings.txPrefixOpname || 'SO';
          counter = (store.opnames || []).length + 1;
        } else if (type === 'damaged') {
          prefix = settings.txPrefixDamaged || 'DMG';
          counter = (store.damagedItems || []).length + 1;
        }

        const d = dateInput ? new Date(dateInput) : new Date();
        const validD = isNaN(d.getTime()) ? new Date() : d;
        const YYYY = String(validD.getFullYear());
        const MM = String(validD.getMonth() + 1).padStart(2, '0');
        const DD = String(validD.getDate()).padStart(2, '0');
        const YYYYMMDD = `${YYYY}${MM}${DD}`;
        const XXXX = String(counter).padStart(4, '0');

        const pattern = settings.txNumberFormat || '[PREFIX]-YYYYMMDD-XXXX';

        return pattern
          .replace('[PREFIX]', prefix)
          .replace('YYYYMMDD', YYYYMMDD)
          .replace('YYYY', YYYY)
          .replace('MM', MM)
          .replace('DD', DD)
          .replace('XXXX', XXXX);
      }

      function getProductWarehouseStock(product, warehouse = 'Semua Gudang') {
        if (!product || !product.stocks || typeof product.stocks !== 'object') return 0;
        if (!warehouse || warehouse === 'Semua Gudang') {
          return Object.values(product.stocks).reduce((sum, qty) => sum + Number(qty || 0), 0);
        }
        if (product.stocks[warehouse] !== undefined) return Number(product.stocks[warehouse]) || 0;
        const targetClean = String(warehouse).trim().toLowerCase();
        for (const [k, v] of Object.entries(product.stocks)) {
          if (String(k).trim().toLowerCase() === targetClean) {
            return Number(v) || 0;
          }
        }
        return 0;
      }

      // Helper Functions
      function totalStock(product, warehouse = 'Semua Gudang') {
        return getProductWarehouseStock(product, warehouse);
      }

      function escapeHtml(str) {
        return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

      function getProductMin(product) {
        if (product && product.min !== undefined && product.min !== null && product.min !== '' && !isNaN(Number(product.min))) {
          return Math.max(0, Number(product.min));
        }
        return 0;
      }

      function stockState(product, warehouse = 'Semua Gudang') {
        const qty = totalStock(product, warehouse);
        if (qty <= 0) return ['Habis', 'danger'];
        const minVal = getProductMin(product);
        if (minVal > 0 && qty <= minVal) return ['Menipis', 'warning'];
        return ['Aman', 'success'];
      }

      function getCriticalProducts() {
        return store.products.filter(p => {
          if (!p.active) return false;
          const [st] = stockState(p);
          return st === 'Habis' || st === 'Menipis';
        }).sort((a, b) => {
          const stockA = totalStock(a);
          const stockB = totalStock(b);
          if (stockA <= 0 && stockB > 0) return -1;
          if (stockB <= 0 && stockA > 0) return 1;
          return stockA - stockB;
        });
      }

      // Image Compression & Processing Helper
      function compressImageFile(file, maxWidth = 800, quality = 0.58) {
        return new Promise((resolve, reject) => {
          if (!file || !file.type || !file.type.startsWith('image/')) {
            return reject(new Error('File yang dipilih bukan gambar yang valid.'));
          }
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              let width = img.width;
              let height = img.height;
              const maxDim = maxWidth;
              if (width > maxDim || height > maxDim) {
                if (width >= height) {
                  height = Math.round((height * maxDim) / width);
                  width = maxDim;
                } else {
                  width = Math.round((width * maxDim) / height);
                  height = maxDim;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);

              let curQuality = quality;
              let dataUrl = canvas.toDataURL('image/jpeg', curQuality);

              // Jaminan string Base64 <= 42.000 karakter agar tidak melebihi batas sel Google Spreadsheet (50.000 karakter)
              if (dataUrl.length > 42000) {
                dataUrl = canvas.toDataURL('image/jpeg', 0.45);
              }
              if (dataUrl.length > 42000) {
                const c2 = document.createElement('canvas');
                c2.width = Math.round(width * 0.75);
                c2.height = Math.round(height * 0.75);
                const ctx2 = c2.getContext('2d');
                ctx2.drawImage(canvas, 0, 0, c2.width, c2.height);
                dataUrl = c2.toDataURL('image/jpeg', 0.45);
              }

              resolve(dataUrl);
            };
            img.onerror = () => reject(new Error('Gagal memproses file gambar.'));
            img.src = e.target.result;
          };
          reader.onerror = () => reject(new Error('Gagal membaca file gambar.'));
          reader.readAsDataURL(file);
        });
      }

      // MODUL KAMERA MANDIRI (LUAR SANDBOX APPS SCRIPT)
      // ==========================================
      const CAMERA_STORAGE_KEY = 'STOKKITA_CAMERA_PHOTO_RESULT_V1';
      let cameraPopupWindow = null;
      let cameraPollingInterval = null;
      const processedPhotoIds = new Set();

      function createCameraPopupHTML(targetProp, containerId) {
        const safeTargetProp = JSON.stringify(targetProp || 'transactionPhoto');
        const safeContainerId = JSON.stringify(containerId || 'txPhotoContainer');
        const storageKey = JSON.stringify(CAMERA_STORAGE_KEY);

        return `<!DOCTYPE html>

</head>
<body>
  <div class="cam-box">

  <script>
    var TARGET_PROP = ${safeTargetProp};
    var CONTAINER_ID = ${safeContainerId};
    var STORAGE_KEY = ${storageKey};

    var cameraStream = null;
    var currentFacing = 'environment';
    var capturedDataUrl = '';
    var videoEl = document.getElementById('cameraVideo');
    var canvasEl = document.getElementById('photoCanvas');
    var resultEl = document.getElementById('photoResult');
    var statusEl = document.getElementById('statusBadge');
    var captureBtn = document.getElementById('captureBtn');
    var useBtn = document.getElementById('useBtn');
    var retakeBtn = document.getElementById('retakeBtn');

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = 'status-badge' + (type ? ' ' + type : '');
    }

    function stopTracks() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(function(t) { t.stop(); });
        cameraStream = null;
      }
    }

    async function initCamera() {
      stopTracks();
      resetDisplayUI();
      setStatus('Meminta akses kamera...', '');

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus('Browser Anda tidak mendukung akses media kamera.', 'error');
        return;
      }

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: currentFacing },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        videoEl.srcObject = cameraStream;
        await videoEl.play();
        setStatus(currentFacing === 'environment' ? 'Kamera belakang aktif.' : 'Kamera depan aktif.', 'success');
      } catch (err) {
        console.error(err);
        var msg = 'Kamera tidak dapat diakses.';
        if (err.name === 'NotAllowedError') msg = 'Izin kamera ditolak. Berikan izin kamera pada browser Anda.';
        else if (err.name === 'NotFoundError') msg = 'Perangkat kamera tidak ditemukan.';
        setStatus(msg, 'error');
      }
    }

    function switchCameraFacing() {
      currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
      initCamera();
    }

    function resetDisplayUI() {
      videoEl.style.display = 'block';
      resultEl.style.display = 'none';
      resultEl.src = '';
      captureBtn.style.display = 'block';
      useBtn.style.display = 'none';
      retakeBtn.style.display = 'none';
      capturedDataUrl = '';
    }

    function takeSnapshot() {
      if (!videoEl.videoWidth || !videoEl.videoHeight) {
        setStatus('Kamera belum siap, tunggu beberapa detik.', 'error');
        return;
      }

      var maxW = 1000;
      var scale = Math.min(1, maxW / videoEl.videoWidth);
      canvasEl.width = Math.round(videoEl.videoWidth * scale);
      canvasEl.height = Math.round(videoEl.videoHeight * scale);

      var ctx = canvasEl.getContext('2d');
      ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);

      capturedDataUrl = canvasEl.toDataURL('image/jpeg', 0.80);
      resultEl.src = capturedDataUrl;

      videoEl.style.display = 'none';
      resultEl.style.display = 'block';
      captureBtn.style.display = 'none';
      useBtn.style.display = 'block';
      retakeBtn.style.display = 'block';

      setStatus('Foto berhasil diambil. Periksa pratinjau sebelum menyimpan.', 'success');
    }

    function resetToLiveCamera() {
      resetDisplayUI();
      setStatus('Silakan bidik kembali lalu tekan Ambil Foto.', '');
    }

    function confirmAndSendPhoto() {
      if (!capturedDataUrl) {
        setStatus('Belum ada foto yang diambil.', 'error');
        return;
      }

      var payload = {
        type: 'STOKKITA_CAMERA_PHOTO_RESULT',
        photoId: 'photo_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
        imageBase64: capturedDataUrl,
        targetProp: TARGET_PROP,
        containerId: CONTAINER_ID,
        timestamp: Date.now()
      };

      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, '*');
        }
      } catch (e) { }

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (e) { }

      setStatus('Foto berhasil dikirim ke aplikasi StokKita! Menutup jendela...', 'success');
      setTimeout(function() {
        stopTracks();
        window.close();
      }, 400);
    }

    function closeCameraWindow() {
      stopTracks();
      window.close();
    }

    window.addEventListener('beforeunload', stopTracks);
    initCamera();
  <\/script>
</body>
</html>`;
      }

      function openCameraPopup(targetProp = 'transactionPhoto', containerId = 'txPhotoContainer') {
        const width = Math.min(480, screen.availWidth - 24);
        const height = Math.min(760, screen.availHeight - 40);
        const left = Math.max(0, Math.round((screen.availWidth - width) / 2));
        const top = Math.max(0, Math.round((screen.availHeight - height) / 2));

        try {
          localStorage.removeItem(CAMERA_STORAGE_KEY);
        } catch (e) { }

        cameraPopupWindow = window.open(
          '',
          'stokkita_camera_popup',
          `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes`
        );

        if (!cameraPopupWindow) {
          showToast('Popup Diblokir', 'Browser memblokir jendela kamera. Silakan izinkan popup untuk situs ini.', true);
          return;
        }

        const html = createCameraPopupHTML(targetProp, containerId);
        try {
          cameraPopupWindow.document.open();
          cameraPopupWindow.document.write(html);
          cameraPopupWindow.document.close();
          cameraPopupWindow.focus();
        } catch (err) {
          try {
            const blob = new Blob([html], { type: 'text/html' });
            cameraPopupWindow.location.href = URL.createObjectURL(blob);
          } catch (e) {
            console.error('Gagal menulis ke popup kamera:', e);
          }
        }

        startCameraPollingFallback(targetProp, containerId);
        showToast('Kamera Terbuka', 'Jendela kamera mandiri telah dibuka. Ambil foto lalu klik "Gunakan Foto Ini".');
      }

      function handleReceivedCameraPhoto(data) {
        if (!data || data.type !== 'STOKKITA_CAMERA_PHOTO_RESULT' || !data.photoId) return;
        if (processedPhotoIds.has(data.photoId)) return;
        processedPhotoIds.add(data.photoId);

        setTimeout(() => processedPhotoIds.delete(data.photoId), 60000);

        const targetProp = data.targetProp || 'transactionPhoto';
        const containerId = data.containerId || 'txPhotoContainer';
        const base64 = data.imageBase64;

        if (typeof base64 === 'string' && base64.startsWith('data:image/')) {
          state[targetProp] = base64;
          updatePhotoAttachmentContainer(containerId, base64);
          showToast('Foto Berhasil Dilampirkan', 'Foto bukti berhasil diterima dan siap disimpan bersama data.');
        }

        stopCameraPollingFallback();
      }

      function startCameraPollingFallback(expectedProp, expectedContainer) {
        stopCameraPollingFallback();
        let counter = 0;
        cameraPollingInterval = setInterval(() => {
          counter++;
          if (counter > 150 || (cameraPopupWindow && cameraPopupWindow.closed)) {
            stopCameraPollingFallback();
            return;
          }

          try {
            const raw = localStorage.getItem(CAMERA_STORAGE_KEY);
            if (raw) {
              localStorage.removeItem(CAMERA_STORAGE_KEY);
              const data = JSON.parse(raw);
              if (data && data.imageBase64) {
                handleReceivedCameraPhoto(data);
              }
            }
          } catch (e) { }
        }, 400);
      }

      function stopCameraPollingFallback() {
        if (cameraPollingInterval) {
          clearInterval(cameraPollingInterval);
          cameraPollingInterval = null;
        }
      }

      window.addEventListener('message', function (event) {
        if (event.data && event.data.type === 'STOKKITA_CAMERA_PHOTO_RESULT') {
          handleReceivedCameraPhoto(event.data);
        }
      });

      function renderPhotoAttachmentField(opts) {
        const containerId = opts.containerId || (opts.cameraInputId ? `${opts.cameraInputId}Container` : 'photoContainer');
        const mergedOpts = { ...opts, containerId };
        return `

            ${renderPhotoAttachmentInner(mergedOpts)}
          </div>
        `;
      }

      function renderPhotoAttachmentInner(opts) {
        const {
          photo = '',
          cameraInputId = 'txCameraInput',
          uploadInputId = 'txUploadInput',
          triggerCameraAction = 'trigger-tx-camera',
          triggerUploadAction = 'trigger-tx-upload',

        const safePhoto = escapeHtml(photo);

        return `

            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:6px;">

              <button type="button" class="btn btn-secondary btn-sm" data-action="${triggerUploadAction}" style="display:inline-flex;align-items:center;gap:6px;">
                <svg class="icon"><use href="#i-image" /></svg> Pilih dari Galeri
              </button>
              ${photo ? `
                <button type="button" class="btn btn-ghost btn-sm" data-action="${removeAction}" style="color:var(--danger);display:inline-flex;align-items:center;gap:4px;">
                  <svg class="icon"><use href="#i-trash" /></svg> Hapus Foto

            </div>

            ${photo ? `
              <div style="margin-top:10px;display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--bg-subtle, #f8fafc);border:1px solid var(--border);border-radius:8px;">
                <img src="${safePhoto}" alt="Pratinjau Foto" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:pointer;" data-action="view-photo" data-photo="${safePhoto}" data-title="Pratinjau Foto Bukti" title="Klik untuk memperbesar">
                <div style="flex:1;min-width:0;">
                  <div style="font-size:12px;font-weight:600;color:var(--ink-900);display:flex;align-items:center;gap:6px;">

                <button type="button" class="btn btn-ghost btn-sm" data-action="view-photo" data-photo="${safePhoto}" data-title="Pratinjau Foto Bukti" style="padding:4px 8px;font-size:11px;">

                </button>

      }

      function updatePhotoAttachmentContainer(containerId, newPhoto, customOpts = {}) {
        const container = document.getElementById(containerId);

        let opts = {};
        try {
          if (container.dataset.opts) opts = JSON.parse(container.dataset.opts);

        opts = { ...opts, ...customOpts, photo: newPhoto, containerId };

        container.innerHTML = renderPhotoAttachmentInner(opts);
      }

      function handlePhotoUpload(file, stateProp, containerId) {
        if (!file) return;
        showToast('Memproses Gambar...', 'Sedang mengompresi foto agar optimal & hemat penyimpanan...');
        compressImageFile(file, 900, 0.65)
          .then(dataUrl => {
            state[stateProp] = dataUrl;
            updatePhotoAttachmentContainer(containerId, dataUrl);
