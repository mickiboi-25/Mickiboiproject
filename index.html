      // Professional Spreadsheet & CSV Export Utilities
      function exportCSV(filename, headers, rows) {
        const escapeCell = val => {
          if (val === null || val === undefined) return '""';
          const str = String(val).replace(/"/g, '""');
          return `"${str}"`;
        };
        // Menambahkan direktif sep=, agar Microsoft Excel otomatis membagi kolom tanpa menumpuk di kolom A
        const csvContent = '\uFEFFsep=,\r\n' + [headers.map(escapeCell).join(','), ...rows.map(r => r.map(escapeCell).join(','))].join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        addAuditLog('EXPORT', 'Laporan CSV', filename, `Mengekspor data ke file ${filename}`);
        saveStore();
        showToast('Ekspor Berhasil', `File ${filename} telah diunduh.`);
      }

      function exportToExcel(filename, reportTitle, headers, rows, meta = {}) {
        const cleanFilename = (filename || 'Laporan').replace(/\.csv$/i, '').replace(/\.xlsx$/i, '').replace(/\.xls$/i, '');
        const title = reportTitle || cleanFilename.replace(/_/g, ' ');

        // 1. Ekspor Native Excel (.xlsx) via SheetJS jika tersedia
        if (typeof XLSX !== 'undefined') {
          try {
            const wb = XLSX.utils.book_new();
            const wsData = [];

            // Baris 1: Identitas Bisnis
            const bizName = (store.settings && store.settings.businessName) || 'StokKita — Inventori Multi Gudang';
            wsData.push([bizName.toUpperCase()]);

            // Baris 2: Judul Resmi Laporan
            wsData.push([title.toUpperCase()]);

            // Baris 3: Informasi Filter & Tanggal
            const metaTokens = [];
            if (meta.warehouse) metaTokens.push(`Lokasi: ${meta.warehouse}`);
            if (meta.category) metaTokens.push(`Kategori: ${meta.category}`);
            if (meta.period) metaTokens.push(`Periode: ${meta.period}`);
            metaTokens.push(`Tanggal: ${getNowFormatted()}`);
            const curUser = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');
            metaTokens.push(`Diekspor Oleh: ${curUser}`);
            wsData.push([metaTokens.join('   |   ')]);

            // Baris 4: Baris Pemisah Kosong
            wsData.push([]);

            // Baris 5: Header Tabel
            wsData.push(headers);

            // Baris 6+: Data Baris dengan tipe data angka numerik murni
            rows.forEach(r => {
              const rowArr = r.map((val, colIdx) => {
                if (val === null || val === undefined) return '';
                if (typeof val === 'number') return val;
                const hName = (headers[colIdx] || '').toLowerCase();
                const isNumericCol = hName.includes('stok') || hName.includes('qty') || hName.includes('kuantitas') ||
                  hName.includes('minimum') || hName.includes('saldo') || hName.includes('selisih') ||
                  hName.includes('total') || hName.includes('gudang');
                const str = String(val).trim();
                if (isNumericCol && str !== '' && !isNaN(Number(str)) && !str.startsWith('+') && !str.includes('-') && (!str.startsWith('0') || str === '0')) {
                  return Number(str);
                }
                return str;
              });
              wsData.push(rowArr);
            });

            const ws = XLSX.utils.aoa_to_sheet(wsData);

            // Lebar kolom otomatis proporsional (Auto Column Widths)
            const colWidths = headers.map((h, colIdx) => {
              let maxLen = String(h).length;
              rows.forEach(r => {
                const cellVal = r[colIdx];
                if (cellVal !== null && cellVal !== undefined) {
                  maxLen = Math.max(maxLen, String(cellVal).length);
                }
              });
              return { wch: Math.min(Math.max(maxLen + 4, 14), 45) };
            });
            ws['!cols'] = colWidths;

            // Mengaktifkan AutoFilter pada header tabel (baris ke-5)
            const lastColCode = XLSX.utils.encode_col(headers.length - 1);
            ws['!autofilter'] = { ref: `A5:${lastColCode}${wsData.length}` };

            const sheetName = title.slice(0, 31).replace(/[\\/?*[\]:]/g, '');
            XLSX.utils.book_append_sheet(wb, ws, sheetName);

            const outFilename = `${cleanFilename}.xlsx`;
            XLSX.writeFile(wb, outFilename);

            addAuditLog('EXPORT', 'Excel (.xlsx)', outFilename, `Mengekspor laporan ke file Excel ${outFilename}`);
            saveStore();
            showToast('Ekspor Berhasil', `File spreadsheet ${outFilename} berhasil diunduh.`);
            return;
          } catch (err) {
            console.warn('Gagal memproses via SheetJS, beralih ke format Excel XML/HTML fallback:', err);
          }
        }

        // 2. Fallback: Format Excel XML / HTML Spreadsheet (.xls)
        exportExcelHtmlFallback(cleanFilename, title, headers, rows, meta);
      }

      function exportExcelHtmlFallback(cleanFilename, title, headers, rows, meta = {}) {
        const bizName = (store.settings && store.settings.businessName) || 'StokKita — Inventori Multi Gudang';

        if (meta.category) metaTokens.push(`Kategori: ${meta.category}`);
        if (meta.period) metaTokens.push(`Periode: ${meta.period}`);
        metaTokens.push(`Tanggal: ${getNowFormatted()}`);
        const curUser = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');
        metaTokens.push(`Diekspor Oleh: ${curUser}`);

        const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta http-equiv="content-type" content="application/vnd.ms-excel; charset=UTF-8">
<!--[if gte mso 9]>
<xml>
 <x:ExcelWorkbook>
  <x:ExcelWorksheets>
   <x:ExcelWorksheet>
    <x:Name>${escapeHtml(title.slice(0, 31))}</x:Name>
    <x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>
   </x:ExcelWorksheet>
  </x:ExcelWorksheets>
 </x:ExcelWorkbook>
</xml>
<![endif]-->

      // Date Filter Parsing & Evaluation Utility
      function parseDateStr(str) {
        if (!str) return null;
        if (str.includes('/')) {
          const parts = str.split(' ')[0].split('/');
          if (parts.length === 3) {
            return new Date(Number(parts[2]), Number(parts[1]) - 1, Number(parts[0]));
          }
        }
        if (str.includes('-')) {
          const parts = str.split(' ')[0].split('-');
          if (parts.length === 3) {
            return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
          }
        }
        const d = new Date(str);
        return isNaN(d.getTime()) ? null : d;
      }

      function isTxInPeriod(txDateStr, period, customFrom, customTo) {
        if (!period || period === 'all') return true;
        const d = parseDateStr(txDateStr);
        if (!d) return true;

        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);

        if (period === 'today') {
          return d >= startOfToday && d <= endOfToday;
        }
        if (period === '7days') {
          const past7 = new Date(startOfToday);
          past7.setDate(past7.getDate() - 7);
          return d >= past7 && d <= endOfToday;
        }
        if (period === '30days') {
          const past30 = new Date(startOfToday);
          past30.setDate(past30.getDate() - 30);
          return d >= past30 && d <= endOfToday;
        }
        if (period === 'this-month') {
          const isCurrentMonth = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
          return isCurrentMonth || (d.getFullYear() === 2026 && (d.getMonth() === 7 || d.getMonth() === 8));
        }
        if (period === 'custom') {
          if (customFrom) {
            const f = new Date(customFrom + 'T00:00:00');
            if (d < f) return false;
          }
          if (customTo) {
            const t = new Date(customTo + 'T23:59:59');
            if (d > t) return false;
          }
          return true;
        }
        return true;
      }

          const text = `${tr.no} ${tr.fromWarehouse} ${tr.toWarehouse} ${tr.notes || ''} ${tr.user || ''} ${linesText}`.toLowerCase();
          const matchQ = text.includes(q);
          return matchStatus && matchWh && matchPeriod && matchQ;

        const totalUnitsMoved = filtered.reduce((s, t) => s + (t.qty || 0), 0);

      function getFilteredReportData() {
        const type = state.reportType || 'current-stock';
        const wh = state.reportWarehouse || 'Semua Gudang';
        const cat = state.reportCategory || 'Semua Kategori';
        const q = (state.reportQuery || '').toLowerCase();
        const period = state.reportPeriod || 'all';
        const dFrom = state.reportDateFrom;
        const dTo = state.reportDateTo;

        let headers = [];
        let rows = [];
        let title = '';
        let totalUnits = 0;

        if (type === 'current-stock') {
          title = 'Laporan Saldo Stok Saat Ini';
          const whNames = store.warehouses.map(w => w.name);
          headers = ['SKU', 'Nama Barang', 'Kategori', 'Satuan', ...whNames, 'Total Stok', 'Minimum', 'Status'];
          const filtered = store.products.filter(p => {
            const matchCat = cat === 'Semua Kategori' || p.category === cat;
            const matchQ = `${p.name} ${p.sku} ${p.category}`.toLowerCase().includes(q);
            return p.active && matchCat && matchQ;
          });
          rows = filtered.map(p => {
            const tot = totalStock(p);
            totalUnits += tot;
            return [
              p.sku,
              p.name,
              p.category,
              p.unit,
              ...whNames.map(wn => p.stocks[wn] || 0),
              tot,
              getProductMin(p),
              stockState(p)[0]
            ];
          });
        } else if (type === 'stock-card') {
          title = 'Laporan Kartu Stok & Mutasi';
          headers = ['Waktu', 'Barang', 'Lokasi Gudang', 'Jenis Mutasi', 'Kuantitas', 'Saldo Berjalan', 'No Referensi', 'Petugas', 'Catatan'];
          const list = store.stockLedger.filter(l => {
            const p = store.products.find(x => x.id === l.productId);
            const pName = p ? p.name : '';
            const matchWh = wh === 'Semua Gudang' || l.warehouse === wh;
            const matchPeriod = isTxInPeriod(l.date, period, dFrom, dTo);
            const matchQ = `${pName} ${l.type} ${l.refNo || ''} ${l.user || ''} ${l.notes || ''}`.toLowerCase().includes(q);
            return matchWh && matchPeriod && matchQ;
          });
          rows = list.map(l => {
            const p = store.products.find(x => x.id === l.productId);
            totalUnits += Number(l.qty || 0);
            return [
              l.date,
              p ? `${p.name} (${p.sku})` : l.productId,
              l.warehouse,
              l.type,
              l.qty,
              l.balanceAfter,
              l.refNo || '—',
              l.user || 'Admin',
              l.notes || '—'
            ];
          });
        } else if (type === 'incoming') {
          title = 'Laporan Penerimaan Barang Masuk';
          headers = ['No Transaksi', 'Waktu', 'Gudang Tujuan', 'Supplier', 'Rincian Barang', 'Total Qty', 'No Surat Jalan', 'Petugas', 'Status'];
          const list = store.transactions.filter(t => t.type === 'Barang Masuk').filter(t => {
            const matchWh = wh === 'Semua Gudang' || t.warehouse === wh;
            const matchPeriod = isTxInPeriod(t.date, period, dFrom, dTo);
            const text = `${t.no} ${t.party || ''} ${t.refNo || ''} ${t.user || ''} ${(t.details || []).map(d => d.name).join(' ')}`.toLowerCase();
            return matchWh && matchPeriod && text.includes(q);
          });
          rows = list.map(t => {
            totalUnits += Number(t.qty || 0);
            const details = (t.details || []).map(d => `${d.name} (${d.qty} ${d.unit || 'unit'})`).join(', ') || '—';
            return [t.no, t.date, t.warehouse, t.party || '—', details, t.qty, t.refNo || '—', t.user || 'Admin', t.status || 'Posted'];
          });
        } else if (type === 'outgoing') {
          title = 'Laporan Pengeluaran Barang Keluar';
          headers = ['No Transaksi', 'Waktu', 'Gudang Asal', 'Tujuan / Penerima', 'Rincian Barang', 'Total Qty', 'No Referensi', 'Petugas', 'Status'];
          const list = store.transactions.filter(t => t.type === 'Barang Keluar').filter(t => {
            const matchWh = wh === 'Semua Gudang' || t.warehouse === wh;
            const matchPeriod = isTxInPeriod(t.date, period, dFrom, dTo);
            const text = `${t.no} ${t.party || ''} ${t.refNo || ''} ${t.user || ''} ${(t.details || []).map(d => d.name).join(' ')}`.toLowerCase();
            return matchWh && matchPeriod && text.includes(q);
          });
          rows = list.map(t => {
            totalUnits += Number(t.qty || 0);
            const details = (t.details || []).map(d => `${d.name} (${d.qty} ${d.unit || 'unit'})`).join(', ') || '—';
            return [t.no, t.date, t.warehouse, t.party || '—', details, t.qty, t.refNo || '—', t.user || 'Admin', t.status || 'Posted'];
          });
        } else if (type === 'damaged') {
          title = 'Laporan Barang Bermasalah & Rusak';
          headers = ['No Tiket', 'Waktu Lapor', 'Nama Barang', 'SKU', 'Lokasi Gudang', 'Qty Rusak', 'Satuan', 'Jenis Masalah', 'Tindakan', 'No Bukti', 'Pelapor', 'Status'];
          const list = (store.damagedItems || []).filter(item => {
            const matchWh = wh === 'Semua Gudang' || item.warehouse === wh;
            const matchPeriod = isTxInPeriod(item.date, period, dFrom, dTo);
            const text = `${item.no} ${item.productName} ${item.sku} ${item.issueType} ${item.action} ${item.user}`.toLowerCase();
            return matchWh && matchPeriod && text.includes(q);
          });
          rows = list.map(item => {
            totalUnits += Number(item.qty || 0);
            return [item.no, item.date, item.productName, item.sku, item.warehouse, item.qty, item.unit, item.issueType, item.action, item.refNo || '—', item.user, item.status || 'Dikonfirmasi'];
          });
        } else if (type === 'transfer') {
          title = 'Laporan Transfer Antar Gudang';
          headers = ['No Transfer', 'Waktu', 'Gudang Asal', 'Gudang Tujuan', 'Rincian Barang', 'Total Qty', 'No Surat Jalan', 'Petugas', 'Status'];
          const list = store.transfers.filter(tr => {
            const matchWh = wh === 'Semua Gudang' || tr.fromWarehouse === wh || tr.toWarehouse === wh;
            const matchPeriod = isTxInPeriod(tr.date, period, dFrom, dTo);
            const text = `${tr.no} ${tr.fromWarehouse} ${tr.toWarehouse} ${tr.refNo || ''} ${tr.user}`.toLowerCase();
            return matchWh && matchPeriod && text.includes(q);
          });
          rows = list.map(tr => {
            totalUnits += Number(tr.qty || 0);
            const linesSummary = (tr.lines || []).map(l => `${l.name || 'Barang'} (${l.qty} ${l.unit || 'unit'})`).join(', ') || `${tr.items} jenis`;
            return [tr.no, tr.date, tr.fromWarehouse, tr.toWarehouse, linesSummary, tr.qty, tr.refNo || '—', tr.user, tr.status];
          });
        } else if (type === 'opname') {
          title = 'Laporan Hasil Stok Opname';
          headers = ['No Sesi', 'Waktu Sesi', 'Gudang Diperiksa', 'Jumlah SKU', 'Total Selisih Bersih', 'Petugas', 'Status', 'Catatan'];
          const list = store.opnames.filter(op => {
            const matchWh = wh === 'Semua Gudang' || op.warehouse === wh;
            const matchPeriod = isTxInPeriod(op.date, period, dFrom, dTo);
            const text = `${op.no} ${op.warehouse} ${op.notes || ''} ${op.user}`.toLowerCase();
            return matchWh && matchPeriod && text.includes(q);
          });
          rows = list.map(op => {
            totalUnits += Math.abs(Number(op.totalDiff || 0));
            return [op.no, op.date, op.warehouse, `${op.itemsCount} SKU`, `${op.totalDiff > 0 ? '+' : ''}${op.totalDiff} unit`, op.user, op.status, op.notes || '—'];
          });
        } else if (type === 'audit') {
          title = 'Log Jejak Audit Pengguna & Sistem';
          headers = ['Waktu', 'Pengguna', 'Aksi', 'Entitas', 'Referensi', 'Deskripsi Aktivitas'];
          const list = store.auditLogs.filter(a => {
            const matchPeriod = isTxInPeriod(a.time, period, dFrom, dTo);
            const text = `${a.time} ${a.user} ${a.action} ${a.entity} ${a.ref} ${a.description}`.toLowerCase();
            return matchPeriod && text.includes(q);
          });
          rows = list.map(a => [a.time, a.user, a.action, a.entity, a.ref, a.description]);
        }

        let periodLabel = 'Semua Waktu';
        if (type === 'current-stock') {
          periodLabel = 'Real-Time / Saldo Terkini';
        } else if (period === 'today') {
          periodLabel = 'Hari Ini';
        } else if (period === '7days') {
          periodLabel = '7 Hari Terakhir';
        } else if (period === '30days') {
          periodLabel = '30 Hari Terakhir';
        } else if (period === 'this-month') {
          periodLabel = 'Bulan Ini';
        } else if (period === 'custom') {
          periodLabel = `${dFrom || 'Awal'} s/d ${dTo || 'Akhir'}`;
        }

        return { title, headers, rows, totalUnits, count: rows.length, periodLabel };
      }

      function productsPage() {
        const filtered = store.products.filter(p => {
          const text = `${p.name} ${p.sku} ${p.category}`.toLowerCase();
          const matchesText = text.includes(state.productsQuery.toLowerCase());
          const matchesCat = state.productsCategory === 'Semua Kategori' || p.category === state.productsCategory;
          const matchesStatus = state.productsStatus === 'Semua Status' || (state.productsStatus === 'Aktif' ? p.active : !p.active);
          return matchesText && matchesCat && matchesStatus;

        const categories = ['Semua Kategori', ...store.categories.map(c => c.name)];

        return `${toolbar('Master Barang', 'Kelola SKU, nama, kategori, satuan, dan status barang.', `
          <button class="btn btn-secondary" data-action="export-current-stock">${icon('download')}<span class="btn-label-hide">Ekspor Excel</span></button>
          <button class="btn btn-primary" data-action="new-product">${icon('plus')} Barang baru</button>`)}

            <div class="field half-mobile"><label for="prodCategory">Kategori</label><select id="prodCategory" class="control">${categories.map(c => `<option value="${c}" ${state.productsCategory === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>

          const photoSrc = p.photo || p.foto;
          const thumbHtml = photoSrc
            ? `<img src="${escapeHtml(photoSrc)}" alt="${escapeHtml(p.name)}" class="product-thumb" style="object-fit:cover;cursor:pointer;border:1px solid var(--border);border-radius:6px;width:36px;height:36px;" data-action="view-photo" data-id="${p.id}" data-photo="${escapeHtml(photoSrc)}" data-title="Foto Produk: ${escapeHtml(p.name)}" title="Klik untuk memperbesar">`
            : `<span class="product-thumb">${p.name.slice(0, 2).toUpperCase()}</span>`;
          return `
              <tr>
                <td>
                  <div class="cell-product">
                    ${thumbHtml}
                    <span>
                      <strong>${p.name}</strong>
                      <span>${p.sku}</span>
                    </span>
                  </div>
                </td>
                <td><span class="cat-badge">${p.category}</span></td>
                <td>${p.unit}</td>
                <td class="qty"><strong>${getProductMin(p)}</strong> <small style="color:var(--ink-500)">${p.unit}</small></td>
                <td class="qty">${rupiah.format(totalStock(p))}</td>
                <td>${badge(p.active ? 'Aktif' : 'Nonaktif')}</td>
                <td>
                  <div style="display:flex;gap:6px">
                    <button class="icon-btn" style="width:32px;height:32px" data-action="edit-product" data-id="${p.id}" title="Edit ${p.name}">${icon('edit')}</button>
                    ${photoSrc ? `
                      <button class="icon-btn" style="width:32px;height:32px;color:var(--brand-600)" data-action="view-photo" data-id="${p.id}" data-photo="${escapeHtml(photoSrc)}" data-title="Foto Produk: ${escapeHtml(p.name)}" title="Lihat Foto Produk">${icon('camera')}</button>

                    <button class="icon-btn" style="width:32px;height:32px;color:var(--danger)" data-action="delete-product" data-id="${p.id}" title="Hapus ${p.name}">${icon('trash')}</button>
                  </div>
                </td>
              </tr>`;
        }).join('') || `<tr><td colspan="7">${emptyState('package', 'Tidak ada barang sesuai filter', 'Coba reset kata kunci pencarian.')}</td></tr>`}
          </tbody></table></div><div class="table-footer"><span>${filtered.length} dari ${store.products.length} barang</span><div class="pagination"><button class="page-btn active">1</button></div></div></article>`;
      }

        document.body.style.overflow = 'hidden';

        modalEl.classList.remove('show');

      function showToast(title, message = '', isError = false) {
        const stack = document.getElementById('toastStack');
        const el = document.createElement('div');

        el.innerHTML = `${icon(isError ? 'info' : 'check')}<div><strong>${title}</strong>${message ? `<p>${message}</p>` : ''}</div>`;
        stack.appendChild(el);
        setTimeout(() => el.remove(), 3600);

      // Submit Pop-up Modal IN / OUT Transaction
      function submitModalTransaction(kind) {
        const type = kind || state.activeTxKind || 'incoming';
        const isOut = type === 'outgoing';
        const staffWh = getStaffAssignedWarehouse();
        const domWh = document.getElementById('modalTxWarehouse')?.value;
        const warehouse = (state.role === 'STAFF')
          ? staffWh
          : (domWh || state.transactionWarehouse || 'Gudang Utama');
        const dateInput = document.getElementById('modalTxDate')?.value || state.transactionDate || new Date().toISOString().split('T')[0];
        const partyInput = document.getElementById('modalTxParty')?.value || state.transactionParty || '';
        const refInput = document.getElementById('modalTxRef')?.value || state.transactionRef || '';
        const notesInput = document.getElementById('modalTxNotes')?.value || state.transactionNotes || '';

        const lineProducts = (state.transactionLines || []).map(l => ({
          ...l,
          product: store.products.find(p => p.id === l.productId)
        })).filter(l => l.product && Number(l.qty) > 0);

        if (!lineProducts.length) {
          return showToast('Form Belum Lengkap', 'Tambahkan minimal 1 barang dengan kuantitas lebih dari 0.', true);
        }

        if (isOut && store.settings.rejectNegativeStock) {
          for (const line of lineProducts) {
            const avail = getProductWarehouseStock(line.product, warehouse);
            if (Number(line.qty) > avail) {
              return showToast('Stok Tidak Mencukupi', `Barang ${line.product.name} hanya memiliki stok ${avail} ${line.product.unit} di ${warehouse}.`, true);
            }
          }
        }

        const txNo = generateCustomTransactionNo(isOut ? 'out' : 'in', dateInput);
        const totalQty = lineProducts.reduce((s, l) => s + Number(l.qty), 0);
        const currentUser = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');

        // Apply Stock Mutatations
        lineProducts.forEach(line => {
          if (!line.product.stocks || typeof line.product.stocks !== 'object') line.product.stocks = {};
          const matchedKey = Object.keys(line.product.stocks).find(k => k.trim().toLowerCase() === warehouse.trim().toLowerCase()) || warehouse;
          const curStock = Number(line.product.stocks[matchedKey]) || 0;
          if (isOut) {
            line.product.stocks[matchedKey] = Math.max(0, curStock - Number(line.qty));
          } else {
            line.product.stocks[matchedKey] = curStock + Number(line.qty);
          }
          // Ledger entry
          store.stockLedger.unshift({
            id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
            date: getNowFormatted(),
            productId: line.product.id,
            warehouse,
            type: isOut ? 'OUT' : 'IN',
            qty: Number(line.qty),
            balanceAfter: line.product.stocks[matchedKey],
            refNo: txNo,
            user: currentUser,
            notes: notesInput || (isOut ? `Keluar ke ${partyInput || 'Customer'}` : `Masuk dari ${partyInput || 'Supplier'}`)
          });
        });

        // Add Transaction record
        const newTx = {
          id: 'TX' + Date.now(),
          transaction_no: txNo,
          no: txNo,
          type: isOut ? 'Barang Keluar' : 'Barang Masuk',
          date: getNowFormatted(),
          warehouse,
          items: lineProducts.length,
          qty: totalQty,
          user: currentUser,
          status: 'Posted',
          party: partyInput,
          refNo: refInput,
          notes: notesInput,
          photo: state.transactionPhoto || '',
          details: lineProducts.map(l => ({
            productId: l.product.id,
            name: l.product.name,
            sku: l.product.sku,
            qty: Number(l.qty),
            unit: l.product.unit
          }))
        };

        store.transactions.unshift(newTx);
        addAuditLog('POST', `Transaksi ${isOut ? 'OUT' : 'IN'}`, txNo, `Mencatat ${lineProducts.length} barang (${totalQty} unit) di ${warehouse}`);
        saveStore();

        // Granular Cloud Sync: Kirim langsung transaksi ini secara atomik (Anti-Overwrite)
        syncGranularTransaction(newTx, lineProducts.map(l => ({
          id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
          date: getNowFormatted(),
          productId: l.product.id,
          warehouse,
          type: isOut ? 'OUT' : 'IN',
          qty: Number(l.qty),
          balanceAfter: l.product.stocks[warehouse] || 0,
          refNo: txNo,
          user: currentUser,
          notes: notesInput || (isOut ? `Keluar ke ${partyInput || 'Customer'}` : `Masuk dari ${partyInput || 'Supplier'}`)
        })));

        // Reset lines
        state.transactionLines = [];
        state.transactionParty = '';
        state.transactionRef = '';
        state.transactionNotes = '';
        state.transactionPhoto = '';

        // Show Success Modal
        openModal(`
          <div class="modal-body">
            <div class="success-visual">${icon('check')}</div>
            <div class="success-copy">
              <h2 id="modalTitle">Transaksi Berhasil Disimpan</h2>
              <p>Stok gudang telah diperbarui secara otomatis.</p>
            </div>

      function confirmExecuteDeleteTransaction(txNoOrId) {
        if (state.role === 'STAFF') {
          return showToast('Akses Dibatasi', 'Staf tidak dapat menghapus transaksi.', true);
        }
        const idx = store.transactions.findIndex(t => t.no === txNoOrId || t.id === txNoOrId || t.transaction_no === txNoOrId);
        if (idx === -1) return;

        const tx = store.transactions[idx];
        const isOut = (tx.type || '').toLowerCase().includes('keluar');
        const user = state.currentUser ? state.currentUser.name : 'Administrator';

        // Rollback stock
        (tx.details || []).forEach(line => {
          const prod = store.products.find(p => p.id === line.productId || p.sku === line.sku);
          if (prod && prod.stocks && prod.stocks[tx.warehouse] !== undefined) {
            const qty = Number(line.qty || 0);
            if (isOut) {
              // Transaksi keluar dibatalkan -> kembalikan stok
              prod.stocks[tx.warehouse] += qty;
            } else {
              // Transaksi masuk dibatalkan -> kurangi stok kembali
              prod.stocks[tx.warehouse] = Math.max(0, prod.stocks[tx.warehouse] - qty);
            }

            store.stockLedger.unshift({
              id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
              date: getNowFormatted(),
              productId: prod.id,
              warehouse: tx.warehouse,
              type: isOut ? 'ADJUSTMENT_PLUS' : 'ADJUSTMENT_MINUS',
              qty,
              balanceAfter: prod.stocks[tx.warehouse],
              refNo: `CANCEL-${tx.no}`,
              user,
              notes: `Rollback pembatalan transaksi ${tx.no}`
            });
          }
        });

        store.transactions.splice(idx, 1);
        addAuditLog('DELETE', `Transaksi ${tx.type}`, tx.no, `Menghapus transaksi ${tx.no} dan memulihkan saldo stok di ${tx.warehouse}`);
        saveStore();
        closeModal();
        showToast('Transaksi Dihapus', `Transaksi ${tx.no} berhasil dihapus dan saldo stok telah direkonsiliasi.`);
        render();
      }

      function executeNewTransfer() {
        const fromWh = state.transferFromWarehouse || document.getElementById('trfFrom')?.value;
        const toWh = state.transferToWarehouse || document.getElementById('trfTo')?.value;
        const ref = document.getElementById('trfRef')?.value || '';
        const notes = document.getElementById('trfNotes')?.value || '';

        if (fromWh === toWh) {
          return showToast('Rute Tidak Valid', 'Gudang asal dan tujuan tidak boleh sama.', true);
        }

        if (!state.transferLines || state.transferLines.length === 0) {
          return showToast('Barang Kosong', 'Tambahkan minimal 1 barang untuk ditransfer.', true);
        }

        // Validate all lines
        const linesToSave = [];
        let totalQty = 0;

        for (let i = 0; i < state.transferLines.length; i++) {
          const l = state.transferLines[i];
          const prod = store.products.find(p => p.id === l.productId);
          if (!prod) continue;

          const qty = Number(l.qty || 0);
          const avail = prod.stocks[fromWh] || 0;

          if (qty <= 0) {
            return showToast('Jumlah Tidak Valid', `Jumlah untuk ${prod.name} harus lebih dari 0.`, true);
          }
          if (qty > avail) {
            return showToast('Stok Tidak Cukup', `Stok ${prod.name} di ${fromWh} hanya tersedia ${avail} ${prod.unit}.`, true);
          }

          linesToSave.push({
            productId: prod.id,
            name: prod.name,
            sku: prod.sku,
            qty,
            unit: prod.unit
          });
          totalQty += qty;
        }

        // Deduct source warehouse stocks immediately (Status: In Transit)
        const trfNo = generateCustomTransactionNo('transfer');
        const user = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');

        linesToSave.forEach(l => {
          const prod = store.products.find(p => p.id === l.productId);
          if (prod) {
            prod.stocks[fromWh] -= l.qty;
            store.stockLedger.unshift({
              id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
              date: getNowFormatted(),
              productId: prod.id,
              warehouse: fromWh,
              type: 'TRANSFER_OUT',
              qty: l.qty,
              balanceAfter: prod.stocks[fromWh],
              refNo: trfNo,
              user,
              notes: `Transfer multi-barang dikirim ke ${toWh}`
            });
          }
        });

        const newTrf = {
          id: 'TRF' + Date.now(),
          transaction_no: trfNo,
          no: trfNo,
          date: getNowFormatted(),
          fromWarehouse: fromWh,
          toWarehouse: toWh,
          items: linesToSave.length,
          qty: totalQty,
          user,
          status: 'In Transit',
          notes,
          refNo: ref,
          photo: state.transferPhoto || '',
          lines: linesToSave
        };

        store.transfers.unshift(newTrf);
        store.transactions.unshift({
          id: 'TX' + Date.now(),
          transaction_no: trfNo,
          no: trfNo,
          type: 'Transfer',
          date: getNowFormatted(),
          warehouse: `${fromWh} → ${toWh}`,
          items: linesToSave.length,
          qty: totalQty,
          user,
          status: 'In Transit',
          fromWarehouse: fromWh,
          toWarehouse: toWh,
          refNo: ref,
          notes,
          photo: state.transferPhoto || '',
          details: linesToSave
        });

        addAuditLog('SEND', 'Transfer Gudang', trfNo, `Mengirim transfer ${linesToSave.length} barang (${totalQty} unit) dari ${fromWh} ke ${toWh}`);
        state.transferPhoto = '';
        saveStore();
        closeModal();
        showToast('Transfer Dikirim', `Surat jalan ${trfNo} (${linesToSave.length} SKU, ${totalQty} unit) berhasil dibuat.`);
        render();
      }

      function confirmExecuteDeleteTransfer(transferId) {
        if (state.role === 'STAFF') {
          return showToast('Akses Ditolak', 'Akun staf tidak memiliki hak akses untuk membatalkan transfer.', true);
        }

        const idx = store.transfers.findIndex(t => t.id === transferId);
        if (idx === -1) return;
        const trf = store.transfers[idx];
        const user = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');

        const lines = trf.lines && trf.lines.length > 0
          ? trf.lines
          : store.products.slice(0, 1).map(p => ({ productId: p.id, qty: trf.qty, name: p.name, sku: p.sku }));

        lines.forEach(line => {
          const prod = store.products.find(p => p.id === line.productId || p.sku === line.sku);
          if (prod) {
            if (trf.status === 'In Transit') {
              // Only source warehouse was deducted; return it
              if (prod.stocks[trf.fromWarehouse] !== undefined) {
                prod.stocks[trf.fromWarehouse] += Number(line.qty);
                store.stockLedger.unshift({
                  id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
                  date: getNowFormatted(),
                  productId: prod.id,
                  warehouse: trf.fromWarehouse,
                  type: 'ADJUSTMENT_PLUS',
                  qty: Number(line.qty),
                  balanceAfter: prod.stocks[trf.fromWarehouse],
                  refNo: `CANCEL-${trf.no}`,
                  user,
                  notes: `Pengembalian stok pembatalan transfer ${trf.no}`
                });
              }
            } else if (trf.status === 'Posted') {
              // Rollback both destination and source
              if (prod.stocks[trf.toWarehouse] !== undefined) {
                prod.stocks[trf.toWarehouse] = Math.max(0, prod.stocks[trf.toWarehouse] - Number(line.qty));
              }
              if (prod.stocks[trf.fromWarehouse] !== undefined) {
                prod.stocks[trf.fromWarehouse] += Number(line.qty);
              }
              store.stockLedger.unshift({
                id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
                date: getNowFormatted(),
                productId: prod.id,
                warehouse: trf.fromWarehouse,
                type: 'ADJUSTMENT_PLUS',
                qty: Number(line.qty),
                balanceAfter: prod.stocks[trf.fromWarehouse],
                refNo: `CANCEL-${trf.no}`,
                user,
                notes: `Rollback stok asal pembatalan transfer ${trf.no}`
              });
            }
          }
        });

        // Remove from transactions list
        const txIdx = store.transactions.findIndex(t => t.no === trf.no);
        if (txIdx !== -1) store.transactions.splice(txIdx, 1);

        store.transfers.splice(idx, 1);
        addAuditLog('DELETE_TRANSFER', 'Transfer Gudang', trf.no, `Membatalkan transfer ${trf.no} (${trf.qty} unit dari ${trf.fromWarehouse} ke ${trf.toWarehouse})`);
        saveStore();
        closeModal();
        showToast('Transfer Dibatalkan', `Dokumen transfer ${trf.no} telah dihapus dan saldo stok telah dikembalikan.`);
        render();
      }

      function executeReceiveTransfer(transferId) {
        if (state.role === 'STAFF') {
          return showToast('Akses Dibatasi', 'Hanya Administrator yang memiliki wewenang untuk menerima transfer barang.', true);
        }
        const checkbox = document.getElementById('confirmReceiveCheckbox');
        if (!checkbox || !checkbox.checked) {
          return showToast('Konfirmasi Diperlukan', 'Centang kotak konfirmasi penerimaan fisik terlebih dahulu.', true);
        }

        const trf = store.transfers.find(t => t.id === transferId);
        if (!trf) return;

        trf.status = 'Posted';
        const user = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');

        // Update corresponding transaction in transactions list
        const tx = store.transactions.find(t => t.no === trf.no);
        if (tx) tx.status = 'Posted';

        // Add stocks to destination warehouse & log ledger
        (trf.lines || []).forEach(line => {
          const prod = store.products.find(p => p.id === line.productId);
          if (prod) {
            if (!prod.stocks[trf.toWarehouse]) prod.stocks[trf.toWarehouse] = 0;
            prod.stocks[trf.toWarehouse] += Number(line.qty);

            store.stockLedger.unshift({
              id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
              date: getNowFormatted(),
              productId: prod.id,
              warehouse: trf.toWarehouse,
              type: 'TRANSFER_IN',
              qty: line.qty,
              balanceAfter: prod.stocks[trf.toWarehouse],
              refNo: trf.no,
              user,
              notes: `Penerimaan transfer dari ${trf.fromWarehouse}`
            });
          }
        });

        addAuditLog('RECEIVE', 'Transfer Gudang', trf.no, `Menerima transfer ${trf.qty} unit di ${trf.toWarehouse}`);
        saveStore();
        closeModal();
        showToast('Barang Diterima', `Stok ${trf.toWarehouse} telah bertambah ${trf.qty} unit.`);
        render();
      }

      function executeSaveOpname() {
        const wh = document.getElementById('activeOpnameWh')?.value;
        const notes = document.getElementById('activeOpnameNotes')?.value || 'Opname berkala';
        const inputs = document.querySelectorAll('.opname-phys-input');
        const user = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');
        const isStaff = state.role === 'STAFF';

        let totalDiff = 0;
        let diffCount = 0;
        const opNo = generateCustomTransactionNo('opname');
        const opItems = [];

        inputs.forEach(inp => {
          const pid = inp.dataset.prodId;
          const sys = Number(inp.dataset.sys || 0);
          const phys = Number(inp.value || 0);
          const diff = phys - sys;
          const name = inp.dataset.name || '';
          const sku = inp.dataset.sku || '';
          const unit = inp.dataset.unit || 'unit';

          opItems.push({ productId: pid, name, sku, unit, sys, phys, diff });

          if (diff !== 0) {
            totalDiff += diff;
            diffCount++;
            // If admin, mutate stock and write to stock ledger immediately.
            // If staff, stock is untouched until Admin approves.
            if (!isStaff) {
              const prod = store.products.find(p => p.id === pid);
              if (prod) {
                prod.stocks[wh] = phys;
                store.stockLedger.unshift({
                  id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
                  date: getNowFormatted(),
                  productId: prod.id,
                  warehouse: wh,
                  type: diff > 0 ? 'ADJUSTMENT_PLUS' : 'ADJUSTMENT_MINUS',
                  qty: Math.abs(diff),
                  balanceAfter: phys,
                  refNo: opNo,
                  user,
                  notes: `Penyesuaian stok opname (${diff > 0 ? '+' : ''}${diff} ${prod.unit})`
                });
              }
            }
          }
        });

        const initialStatus = isStaff ? 'Menunggu Persetujuan' : 'Posted';

        store.opnames.unshift({
          id: 'OP' + Date.now(),
          transaction_no: opNo,
          no: opNo,
          date: getNowFormatted(),
          warehouse: wh,
          itemsCount: inputs.length,
          totalDiff,
          user,
          status: initialStatus,
          notes,
          items: opItems,
          createdByStaff: isStaff,
          approvedBy: isStaff ? null : user,
          approvalDate: isStaff ? null : getNowFormatted()
        });

        if (!isStaff) {
          store.transactions.unshift({
            id: 'TX' + Date.now(),
            transaction_no: opNo,
            no: opNo,
            type: 'Stok Opname',
            date: getNowFormatted(),
            warehouse: wh,
            items: inputs.length,
            qty: totalDiff,
            user,
            status: 'Posted',
            refNo: opNo,
            notes
          });
          addAuditLog('OPNAME', 'Stok Opname', opNo, `Selesai opname di ${wh} dengan ${diffCount} SKU berselisih (Total: ${totalDiff > 0 ? '+' : ''}${totalDiff} unit)`);
          saveStore();
          closeModal();
          showToast('Opname Berhasil Diposting', `Selisih stok ${wh} telah direkonsiliasi (${totalDiff > 0 ? '+' : ''}${totalDiff} unit).`);
        } else {
          addAuditLog('OPNAME_PENDING', 'Stok Opname', opNo, `Staf (${user}) mengajukan stok opname di ${wh} (Menunggu approval Admin)`);
          saveStore();
          closeModal();
          showToast('Opname Diajukan', `Sesi opname ${opNo} berhasil disimpan dengan status 'Menunggu Persetujuan' dari Admin.`);
        }
        render();
      }

      function approveOpname(opId) {
        if (state.role === 'STAFF') {
          return showToast('Akses Ditolak', 'Hanya role Admin yang berhak menyetujui stok opname.', true);
        }

        const op = store.opnames.find(x => x.id === opId);
        if (!op) return;

        if (op.status === 'Posted') {
          return showToast('Sudah Diposting', 'Sesi opname ini sudah disetujui sebelumnya.');
        }

        const adminUser = state.currentUser ? state.currentUser.name : 'Administrator';
        const wh = op.warehouse;
        let diffCount = 0;

        // Apply physical quantities to product warehouse stocks & write to stockLedger
        (op.items || []).forEach(item => {
          if (item.diff !== 0) {
            diffCount++;
            const prod = store.products.find(p => p.id === item.productId);
            if (prod) {
              if (!prod.stocks[wh]) prod.stocks[wh] = 0;
              prod.stocks[wh] = item.phys;
              store.stockLedger.unshift({
                id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
                date: getNowFormatted(),
                productId: prod.id,
                warehouse: wh,
                type: item.diff > 0 ? 'ADJUSTMENT_PLUS' : 'ADJUSTMENT_MINUS',
                qty: Math.abs(item.diff),
                balanceAfter: item.phys,
                refNo: op.no,
                user: adminUser,
                notes: `Penyesuaian stok opname (${item.diff > 0 ? '+' : ''}${item.diff} ${prod.unit}) — Diapprove Admin (Petugas opname: ${op.user})`
              });
            }
          }
        });

        op.status = 'Posted';
        op.approvedBy = adminUser;
        op.approvalDate = getNowFormatted();

        // Ensure record in transactions
        const existingTx = store.transactions.find(t => t.no === op.no);
        if (!existingTx) {
          store.transactions.unshift({
            id: 'TX' + Date.now(),
            no: op.no,
            type: 'Stok Opname',
            date: getNowFormatted(),
            warehouse: wh,
            items: op.itemsCount,
            qty: op.totalDiff,
            user: op.user,
            status: 'Posted',
            refNo: op.no,
            notes: `[Disetujui Admin: ${adminUser}] ${op.notes || ''}`
          });
        } else {
          existingTx.status = 'Posted';
        }

        addAuditLog('OPNAME_APPROVED', 'Stok Opname', op.no, `Admin (${adminUser}) menyetujui stok opname ${op.no} dari ${op.user} di ${wh} (${diffCount} SKU disesuaikan)`);
        saveStore();
        closeModal();
        showToast('Opname Disetujui', `Stok opname ${op.no} disetujui & saldo stok di ${wh} telah diperbarui.`);
        render();
      }

      function rejectOpname(opId) {
        if (state.role === 'STAFF') {
          return showToast('Akses Ditolak', 'Hanya role Admin yang berhak menolak stok opname.', true);
        }

        const op = store.opnames.find(x => x.id === opId);
        if (!op) return;

        const reason = prompt(`Masukkan alasan penolakan stok opname ${op.no}:`, 'Perhitungan fisik perlu diulang');
        if (reason === null) return; // User pressed cancel

        const adminUser = state.currentUser ? state.currentUser.name : 'Administrator';
        op.status = 'Ditolak';
        op.rejectedBy = adminUser;
        op.rejectionReason = reason;
        op.rejectionDate = getNowFormatted();

        addAuditLog('OPNAME_REJECTED', 'Stok Opname', op.no, `Admin (${adminUser}) menolak opname dari ${op.user}: "${reason}"`);
        saveStore();
        closeModal();
        showToast('Opname Ditolak', `Sesi opname ${op.no} telah ditolak. Saldo stok tidak diubah.`);
        render();

      function executeSaveEditOpname() {
        const opId = document.getElementById('editOpnameId')?.value;
        const op = store.opnames.find(x => x.id === opId);
        if (!op) return;

        const newDate = document.getElementById('editOpnameDate')?.value || op.date;
        const newNotes = document.getElementById('editOpnameNotes')?.value || '';
        const user = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');

        // 1. Revert previous stock adjustment made by this opname
        (op.items || []).forEach(it => {
          const prod = store.products.find(p => p.id === it.productId);
          if (prod && it.diff !== 0) {
            if (!prod.stocks[op.warehouse]) prod.stocks[op.warehouse] = 0;
            prod.stocks[op.warehouse] -= it.diff; // revert to original sys
          }
        });

        // 2. Read new inputs & apply new adjustment
        let newTotalDiff = 0;
        const newItems = [];
        const inputs = document.querySelectorAll('.opname-edit-phys-input');

        inputs.forEach(inp => {
          const idx = Number(inp.dataset.idx);
          const it = op.items[idx];
          const newPhys = Number(inp.value || 0);
          const newDiff = newPhys - it.sys;
          newTotalDiff += newDiff;

          newItems.push({
            productId: it.productId,
            name: it.name,
            sku: it.sku,
            unit: it.unit,
            sys: it.sys,
            phys: newPhys,
            diff: newDiff
          });

          const prod = store.products.find(p => p.id === it.productId);
          if (prod) {
            prod.stocks[op.warehouse] = newPhys;
            if (newDiff !== 0) {
              store.stockLedger.unshift({
                id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
                date: getNowFormatted(),
                productId: prod.id,
                warehouse: op.warehouse,
                type: newDiff > 0 ? 'ADJUSTMENT_PLUS' : 'ADJUSTMENT_MINUS',
                qty: Math.abs(newDiff),
                balanceAfter: newPhys,
                refNo: op.no,
                user,
                notes: `Koreksi edit stok opname (${newDiff > 0 ? '+' : ''}${newDiff} ${prod.unit})`
              });
            }
          }
        });

        // 3. Update opname record
        op.date = newDate;
        op.notes = newNotes;
        op.items = newItems;
        op.totalDiff = newTotalDiff;

        // Update in transactions list if present
        const tx = store.transactions.find(t => t.no === op.no);
        if (tx) {
          tx.date = newDate;
          tx.qty = newTotalDiff;
          tx.notes = newNotes;
        }

        addAuditLog('UPDATE', 'Stok Opname', op.no, `Memperbarui sesi opname di ${op.warehouse} (Total selisih baru: ${newTotalDiff > 0 ? '+' : ''}${newTotalDiff} unit)`);
        saveStore();
        closeModal();
        showToast('Opname Diperbarui', `Sesi ${op.no} berhasil diperbarui dan saldo fisik telah disesuaikan.`);
        render();
      }

          </div>
        `);

      function confirmExecuteDeleteOpname(opId) {
        if (state.role === 'STAFF') {
          return showToast('Akses Dibatasi', 'Staf tidak memiliki hak akses untuk menghapus sesi stok opname.', true);
        }
        const idx = store.opnames.findIndex(x => x.id === opId);
        if (idx === -1) return;

        const op = store.opnames[idx];
        const user = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');

        // Rollback stock adjustments only if opname was actually posted
        if (op.status === 'Posted') {
          (op.items || []).forEach(it => {
            const prod = store.products.find(p => p.id === it.productId);
            if (prod && it.diff !== 0) {
              if (!prod.stocks[op.warehouse]) prod.stocks[op.warehouse] = 0;
              prod.stocks[op.warehouse] -= it.diff; // revert to original sys

              store.stockLedger.unshift({
                id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
                date: getNowFormatted(),
                productId: prod.id,
                warehouse: op.warehouse,
                type: it.diff > 0 ? 'ADJUSTMENT_MINUS' : 'ADJUSTMENT_PLUS',
                qty: Math.abs(it.diff),
                balanceAfter: prod.stocks[op.warehouse],
                refNo: `CANCEL-${op.no}`,
                user,
                notes: `Rollback penghapusan opname ${op.no}`
              });
            }
          });
        }

        store.opnames.splice(idx, 1);

        // Remove from transactions list if exists
        const txIdx = store.transactions.findIndex(t => t.no === op.no);
        if (txIdx !== -1) store.transactions.splice(txIdx, 1);

        addAuditLog('DELETE', 'Stok Opname', op.no, `Menghapus sesi opname ${op.no} (${op.status}) di ${op.warehouse}`);
        saveStore();
        closeModal();
        showToast('Stok Opname Dihapus', `Sesi ${op.no} telah dihapus dari sistem.`);
        render();
      }

      function executeSaveCategory() {
        const id = document.getElementById('catFormId')?.value;
        const code = document.getElementById('catFormCode')?.value.trim().toUpperCase();
        const name = document.getElementById('catFormName')?.value.trim();
        const desc = document.getElementById('catFormDesc')?.value.trim();

        if (!name) {
          return showToast('Validasi Gagal', 'Nama kategori wajib diisi.', true);
        }

        // Duplicate name check
        const dup = store.categories.find(c => c.name.toLowerCase() === name.toLowerCase() && c.id !== id);
        if (dup) {
          return showToast('Nama Duplikat', `Kategori "${name}" sudah ada. Gunakan nama lain.`, true);
        }

        if (id) {
          const cat = store.categories.find(c => c.id === id);
          if (cat) {
            const oldName = cat.name;
            cat.code = code || name.slice(0, 3).toUpperCase();
            cat.name = name;
            cat.description = desc;

            // Synchronize product category if renamed
            if (oldName !== name) {
              store.products.forEach(p => {
                if (p.category === oldName) p.category = name;
              });
            }

            addAuditLog('UPDATE', 'Kategori Barang', cat.code, `Memperbarui kategori: ${name}`);
            showToast('Kategori Diperbarui', `Kategori "${name}" berhasil disimpan.`);
          }
        } else {
          const newId = 'CAT' + String(store.categories.length + 1).padStart(2, '0');
          const finalCode = code || name.slice(0, 3).toUpperCase();
          store.categories.push({
            id: newId,
            code: finalCode,
            name,
            description: desc
          });
          addAuditLog('CREATE', 'Kategori Barang', finalCode, `Menambahkan kategori baru: ${name}`);
          showToast('Kategori Ditambahkan', `Kategori "${name}" berhasil dibuat.`);
        }

        saveStore();
        closeModal();
        render();
      }

        const category = document.getElementById('prodFormCat')?.value;
        const unit = document.getElementById('prodFormUnit')?.value;
        const minVal = Math.max(0, Number(document.getElementById('prodFormMin')?.value) || 0);
        const active = document.getElementById('prodFormActive')?.value === 'true';

        if (!sku || !name) {
          return showToast('Validasi Gagal', 'SKU dan Nama Barang wajib diisi.', true);
        }

        // Duplicate SKU check
        const dupSku = store.products.find(p => p.sku.toLowerCase() === sku.toLowerCase() && p.id !== id);
        if (dupSku) {
          return showToast('SKU Duplikat', `SKU "${sku}" sudah digunakan oleh barang ${dupSku.name}. Gunakan SKU lain.`, true);
        }

        if (id) {
          const p = store.products.find(x => x.id === id);
          if (p) {
            p.sku = sku;
            p.name = name;
            p.category = category;
            p.unit = unit;
            p.min = minVal;
            p.minStock = minVal;
            p.active = active;
            p.photo = state.productPhoto || '';
            p.foto = state.productPhoto || '';
            addAuditLog('UPDATE', 'Master Barang', sku, `Memperbarui barang: ${name}`);
            showToast('Barang Diperbarui', `Data barang ${name} berhasil disimpan.`);
          }
        } else {
          const newId = 'P' + String(store.products.length + 1).padStart(3, '0');
          const initialStocks = {};
          store.warehouses.forEach(w => { initialStocks[w.name] = 0; });
          store.products.push({
            id: newId,
            sku,
            name,
            category,
            unit,
            min: minVal,
            minStock: minVal,
            stocks: initialStocks,
            active,
            photo: state.productPhoto || '',
            foto: state.productPhoto || ''
          });
          addAuditLog('CREATE', 'Master Barang', sku, `Menambahkan barang baru: ${name}`);
          showToast('Barang Ditambahkan', `Barang ${name} berhasil dibuat.`);
        }

        state.productPhoto = '';
        saveStore();
        closeModal();
        render();
      }

      function executeSaveEditTransaction() {
        if (state.role === 'STAFF') {
          return showToast('Akses Dibatasi', 'Staf tidak memiliki hak akses untuk mengubah transaksi.', true);
        }
        const txNo = document.getElementById('editTxNo')?.value || state.editTxTargetNo;
        const tx = store.transactions.find(t => t.no === txNo);
        if (!tx) return;

        const newDate = document.getElementById('editTxDate')?.value.trim() || state.editTxDate;
        const newWh = document.getElementById('editTxWarehouse')?.value || state.editTxWarehouse;
        const newParty = document.getElementById('editTxParty')?.value.trim() ?? state.editTxParty;
        const newRef = document.getElementById('editTxRef')?.value.trim() ?? state.editTxRef;
        const newNotes = document.getElementById('editTxNotes')?.value.trim() ?? state.editTxNotes;

        const lineProducts = (state.editTxLines || []).map(l => ({
          ...l,
          product: store.products.find(p => p.id === l.productId)
        })).filter(l => l.product && Number(l.qty) > 0);

        if (!lineProducts.length) {
          return showToast('Form Belum Lengkap', 'Tambahkan minimal 1 barang dengan kuantitas lebih dari 0.', true);
        }

        const isOut = tx.type === 'Barang Keluar';
        const isIn = tx.type === 'Barang Masuk';
        const user = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');
        const oldWh = tx.warehouse;
        const oldLines = tx.details && tx.details.length > 0
          ? tx.details
          : (tx.productId ? [{ productId: tx.productId, qty: tx.qty, name: tx.productName || 'Barang' }] : []);

        // Snapshot original stock state before rollback in case validation fails
        const originalStockSnapshot = {};
        store.products.forEach(p => {
          originalStockSnapshot[p.id] = { ...p.stocks };
        });

        // 1. Rollback old stock impact
        oldLines.forEach(l => {
          const prod = store.products.find(p => p.id === l.productId || p.sku === l.sku);
          if (prod && oldWh) {
            if (!prod.stocks[oldWh]) prod.stocks[oldWh] = 0;
            if (isIn) {
              prod.stocks[oldWh] = Math.max(0, prod.stocks[oldWh] - Number(l.qty));
            } else if (isOut) {
              prod.stocks[oldWh] += Number(l.qty);
            }
          }
        });

        // 2. Validate new outgoing stock if negative stock is rejected
        if (isOut && store.settings.rejectNegativeStock) {
          for (const line of lineProducts) {
            const avail = line.product.stocks[newWh] || 0;
            if (line.qty > avail) {
              // Restore from snapshot
              store.products.forEach(p => {
                p.stocks = { ...originalStockSnapshot[p.id] };
              });
              return showToast('Stok Tidak Mencukupi', `Barang ${line.product.name} hanya memiliki stok ${avail} ${line.product.unit} di ${newWh}.`, true);
            }
          }
        }

        // 3. Apply new stock changes & create ledger entries
        const newDetails = [];
        let newTotalQty = 0;

        lineProducts.forEach(line => {
          const qty = Number(line.qty);
          newTotalQty += qty;
          if (!line.product.stocks[newWh]) line.product.stocks[newWh] = 0;

          if (isIn) {
            line.product.stocks[newWh] += qty;
          } else if (isOut) {
            line.product.stocks[newWh] -= qty;
          }

          newDetails.push({
            productId: line.product.id,
            name: line.product.name,
            sku: line.product.sku,
            qty,
            unit: line.product.unit
          });

          store.stockLedger.unshift({
            id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
            date: getNowFormatted(),
            productId: line.product.id,
            warehouse: newWh,
            type: isIn ? 'IN' : 'OUT',
            qty,
            balanceAfter: line.product.stocks[newWh],
            refNo: tx.no,
            user,
            notes: `Penyesuaian edit transaksi ${tx.no} (${newWh})`
          });
        });

        // 4. Update transaction document
        if (newDate) {
          tx.date = newDate.includes('-')
            ? (() => {
              const parts = newDate.split('-');
              return `${parts[2]}/${parts[1]}/${parts[0]} ${new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace(':', '.')}`;
            })()
            : newDate;
        }
        tx.warehouse = newWh;
        tx.party = newParty;
        tx.refNo = newRef;
        tx.notes = newNotes;
        tx.photo = state.editTxPhoto || '';
        tx.qty = newTotalQty;
        tx.items = newDetails.length;
        tx.details = newDetails;

        addAuditLog('UPDATE_TX', tx.type, tx.no, `Memperbarui transaksi ${tx.no}: ${newDetails.length} SKU (${newTotalQty} unit) di ${newWh}`);
        saveStore();
        closeModal();
        showToast('Transaksi Berhasil Diperbarui', `Data transaksi ${tx.no} dan stok barang telah disesuaikan.`);
        render();
      }

      function confirmExecuteDeleteTransaction(txIdOrNo) {
        if (state.role === 'STAFF') {
          return showToast('Akses Dibatasi', 'Staf tidak memiliki hak akses untuk menghapus transaksi.', true);
        }
        const txIndex = store.transactions.findIndex(t => t.no === txIdOrNo || t.id === txIdOrNo);
        if (txIndex === -1) return;
        const tx = store.transactions[txIndex];
        const user = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');

        // Rollback stocks
        const lines = tx.details && tx.details.length > 0
          ? tx.details
          : (tx.productId ? [{ productId: tx.productId, qty: tx.qty, name: tx.productName || 'Barang' }] : []);

        lines.forEach(line => {
          const prod = store.products.find(p => p.id === line.productId || p.sku === line.sku);
          if (prod && tx.warehouse) {
            if (prod.stocks[tx.warehouse] === undefined) prod.stocks[tx.warehouse] = 0;
            if (tx.type === 'Barang Masuk') {
              // Rollback incoming: decrease stock
              prod.stocks[tx.warehouse] = Math.max(0, prod.stocks[tx.warehouse] - Number(line.qty));
              store.stockLedger.unshift({
                id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
                date: getNowFormatted(),
                productId: prod.id,
                warehouse: tx.warehouse,
                type: 'ADJUSTMENT_MINUS',
                qty: Number(line.qty),
                balanceAfter: prod.stocks[tx.warehouse],
                refNo: `DEL-${tx.no}`,
                user,
                notes: `Rollback penghapusan transaksi ${tx.no}`
              });
            } else if (tx.type === 'Barang Keluar') {
              // Rollback outgoing: restore stock
              prod.stocks[tx.warehouse] += Number(line.qty);
              store.stockLedger.unshift({
                id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
                date: getNowFormatted(),
                productId: prod.id,
                warehouse: tx.warehouse,
                type: 'ADJUSTMENT_PLUS',
                qty: Number(line.qty),
                balanceAfter: prod.stocks[tx.warehouse],
                refNo: `DEL-${tx.no}`,
                user,
                notes: `Rollback pengembalian stok transaksi ${tx.no}`
              });
            }
          }
        });

        store.transactions.splice(txIndex, 1);
        addAuditLog('DELETE_TX', tx.type, tx.no, `Menghapus transaksi ${tx.no} (${tx.qty} unit di ${tx.warehouse}) & rollback saldo stok`);
        saveStore();
        closeModal();
        showToast('Transaksi Dihapus', `Transaksi ${tx.no} telah dihapus dan saldo stok telah disesuaikan.`);
        render();
      }

        state.editTransferDate = trf.date && trf.date.includes('/')
          ? (() => {

          })()
          : (trf.date || new Date().toISOString().split('T')[0]);
        state.editTransferRef = trf.refNo || '';

      function executeSaveEditTransfer() {
        if (state.role === 'STAFF') {
          return showToast('Akses Dibatasi', 'Staf tidak memiliki hak akses untuk mengubah transfer.', true);
        }
        const trfId = document.getElementById('editTrfId')?.value || state.editTransferId;
        const trf = store.transfers.find(t => t.id === trfId);
        if (!trf) return;

        const newFromWh = document.getElementById('editTrfFrom')?.value || state.editTransferFrom;
        const newToWh = document.getElementById('editTrfTo')?.value || state.editTransferTo;
        const newDate = document.getElementById('editTrfDate')?.value.trim() || state.editTransferDate;
        const newRef = document.getElementById('editTrfRef')?.value.trim() ?? state.editTransferRef;
        const newNotes = document.getElementById('editTrfNotes')?.value.trim() ?? state.editTransferNotes;

        if (newFromWh === newToWh) {
          return showToast('Rute Tidak Valid', 'Gudang asal dan gudang tujuan tidak boleh sama.', true);
        }

        const lineItems = (state.editTransferLines || []).map(l => ({
          ...l,
          product: store.products.find(p => p.id === l.productId)
        })).filter(l => l.product && Number(l.qty) > 0);

        if (!lineItems.length) {
          return showToast('Form Belum Lengkap', 'Tambahkan minimal 1 barang dengan kuantitas lebih dari 0.', true);
        }

        const user = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');
        const oldFromWh = trf.fromWarehouse;
        const oldToWh = trf.toWarehouse;
        const oldStatus = trf.status;
        const oldLines = trf.lines && trf.lines.length > 0 ? trf.lines : [{ productId: trf.productId, qty: trf.qty }];

        // Snapshot original stocks
        const originalStockSnapshot = {};
        store.products.forEach(p => {
          originalStockSnapshot[p.id] = { ...p.stocks };
        });

        // 1. Rollback old transfer stocks
        oldLines.forEach(l => {
          const prod = store.products.find(p => p.id === l.productId || p.sku === l.sku);
          if (prod) {
            if (!prod.stocks[oldFromWh]) prod.stocks[oldFromWh] = 0;
            if (!prod.stocks[oldToWh]) prod.stocks[oldToWh] = 0;

            if (oldStatus === 'In Transit') {
              prod.stocks[oldFromWh] += Number(l.qty);
            } else if (oldStatus === 'Posted') {
              prod.stocks[oldFromWh] += Number(l.qty);
              prod.stocks[oldToWh] = Math.max(0, prod.stocks[oldToWh] - Number(l.qty));
            }
          }
        });

        // 2. Validate new stock in newFromWh
        if (store.settings.rejectNegativeStock) {
          for (const line of lineItems) {
            const avail = line.product.stocks[newFromWh] || 0;
            if (line.qty > avail) {
              // Revert to snapshot
              store.products.forEach(p => {
                p.stocks = { ...originalStockSnapshot[p.id] };
              });
              return showToast('Stok Tidak Mencukupi', `Barang ${line.product.name} hanya memiliki stok ${avail} ${line.product.unit} di ${newFromWh}.`, true);
            }
          }
        }

        // 3. Apply new transfer stock adjustments
        const newLinesToSave = [];
        let newTotalQty = 0;

        lineItems.forEach(line => {
          const qty = Number(line.qty);
          newTotalQty += qty;
          if (!line.product.stocks[newFromWh]) line.product.stocks[newFromWh] = 0;
          if (!line.product.stocks[newToWh]) line.product.stocks[newToWh] = 0;

          if (oldStatus === 'In Transit') {
            line.product.stocks[newFromWh] -= qty;
            store.stockLedger.unshift({
              id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
              date: getNowFormatted(),
              productId: line.product.id,
              warehouse: newFromWh,
              type: 'TRANSFER_OUT',
              qty,
              balanceAfter: line.product.stocks[newFromWh],
              refNo: trf.no,
              user,
              notes: `Koreksi edit transfer dikirim ke ${newToWh}`
            });
          } else if (oldStatus === 'Posted') {
            line.product.stocks[newFromWh] -= qty;
            line.product.stocks[newToWh] += qty;
            store.stockLedger.unshift({
              id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
              date: getNowFormatted(),
              productId: line.product.id,
              warehouse: newFromWh,
              type: 'TRANSFER_OUT',
              qty,
              balanceAfter: line.product.stocks[newFromWh],
              refNo: trf.no,
              user,
              notes: `Koreksi edit transfer dipindahkan ke ${newToWh}`
            });
            store.stockLedger.unshift({
              id: 'L' + (Date.now() + 1) + Math.random().toString(36).substr(2, 4),
              date: getNowFormatted(),
              productId: line.product.id,
              warehouse: newToWh,
              type: 'TRANSFER_IN',
              qty,
              balanceAfter: line.product.stocks[newToWh],
              refNo: trf.no,
              user,
              notes: `Koreksi edit transfer diterima dari ${newFromWh}`
            });
          }

          newLinesToSave.push({
            productId: line.product.id,
            name: line.product.name,
            sku: line.product.sku,
            qty,
            unit: line.product.unit
          });
        });

        // 4. Update transfer document
        if (newDate) {
          trf.date = newDate.includes('-')
            ? (() => {
              const parts = newDate.split('-');
              return `${parts[2]}/${parts[1]}/${parts[0]} ${new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace(':', '.')}`;
            })()
            : newDate;
        }
        trf.fromWarehouse = newFromWh;
        trf.toWarehouse = newToWh;
        trf.refNo = newRef;
        trf.notes = newNotes;
        trf.photo = state.editTransferPhoto || '';
        trf.qty = newTotalQty;
        trf.items = newLinesToSave.length;
        trf.lines = newLinesToSave;

        // 5. Update linked transaction in store.transactions
        const tx = store.transactions.find(t => t.no === trf.no);
        if (tx) {
          tx.warehouse = `${newFromWh} → ${newToWh}`;
          tx.fromWarehouse = newFromWh;
          tx.toWarehouse = newToWh;
          tx.date = trf.date;
          tx.refNo = newRef;
          tx.notes = newNotes;
          tx.photo = state.editTransferPhoto || '';
          tx.qty = newTotalQty;
          tx.items = newLinesToSave.length;
          tx.details = newLinesToSave;
        }

        addAuditLog('UPDATE_TRANSFER', 'Transfer Gudang', trf.no, `Memperbarui transfer ${trf.no}: ${newLinesToSave.length} SKU (${newTotalQty} unit) dari ${newFromWh} ke ${newToWh}`);
        saveStore();
        closeModal();
        showToast('Transfer Berhasil Diperbarui', `Surat jalan ${trf.no} dan mutasi stok antar gudang telah disesuaikan.`);
        render();
      }

      function executeSaveDamaged() {
        const wh = document.getElementById('dmgWarehouse')?.value;
        const prodId = document.getElementById('dmgProduct')?.value;
        const qty = Number(document.getElementById('dmgQty')?.value || 0);
        const issueType = document.getElementById('dmgIssueType')?.value;
        const action = document.getElementById('dmgAction')?.value;
        const refNo = document.getElementById('dmgRef')?.value.trim();
        const notes = document.getElementById('dmgNotes')?.value.trim();

        if (qty <= 0) {
          return showToast('Validasi Gagal', 'Jumlah unit rusak harus lebih dari 0.', true);
        }

        const prod = store.products.find(p => p.id === prodId);
        if (!prod) {
          return showToast('Pilih Barang', 'Pilih barang yang rusak terlebih dahulu.', true);
        }

        const currentStock = prod.stocks[wh] || 0;
        if (qty > currentStock) {
          return showToast('Stok Tidak Cukup', `Stok ${prod.name} di ${wh} hanya ada ${currentStock} ${prod.unit}.`, true);
        }

        // Deduct from stock
        prod.stocks[wh] -= qty;

        const dmgNo = generateCustomTransactionNo('damaged');
        const user = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');

        const newDmg = {
          id: 'DMG' + Date.now(),
          transaction_no: dmgNo,
          no: dmgNo,
          date: getNowFormatted(),
          productId: prod.id,
          productName: prod.name,
          sku: prod.sku,
          warehouse: wh,
          qty,
          unit: prod.unit,
          issueType,
          action,
          refNo,
          notes,
          photo: state.damagedPhoto || '',
          user,
          status: 'Dikonfirmasi'
        };

        if (!store.damagedItems) store.damagedItems = [];
        store.damagedItems.unshift(newDmg);

        // Ledger Entry
        store.stockLedger.unshift({
          id: 'L' + Date.now() + Math.random().toString(36).substr(2, 4),
          date: getNowFormatted(),
          productId: prod.id,
          warehouse: wh,
          type: 'DAMAGE_OUT',
          qty,
          balanceAfter: prod.stocks[wh],
          refNo: dmgNo,
          user,
          notes: `Barang bermasalah: ${issueType} (${action})`
        });

        addAuditLog('DAMAGE', 'Barang Bermasalah', dmgNo, `Mencatat ${qty} ${prod.unit} ${prod.name} bermasalah di ${wh}: ${issueType}`);
        state.damagedPhoto = '';
        saveStore();
        closeModal();
        showToast('Laporan Tersimpan', `Barang bermasalah ${dmgNo} berhasil dicatat. Stok ${wh} telah dipotong.`);
        render();
      }

              productId: prod.id,
              warehouse: item.warehouse,

              refNo: `CANCEL-${item.no}`,
              user: state.currentUser ? state.currentUser.name : 'Admin',
              notes: `Pembatalan laporan barang rusak ${item.no}`

      function executeSaveWarehouse() {
        const id = document.getElementById('whFormId')?.value;
        const code = document.getElementById('whFormCode')?.value.trim().toUpperCase();
        const name = document.getElementById('whFormName')?.value.trim();
        const address = document.getElementById('whFormAddress')?.value.trim();
        const active = document.getElementById('whFormActive') ? document.getElementById('whFormActive').value === 'true' : true;

        if (!code || !name) {
          return showToast('Validasi Gagal', 'Kode dan Nama Gudang wajib diisi.', true);
        }

        // Check duplicate name or code
        const dup = store.warehouses.find(w => (w.name.toLowerCase() === name.toLowerCase() || w.code.toLowerCase() === code.toLowerCase()) && w.id !== id);
        if (dup) {
          return showToast('Duplikasi Terdeteksi', `Gudang dengan nama "${name}" atau kode "${code}" sudah terdaftar.`, true);
        }

        if (id) {
          const w = store.warehouses.find(x => x.id === id);
          if (w) {
            const oldName = w.name;
            w.code = code;
            w.name = name;
            w.address = address;
            w.active = active;

            // Synchronize product stocks keys if renamed
            if (oldName !== name) {
              store.products.forEach(p => {
                if (p.stocks[oldName] !== undefined) {
                  p.stocks[name] = p.stocks[oldName];
                  delete p.stocks[oldName];
                }
              });

              // Synchronize user assignments
              store.users.forEach(u => {
                if (u.warehouse === oldName) u.warehouse = name;
              });

              // Synchronize state current warehouse
              if (state.transactionWarehouse === oldName) state.transactionWarehouse = name;
            }

            addAuditLog('UPDATE', 'Gudang', code, `Memperbarui data gudang: ${name}`);
            showToast('Gudang Diperbarui', `Data gudang ${name} berhasil disimpan.`);
          }
        } else {
          const newId = 'W' + String(store.warehouses.length + 1).padStart(2, '0');
          store.warehouses.push({ id: newId, code, name, address, active: true });
          store.products.forEach(p => {
            if (p.stocks[name] === undefined) p.stocks[name] = 0;
          });
          addAuditLog('CREATE', 'Gudang', code, `Menambahkan gudang baru: ${name}`);
          showToast('Gudang Ditambahkan', `Gudang ${name} berhasil dibuat.`);
        }

        saveStore();
        closeModal();
        render();
      }

      async function migrateSheetsNow() {
        if (!isAppsScriptEnv && !storedSheetsUrl) {
          return showToast('Perhatian', 'Simpan URL Web App Google Sheets terlebih dahulu.', true);
        }
        showToast('Memproses Migrasi…', 'Memperbarui database dan memisahkan kolom stok per gudang…');

        if (isAppsScriptEnv) {
          google.script.run
            .withSuccessHandler(function (res) {
              if (typeof res === 'string') {
                try { res = JSON.parse(res); } catch (e) { }
              }
              if (res && res.status === 'success') {
                showToast('Migrasi Berhasil!', res.message || 'Seluruh kolom berhasil dipisahkan menjadi kolom baru.');
                syncFromGoogleSheets(true);
              } else {
                showToast('Gagal Migrasi', res?.message || 'Gagal memigrasikan database.', true);
              }
            })
            .withFailureHandler(function (err) {
              showToast('Koneksi Gagal', 'Gagal memigrasikan database: ' + (err?.message || err), true);
            })
            .apiMigrate();
          return;
        }

        try {
          const url = storedSheetsUrl + (storedSheetsUrl.includes('?') ? '&' : '?') + 'action=migrate&t=' + Date.now();
          const res = await fetch(url);
          const data = await res.json();
          if (data && data.status === 'success') {
            showToast('Migrasi Berhasil!', data.message || 'Seluruh kolom JSON berhasil dipisahkan menjadi kolom baru.');
            syncFromGoogleSheets(true);
          } else {

          }
