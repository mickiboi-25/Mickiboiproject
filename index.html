  <style>
    :root {
      /* Brand Palette: Refined Modern Emerald */
      --brand-50: #ecfdf5;
      --brand-100: #d1fae5;
      --brand-200: #a7f3d0;
      --brand-500: #10b981;
      --brand-600: #059669;
      --brand-700: #047857;
      --brand-800: #065f46;
      --brand-900: #064e3b;

      /* Neutral Palette: Crisp Slate for modern SaaS look */
      --ink-950: #0f172a;
      --ink-800: #1e293b;
      --ink-600: #475569;
      --ink-500: #64748b;
      --ink-300: #cbd5e1;
      --ink-200: #e2e8f0;
      --ink-100: #f1f5f9;
      --ink-50: #f8fafc;

      /* Surfaces */
      --surface: #ffffff;
      --canvas: #f8fafc;

      /* Functional Accents */
      --danger: #ef4444;
      --danger-soft: #fef2f2;
      --warning: #f59e0b;
      --warning-soft: #fffbeb;
      --info: #3b82f6;
      --info-soft: #eff6ff;

      /* Shadows: Smooth modern layered shadows */
      --shadow-sm: 0 1px 3px 0 rgba(15, 23, 42, 0.05), 0 1px 2px -1px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.04);

      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 16px;
      --sidebar: 256px;
      --topbar: 68px;
      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    [data-theme="dark"],
    body.dark-mode {
      --brand-50: rgba(16, 185, 129, 0.1);
      --brand-100: rgba(16, 185, 129, 0.18);
      --brand-200: rgba(16, 185, 129, 0.28);
      --brand-500: #10b981;
      --brand-600: #059669;
      --brand-700: #34d399;
      --brand-800: #6ee7b7;

      --ink-950: #f8fafc;
      --ink-800: #e2e8f0;
      --ink-600: #94a3b8;
      --ink-500: #64748b;
      --ink-300: #334155;
      --ink-200: #1e293b;
      --ink-100: #131d2e;
      --ink-50: #0b111c;

      --surface: #0f172a;
      --canvas: #090d14;

      --danger: #f87171;
      --danger-soft: rgba(239, 68, 68, 0.14);
      --warning: #fbbf24;
      --warning-soft: rgba(245, 158, 11, 0.14);
      --info: #60a5fa;
      --info-soft: rgba(59, 130, 246, 0.14);

      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.4);
      --shadow-md: 0 6px 16px 0 rgba(0, 0, 0, 0.5);
    }

    [data-theme="dark"] .icon-btn {
      background: var(--surface);
      border-color: var(--ink-200);
      color: var(--ink-800);
    }

    [data-theme="dark"] .btn-secondary {
      background: var(--surface);
      border-color: var(--ink-200);
      color: var(--ink-800);
    }

    [data-theme="dark"] .btn-secondary:hover {
      background: var(--ink-100);
      border-color: var(--ink-300);
      color: var(--ink-950);
    }

    [data-theme="dark"] .topbar {
      background: rgba(15, 23, 42, 0.94);
      border-color: var(--ink-200);
    }

    [data-theme="dark"] .card {
      background: var(--surface);
      border-color: var(--ink-200);
    }

    [data-theme="dark"] .control {
      background: var(--ink-100);
      color: var(--ink-950);
      border-color: var(--ink-200);
    }

    [data-theme="dark"] .control:focus {
      background: var(--surface);
      border-color: var(--brand-500);
    }

    [data-theme="dark"] .filters {
      background: var(--surface);
      border-color: var(--ink-200);
    }

    [data-theme="dark"] .table-wrap table thead th {
      background: var(--ink-100);
      color: var(--ink-500);
      border-color: var(--ink-200);
    }

    [data-theme="dark"] .table-wrap table tbody tr:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    [data-theme="dark"] .badge.success,
    body.dark-mode .badge.success {
      color: #34d399;
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(52, 211, 153, 0.3);
    }

    [data-theme="dark"] .badge.warning,
    body.dark-mode .badge.warning {
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(251, 191, 36, 0.3);
    }

    [data-theme="dark"] .badge.danger,
    body.dark-mode .badge.danger {
      color: #f87171;
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(248, 113, 113, 0.3);
    }

    [data-theme="dark"] .badge.info,
    body.dark-mode .badge.info {
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.15);
      border-color: rgba(96, 165, 250, 0.3);
    }

    [data-theme="dark"] .badge.neutral,
    body.dark-mode .badge.neutral {
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.12);
    }

    [data-theme="dark"] .receipt {
      background: var(--ink-100);
      border-color: var(--ink-200);
    }

    [data-theme="dark"] .item-search,
    [data-theme="dark"] .line-item {
      background: var(--ink-100);
      border-color: var(--ink-200);
    }

    [data-theme="dark"] .product-suggestions-dropdown {
      background: var(--surface);
      border-color: var(--ink-200);
    }

    [data-theme="dark"] .product-suggestion-item:hover {
      background: var(--brand-100);
    }

    /* Dark Mode Components & High Contrast Overrides */
    [data-theme="dark"] .modal,
    body.dark-mode .modal {
      background: var(--surface) !important;
      color: var(--ink-950) !important;
      border: 1px solid var(--ink-200) !important;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .75) !important;
    }

    [data-theme="dark"] .modal-header,
    body.dark-mode .modal-header {
      background: var(--surface) !important;
      border-bottom: 1px solid var(--ink-200) !important;
      color: var(--ink-950) !important;
    }

    [data-theme="dark"] .modal-header h2,
    body.dark-mode .modal-header h2 {
      color: var(--ink-950);
    }

    [data-theme="dark"] .modal-header p,
    body.dark-mode .modal-header p {
      color: var(--ink-500) !important;
    }

    [data-theme="dark"] .modal-body,
    body.dark-mode .modal-body {
      background: var(--surface) !important;
      color: var(--ink-950) !important;
    }

    [data-theme="dark"] .modal-footer,
    body.dark-mode .modal-footer {
      background: var(--surface) !important;
      border-top: 1px solid var(--ink-200) !important;
      color: var(--ink-950) !important;
    }

    /* Notice Boxes in Dark Mode */
    [data-theme="dark"] .notice,
    body.dark-mode .notice {
      background: rgba(255, 255, 255, 0.05) !important;
      color: #e2e8f0 !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
    }

    [data-theme="dark"] .notice.warning,
    body.dark-mode .notice.warning {
      color: #fde68a !important;
      background: rgba(245, 158, 11, 0.16) !important;
      border: 1px solid rgba(253, 230, 138, 0.35) !important;
    }

    [data-theme="dark"] .notice.warning svg,
    [data-theme="dark"] .notice.warning .icon,
    body.dark-mode .notice.warning svg,
    body.dark-mode .notice.warning .icon {
      color: #fbbf24 !important;
      stroke: #fbbf24 !important;
    }

    [data-theme="dark"] .notice.warning div,
    [data-theme="dark"] .notice.warning span,
    [data-theme="dark"] .notice.warning strong,
    body.dark-mode .notice.warning div,
    body.dark-mode .notice.warning span,
    body.dark-mode .notice.warning strong {
      color: #fde68a !important;
    }

    [data-theme="dark"] .notice.info,
    body.dark-mode .notice.info {
      color: #93c5fd !important;
      background: rgba(59, 130, 246, 0.16) !important;
      border: 1px solid rgba(147, 197, 253, 0.35) !important;
    }

    [data-theme="dark"] .notice.info svg,
    [data-theme="dark"] .notice.info .icon,
    body.dark-mode .notice.info svg,
    body.dark-mode .notice.info .icon {
      color: #60a5fa !important;
      stroke: #60a5fa !important;
    }

    [data-theme="dark"] .notice.info div,
    [data-theme="dark"] .notice.info span,
    [data-theme="dark"] .notice.info strong,
    body.dark-mode .notice.info div,
    body.dark-mode .notice.info span,
    body.dark-mode .notice.info strong {
      color: #93c5fd !important;
    }

    [data-theme="dark"] .notice.danger,
    body.dark-mode .notice.danger {
      color: #fca5a5 !important;
      background: rgba(239, 68, 68, 0.16) !important;
      border: 1px solid rgba(252, 165, 165, 0.35) !important;
    }

    [data-theme="dark"] .notice.danger svg,
    [data-theme="dark"] .notice.danger .icon,
    body.dark-mode .notice.danger svg,
    body.dark-mode .notice.danger .icon {
      color: #f87171 !important;
      stroke: #f87171 !important;
    }

    [data-theme="dark"] .notice.danger div,
    [data-theme="dark"] .notice.danger span,
    [data-theme="dark"] .notice.danger strong,
    body.dark-mode .notice.danger div,
    body.dark-mode .notice.danger span,
    body.dark-mode .notice.danger strong {
      color: #fca5a5 !important;
    }

    /* Badges in Dark Mode */
    [data-theme="dark"] .badge.success,
    body.dark-mode .badge.success {
      color: #34d399 !important;
      background: rgba(16, 185, 129, 0.18) !important;
      border: 1px solid rgba(52, 211, 153, 0.28) !important;
    }

    [data-theme="dark"] .badge.warning,
    body.dark-mode .badge.warning {
      color: #fbbf24 !important;
      background: rgba(245, 158, 11, 0.18) !important;
      border: 1px solid rgba(251, 191, 36, 0.28) !important;
    }

    [data-theme="dark"] .badge.danger,
    body.dark-mode .badge.danger {
      color: #f87171 !important;
      background: rgba(239, 68, 68, 0.18) !important;
      border: 1px solid rgba(248, 113, 113, 0.28) !important;
    }

    [data-theme="dark"] .badge.info,
    body.dark-mode .badge.info {
      color: #60a5fa !important;
      background: rgba(59, 130, 246, 0.18) !important;
      border: 1px solid rgba(96, 165, 250, 0.28) !important;
    }

    [data-theme="dark"] .badge.neutral,
    body.dark-mode .badge.neutral {
      color: #cbd5e1 !important;
      background: rgba(255, 255, 255, 0.08) !important;
      border: 1px solid rgba(255, 255, 255, 0.14) !important;
    }

    /* Action Buttons in Dark Mode */
    [data-theme="dark"] .btn-danger,
    body.dark-mode .btn-danger {
      color: #fca5a5 !important;
      background: rgba(226, 92, 106, 0.15) !important;
      border: 1px solid rgba(226, 92, 106, 0.35) !important;
    }

    [data-theme="dark"] .btn-danger:hover,
    body.dark-mode .btn-danger:hover {
      color: #ffffff !important;
      background: rgba(226, 92, 106, 0.28) !important;
      border-color: rgba(226, 92, 106, 0.5) !important;
    }

    [data-theme="dark"] .btn-ghost,
    body.dark-mode .btn-ghost {
      color: var(--ink-800) !important;
    }

    [data-theme="dark"] .btn-ghost:hover,
    body.dark-mode .btn-ghost:hover {
      background: var(--ink-100) !important;
      color: #fff !important;
    }

    /* Toast in Dark Mode */
    [data-theme="dark"] .toast,
    body.dark-mode .toast {
      background: var(--surface) !important;
      border-color: var(--ink-200) !important;
      color: var(--ink-950) !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6) !important;
    }

    [data-theme="dark"] .toast strong,
    body.dark-mode .toast strong {
      color: var(--ink-950) !important;
    }

    [data-theme="dark"] .toast p,
    body.dark-mode .toast p {
      color: var(--ink-500) !important;
    }

    [data-theme="dark"] .toast.toast-error,
    body.dark-mode .toast.toast-error {
      background: #251417 !important;
      border-color: rgba(226, 92, 106, 0.4) !important;
    }

    /* Form Controls & Dropdowns in Dark Mode */
    [data-theme="dark"] select option,
    body.dark-mode select option {
      background: var(--surface);
      color: var(--ink-950);
    }

    /* Modal Sub-cards & Nested Containers in Dark Mode */
    [data-theme="dark"] .modal div[style*="background:#fafbfb"],
    [data-theme="dark"] .modal div[style*="background: #fafbfb"],
    [data-theme="dark"] .modal div[style*="background:#fafafa"],
    [data-theme="dark"] .modal div[style*="background: #fafafa"],
    body.dark-mode .modal div[style*="background:#fafbfb"],
    body.dark-mode .modal div[style*="background: #fafbfb"],
    body.dark-mode .modal div[style*="background:#fafafa"],
    body.dark-mode .modal div[style*="background: #fafafa"] {
      background: var(--ink-100) !important;
      border-color: var(--ink-200) !important;
      color: var(--ink-950) !important;
    }

    [data-theme="dark"] .modal div[style*="background:#fffbeb"],
    body.dark-mode .modal div[style*="background:#fffbeb"] {
      background: rgba(245, 158, 11, 0.12) !important;
      border-color: rgba(253, 230, 138, 0.28) !important;
    }

    [data-theme="dark"] .modal div[style*="background:#eff6ff"],
    body.dark-mode .modal div[style*="background:#eff6ff"] {
      background: rgba(59, 130, 246, 0.12) !important;
      border-color: rgba(147, 197, 253, 0.28) !important;
    }

    [data-theme="dark"] .modal div[style*="background:#fff"],
    [data-theme="dark"] .modal div[style*="background: #fff"],
    body.dark-mode .modal div[style*="background:#fff"],
    body.dark-mode .modal div[style*="background: #fff"] {
      background: var(--surface) !important;
      border-color: var(--ink-200) !important;
      color: var(--ink-950) !important;
    }

    [data-theme="dark"] .modal div[style*="background:var(--bg-subtle, #f8fafc)"],
    body.dark-mode .modal div[style*="background:var(--bg-subtle, #f8fafc)"] {
      background: var(--ink-100) !important;
      border-color: var(--ink-200) !important;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html {
      scroll-behavior: smooth;
      text-rendering: optimizeLegibility;
    }

    body {
      margin: 0;
      color: var(--ink-800);
      background: var(--canvas);
      font-family: var(--font);
      font-size: 13.5px;
      line-height: 1.5;
      letter-spacing: -0.011em;
      transition: background-color .2s ease, color .2s ease;
    }

    h1, h2, h3, h4, h5, h6 {
      color: var(--ink-950);
      letter-spacing: -0.022em;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    svg {
      display: block;
    }

    .icon {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .hidden {
      display: none !important;
    }

    .app-shell {
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 50;
      width: var(--sidebar);
      padding: 24px 16px;
      color: #e2e8f0;
      background: linear-gradient(180deg, #0b1c17 0%, #061410 100%);
      border-right: 1px solid rgba(255, 255, 255, 0.07);
      display: flex;
      flex-direction: column;
      transition: transform .25s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px 24px;
      color: #fff;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      color: #064e3b;
      background: #34d399;
      box-shadow: 0 4px 14px rgba(52, 211, 153, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .brand-copy strong {
      display: block;
      font-size: 17.5px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -.02em;
    }

    .brand-copy span {
      display: block;
      margin-top: 3px;
      color: #94a3b8;
      font-size: 11.5px;
      letter-spacing: 0.01em;
    }

    .nav-scroll {
      overflow-y: auto;
      flex: 1;
      padding-right: 0;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    .sidebar,
    .nav-scroll {
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    .sidebar::-webkit-scrollbar,
    .nav-scroll::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    .nav-label {
      margin: 18px 10px 8px;
      color: #64748b;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .nav-item {
      width: 100%;
      min-height: 40px;
      border: 0;
      border-radius: 9px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      gap: 11px;
      color: #94a3b8;
      background: transparent;
      text-align: left;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s ease;
    }

    .nav-item:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, .06);
    }

    .nav-item.active {
      color: #ffffff;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.16);
      box-shadow: inset 3px 0 0 #10b981;
    }

    .nav-item.active .icon {
      color: #34d399;
    }

    .nav-item .icon {
      width: 18px;
      height: 18px;
      flex: none;
      color: #64748b;
      transition: color .15s ease;
    }

    .nav-item:hover .icon {
      color: #cbd5e1;
    }

    .nav-item span {
      flex: 1;
      font-weight: 500;
    }

    .nav-badge {
      flex: none !important;
      padding: 1px 7px;
      border-radius: 99px;
      color: #064e3b;
      background: #a7f3d0;
      font-size: 10.5px;
      font-weight: 700;
    }

    .sidebar-footer {
      margin-top: 16px;
      padding: 13px;
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 12px;
      background: rgba(0, 0, 0, .08);
    }

    .sidebar-footer .sync {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: #70dbb4;
      box-shadow: 0 0 0 4px rgba(112, 219, 180, .1);
    }

    .sidebar-footer small {
      display: block;
      margin-top: 5px;
      color: #88a99e;
    }

    .main {
      min-height: 100vh;
      margin-left: var(--sidebar);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 35;
      height: var(--topbar);
      padding: 0 32px;
      display: flex;
      align-items: center;
      gap: 18px;
      border-bottom: 1px solid var(--ink-200);
      background: rgba(255, 255, 255, .88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .mobile-menu {
      display: none;
    }

    .page-heading {
      min-width: 0;
      flex: 1;
    }

    .page-heading h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -.025em;
      color: var(--ink-950);
    }

    .page-heading p {
      margin: 3px 0 0;
      color: var(--ink-500);
      font-size: 12.5px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--ink-200);
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: var(--ink-600);
      background: var(--surface);
      box-shadow: 0 1px 2px 0 rgba(15, 23, 42, 0.04);
      transition: all .15s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .icon-btn:hover {
      border-color: var(--brand-500);
      color: var(--brand-600);
      background: var(--brand-50);
      transform: translateY(-1px);
      box-shadow: 0 3px 8px 0 rgba(15, 23, 42, 0.06);
    }

    .icon-btn:active {
      transform: translateY(1px);
    }

    .icon-btn .icon {
      width: 18px;
      height: 18px;
    }

    .notification {
      position: relative;
    }

    .notification-badge {
      position: absolute;
      right: -3px;
      top: -4px;
      min-width: 17px;
      height: 17px;
      padding: 0 4px;
      display: grid;
      place-items: center;
      border: 2px solid var(--surface);
      border-radius: 99px;
      color: #fff;
      background: var(--danger);
      font-size: 9.5px;
      font-weight: 700;
    }

    .profile-button {
      border: 1px solid transparent;
      padding: 4px 10px 4px 6px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: all .15s ease;
    }

    .profile-button:hover {
      background: var(--ink-100);
      border-color: var(--ink-200);
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--brand-500) 0%, var(--brand-700) 100%);
      font-weight: 700;
      font-size: 13.5px;
      box-shadow: 0 2px 6px rgba(5, 150, 105, 0.25);
    }

    .profile-copy strong,
    .profile-copy span {
      display: block;
    }

    .profile-copy strong {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-950);
    }

    .profile-copy span {
      color: var(--ink-500);
      font-size: 11px;
    }

    .profile-button .chevron {
      width: 14px;
      height: 14px;
      color: var(--ink-500);
    }

    .content {
      max-width: 1560px;
      margin: 0 auto;
      padding: 26px 30px 70px;
    }

    .page-toolbar {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .toolbar-copy h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      letter-spacing: -.45px;
    }

    .toolbar-copy p {
      margin: 5px 0 0;
      color: var(--ink-600);
    }

    .toolbar-actions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: var(--font);
      font-weight: 600;
      font-size: 13.5px;
      letter-spacing: -0.01em;
      white-space: nowrap;
      user-select: none;
      cursor: pointer;
      position: relative;
      transition: all .15s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px) scale(0.99);
    }

    .btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--brand-500);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: .5;
      box-shadow: none !important;
      transform: none !important;
    }

    .btn .icon {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .btn-primary {
      color: #ffffff;
      background: var(--brand-600);
      border-color: rgba(4, 120, 87, 0.9);
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.06), 0 4px 12px 0 rgba(5, 150, 105, 0.22), inset 0 1px 0 0 rgba(255, 255, 255, 0.22);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--brand-700);
      border-color: var(--brand-800);
      box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.08), 0 6px 18px 0 rgba(5, 150, 105, 0.32), inset 0 1px 0 0 rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    .btn-secondary {
      color: var(--ink-800);
      border-color: var(--ink-200);
      background: var(--surface);
      box-shadow: 0 1px 2px 0 rgba(15, 23, 42, 0.04);
    }

    .btn-secondary:hover:not(:disabled) {
      border-color: var(--ink-300);
      background: var(--ink-50);
      color: var(--ink-950);
      box-shadow: 0 2px 6px 0 rgba(15, 23, 42, 0.06);
      transform: translateY(-1px);
    }

    .btn-danger {
      color: #ef4444;
      border-color: #fecaca;
      background: var(--surface);
      box-shadow: 0 1px 2px 0 rgba(239, 68, 68, 0.04);
    }

    .btn-danger:hover:not(:disabled) {
      background: var(--danger-soft);
      border-color: #fca5a5;
      color: #dc2626;
      transform: translateY(-1px);
    }

    .btn-ghost {
      color: var(--ink-600);
      background: transparent;
      border-color: transparent;
    }

    .btn-ghost:hover:not(:disabled) {
      color: var(--brand-600);
      background: var(--brand-50);
    }

    .btn-sm {
      min-height: 34px;
      padding: 0 12px;
      font-size: 12px;
      border-radius: 8px;
    }

    .btn-lg {
      min-height: 48px;
      padding: 0 22px;
      font-size: 14.5px;
      border-radius: 12px;
    }

    .btn-block {
      width: 100%;
    }

    .card {
      border: 1px solid var(--ink-200);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      transition: box-shadow .2s ease, border-color .2s ease;
    }

    .card-header {
      min-height: 56px;
      padding: 15px 20px;
      border-bottom: 1px solid var(--ink-100);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-title {
      min-width: 0;
    }

    .card-title h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.015em;
      color: var(--ink-950);
    }

    .card-title p {
      margin: 3px 0 0;
      color: var(--ink-500);
      font-size: 12px;
      line-height: 1.4;
    }

    .card-body {
      padding: 19px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat-card {
      position: relative;
      overflow: hidden;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stat-top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .stat-label {
      color: var(--ink-500);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: .03em;
      text-transform: uppercase;
    }

    .stat-icon {
      width: 38px;
      height: 38px;
      flex: none;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: var(--accent, var(--brand-600));
      background: var(--accent-soft, var(--brand-50));
    }

    .stat-icon .icon {
      width: 19px;
      height: 19px;
    }

    .stat-value {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -.03em;
      font-variant-numeric: tabular-nums;
      color: var(--ink-950);
      line-height: 1.15;
    }

    .stat-meta {
      position: relative;
      z-index: 1;
      margin-top: 6px;
      color: var(--ink-500);
      font-size: 12px;
      line-height: 1.4;
    }

    .trend {
      font-weight: 700;
    }

    .trend.up {
      color: var(--brand-600);
    }

    .trend.down {
      color: var(--danger);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.65fr) minmax(310px, .85fr);
      gap: 18px;
    }

    .stack {
      display: grid;
      gap: 18px;
    }

    .chart-wrap {
      height: 260px;
      position: relative;
    }

    .chart-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .chart-grid {
      stroke: #edf0ef;
      stroke-width: 1;
    }

    .chart-label {
      fill: #82908c;
      font-size: 10px;
    }

    .chart-line-in {
      fill: none;
      stroke: #299979;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .chart-line-out {
      fill: none;
      stroke: #e0a33d;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .chart-area {
      fill: url(#areaGradient);
      opacity: .6;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--ink-600);
      font-size: 11px;
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend i {
      width: 8px;
      height: 8px;
      border-radius: 99px;
    }

    .alert-list,
    .activity-list {
      display: grid;
    }

    .alert-row,
    .activity-row {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px 0;
      border-bottom: 1px solid var(--ink-100);
    }

    .alert-row:first-child,
    .activity-row:first-child {
      padding-top: 0;
    }

    .alert-row:last-child,
    .activity-row:last-child {
      padding-bottom: 0;
      border: 0;
    }

    .product-thumb {
      width: 39px;
      height: 39px;
      flex: none;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: var(--brand-700);
      background: var(--brand-50);
      font-size: 11px;
      font-weight: 800;
    }

    .row-main {
      min-width: 0;
      flex: 1;
    }

    .row-main strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }

    .row-main small {
      display: block;
      margin-top: 2px;
      color: var(--ink-500);
      font-size: 10px;
    }

    .row-value {
      flex: none;
      text-align: right;
    }

    .row-value strong {
      display: block;
      font-size: 12px;
    }

    .row-value small {
      display: block;
      color: var(--ink-500);
      font-size: 10px;
    }

    .activity-icon {
      width: 35px;
      height: 35px;
      flex: none;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--brand-600);
      background: var(--brand-50);
    }

    .activity-icon .icon {
      width: 16px;
      height: 16px;
    }

    .bars {
      display: grid;
      gap: 15px;
    }

    .bar-item {
      display: grid;
      grid-template-columns: minmax(90px, 1fr) 2fr 44px;
      align-items: center;
      gap: 10px;
    }

    .bar-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      font-weight: 600;
    }

    .bar-track {
      height: 8px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--ink-100);
    }

    .bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--brand-500), #73ccb0);
    }

    .bar-value {
      color: var(--ink-600);
      text-align: right;
      font-size: 11px;
      font-weight: 700;
    }

    .filters {
      padding: 14px;
      margin-bottom: 14px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .field {
      min-width: 0;
    }

    .field.grow {
      flex: 1;
      min-width: 220px;
    }

    .field label {
      display: block;
      margin: 0 0 6px;
      color: var(--ink-700);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .input-wrap {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      width: 17px;
      height: 17px;
      color: var(--ink-500);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .control {
      width: 100%;
      height: 42px;
      padding: 9px 13px;
      border: 1px solid var(--ink-200);
      border-radius: 9px;
      color: var(--ink-950);
      background: var(--surface);
      font-family: var(--font);
      font-size: 13.5px;
      outline: none;
      box-shadow: 0 1px 2px 0 rgba(15, 23, 42, 0.04);
      transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
    }

    .control.with-icon {
      padding-left: 38px;
    }

    .control:focus {
      border-color: var(--brand-500);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.16);
      background: var(--surface);
    }

    .control::placeholder {
      color: #94a3b8;
    }

    textarea.control {
      height: auto;
      min-height: 86px;
      resize: vertical;
    }

    select.control {
      padding-right: 32px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--ink-100);
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: var(--ink-500);
      background: var(--ink-50);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      white-space: nowrap;
      border-bottom: 1px solid var(--ink-200);
    }

    td {
      font-size: 13px;
      color: var(--ink-800);
      line-height: 1.45;
    }

    tbody tr {
      transition: background-color .15s ease;
    }

    tbody tr:hover {
      background: var(--ink-50);
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .cell-product {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 180px;
    }

    .cell-product strong,
    .cell-product span {
      display: block;
    }

    .cell-product strong {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-950);
    }

    .cell-product span {
      color: var(--ink-500);
      font-size: 11.5px;
      margin-top: 2px;
    }

    .qty {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--ink-950);
    }

    .muted {
      color: var(--ink-500);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 24px;
      padding: 2px 10px;
      border-radius: 9999px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .badge.success {
      color: #065f46;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
    }

    .badge.warning {
      color: #92400e;
      background: #fffbeb;
      border: 1px solid #fde68a;
    }

    .badge.danger {
      color: #991b1b;
      background: #fef2f2;
      border: 1px solid #fecaca;
    }

    .badge.info {
      color: #1e40af;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
    }

    .badge.neutral {
      color: #475569;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
    }

    .table-footer {
      padding: 12px 15px;
      border-top: 1px solid var(--ink-100);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--ink-500);
      font-size: 11px;
    }

    .pagination {
      display: flex;
      gap: 5px;
    }

    .page-btn {
      width: 30px;
      height: 30px;
      border: 1px solid var(--ink-200);
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--ink-600);
      background: #fff;
    }

    .page-btn.active {
      color: #fff;
      border-color: var(--brand-600);
      background: var(--brand-600);
    }

    .form-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 18px;
      align-items: start;
    }

    .form-section {
      padding: 19px;
    }

    .form-section+.form-section {
      border-top: 1px solid var(--ink-100);
    }

    .section-heading {
      margin-bottom: 15px;
    }

    .section-heading h3 {
      margin: 0;
      font-size: 14px;
    }

    .section-heading p {
      margin: 3px 0 0;
      color: var(--ink-500);
      font-size: 11px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .span-2 {
      grid-column: span 2;
    }

    .item-editor {
      border: 1px solid var(--ink-200);
      border-radius: 11px;
      overflow: hidden;
    }

    .item-search {
      padding: 12px;
      background: #fafbfb;
      border-bottom: 1px solid var(--ink-200);
      position: relative;
    }

    .product-search-box {
      position: relative;
      width: 100%;
    }

    .product-suggestions-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      z-index: 99;
      max-height: 250px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid var(--ink-200);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(11, 24, 20, 0.12);
    }

    .product-suggestion-item {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--ink-100);
      transition: background .12s;
    }

    .product-suggestion-item:last-child {
      border-bottom: 0;
    }

    .product-suggestion-item:hover,
    .product-suggestion-item.active {
      background: #e8f7f1;
    }

    .product-suggestion-info {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .product-suggestion-info strong {
      font-size: 12px;
      color: var(--ink-900);
    }

    .product-suggestion-info small {
      font-size: 10px;
      color: var(--ink-500);
      margin-top: 1px;
    }

    .product-suggestion-stock {
      text-align: right;
      font-size: 11px;
      color: var(--ink-600);
      white-space: nowrap;
    }

    .product-suggestion-stock strong {
      font-size: 12px;
      color: var(--brand-700);
    }

    .line-item {
      padding: 12px;
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 100px 110px 36px;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--ink-100);
    }

    .line-item:last-child {
      border-bottom: 0;
    }

    .line-product strong,
    .line-product small {
      display: block;
    }

    .line-product strong {
      font-size: 12px;
    }

    .line-product small {
      margin-top: 2px;
      color: var(--ink-500);
      font-size: 10px;
    }

    .mini-label {
      display: none;
      color: var(--ink-500);
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .remove-line {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--danger);
      background: var(--danger-soft);
      transition: background .15s;
    }

    .remove-line:hover {
      background: #ffd6da;
    }

    .summary-card {
      position: sticky;
      top: calc(var(--topbar) + 18px);
      overflow: hidden;
    }

    .summary-hero {
      padding: 20px;
      color: #fff;
      background: linear-gradient(135deg, #176b57, #0f4a3d);
    }

    .summary-hero small {
      color: #b9ddd1;
    }

    .summary-hero strong {
      display: block;
      margin-top: 4px;
      font-size: 21px;
    }

    .summary-list {
      padding: 8px 18px;
    }

    .summary-row {
      padding: 11px 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--ink-100);
      font-size: 12px;
    }

    .summary-row:last-child {
      border: 0;
    }

    .summary-row span {
      color: var(--ink-500);
    }

    .summary-actions {
      padding: 14px 18px 18px;
      display: grid;
      gap: 8px;
    }

    .notice {
      margin-bottom: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 11px;
    }

    .notice.info {
      color: #285b9b;
      background: var(--info-soft);
    }

    .notice.warning {
      color: #8a570d;
      background: var(--warning-soft);
    }

    .notice.danger {
      color: #a82e3b;
      background: var(--danger-soft);
    }

    .notice .icon {
      width: 17px;

    .report-grid {

    .report-card:hover {

    .report-icon {
      width: 42px;
      height: 42px;

      place-items: center;

      background: var(--brand-50);

    .report-icon .icon {

      height: 20px;
    }

    .report-card h3 {
      margin: 0;
      font-size: 14px;
    }

    .report-card p {
      min-height: 36px;
      margin: 6px 0 14px;
      color: var(--ink-600);
      font-size: 11px;
    }

    .report-link {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--brand-600);
      font-size: 11px;
      font-weight: 800;

    .warehouse-grid {

      gap: 14px;

    .warehouse-card {
      padding: 18px;
    }

    .warehouse-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

    .warehouse-icon {

      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: var(--brand-600);

    .warehouse-icon .icon {

      height: 21px;

    .warehouse-card h3 {
      margin: 14px 0 3px;
      font-size: 14px;
    }

    .warehouse-card>p {
      min-height: 35px;
      margin: 0;
      color: var(--ink-500);
      font-size: 11px;
    }

    .warehouse-stats {
      margin-top: 15px;
      padding-top: 14px;
      border-top: 1px solid var(--ink-100);
      display: flex;
      gap: 24px;
    }

    .warehouse-stats strong,
    .warehouse-stats span {
      display: block;
    }

    .warehouse-stats strong {
      font-size: 16px;
    }

    .warehouse-stats span {
      color: var(--ink-500);
      font-size: 10px;
    }

    .empty-state {
      padding: 45px 20px;
      text-align: center;
    }

    .empty-icon {
      width: 54px;
      height: 54px;
      margin: 0 auto 12px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: var(--brand-600);
      background: var(--brand-50);
    }

    .empty-icon .icon {
      width: 26px;
      height: 26px;
    }

    .empty-state h3 {
      margin: 0;
      font-size: 14px;
    }

    .empty-state p {
      max-width: 380px;
      margin: 6px auto 0;
      color: var(--ink-500);
      font-size: 11px;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(11, 24, 20, .52);
      opacity: 0;
      visibility: hidden;
      transition: .2s;
    }

    .overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      position: fixed;
      z-index: 90;
      left: 50%;
      top: 50%;
      width: min(600px, calc(100% - 28px));
      max-height: calc(100vh - 28px);
      overflow: auto;
      border-radius: 17px;
      background: #fff;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .2);
      transform: translate(-50%, -46%) scale(.98);
      opacity: 0;
      visibility: hidden;
      transition: .2s;
    }

    .modal.modal-lg {
      width: min(840px, calc(100% - 28px));
    }

    .modal.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      visibility: visible;
    }

    .modal-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--ink-100);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      background: #fff;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 17px;
    }

    .modal-header p {
      margin: 3px 0 0;
      color: var(--ink-500);
      font-size: 11px;
    }

    .modal-body {
      padding: 20px;
    }

    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--ink-100);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      background: #fafbfb;
      position: sticky;
      bottom: 0;
      z-index: 2;
    }

    .success-visual {
      width: 70px;
      height: 70px;
      margin: 5px auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--brand-500);
      box-shadow: 0 0 0 10px var(--brand-50);
    }

    .success-visual .icon {
      width: 34px;
      height: 34px;
    }

    .success-copy {
      text-align: center;
    }

    .success-copy h2 {
      margin: 0;
      font-size: 20px;
    }

    .success-copy p {
      margin: 6px 0 18px;
      color: var(--ink-500);
    }

    .receipt {
      padding: 14px;
      border: 1px dashed var(--ink-300);
      border-radius: 10px;
      background: #fafbfb;
    }

    .receipt-row {
      padding: 6px 0;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      font-size: 11px;
    }

    .receipt-row span {
      color: var(--ink-500);
    }

    .toast-stack {
      position: fixed;
      z-index: 110;
      right: 20px;
      bottom: 20px;
      display: grid;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      width: min(360px, calc(100vw - 28px));
      padding: 12px 14px;
      border: 1px solid var(--ink-200);
      border-radius: 11px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #fff;
      box-shadow: var(--shadow-md);
      animation: toast-in .25s ease;
      pointer-events: auto;
    }

    .toast.toast-error {
      border-color: #fbd0d5;
      background: #fffbfb;
    }

    .toast.toast-error .icon {
      color: var(--danger);
    }

    .toast .icon {
      width: 18px;
      height: 18px;
      flex: none;
      color: var(--brand-600);
      margin-top: 1px;
    }

    .toast strong {
      display: block;
      font-size: 12px;
    }

    .toast p {
      margin: 2px 0 0;
      color: var(--ink-500);
      font-size: 10px;
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
    }

    /* Login Screen & Auth UI */
    /* 2-Section Modern AI & Professional Login Layout */
    .login-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.16) 0%, transparent 45%),
                  radial-gradient(circle at 85% 85%, rgba(5, 150, 105, 0.18) 0%, transparent 50%),
                  #07130f;
      color: #fff;
      overflow-y: auto;
    }

    .login-split-card {
      width: 100%;
      max-width: 1040px;
      min-height: 590px;
      border-radius: 24px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      box-shadow: 0 30px 90px -10px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.08);
      animation: modal-in 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    /* Section Kiri: Penjelasan & Kegunaan Aplikasi */
    .login-info-section {
      background: linear-gradient(155deg, #072e23 0%, #031c15 55%, #01110c 100%);
      padding: 44px 40px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .login-info-section::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(16, 185, 129, 0.16) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    .login-info-glow {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.3) 0%, transparent 70%);
      top: -60px;
      right: -60px;
      filter: blur(40px);
      pointer-events: none;
    }

    .login-info-content {
      position: relative;
      z-index: 2;
    }

    .ai-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 99px;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(52, 211, 153, 0.3);
      font-size: 11px;
      font-weight: 700;
      color: #34d399;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .ai-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulseDot 2s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .login-info-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .login-info-brand .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #10b981, #047857);
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
    }

    .login-info-brand h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      line-height: 1.1;
    }

    .login-info-brand span {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      display: block;
    }

    .login-info-title {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.6px;
      margin: 0 0 10px;
      color: #ffffff;
    }

    .login-info-title .gradient-text {
      background: linear-gradient(90deg, #6ee7b7, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-info-desc {
      font-size: 13px;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.8);
      margin: 0 0 24px;
    }

    /* Micro Feature Cards */
    .login-feature-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .login-feature-item {
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .login-feature-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(52, 211, 153, 0.35);

    .login-feature-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .login-feature-icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: #34d399;
      display: grid;
      place-items: center;
      flex: none;

    .login-feature-icon .icon {
      width: 14px;
      height: 14px;
    }

    .login-feature-item strong {
      font-size: 12.5px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }

    .login-feature-item p {
      margin: 0;
      font-size: 11px;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.72);
    }

    /* Bottom Trust Pills */
    .login-info-footer {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);

    .login-trust-pill {
      display: inline-flex;

      gap: 6px;

      color: rgba(255, 255, 255, 0.85);

    .login-trust-pill .icon {
      width: 13px;
      height: 13px;
      color: #34d399;

    .login-form-section {
      padding: 44px 40px;
      display: flex;
      flex-direction: column;

      position: relative;

    /* ==========================================================================
       FULLSCREEN & IMMERSIVE MOBILE UX (RESPONSIVE & TACTILE)
       ========================================================================== */
    .fullscreen-toggle {
      position: relative;
      transition: all .2s cubic-bezier(.4, 0, .2, 1);
    }

    .fullscreen-toggle:hover {
      border-color: var(--brand-500);
      color: var(--brand-600);
    }

    .fullscreen-toggle.active {
      background: var(--brand-50) !important;
      border-color: var(--brand-500) !important;

      box-shadow: 0 0 0 3px rgba(33, 135, 109, .15);
    }

    [data-theme="dark"] .fullscreen-toggle.active,
    body.dark-mode .fullscreen-toggle.active {
      background: var(--brand-100) !important;
      border-color: var(--brand-500) !important;
      color: var(--brand-700) !important;
      box-shadow: 0 0 0 3px rgba(51, 184, 149, .22);

    .sidebar-fs-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 12px;

      border: 1px solid rgba(255, 255, 255, .12);

      font-weight: 500;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all .2s;
    }

    .sidebar-fs-btn:hover,
    .sidebar-fs-btn.active {

      border-color: rgba(255, 255, 255, .3);
      color: #fff;
    }

    .sidebar-fs-btn .icon {
      width: 16px;
      height: 16px;
    }

    /* Fullscreen state styles */
    html.is-fullscreen,
    body.is-fullscreen,
    html.pseudo-fullscreen,
    body.pseudo-fullscreen {
      height: 100dvh !important;
      max-height: 100dvh !important;
      overflow: hidden !important;
    }

    .is-fullscreen .main,
    .pseudo-fullscreen .main {
      height: 100dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }

    /* Mobile Ergonomics & Anti-Slop Tactile Feedback */
    .btn,
    .icon-btn,
    .nav-item,
    .bottom-item,
    .tab-btn {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .btn:active,
    .icon-btn:active,
    .bottom-item:active {
      transform: scale(.95);
      transition: transform .08s ease;
    }

    /* Sleek thin scrollbar for mobile & desktop */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--ink-300);
      border-radius: 99px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--ink-500);
    }

    [data-theme="dark"] ::-webkit-scrollbar-thumb,
    body.dark-mode ::-webkit-scrollbar-thumb {
      background: var(--ink-200);
    }

    @media (max-width: 900px) {

      .is-fullscreen .topbar,
      .pseudo-fullscreen .topbar {
        padding-top: max(4px, env(safe-area-inset-top, 0px)) !important;
        height: calc(56px + env(safe-area-inset-top, 0px)) !important;
      }

      .is-fullscreen .mobile-bottom-nav,
      .pseudo-fullscreen .mobile-bottom-nav {
        padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)) !important;
        height: calc(62px + env(safe-area-inset-bottom, 0px)) !important;
      }
    }

    /* Utility print visibility */
    .print-only {
      display: none !important;
    }

    @media print {
      @page {
        size: auto;
        margin: 10mm 12mm;
      }

      /* Hide web application chrome and interactive elements */
      .sidebar,
      .topbar,
      .page-toolbar,
      .toolbar-actions,
      .filters,
      .stats-grid,
      .mobile-bottom-nav,
      .no-print,
      button,
      .btn,
      .icon-btn,
      .toast-container,
      .sheets-sync-banner,
      #sheetsSyncBanner,
      .input-wrap,
      .product-search-box,
      .pagination {
        display: none !important;
      }

      /* Base layout resets */
      html,
      body {
        background: #ffffff !important;
        color: #0f172a !important;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif !important;
        font-size: 9pt !important;
        line-height: 1.4 !important;
        margin: 0 !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .main {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
      }

      .content {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      .card {
        box-shadow: none !important;
        border: none !important;
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
        break-inside: auto !important;
        page-break-inside: auto !important;
      }

      .card-header {
        display: none !important;
      }

      /* Print only elements */
      .print-only {
        display: block !important;

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'stokkita_inventory_app_v2';
      const rupiah = new Intl.NumberFormat('id-ID');
      const icon = (name, className = 'icon') => `<svg class="${className}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

      // Data Awal Bersih (Bebas dari Data Demo)
      const defaultData = {
        categories: [],
        products: [],
        warehouses: [
          { id: 'W01', code: 'GDG-01', name: 'Gudang Utama', address: '', active: true }
        ],
        users: [
          { id: 'U01', username: 'admin', code: 'ADM', name: 'Administrator', role: 'ADMIN', warehouse: 'Semua Gudang', password: 'admin', active: true, lastLogin: '' }
        ],
        transactions: [],
        damagedItems: [],
        transfers: [],
        opnames: [],
        stockLedger: [],
        auditLogs: [],
        settings: {
          businessName: 'StokKita Inventori',
          phone: '',
          address: '',
          timezone: 'Asia/Jakarta (WIB)',
          rejectNegativeStock: true,
          autoLogoutEnabled: true,
          autoLogoutMinutes: 15,
          geminiApiKey: '',
          geminiModel: 'gemini-2.5-flash'
        }
      };

      // Inisialisasi Data Store Langsung dari Database Cloud (Tanpa Menyimpan Database di LocalStorage)
      function loadStore() {
        try {
          // Bersihkan cache data demo lama dari localStorage jika ada
          localStorage.removeItem(STORAGE_KEY);
        } catch (e) { }

        return JSON.parse(JSON.stringify(defaultData));
      }

      const store = loadStore();

      const SHEETS_URL_KEY = 'stokkita_sheets_url_v2';

      // Google Sheets Realtime State & Environment Detection
      const isAppsScriptEnv = (typeof google !== 'undefined' && google && google.script && typeof google.script.run !== 'undefined');
      const defaultSheetsUrl = 'https://script.google.com/macros/s/AKfycbz_SAMPLE_DEPLOYMENT_ID/exec';
      let storedSheetsUrl = '';
      try {
        storedSheetsUrl = (localStorage.getItem(SHEETS_URL_KEY) || (store.settings && store.settings.googleSheetsUrl) || '').trim();
      } catch (e) { }

      let currentSheetsStatus = (isAppsScriptEnv || storedSheetsUrl) ? 'idle' : 'unconfigured';
      let lastSheetsSyncTime = null;
      let sheetsSyncTimer = null;

      function parseDateTimeToSort(str) {
        if (!str) return 0;
        if (typeof str === 'number') return str;
        const s = String(str).trim();
        const dmyMatch = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})(?:\s+(\d{1,2})[:\.](\d{1,2})(?:[:\.](\d{1,2}))?)?/);
        if (dmyMatch) {
          const day = parseInt(dmyMatch[1], 10);
          const month = parseInt(dmyMatch[2], 10) - 1;
          const year = parseInt(dmyMatch[3], 10);
          const hour = dmyMatch[4] ? parseInt(dmyMatch[4], 10) : 0;
          const min = dmyMatch[5] ? parseInt(dmyMatch[5], 10) : 0;
          const sec = dmyMatch[6] ? parseInt(dmyMatch[6], 10) : 0;
          return new Date(year, month, day, hour, min, sec).getTime();
        }
        const ymdMatch = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})(?:\s+(\d{1,2})[:\.](\d{1,2})(?:[:\.](\d{1,2}))?)?/);
        if (ymdMatch) {
          const year = parseInt(ymdMatch[1], 10);
          const month = parseInt(ymdMatch[2], 10) - 1;
          const day = parseInt(ymdMatch[3], 10);
          const hour = ymdMatch[4] ? parseInt(ymdMatch[4], 10) : 0;
          const min = ymdMatch[5] ? parseInt(ymdMatch[5], 10) : 0;
          const sec = ymdMatch[6] ? parseInt(ymdMatch[6], 10) : 0;
          return new Date(year, month, day, hour, min, sec).getTime();
        }
        const fallback = new Date(s).getTime();
        return isNaN(fallback) ? 0 : fallback;
      }

      function sortLatestFirst(list) {
        if (!Array.isArray(list)) return [];
        return [...list].sort((a, b) => {
          const timeA = parseDateTimeToSort(a.date || a.time || a.createdAt || a.approvalDate || '');
          const timeB = parseDateTimeToSort(b.date || b.time || b.createdAt || b.approvalDate || '');
          if (timeA !== timeB) return timeB - timeA;
          return String(b.transaction_no || b.no || b.id || '').localeCompare(String(a.transaction_no || a.no || a.id || ''), undefined, { numeric: true });
        });
      }

      function updateSheetsStatusUI() {
        const dot = document.getElementById('sheetsStatusDot');
        const text = document.getElementById('sheetsStatusText');
        const syncEl = document.getElementById('syncTime');
        const refreshBtn = document.getElementById('topRefreshBtn');
        if (refreshBtn) {
          if (currentSheetsStatus === 'syncing') {
            refreshBtn.classList.add('spinning');
          } else {
            refreshBtn.classList.remove('spinning');
          }
        }
        if (!dot || !text) return;

        dot.className = 'sheets-status-dot';
        if (!isAppsScriptEnv && !storedSheetsUrl) {
          dot.classList.add('error');
          text.textContent = 'Hubungkan Sheets';
          if (syncEl) syncEl.textContent = 'Mode Lokal (Google Sheets Belum Terhubung)';
        } else if (currentSheetsStatus === 'syncing') {
          dot.classList.add('syncing');
          text.textContent = 'Menyinkronkan…';
          if (syncEl) syncEl.textContent = 'Menyinkronkan ke Google Spreadsheet…';
        } else if (currentSheetsStatus === 'connected' || currentSheetsStatus === 'idle') {
          dot.classList.add('connected');
          if (isAppsScriptEnv) {
            text.textContent = lastSheetsSyncTime ? `Cloud (${lastSheetsSyncTime})` : 'Cloud Aktif';
            if (syncEl) syncEl.textContent = `Tersinkron Langsung Google Apps Script ${lastSheetsSyncTime || ''}`;
          } else {
            text.textContent = lastSheetsSyncTime ? `Sheets (${lastSheetsSyncTime})` : 'Sheets Aktif';
            if (syncEl) syncEl.textContent = `Tersinkron Google Sheets ${lastSheetsSyncTime || ''}`;
          }
        } else if (currentSheetsStatus === 'error') {
          dot.classList.add('error');
          text.textContent = 'Gagal Sinkron';
          if (syncEl) syncEl.textContent = 'Gagal terhubung ke Google Sheets. Periksa kembali URL database Anda.';
        }
      }

      function applyFetchedSpreadsheetData(d, isManual) {
        if (!d) return;
        if (Array.isArray(d.categories)) {
          store.categories = d.categories.map(c => ({
            ...c,
            description: c.description || c.desc || ''
          }));
        }
        if (Array.isArray(d.warehouses) && d.warehouses.length > 0) {
          store.warehouses = d.warehouses;
        }
        if (Array.isArray(d.products)) {
          store.products = d.products.map(p => {
            const min = p.min !== undefined ? Number(p.min) : (p.minStock !== undefined ? Number(p.minStock) : 0);
            const active = p.active !== undefined ? (p.active === true || p.active === 'true' || p.active === 1 || p.active === '1') : true;
            return {
              ...p,
              min,
              minStock: min,
              active,
              stocks: (p.stocks && typeof p.stocks === 'object') ? p.stocks : {}
            };
          });
        }
        if (Array.isArray(d.users) && d.users.length > 0) {
          store.users = d.users.map(u => ({
            ...u,
            role: String(u.role || 'STAFF').trim().toUpperCase(),
            username: String(u.username || '').trim().toLowerCase(),
            active: u.active !== undefined ? (u.active === true || u.active === 'true' || u.active === 1 || u.active === '1') : true
          }));
        }
        if (Array.isArray(d.transactions)) {
          store.transactions = sortLatestFirst(d.transactions.map(t => {
            const no = t.transaction_no || t.no || '';
            return { ...t, transaction_no: no, no };
          }));
        }
        if (Array.isArray(d.transfers)) {
          store.transfers = sortLatestFirst(d.transfers.map(tr => {
            const no = tr.transaction_no || tr.no || '';
            return { ...tr, transaction_no: no, no };
          }));
        }
        if (Array.isArray(d.opnames)) {
          store.opnames = sortLatestFirst(d.opnames.map(op => {
            const no = op.transaction_no || op.no || '';
            return {
              ...op,
              transaction_no: no,
              no,
              itemsCount: op.itemsCount !== undefined ? op.itemsCount : (op.itemsChecked || (op.items ? op.items.length : 0)),
              totalDiff: op.totalDiff !== undefined ? op.totalDiff : (op.differenceTotal || 0),
              items: op.items || op.lines || []
            };
          }));
        }
        if (Array.isArray(d.damagedItems)) {
          store.damagedItems = sortLatestFirst(d.damagedItems.map(dmg => {
            const no = dmg.transaction_no || dmg.no || '';
            return { ...dmg, transaction_no: no, no };
          }));
        }
        if (Array.isArray(d.stockLedger)) store.stockLedger = sortLatestFirst(d.stockLedger);
        if (Array.isArray(d.auditLogs)) store.auditLogs = sortLatestFirst(d.auditLogs);
        if (d.settings && typeof d.settings === 'object' && Object.keys(d.settings).length) {
          store.settings = { ...store.settings, ...d.settings };
        }

        currentSheetsStatus = 'connected';
        const now = new Date();
        lastSheetsSyncTime = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        updateSheetsStatusUI();

        // Seluruh data kini disimpan di Google Sheets, tidak lagi disimpan ke localStorage
        if (isManual) showToast('Sinkronisasi Sukses', 'Seluruh data berhasil diambil langsung dari database Google Spreadsheet.');
        render();
      }

      async function syncFromGoogleSheets(isManual = false) {
        if (!isAppsScriptEnv && !storedSheetsUrl) {
          if (isManual) openSheetsConfigModal();
          return;
        }

        currentSheetsStatus = 'syncing';
        updateSheetsStatusUI();

        // Jika berjalan langsung di dalam Web App Google Apps Script
        if (isAppsScriptEnv) {
          google.script.run
            .withSuccessHandler(function (result) {
              if (typeof result === 'string') {
                try { result = JSON.parse(result); } catch (e) { }
              }
              if (result && result.status === 'success' && result.data) {
                applyFetchedSpreadsheetData(result.data, isManual);
              } else {
                currentSheetsStatus = 'error';
                updateSheetsStatusUI();
                if (isManual) showToast('Koneksi Gagal', result?.message || 'Gagal memuat data dari Spreadsheet.', true);
              }
            })
            .withFailureHandler(function (err) {
              console.warn('Gagal memuat dari Google Apps Script:', err);
              currentSheetsStatus = 'error';
              updateSheetsStatusUI();
              if (isManual) showToast('Koneksi Gagal', 'Gagal memuat: ' + (err?.message || err), true);
            })
            .apiReadAll();
          return;
        }

        // Jika berjalan di browser lokal/eksternal via HTTP Fetch
        try {
          const fetchUrl = storedSheetsUrl + (storedSheetsUrl.includes('?') ? '&' : '?') + 'action=readAll&t=' + Date.now();
          const response = await fetch(fetchUrl);
          const result = await response.json();

          if (result && result.status === 'success' && result.data) {
            applyFetchedSpreadsheetData(result.data, isManual);
          } else {
            throw new Error(result?.message || 'Data tidak valid');
          }
        } catch (err) {
          console.warn('Gagal memuat dari Google Sheets:', err);
          currentSheetsStatus = 'error';
          updateSheetsStatusUI();
          if (isManual) {
            const errStr = err.toString();
            const isCorsOrAuth = errStr.includes('Unexpected token') || errStr.includes('Failed to fetch') || errStr.includes('NetworkError');
            const msg = isCorsOrAuth
              ? 'Tidak dapat mengakses Google Sheets. Pastikan deployment Web App diatur ke "Who has access: Anyone (Siapa saja)".'
              : 'Tidak dapat menghubungi Google Sheets. Periksa URL Web App Anda.';
            showToast('Koneksi Gagal', msg, true);
          }
        }
      }

      function triggerGoogleSheetsSync() {
        if (!isAppsScriptEnv && !storedSheetsUrl) return;
        currentSheetsStatus = 'syncing';
        updateSheetsStatusUI();

        clearTimeout(sheetsSyncTimer);
        sheetsSyncTimer = setTimeout(async () => {
          // Jika berjalan di dalam Google Apps Script langsung
          if (isAppsScriptEnv) {
            google.script.run
              .withSuccessHandler(function (res) {
                currentSheetsStatus = 'connected';
                const now = new Date();
                lastSheetsSyncTime = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                updateSheetsStatusUI();
              })
              .withFailureHandler(function (err) {
                console.error('Gagal menyimpan via google.script.run:', err);
                currentSheetsStatus = 'error';
                updateSheetsStatusUI();
              })
              .apiSaveAll(JSON.stringify(store));
            return;
          }

          // Jika via HTTP fetch (eksternal)
          try {
            await fetch(storedSheetsUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'saveAll', data: store })
            });

            currentSheetsStatus = 'connected';
            const now = new Date();
            lastSheetsSyncTime = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            updateSheetsStatusUI();
          } catch (err) {
            console.error('Gagal menyimpan ke Google Sheets:', err);
            currentSheetsStatus = 'error';
            updateSheetsStatusUI();
          }
        }, 600);
      }

      function syncGranularTransaction(transaction, ledgerEntries) {
        if (!isAppsScriptEnv && !storedSheetsUrl) return;

        const payload = {
          action: 'appendTransaction',
          data: {
            transaction,
            ledgerEntries: ledgerEntries || []
          }
        };

        if (isAppsScriptEnv) {
          google.script.run
            .withSuccessHandler(function(res) {
              if (res && res.status === 'success') {
                currentSheetsStatus = 'connected';
                const now = new Date();
                lastSheetsSyncTime = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                updateSheetsStatusUI();
              }
            })
            .withFailureHandler(function(err) {
              console.warn('Granular sync gagal, fallback ke queue saveAll:', err);
              triggerGoogleSheetsSync();
            })
            .apiAppendTransaction(payload.data);
          return;
        }

        if (storedSheetsUrl) {
          fetch(storedSheetsUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          })
          .then(r => r.json())
          .then(res => {
            if (res && res.status === 'success') {
              currentSheetsStatus = 'connected';
              const now = new Date();
              lastSheetsSyncTime = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
              updateSheetsStatusUI();
            }
          })
          .catch(err => {
            console.warn('Granular fetch gagal, fallback ke saveAll:', err);
            triggerGoogleSheetsSync();
          });
        }
      }

      // Generator Nomor Transaksi Kustom
      function generateCustomTransactionNo(type, dateInput = null) {
        const settings = store.settings || {};
        let prefix = 'TRX';
        let counter = 1;

        if (type === 'in' || type === 'incoming') {
          prefix = settings.txPrefixIn || 'IN';
          counter = (store.transactions || []).filter(t => (t.type || '').toLowerCase().includes('masuk')).length + 1;
        } else if (type === 'out' || type === 'outgoing') {
          prefix = settings.txPrefixOut || 'OUT';
          counter = (store.transactions || []).filter(t => (t.type || '').toLowerCase().includes('keluar')).length + 1;
        } else if (type === 'transfer') {
          prefix = settings.txPrefixTransfer || 'TRF';
          counter = (store.transfers || []).length + 1;
        } else if (type === 'opname') {
          prefix = settings.txPrefixOpname || 'SO';
          counter = (store.opnames || []).length + 1;
        } else if (type === 'damaged') {
          prefix = settings.txPrefixDamaged || 'DMG';
          counter = (store.damagedItems || []).length + 1;
        }

        const d = dateInput ? new Date(dateInput) : new Date();
        const validD = isNaN(d.getTime()) ? new Date() : d;
        const YYYY = String(validD.getFullYear());
        const MM = String(validD.getMonth() + 1).padStart(2, '0');
        const DD = String(validD.getDate()).padStart(2, '0');
        const YYYYMMDD = `${YYYY}${MM}${DD}`;
        const XXXX = String(counter).padStart(4, '0');

        const pattern = settings.txNumberFormat || '[PREFIX]-YYYYMMDD-XXXX';

        return pattern
          .replace('[PREFIX]', prefix)
          .replace('YYYYMMDD', YYYYMMDD)
          .replace('YYYY', YYYY)
          .replace('MM', MM)
          .replace('DD', DD)
          .replace('XXXX', XXXX);
      }

      function getStaffAssignedWarehouse() {

      function getProductWarehouseStock(product, warehouse = 'Semua Gudang') {
        if (!product || !product.stocks || typeof product.stocks !== 'object') return 0;
        if (!warehouse || warehouse === 'Semua Gudang') {
          return Object.values(product.stocks).reduce((sum, qty) => sum + Number(qty || 0), 0);
        }
        if (product.stocks[warehouse] !== undefined) return Number(product.stocks[warehouse]) || 0;
        const targetClean = String(warehouse).trim().toLowerCase();
        for (const [k, v] of Object.entries(product.stocks)) {
          if (String(k).trim().toLowerCase() === targetClean) {
            return Number(v) || 0;
          }
        }
        return 0;
      }

      // Helper Functions
      function totalStock(product, warehouse = 'Semua Gudang') {
        return getProductWarehouseStock(product, warehouse);
      }

      function escapeHtml(str) {
        return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function getProductMin(product) {
        if (product && product.min !== undefined && product.min !== null && product.min !== '' && !isNaN(Number(product.min))) {
          return Math.max(0, Number(product.min));
        }
        return 0;
      }

      function stockState(product, warehouse = 'Semua Gudang') {
        const qty = totalStock(product, warehouse);
        if (qty <= 0) return ['Habis', 'danger'];
        const minVal = getProductMin(product);
        if (minVal > 0 && qty <= minVal) return ['Menipis', 'warning'];
        return ['Aman', 'success'];
      }

      function getCriticalProducts() {
        return store.products.filter(p => {
          if (!p.active) return false;
          const [st] = stockState(p);
          return st === 'Habis' || st === 'Menipis';
        }).sort((a, b) => {
          const stockA = totalStock(a);
          const stockB = totalStock(b);
          if (stockA <= 0 && stockB > 0) return -1;
          if (stockB <= 0 && stockA > 0) return 1;
          return stockA - stockB;
        });
      }

      // Image Compression & Processing Helper
      function compressImageFile(file, maxWidth = 800, quality = 0.58) {
        return new Promise((resolve, reject) => {
          if (!file || !file.type || !file.type.startsWith('image/')) {
            return reject(new Error('File yang dipilih bukan gambar yang valid.'));
          }
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              let width = img.width;
              let height = img.height;
              const maxDim = maxWidth;
              if (width > maxDim || height > maxDim) {
                if (width >= height) {
                  height = Math.round((height * maxDim) / width);
                  width = maxDim;
                } else {
                  width = Math.round((width * maxDim) / height);
                  height = maxDim;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);

              let curQuality = quality;
              let dataUrl = canvas.toDataURL('image/jpeg', curQuality);

              // Jaminan string Base64 <= 42.000 karakter agar tidak melebihi batas sel Google Spreadsheet (50.000 karakter)
              if (dataUrl.length > 42000) {
                dataUrl = canvas.toDataURL('image/jpeg', 0.45);
              }
              if (dataUrl.length > 42000) {
                const c2 = document.createElement('canvas');
                c2.width = Math.round(width * 0.75);
                c2.height = Math.round(height * 0.75);
                const ctx2 = c2.getContext('2d');
                ctx2.drawImage(canvas, 0, 0, c2.width, c2.height);
                dataUrl = c2.toDataURL('image/jpeg', 0.45);
              }

              resolve(dataUrl);
            };
            img.onerror = () => reject(new Error('Gagal memproses file gambar.'));
            img.src = e.target.result;
          };
          reader.onerror = () => reject(new Error('Gagal membaca file gambar.'));
          reader.readAsDataURL(file);
        });
      }

<body>
  <div class="cam-box">
    <div class="cam-header">
      <h2>📷 Kamera Dokumen StokKita</h2>
      <p>Arahkan kamera ke barang atau bukti nota, lalu tekan tombol ambil.</p>
