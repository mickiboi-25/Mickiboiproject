    .standby-box {
      text-align: center;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin: auto 0;
    }
    .standby-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: var(--brand-50);
      border: 1px solid var(--brand-200);
      color: var(--brand-700);
      display: grid;
      place-items: center;
    }
    .standby-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink-950);
    }
    .standby-desc {
      font-size: 12.5px;
      color: var(--ink-500);
      line-height: 1.5;
      max-width: 320px;
    }
    .standby-tip {
      font-size: 11.5px;
      color: var(--ink-500);
      background: var(--canvas);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--ink-200);
    }
    .manual-toggle-btn {
      min-height: 44px;
      padding: 0 14px;
      background: var(--surface);
      border: 1px solid var(--ink-200);
      border-radius: var(--radius-sm);
      color: var(--brand-700);
      font-family: var(--font);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .manual-toggle-btn:hover {
      background: var(--brand-50);
      border-color: var(--brand-200);
    }
    .manual-form {
      display: none;
      width: 100%;
      max-width: 340px;
      margin-top: 4px;
      gap: 6px;
    }
    .manual-input {
      flex: 1;
      height: 44px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      background: var(--canvas);
      border: 1px solid var(--ink-300);
      color: var(--ink-950);
      font-family: var(--font);
      font-size: 13px;
    }
    .manual-input:focus { border-color: var(--brand-600); }
    .manual-btn {
      min-height: 44px;
      padding: 0 16px;
      border-radius: var(--radius-sm);
      background: var(--brand-700);
      color: #ffffff;
      font-family: var(--font);
      font-weight: 600;
      font-size: 13px;
      border: none;
      cursor: pointer;
    }
    .manual-btn:hover { background: var(--brand-800); }

    /* Detected State */
    .detected-box {
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
    }
    .detected-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
    }
    .status-pill.success {
      background: var(--brand-50);
      color: var(--brand-700);
      border: 1px solid var(--brand-200);
    }
    .status-pill.warning {
      background: var(--warning-soft);
      color: var(--warning);
      border: 1px solid var(--warning);
    }
    .code-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-600);
      background: var(--ink-100);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .product-summary-card {
      background: var(--canvas);
      border: 1px solid var(--ink-200);
      border-radius: var(--radius-sm);
      padding: 12px;
      margin-bottom: 8px;
    }
    .product-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink-950);
      line-height: 1.35;
      margin-bottom: 6px;
    }
    .product-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    .meta-chip {
      font-size: 11px;
      color: var(--ink-600);
      background: var(--surface);
      border: 1px solid var(--ink-200);
      padding: 2px 8px;
      border-radius: 6px;
    }
    .product-stock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--ink-200);
      padding-top: 8px;
      font-size: 12.5px;
      color: var(--ink-600);
    }
    .stock-val {
      font-weight: 700;
      color: var(--brand-700);
    }

    .notfound-card {
      background: var(--warning-soft);
      border: 1px solid var(--warning);
      border-radius: var(--radius-sm);
      padding: 12px;
      text-align: center;
      margin-bottom: 8px;
    }
    .notfound-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink-950);
      margin: 4px 0;
    }
    .notfound-hint {
      font-size: 12px;
      color: var(--ink-600);
      line-height: 1.4;
    }

    .actions-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: auto;
    }
    .actions-stack .btn,
    .result-sheet .btn {
      width: 100%;
      min-height: 44px;
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .result-sheet .btn-primary {
      background: var(--brand-700);
      color: #ffffff;
    }
    .result-sheet .btn-primary:hover {
      background: var(--brand-800);
    }
    .result-sheet .btn-secondary {
      background: var(--surface);
      border-color: var(--ink-200);
      color: var(--ink-800);
    }
    .result-sheet .btn-secondary:hover {
      background: var(--ink-100);
    }
    .counter-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--brand-700);
      font-weight: 700;
      text-align: center;
      justify-content: center;
      padding: 4px 10px;
      background: var(--brand-50);
      border-radius: 6px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"><\/script>
</head>
<body>
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-left">
      <button type="button" class="close-btn" onclick="closeScannerWindow()" aria-label="Tutup pemindai">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        Tutup
      </button>
      <div class="context-tag" id="contextTag">Scan Barcode</div>
    </div>
    <div class="top-actions">
      <button type="button" class="tool-btn" id="torchBtn" onclick="toggleTorch()" title="Nyalakan Lampu Senter" aria-label="Nyalakan lampu senter">Senter</button>
      <button type="button" class="tool-btn" id="flipCamBtn" onclick="switchCamera()" title="Ganti Kamera" aria-label="Ganti kamera">Balik Kamera</button>
    </div>
  </div>

  <!-- Camera Viewport -->
  <div class="viewport-container">
    <div id="scannerReader"></div>
    <div class="target-overlay" id="targetOverlay">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
      <div class="target-label">Arahkan ke Barcode / QR</div>
    </div>
  </div>

  <!-- Mode Switcher -->
  <div class="mode-bar">
    <button type="button" class="mode-btn" id="mode1xBtn" onclick="setMode(false)">1x Scan (Pencarian)</button>
    <button type="button" class="mode-btn" id="modeMultiBtn" onclick="setMode(true)">Multi-Scan (Input Cepat)</button>
  </div>

  <!-- Result / Interaction Sheet -->
  <div class="result-sheet">
    <!-- Standby View -->
    <div id="standbyView" class="standby-box">
      <div class="standby-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8"/><path d="M12 8v8"/><path d="M17 8v8"/></svg>
      </div>
      <div class="standby-title">Kamera Siap Memindai</div>
      <div class="standby-desc">Arahkan kamera ke barcode 1D atau QR code barang. Informasi barang akan muncul di sini.</div>
      <div class="standby-tip">Jarak ideal 15-25 cm, hindari pantulan cahaya langsung.</div>
      <div id="multiScanCounter" class="counter-badge" style="display:none;margin-top:4px;">0 barang telah discan</div>

      <button type="button" class="manual-toggle-btn" onclick="toggleManualInput()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg>
        Ketik Kode Manual
      </button>
      <div id="manualForm" class="manual-form">
        <input type="text" id="manualInput" class="manual-input" placeholder="Ketik SKU atau kode barcode..." aria-label="Ketik SKU atau kode barcode" onkeydown="if(event.key==='Enter')submitManualCode()">
        <button type="button" class="manual-btn" onclick="submitManualCode()">Cari</button>
      </div>
    </div>

    <!-- Detected View -->
    <div id="detectedView" class="detected-box" style="display:none;">
      <div>
        <div class="detected-badge-row">
          <span id="statusPill" class="status-pill success">BARANG TERDAFTAR</span>
          <span id="codePill" class="code-pill"></span>
        </div>
        <div id="detectedBody"></div>
      </div>
      <div class="actions-stack">
        <button type="button" id="primaryActionBtn" class="btn btn-primary">Lanjutkan Proses Barang Ini &rarr;</button>
        <button type="button" class="btn btn-secondary" onclick="resumeScanning()">Scan Barang Lain</button>
      </div>
    </div>
  </div>

  <script>
    var CONTEXT = ${safeContext};
    var STORAGE_KEY = ${storageKey};
    var PRODUCTS = ${safeCatalog};
    var html5QrCode = null;
    var currentCameraId = null;
    var cameraList = [];
    var isTorchOn = false;
    var isSearchContext = (CONTEXT === 'stockSearch' || CONTEXT === 'productSearch' || CONTEXT === 'global' || CONTEXT === 'stockCard' || CONTEXT === 'damaged' || CONTEXT === 'productFormBarcode');
    var isContinuous = !isSearchContext;
    var scannedCount = 0;
    var lastScannedCode = '';
    var lastScannedTime = 0;
    var autoSubmitTimer = null;

    var CONTEXT_TITLES = {
      'stockSearch': 'Cari Stok',
      'productSearch': 'Master Barang',
      'global': 'Scan Cepat',
      'transaction': 'Transaksi',
      'transfer': 'Transfer Gudang',
      'damaged': 'Barang Rusak',
      'opname': 'Stok Opname',
      'stockCard': 'Kartu Stok',
      'productFormBarcode': 'Input Barcode',
      'barcodePage': 'Cetak Label',
      'general': 'Scan Barcode'
    };

    function updateContextTag() {
      var tag = document.getElementById('contextTag');
      if (tag) tag.textContent = CONTEXT_TITLES[CONTEXT] || 'Scan Barcode';
    }

    function updateModeUI() {
      var btn1x = document.getElementById('mode1xBtn');
      var btnMulti = document.getElementById('modeMultiBtn');
      var counterEl = document.getElementById('multiScanCounter');
      if (btn1x && btnMulti) {
        if (isContinuous) {
          btnMulti.classList.add('active');
          btn1x.classList.remove('active');
          if (counterEl) {
            counterEl.style.display = scannedCount > 0 ? 'inline-flex' : 'none';
            counterEl.textContent = scannedCount + ' barang berhasil dipindai';
          }
        } else {
          btn1x.classList.add('active');
          btnMulti.classList.remove('active');
          if (counterEl) counterEl.style.display = 'none';
        }
      }
    }

    function setMode(continuous) {
      isContinuous = continuous;
      updateModeUI();
    }

    function toggleManualInput() {
      var form = document.getElementById('manualForm');
      if (form) {
        var isOpen = form.style.display === 'flex';
        form.style.display = isOpen ? 'none' : 'flex';
        if (!isOpen) {
          var inp = document.getElementById('manualInput');
          if (inp) inp.focus();
        }
      }
    }

    function submitManualCode() {
      var inp = document.getElementById('manualInput');
      if (!inp) return;
      var code = String(inp.value || '').trim();
      if (!code) return;
      handleScanSuccess(code);
    }

    function playSuccessChime() {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var now = ctx.currentTime;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1320, now + 0.12);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      } catch(e) {}
    }

    function toggleTorch() {
      try {
        var video = document.querySelector('#scannerReader video');
        if (video && video.srcObject) {
          var track = video.srcObject.getVideoTracks()[0];
          if (track && track.applyConstraints) {
            isTorchOn = !isTorchOn;
            track.applyConstraints({ advanced: [{ torch: isTorchOn }] })
              .then(function() {
                var btn = document.getElementById('torchBtn');
                if (btn) {
                  if (isTorchOn) {
                    btn.classList.add('active');
                    btn.innerHTML = 'Senter Aktif';
                  } else {
                    btn.classList.remove('active');
                    btn.innerHTML = 'Senter';
                  }
                }
              })
              .catch(function(err) {
                alert('Lampu senter tidak didukung pada browser/kamera ini.');
              });
          } else {
            alert('Lampu senter tidak didukung pada kamera ini.');
          }
        }
      } catch(e) {}
    }

    function handleScanSuccess(decodedText) {
      var raw = String(decodedText || '').trim();
      // Filter out glitch noise / false positive partials (less than 2 characters)
      if (!raw || raw.length < 2) return;

      var now = Date.now();
      if (raw === lastScannedCode && (now - lastScannedTime) < 1600) return;
      lastScannedCode = raw;
      lastScannedTime = now;
      scannedCount++;

      playSuccessChime();
      if (navigator.vibrate) navigator.vibrate([80, 40, 80]);

      var target = document.getElementById('targetOverlay');
      if (target) {
        target.classList.add('detected');
        setTimeout(function() { target.classList.remove('detected'); }, 800);
      }

      var cleanCode = raw.toLowerCase();
      var p = PRODUCTS.find(function(x) {
        var s = String(x.sku || '').trim().toLowerCase();
        var b = String(x.barcode || '').trim().toLowerCase();
        var id = String(x.id || '').trim().toLowerCase();
        return (s && s === cleanCode) || (b && b === cleanCode) || (id && id === cleanCode);
      });

      sendScanPayload(raw);

      displayScanResult(raw, p);
    }

    function sendScanPayload(code) {
      var payload = {
        type: 'STOKKITA_BARCODE_SCAN_RESULT',
        code: code,
        context: CONTEXT,
        time: Date.now()
      };

      // 1. Instant 0ms BroadcastChannel
      try {
        if (typeof BroadcastChannel !== 'undefined') {
          var bc = new BroadcastChannel('stokkita_barcode_channel');
          bc.postMessage(payload);
          bc.close();
        }
      } catch(e) {}

      // 2. Direct Window Opener PostMessage
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, '*');
        }
      } catch(e) {}

      // 3. LocalStorage Polling Fallback
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch(e) {}
    }

    function displayScanResult(code, p) {
      if (autoSubmitTimer) clearTimeout(autoSubmitTimer);

      var standbyEl = document.getElementById('standbyView');
      var detectedEl = document.getElementById('detectedView');
      if (standbyEl) standbyEl.style.display = 'none';
      if (detectedEl) detectedEl.style.display = 'flex';

      var badgePill = document.getElementById('statusPill');
      var codePill = document.getElementById('codePill');
      var cardBody = document.getElementById('detectedBody');
      var primaryBtn = document.getElementById('primaryActionBtn');

      if (codePill) codePill.textContent = code;

      if (p) {
        if (badgePill) {
          badgePill.className = 'status-pill success';
          badgePill.innerHTML = 'Barang Ditemukan';
        }
        if (cardBody) {
          cardBody.innerHTML =
            '<div class="product-summary-card">' +
              '<div class="product-name">' + escapeHtml(p.name) + '</div>' +
              '<div class="product-meta-row">' +
                '<span class="meta-chip">SKU: ' + escapeHtml(p.sku) + '</span>' +
                (p.barcode && p.barcode !== p.sku ? '<span class="meta-chip">Barcode: ' + escapeHtml(p.barcode) + '</span>' : '') +
                '<span class="meta-chip">' + escapeHtml(p.category || 'Umum') + '</span>' +
              '</div>' +
              '<div class="product-stock-row">' +
                '<span>Saldo Stok Tersedia:</span>' +
                '<span class="stock-val">' + (p.totalStock || 0) + ' ' + escapeHtml(p.unit || 'PCS') + '</span>' +
              '</div>' +
            '</div>';
        }
        if (primaryBtn) {
          primaryBtn.innerHTML = 'Lanjutkan Proses';
          primaryBtn.onclick = function() {
            sendScanPayload(code);
            closeScannerWindow();
          };
        }

        if (!isContinuous) {
          autoSubmitTimer = setTimeout(function() {
            closeScannerWindow();
          }, 850);
        } else {
          updateModeUI();
        }
      } else {
        if (badgePill) {
          badgePill.className = 'status-pill warning';
          badgePill.innerHTML = 'Kode Belum Terdaftar';
        }
        if (cardBody) {
          cardBody.innerHTML =
            '<div class="notfound-card">' +
              '<div style="font-size:11px;color:#cbd5e1;">Kode Barcode Terbaca:</div>' +
              '<div class="notfound-code">' + escapeHtml(code) + '</div>' +
              '<div class="notfound-hint">Kode ini belum tercatat pada Master Data Barang StokKita.</div>' +
            '</div>';
        }
        if (primaryBtn) {
          primaryBtn.innerHTML = 'Tambah Barang Baru';
          primaryBtn.onclick = function() {
            sendScanPayload(code);
            closeScannerWindow();
          };
        }
      }
    }

    function resumeScanning() {
      if (autoSubmitTimer) clearTimeout(autoSubmitTimer);
      var standbyEl = document.getElementById('standbyView');
      var detectedEl = document.getElementById('detectedView');
      if (standbyEl) standbyEl.style.display = 'flex';
      if (detectedEl) detectedEl.style.display = 'none';
      updateModeUI();
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function initScanner() {
      updateContextTag();
      updateModeUI();
      try {
        var cameras = await Html5Qrcode.getCameras();
        if (!cameras || !cameras.length) {
          alert('Tidak ada kamera terdeteksi pada perangkat.');
          return;
        }
        cameraList = cameras;
        var backCam = cameras.find(function(c) {
          var label = (c.label || '').toLowerCase();
          return label.indexOf('back') !== -1 || label.indexOf('rear') !== -1 || label.indexOf('belakang') !== -1 || label.indexOf('environment') !== -1;
        });
        currentCameraId = backCam ? backCam.id : cameras[0].id;

        // Supported format filter to prevent ZXing ITF/Codabar screen moiré false positives (e.g. 66an)
        var supportedFormats = undefined;
        if (typeof Html5QrcodeSupportedFormats !== 'undefined') {
          supportedFormats = [
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.QR_CODE,
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_39
          ];
        }

        html5QrCode = new Html5Qrcode('scannerReader', {
          formatsToSupport: supportedFormats,
          verbose: false,
          experimentalFeatures: {
            useBarCodeDetectorIfSupported: true
          }
        });
        startReading(currentCameraId);
      } catch(err) {
        console.error('Kamera init error:', err);
      }
    }

    function startReading(cameraId) {
      if (!html5QrCode) return;
      var config = {
        fps: 24,
        qrbox: function(w, h) {
          var boxW = Math.min(340, Math.floor(w * 0.90));
          var boxH = Math.min(220, Math.floor(h * 0.65));
          return { width: Math.max(200, boxW), height: Math.max(140, boxH) };
        },
        aspectRatio: 1.333333,
        videoConstraints: {
          deviceId: cameraId ? { exact: cameraId } : undefined,
          facingMode: cameraId ? undefined : { ideal: 'environment' },
          width: { min: 640, ideal: 1920, max: 2560 },
          height: { min: 480, ideal: 1080, max: 1440 },
          focusMode: { ideal: 'continuous' }
        }
      };

      html5QrCode.start(
        cameraId || { facingMode: 'environment' },
        config,
        handleScanSuccess,
        function(err) {}
      ).catch(function(err) {
        console.warn('Camera start with videoConstraints failed, retrying simple mode:', err);
        html5QrCode.start(
          cameraId || { facingMode: 'environment' },
          { fps: 20 },
          handleScanSuccess,
          function(e) {}
        ).catch(function(e2) {
          console.error('Final camera start error:', e2);
          alert('Kamera gagal dimulai: ' + (e2.message || e2));
        });
      });
    }

    async function switchCamera() {
      if (!html5QrCode || cameraList.length < 2) {
        alert('Hanya 1 kamera yang terdeteksi di perangkat ini.');
        return;
      }
      try {
        await html5QrCode.stop();
        var curIdx = cameraList.findIndex(function(c) { return c.id === currentCameraId; });
        var nextIdx = (curIdx + 1) % cameraList.length;
        currentCameraId = cameraList[nextIdx].id;
        startReading(currentCameraId);
      } catch(e) {
        console.error(e);
      }
    }

    function closeScannerWindow() {
      if (autoSubmitTimer) clearTimeout(autoSubmitTimer);
      if (html5QrCode) {
        try { html5QrCode.stop(); } catch(e) {}
      }
      window.close();
    }

    window.addEventListener('beforeunload', function() {
      if (autoSubmitTimer) clearTimeout(autoSubmitTimer);
      if (html5QrCode) {
        try { html5QrCode.stop(); } catch(e) {}
      }
    });

    window.addEventListener('DOMContentLoaded', initScanner);
  <\/script>
</body>
</html>`;
      }

      function openBarcodeScannerPopup(context = 'general') {
        const width = Math.min(500, screen.availWidth - 24);
        const height = Math.min(740, screen.availHeight - 40);
        const left = Math.max(0, Math.round((screen.availWidth - width) / 2));
        const top = Math.max(0, Math.round((screen.availHeight - height) / 2));

        try { localStorage.removeItem(SCANNER_STORAGE_KEY); } catch (e) { }

        barcodeScannerWindow = window.open(
          '',
          'stokkita_barcode_scanner',
          `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes`
        );

        if (!barcodeScannerWindow) {
          showToast('Popup Diblokir', 'Browser memblokir jendela scanner. Silakan izinkan popup untuk situs ini.', true);
          return;
        }

        const catalog = (store.products || []).map(p => ({
          id: p.id,
          name: p.name,
          sku: p.sku || '',
          barcode: p.barcode || '',
          category: p.category || '',
          unit: p.unit || 'PCS',
          min: getProductMin(p),
          totalStock: totalStock(p),
          price: p.buyPrice || p.price || 0,
          photo: p.photo || p.foto || ''
        }));

        const html = createBarcodeScannerPopupHTML(context, catalog);
        try {
          barcodeScannerWindow.document.open();
          barcodeScannerWindow.document.write(html);
          barcodeScannerWindow.document.close();
          barcodeScannerWindow.focus();
        } catch (err) {
          try {
            const blob = new Blob([html], { type: 'text/html' });
            barcodeScannerWindow.location.href = URL.createObjectURL(blob);
          } catch (e) {
            console.error('Gagal menulis popup scanner:', e);
          }
        }

        startBarcodeScannerPolling(context);
        showToast('Scanner Kamera Aktif', 'Arahkan kamera HP ke barcode atau QR code barang.');
      }

      function handleReceivedBarcodeScan(data) {
        if (!data || data.type !== 'STOKKITA_BARCODE_SCAN_RESULT' || !data.code) return;
        const rawCode = String(data.code).trim();
        if (!rawCode) return;

        playBeepSound();

        const p = store.products.find(x =>
          (x.sku && x.sku.toLowerCase() === rawCode.toLowerCase()) ||
          (x.barcode && x.barcode.toLowerCase() === rawCode.toLowerCase()) ||
          (x.id && x.id.toLowerCase() === rawCode.toLowerCase())
        );

        const ctx = data.context || 'global';

        // 1. Context: Transaksi Masuk / Keluar (Modal)
        if (ctx === 'transaction') {
          if (p) {
            if (!state.transactionLines) state.transactionLines = [];
            const existing = state.transactionLines.find(l => l.productId === p.id);
            if (existing) {
              existing.qty = Number(existing.qty || 1) + 1;
            } else {
              state.transactionLines.push({ productId: p.id, qty: 1 });
            }
            // Preserve current form inputs
            const pVal = document.getElementById('modalTxParty')?.value;
            const rVal = document.getElementById('modalTxRef')?.value;
            const nVal = document.getElementById('modalTxNotes')?.value;
            if (pVal !== undefined) state.transactionParty = pVal;
            if (rVal !== undefined) state.transactionRef = rVal;
            if (nVal !== undefined) state.transactionNotes = nVal;

            renderNewTransactionModal();
            showToast('Barang Berhasil Terbaca', `+1 ${p.name} (${p.sku}) ditambahkan ke transaksi.`);
            setTimeout(() => {
              const qtyInputs = document.querySelectorAll('.tx-line-qty');
              if (qtyInputs && qtyInputs.length) {
                const lastInp = qtyInputs[qtyInputs.length - 1];
                lastInp?.focus();
                lastInp?.select();
              }
            }, 80);
          } else {
            showToast('Barang Tidak Ditemukan', `Kode "${rawCode}" tidak cocok dengan SKU atau barcode produk manapun.`, true);
          }
          return;
        }

        // 2. Context: Transfer Antar Gudang (Modal)
        if (ctx === 'transfer') {
          if (p) {
            if (!state.transferLines) state.transferLines = [];
            const existing = state.transferLines.find(l => l.productId === p.id);
            if (existing) {
              existing.qty = Number(existing.qty || 1) + 1;
            } else {
              state.transferLines.push({ productId: p.id, qty: 1 });
            }
            const rVal = document.getElementById('trfRef')?.value;
            const nVal = document.getElementById('trfNotes')?.value;
            if (rVal !== undefined) state.transferRefNo = rVal;
            if (nVal !== undefined) state.transferNotes = nVal;

            renderNewTransferModal();
            showToast('Barang Berhasil Terbaca', `+1 ${p.name} (${p.sku}) ditambahkan ke transfer.`);
            setTimeout(() => {
              const qtyInputs = document.querySelectorAll('.trf-line-qty');
              if (qtyInputs && qtyInputs.length) {
                const lastInp = qtyInputs[qtyInputs.length - 1];
                lastInp?.focus();
                lastInp?.select();
              }
            }, 80);
          } else {
            showToast('Barang Tidak Ditemukan', `Kode "${rawCode}" tidak cocok dengan produk manapun.`, true);
          }
          return;
        }

        // 3. Context: Input Barcode di Form Tambah / Edit Barang
        if (ctx === 'productFormBarcode') {
          const barcodeInput = document.getElementById('prodFormBarcode');
          if (barcodeInput) {
            barcodeInput.value = rawCode;
            barcodeInput.focus();
            showToast('Barcode Berhasil Terbaca', `Kode ${rawCode} berhasil dimasukkan ke form barang.`);
          } else {
            showToast('Hasil Scan', `Kode barcode: ${rawCode}`);
          }
          return;
        }

        // 4. Context: Pencarian Cepat di Cek Stok
        if (ctx === 'stockSearch') {
          state.stockQuery = p ? p.sku : rawCode;
          navigate('stock');
          render();
          const sInp = document.getElementById('stockSearch');
          if (sInp) { sInp.focus(); sInp.select(); }
          if (p) {
            showToast('Barang Berhasil Terbaca', `${p.name} (${p.sku}) ditemukan di stok.`);
            renderQuickScanProductModal(p, rawCode, 'Pencarian Stok: Barang Berhasil Terbaca');
          } else {
            showToast('Barang Tidak Ditemukan', `Kode "${rawCode}" tidak cocok dengan data stok manapun.`, true);
          }
          return;
        }

        // 5. Context: Pencarian Cepat di Master Barang
        if (ctx === 'productSearch') {
          state.productsQuery = p ? p.sku : rawCode;
          navigate('products');
          render();
          const pInp = document.getElementById('prodSearch');
          if (pInp) { pInp.focus(); pInp.select(); }
          if (p) {
            showToast('Barang Berhasil Terbaca', `${p.name} (${p.sku}) ditemukan di master data.`);
            renderQuickScanProductModal(p, rawCode, 'Master Barang: Barang Berhasil Terbaca');
          } else {
            showToast('Barang Tidak Ditemukan', `Kode "${rawCode}" tidak cocok dengan data barang manapun.`, true);
          }
          return;
        }

        // 6. Context: Buka Kartu Stok Langsung
        if (ctx === 'stockCard') {
          if (p) {
            state.stockCardProductId = p.id;
            navigate('stockcard');
            render();
            showToast('Barang Berhasil Terbaca', `Buku mutasi ${p.name} (${p.sku}) siap ditampilkan.`);
          } else {
            showToast('Barang Tidak Ditemukan', `Kode "${rawCode}" belum terdaftar di database.`, true);
          }
          return;
        }

        // 7. Context: Pilih Barang Bermasalah / Rusak
        if (ctx === 'damaged') {
          if (p) {
            const hiddenInp = document.getElementById('dmgProduct');
            const searchInp = document.getElementById('dmgProductSearchInput');
            const badgeEl = document.getElementById('dmgSelectedProductBadge');
            const wh = document.getElementById('dmgWarehouse')?.value || 'Gudang Utama';
            const curStock = p.stocks ? (p.stocks[wh] || 0) : 0;
            if (hiddenInp) hiddenInp.value = p.id;
            if (searchInp) searchInp.value = `${p.name} (${p.sku})`;
            if (badgeEl) {
              badgeEl.innerHTML = `<strong style="color:var(--ink-900)">${escapeHtml(p.name)}</strong> (${escapeHtml(p.sku)}) &bull; Kategori: ${escapeHtml(p.category)} &bull; Stok di ${escapeHtml(wh)}: <strong style="color:var(--brand-700)">${curStock} ${escapeHtml(p.unit)}</strong>`;
            }
            showToast('Barang Berhasil Terbaca', `${p.name} (${p.sku}) siap dilaporkan.`);
          } else {
            showToast('Barang Tidak Ditemukan', `Kode "${rawCode}" tidak cocok dengan produk manapun.`, true);
          }
          return;
        }

        // 8. Context: Hitung Fisik Stok Opname
        if (ctx === 'opname') {
          if (p) {
            const row = document.getElementById(`opnameRow_${p.id}`);
            const input = document.querySelector(`.opname-phys-input[data-prod-id="${p.id}"]`);
            if (row && input) {
              row.style.display = '';
              row.scrollIntoView({ behavior: 'smooth', block: 'center' });
              row.style.transition = 'background-color 0.4s';
              row.style.backgroundColor = 'var(--brand-50, #eff6ff)';
              setTimeout(() => { row.style.backgroundColor = ''; }, 1600);

              const curVal = Number(input.value || 0);
              input.value = curVal + 1;
              input.focus();
              input.select();
              input.dispatchEvent(new Event('input', { bubbles: true }));
              showToast('Barang Berhasil Terbaca', `+1 ${p.name} (Total Fisik: ${input.value} ${p.unit})`);
            } else {
              showToast('Barang Ditemukan', `${p.name} (${p.sku}) tidak ada di daftar opname gudang ini.`, true);
            }
          } else {
            showToast('Barang Tidak Ditemukan', `Kode "${rawCode}" tidak cocok dengan produk manapun.`, true);
          }
          return;
        }

        // 9. Context: Halaman Cetak Barcode & Label
        if (ctx === 'barcodePage') {
          if (state.barcodeTab === 'custom') {
            state.barcodeCustomText = rawCode;
            render();
            renderBarcodePreviewGraphics();
            showToast('Kode Berhasil Terbaca', `Kode teks: ${rawCode}`);
          } else {
            if (p) {
              if (!state.barcodeSelectedProductIds.includes(p.id)) {
                state.barcodeSelectedProductIds.push(p.id);
              }
              state.barcodeSearchQuery = p.sku || p.name;
              render();
              renderBarcodePreviewGraphics();
              showToast('Barang Berhasil Terbaca', `${p.name} (${p.sku}) siap dicetak.`);
            } else {
              showToast('Barang Tidak Ditemukan', `Kode "${rawCode}" tidak ditemukan di database stok.`, true);
            }
          }
          return;
        }

        // 10. Default / Context Global (Topbar Quick Scan)
        renderQuickScanProductModal(p, rawCode);
      }

      function startBarcodeScannerPolling(context) {
        stopBarcodeScannerPolling();
        let counter = 0;
        barcodeScannerInterval = setInterval(() => {
          counter++;
          if (counter > 300 || (barcodeScannerWindow && barcodeScannerWindow.closed)) {
            stopBarcodeScannerPolling();
            return;
          }

          try {
            const raw = localStorage.getItem(SCANNER_STORAGE_KEY);
            if (raw) {
              localStorage.removeItem(SCANNER_STORAGE_KEY);
              const data = JSON.parse(raw);
              if (data && data.code) {
                handleReceivedBarcodeScan(data);
              }
            }
          } catch (e) { }
        }, 350);
      }

      function stopBarcodeScannerPolling() {
        if (barcodeScannerInterval) {
          clearInterval(barcodeScannerInterval);
          barcodeScannerInterval = null;
        }
      }

      // Professional Spreadsheet & CSV Export Utilities
      function exportCSV(filename, headers, rows) {
        const escapeCell = val => {
          if (val === null || val === undefined) return '""';
          const str = String(val).replace(/"/g, '""');
          return `"${str}"`;
        };
        // Menambahkan direktif sep=, agar Microsoft Excel otomatis membagi kolom tanpa menumpuk di kolom A
        const csvContent = '\uFEFFsep=,\r\n' + [headers.map(escapeCell).join(','), ...rows.map(r => r.map(escapeCell).join(','))].join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        addAuditLog('EXPORT', 'Laporan CSV', filename, `Mengekspor data ke file ${filename}`);
        saveStore();
        showToast('Ekspor Berhasil', `File ${filename} telah diunduh.`);
      }

      function exportToExcel(filename, reportTitle, headers, rows, meta = {}) {
        const cleanFilename = (filename || 'Laporan').replace(/\.csv$/i, '').replace(/\.xlsx$/i, '').replace(/\.xls$/i, '');
        const title = reportTitle || cleanFilename.replace(/_/g, ' ');

        // 1. Ekspor Native Excel (.xlsx) via SheetJS jika tersedia
        if (typeof XLSX !== 'undefined') {
          try {
            const wb = XLSX.utils.book_new();
            const wsData = [];

            // Baris 1: Identitas Bisnis
            const bizName = (store.settings && store.settings.businessName) || 'StokKita: Inventori Multi Gudang';
            wsData.push([bizName.toUpperCase()]);

            // Baris 2: Judul Resmi Laporan
            wsData.push([title.toUpperCase()]);

            // Baris 3: Informasi Filter & Tanggal
            const metaTokens = [];
            if (meta.warehouse) metaTokens.push(`Lokasi: ${meta.warehouse}`);
            if (meta.category) metaTokens.push(`Kategori: ${meta.category}`);
            if (meta.period) metaTokens.push(`Periode: ${meta.period}`);
            metaTokens.push(`Tanggal: ${getNowFormatted()}`);
            const curUser = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');
            metaTokens.push(`Diekspor Oleh: ${curUser}`);
            wsData.push([metaTokens.join('   |   ')]);

            // Baris 4: Baris Pemisah Kosong
            wsData.push([]);

            // Baris 5: Header Tabel
            wsData.push(headers);

            // Baris 6+: Data Baris dengan tipe data angka numerik murni
            rows.forEach(r => {
              const rowArr = r.map((val, colIdx) => {
                if (val === null || val === undefined) return '';
                if (typeof val === 'number') return val;
                const hName = (headers[colIdx] || '').toLowerCase();
                const isNumericCol = hName.includes('stok') || hName.includes('qty') || hName.includes('kuantitas') ||
                  hName.includes('minimum') || hName.includes('saldo') || hName.includes('selisih') ||
                  hName.includes('total') || hName.includes('gudang');
                const str = String(val).trim();
                if (isNumericCol && str !== '' && !isNaN(Number(str)) && !str.startsWith('+') && !str.includes('-') && (!str.startsWith('0') || str === '0')) {
                  return Number(str);
                }
                return str;
              });
              wsData.push(rowArr);
            });

            const ws = XLSX.utils.aoa_to_sheet(wsData);

            // Lebar kolom otomatis proporsional (Auto Column Widths)
            const colWidths = headers.map((h, colIdx) => {
              let maxLen = String(h).length;
              rows.forEach(r => {
                const cellVal = r[colIdx];
                if (cellVal !== null && cellVal !== undefined) {
                  maxLen = Math.max(maxLen, String(cellVal).length);
                }
              });
              return { wch: Math.min(Math.max(maxLen + 4, 14), 45) };
            });
            ws['!cols'] = colWidths;

            // Mengaktifkan AutoFilter pada header tabel (baris ke-5)
            const lastColCode = XLSX.utils.encode_col(headers.length - 1);
            ws['!autofilter'] = { ref: `A5:${lastColCode}${wsData.length}` };

            const sheetName = title.slice(0, 31).replace(/[\\/?*[\]:]/g, '');
            XLSX.utils.book_append_sheet(wb, ws, sheetName);

            const outFilename = `${cleanFilename}.xlsx`;
            XLSX.writeFile(wb, outFilename);

            addAuditLog('EXPORT', 'Excel (.xlsx)', outFilename, `Mengekspor laporan ke file Excel ${outFilename}`);
            saveStore();
            showToast('Ekspor Berhasil', `File spreadsheet ${outFilename} berhasil diunduh.`);
            return;
          } catch (err) {
            console.warn('Gagal memproses via SheetJS, beralih ke format Excel XML/HTML fallback:', err);
          }
        }

        // 2. Fallback: Format Excel XML / HTML Spreadsheet (.xls)
        exportExcelHtmlFallback(cleanFilename, title, headers, rows, meta);
      }

      // Date Filter Parsing & Evaluation Utility
      function parseDateStr(str) {
        if (!str) return null;
        if (str.includes('/')) {
          const parts = str.split(' ')[0].split('/');
          if (parts.length === 3) {
            return new Date(Number(parts[2]), Number(parts[1]) - 1, Number(parts[0]));
          }
        }
        if (str.includes('-')) {
          const parts = str.split(' ')[0].split('-');
          if (parts.length === 3) {
            return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
          }
        }
        const d = new Date(str);
        return isNaN(d.getTime()) ? null : d;
      }

      function isTxInPeriod(txDateStr, period, customFrom, customTo) {
        if (!period || period === 'all') return true;
        const d = parseDateStr(txDateStr);
        if (!d) return true;

        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);

        if (period === 'today') {
          return d >= startOfToday && d <= endOfToday;
        }
        if (period === '7days') {
          const past7 = new Date(startOfToday);
          past7.setDate(past7.getDate() - 7);
          return d >= past7 && d <= endOfToday;
        }
        if (period === '30days') {
          const past30 = new Date(startOfToday);
          past30.setDate(past30.getDate() - 30);
          return d >= past30 && d <= endOfToday;
        }
        if (period === 'this-month') {
          const isCurrentMonth = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
          return isCurrentMonth || (d.getFullYear() === 2026 && (d.getMonth() === 7 || d.getMonth() === 8));
        }
        if (period === 'custom') {
          if (customFrom) {
            const f = new Date(customFrom + 'T00:00:00');
            if (d < f) return false;
          }
          if (customTo) {
            const t = new Date(customTo + 'T23:59:59');
            if (d > t) return false;
          }
          return true;
        }
        return true;
      }

                    <span style="font-size:12px;color:#1e40af">${pendingTransfers.reduce((s, t) => s + (t.qty || 0), 0)} unit barang sedang dikirim antar gudang (In Transit).</span>

        const subtitleHtml = `

          ${pendingAlertBanner}
          <div class="stats-grid">${stats.map((s, idx) => {

            return `<article class="card stat-card${modClass}" style="--accent:${s[4]};--accent-soft:${s[5]}"><div class="stat-top"><span class="stat-label">${s[1]}</span><span class="stat-icon">${icon(s[0])}</span></div><div class="stat-value">${s[2]}</div><div class="stat-meta">${s[3]}</div></article>`;
          }).join('')}</div>
          <div class="dashboard-grid">
            <div class="stack">
              ${(() => {
                const chartData = buildStockMovementChart(period, filteredTx, state.dashboardDateFrom, state.dashboardDateTo);
                return `<article class="card"><div class="card-header"><div class="card-title"><h3>${chartData.title}</h3><p>${chartData.subtitle}</p></div><div class="legend"><span><i style="background:#299979"></i>Masuk</span><span><i style="background:#e0a33d"></i>Keluar</span></div></div><div class="card-body"><div class="chart-wrap">${chartData.html}</div></div></article>`;
              })()}
              <article class="card">
                <div class="card-header">
                  <div class="card-title">
                    <h3>Barang Paling Banyak Keluar</h3>
                    <p>Produk dengan kuantitas keluar tertinggi (${periodText})</p>
                  </div>
                  <button class="btn btn-ghost btn-sm" data-route="reports" title="Lihat semua laporan">Lihat laporan ${icon('arrow')}</button>
                </div>
                <div class="card-body">
                  ${topOutProducts.length === 0 ? `
                    <div style="padding:24px 12px;text-align:center;color:var(--ink-500);font-size:12px;">
                      Belum ada pergerakan barang keluar pada periode ${periodText.toLowerCase()}.
                    </div>
                  ` : `
                    <div class="bars" style="display:flex;flex-direction:column;gap:12px;">
                      ${topOutProducts.map((x, idx) => {
          const rankLabel = idx === 0 ? '#1' : idx === 1 ? '#2' : idx === 2 ? '#3' : `#${idx + 1}`;
          const pct = totalTopOutQty > 0 ? Math.round((x.qty / totalTopOutQty) * 100) : 0;
          return `
                          <button type="button" class="bar-item" style="width:100%;text-align:left;background:transparent;border:0;font:inherit;color:inherit;cursor:pointer;padding:6px 8px;border-radius:8px;transition:background 0.15s;" data-action="view-stock-card" data-id="${x.id}" title="Klik untuk buka kartu stok ${escapeHtml(x.name)}">
                            <div class="bar-label" style="display:flex;align-items:center;gap:8px;min-width:140px;">
                              <span style="font-weight:800;font-size:12px;color:var(--brand-700);width:28px;">${rankLabel}</span>

                            <div class="bar-track" style="height:10px;border-radius:5px;flex:1;">

                              ${rupiah.format(x.qty)} <small style="font-weight:normal;color:var(--ink-500);">${escapeHtml(x.unit)}</small>
                            </div>
                          </button>
                        `;
        }).join('')}
                    </div>
                  `}
                </div>
              </article>
            </div>
            <div class="stack">
              <article class="card"><div class="card-header"><div class="card-title"><h3>Perlu Perhatian</h3><p>Stok menipis dan habis</p></div><button class="btn btn-ghost btn-sm" data-route="stock">Lihat semua</button></div><div class="card-body"><div class="alert-list">${(() => {
            const crit = getCriticalProducts();
            if (crit.length === 0) {
              return '<div style="padding:20px;text-align:center;color:var(--ink-500);font-size:12px">Semua stok dalam kondisi aman (di atas batas minimum).</div>';
            }
            return crit.slice(0, 5).map(p => {
              const [st] = stockState(p);
              const qty = totalStock(p);
              const isHabis = qty <= 0;
              return `<button type="button" class="alert-row" style="width:100%;text-align:left;background:transparent;border:0;font:inherit;color:inherit;cursor:pointer" data-action="view-stock-card" data-id="${p.id}" title="Klik untuk lihat kartu stok ${escapeHtml(p.name)}">
                    <span class="product-thumb" style="${isHabis ? 'background:#fee2e2;color:#991b1b;font-weight:700;' : ''}">${escapeHtml(p.name.slice(0, 2).toUpperCase())}</span>
                    <span class="row-main">
                      <strong>${escapeHtml(p.name)}</strong>
                      <small>${escapeHtml(p.sku)} · ${escapeHtml(p.category)} · Batas Min: ${getProductMin(p)} ${escapeHtml(p.unit)}</small>
                    </span>
                    <span class="row-value">
                      <strong style="${isHabis ? 'color:var(--danger);font-size:14px' : ''}">${rupiah.format(qty)} ${escapeHtml(p.unit)}</strong>
                      ${badge(st)}
                    </span>
                  </button>`;
            }).join('');
          })()}</div></div></article>
              <article class="card"><div class="card-header"><div class="card-title"><h3>Aktivitas Terbaru</h3><p>Transaksi yang dicatat (${periodText})</p></div></div><div class="card-body"><div class="activity-list">${displayRecentTx.map(t => `<div class="activity-row"><span class="activity-icon">${icon(t.type === 'Barang Masuk' ? 'in' : (t.type === 'Transfer' ? 'transfer' : 'out'))}</span><span class="row-main"><strong>${t.type} · ${t.qty} unit</strong><small>${t.no} · ${t.user || 'Admin'}</small></span><span class="row-value"><small>${t.date ? t.date.split(' ')[1] || t.date : 'Baru'}</small></span></div>`).join('') || '<div style="padding:15px;text-align:center;color:var(--ink-500);font-size:12px">Tidak ada transaksi pada periode ini.</div>'}</div></div></article>
            </div>
          </div>`;
