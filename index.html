      // Escape HTML utility for safe error rendering
      function escapeHtml(str) {
        return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      // Inactivity Auto-Logout Variables & Listeners (15 Menit + 60s hitung mundur)
      let lastActivityTime = Date.now();
      let inactivityWarningActive = false;
      let countdownSecondsRemaining = 60;
      let countdownTimerInterval = null;

      function recordUserActivity() {
        if (!inactivityWarningActive) {
          lastActivityTime = Date.now();
        }
      }

      ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll', 'click'].forEach(evt => {
        window.addEventListener(evt, recordUserActivity, { passive: true });
      });

      function showInactivityWarningModal() {
        const timeoutMinutes = Number(store.settings?.autoLogoutMinutes) || 15;
        countdownSecondsRemaining = 60;
        openModal(`
          <div class="modal-header">
            <div>
              <h2 id="modalTitle" style="display:flex;align-items:center;gap:8px;color:var(--warning)">
                ${icon('alert')} Peringatan Inaktivitas Sesi
              </h2>
              <p>Tidak ada aktivitas selama ${timeoutMinutes} menit</p>
            </div>
          </div>
          <div class="modal-body" style="text-align:center;padding:20px 16px">
            <div style="font-size:46px;font-weight:800;color:var(--warning);margin-bottom:12px;font-family:monospace" id="inactivityCountdownText">
              60 detik
            </div>
            <p style="font-size:15px;font-weight:600;color:var(--ink-950);margin-bottom:8px">
              Aplikasi tidak mendeteksi aktivitas pengguna selama <strong>${timeoutMinutes} menit</strong>.
            </p>
            <p style="font-size:13px;color:var(--ink-500);margin:0;line-height:1.5">
              Demi perlindungan data inventori, akun Anda akan otomatis dikeluarkan jika tidak ada respons sebelum hitungan mundur di atas berakhir. Klik <strong>Tetap Lanjut</strong> untuk mempertahankan sesi.
            </p>
          </div>
          <div class="modal-footer" style="justify-content:center;gap:12px">
            <button class="btn btn-secondary" data-action="confirm-inactivity-logout">
              ${icon('logout')} Keluar Sekarang
            </button>
            <button class="btn btn-primary" data-action="extend-inactivity-session" style="min-width:140px">
              ${icon('check')} Tetap Lanjut
            </button>
          </div>
        `);

        if (countdownTimerInterval) clearInterval(countdownTimerInterval);
        countdownTimerInterval = setInterval(() => {
          countdownSecondsRemaining--;
          const timerTextEl = document.getElementById('inactivityCountdownText');
          if (timerTextEl) {
            timerTextEl.textContent = `${countdownSecondsRemaining} detik`;
          }
          if (countdownSecondsRemaining <= 0) {
            clearInterval(countdownTimerInterval);
            countdownTimerInterval = null;
            forceInactivityLogout(`Sesi Anda berakhir otomatis karena tidak ada aktivitas selama ${timeoutMinutes} menit. Silakan login kembali.`);
          }
        }, 1000);
      }

      function extendInactivitySession() {
        if (countdownTimerInterval) {
          clearInterval(countdownTimerInterval);
          countdownTimerInterval = null;
        }
        inactivityWarningActive = false;
        lastActivityTime = Date.now();
        closeModal();
        showToast('Sesi Diperpanjang', 'Waktu inaktivitas Anda telah di-reset.');
      }

      function forceInactivityLogout(reasonMessage) {
        if (countdownTimerInterval) {
          clearInterval(countdownTimerInterval);
          countdownTimerInterval = null;
        }
        inactivityWarningActive = false;
        closeModal();

        const timeoutMinutes = Number(store.settings?.autoLogoutMinutes) || 15;
        if (state.currentUser) {
          addAuditLog('AUTO_LOGOUT', 'Sesi', state.currentUser.username, `Logout otomatis akibat tidak ada aktivitas selama ${timeoutMinutes} menit`);
          saveStore();
        }
        clearSession();
        state.isLoggedIn = false;
        state.currentUser = null;
        state.loginNotice = reasonMessage || `Sesi Anda telah berakhir otomatis karena tidak ada aktivitas selama ${timeoutMinutes} menit. Silakan login kembali.`;
        render();
      }

      // Check inactivity every 5 seconds
      setInterval(() => {
        if (!state.isLoggedIn) return;
        if (store.settings && store.settings.autoLogoutEnabled === false) return;
        if (inactivityWarningActive) return;

        const timeoutMinutes = Number(store.settings?.autoLogoutMinutes) || 15;
        const timeoutMs = timeoutMinutes * 60 * 1000;
        if (Date.now() - lastActivityTime >= timeoutMs) {
          inactivityWarningActive = true;
          showInactivityWarningModal();
        }
      }, 5000);

      // Login / Logout Functions
      function handleLogin(username, password) {
        const uInput = document.getElementById('loginUsername');
        const pInput = document.getElementById('loginPassword');
        if (uInput) uInput.classList.remove('input-error');
        if (pInput) pInput.classList.remove('input-error');

        const alertBox = document.getElementById('loginAlertBox');
        if (alertBox) {
          alertBox.style.display = 'none';
          alertBox.innerHTML = '';
        }

        const showLoginAlert = (msg, inputToFocus) => {
          if (alertBox) {
            alertBox.style.display = 'block';
            alertBox.innerHTML = `
              <div style="background:var(--danger-soft);border:1px solid var(--danger);border-radius:var(--radius-sm);padding:10px 12px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--danger);animation:loginShake 0.35s ease">
                ${icon('alert')}
                <div style="flex:1;line-height:1.4">${msg}</div>
              </div>
            `;
          }
          if (inputToFocus) {
            inputToFocus.classList.add('input-error');
            inputToFocus.focus();
          }
        };

        if (!username && !password) {
          showLoginAlert('Silakan masukkan username dan kata sandi Anda.', uInput);
          return showToast('Form Belum Lengkap', 'Masukkan username dan kata sandi.', true);
        }
        if (!username) {
          showLoginAlert('Username belum diisi. Silakan masukkan username Anda.', uInput);
          return showToast('Form Belum Lengkap', 'Username belum diisi.', true);
        }
        if (!password) {
          showLoginAlert('Kata sandi belum diisi. Silakan masukkan kata sandi Anda.', pInput);
          return showToast('Form Belum Lengkap', 'Kata sandi belum diisi.', true);
        }

        // Server-Side Verification jika terhubung ke Google Apps Script
        if (isAppsScriptEnv) {
          showToast('Memverifikasi...', 'Sedang memeriksa kredensial ke server...');
          google.script.run
            .withSuccessHandler(function(res) {
              if (res && res.status === 'success' && res.user) {
                completeLoginSuccess(res.user);
              } else {
                showLoginAlert(res?.message || 'Login gagal. Periksa kembali username dan kata sandi.', pInput);
                showToast('Login Gagal', res?.message || 'Kredensial tidak valid', true);
              }
            })
            .withFailureHandler(function(err) {
              console.warn('Verifikasi server gagal, mencoba verifikasi offline lokal:', err);
              verifyLocalLogin(username, password, uInput, pInput, showLoginAlert);
            })
            .apiLogin(username, password);
          return;
        }

        // Jika terhubung via HTTP Sheets URL
        if (storedSheetsUrl) {
          showToast('Memverifikasi...', 'Sedang memeriksa kredensial ke database...');
          fetch(storedSheetsUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'login', username, password })
          })
          .then(r => r.json())
          .then(res => {
            if (res && res.status === 'success' && res.user) {
              completeLoginSuccess(res.user);
            } else {
              showLoginAlert(res?.message || 'Login gagal. Periksa kembali username dan kata sandi.', pInput);
              showToast('Login Gagal', res?.message || 'Kredensial tidak valid', true);
            }
          })
          .catch(err => {
            console.warn('Gagal koneksi cloud login, menggunakan verifikasi lokal:', err);
            verifyLocalLogin(username, password, uInput, pInput, showLoginAlert);
          });
          return;
        }

        // Standalone / Offline Local Verification
        verifyLocalLogin(username, password, uInput, pInput, showLoginAlert);
      }

      function completeLoginSuccess(user) {
        // Sinkronisasi data user lokal
        const existing = store.users.find(u => u.username.toLowerCase() === user.username.toLowerCase());
        if (existing) {
          existing.lastLogin = user.lastLogin || getNowFormatted();
          existing.role = user.role;
          existing.warehouse = user.warehouse;
        }

        state.isLoggedIn = true;
        state.currentUser = user;
        state.role = user.role;
        state.route = 'dashboard';
        state.loginNotice = null;
        lastActivityTime = Date.now();
        inactivityWarningActive = false;

        saveSession(user);
        addAuditLog('LOGIN', 'Sesi', user.username, `Login berhasil (${user.role})`);
        saveStore();
        showToast('Login Berhasil', `Selamat datang, ${user.name}!`);
        render();

        // Refresh data cloud setelah login
        if (isAppsScriptEnv || storedSheetsUrl) {
          syncFromGoogleSheets(false);
        }
      }

      function verifyLocalLogin(username, password, uInput, pInput, showLoginAlert) {
        const user = store.users.find(u => u.username.toLowerCase() === username.toLowerCase());
        if (!user) {
          addAuditLog('LOGIN_FAILED', 'Sesi', username, 'Percobaan login gagal: Username tidak ditemukan');
          saveStore();
          showLoginAlert(`Username "<strong>${escapeHtml(username)}</strong>" tidak ditemukan. Pastikan ejaan benar atau hubungi Administrator.`, uInput);
          return showToast('Login Gagal', 'Username tidak ditemukan!', true);
        }

        if (user.password !== password) {
          addAuditLog('LOGIN_FAILED', 'Sesi', username, 'Percobaan login gagal: Password salah');
          saveStore();
          showLoginAlert('Kata sandi yang Anda masukkan salah. Periksa kembali huruf besar/kecil.', pInput);
          return showToast('Login Gagal', 'Kata sandi salah!', true);
        }

        if (user.active === false) {
          showLoginAlert('Akun Anda telah dinonaktifkan oleh Administrator.', null);
          return showToast('Akun Nonaktif', 'Akun Anda dinonaktifkan. Hubungi Administrator.', true);
        }

        completeLoginSuccess(user);
      }

      function confirmLogout() {

      // Theme Management
      function applyTheme(themeName) {
        state.theme = themeName;
        localStorage.setItem('stokkita_theme', themeName);
        if (themeName === 'dark') {
          document.body.setAttribute('data-theme', 'dark');
          document.body.classList.add('dark-mode');
        } else {
          document.body.removeAttribute('data-theme');
          document.body.classList.remove('dark-mode');
        }
        updateThemeToggleIcons();
      }

      function toggleTheme() {
        const nextTheme = state.theme === 'dark' ? 'light' : 'dark';
        applyTheme(nextTheme);
        showToast('Tema Diubah', `Beralih ke Mode ${nextTheme === 'dark' ? 'Gelap' : 'Terang'}`);
      }

      function updateThemeToggleIcons() {
        const isDark = state.theme === 'dark';
        const sun = document.getElementById('themeIconSun');
        const moon = document.getElementById('themeIconMoon');
        if (sun) sun.style.display = isDark ? 'block' : 'none';
        if (moon) moon.style.display = isDark ? 'none' : 'block';
        const loginThemeBtn = document.querySelector('.login-theme-toggle');
        if (loginThemeBtn) {
          loginThemeBtn.innerHTML = icon(isDark ? 'sun' : 'moon');
        }
      }

      // Fullscreen & Immersive Mobile Mode Management
      function isFullscreenActive() {
        return Boolean(
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          document.mozFullScreenElement ||
          document.msFullscreenElement ||
          document.documentElement.classList.contains('pseudo-fullscreen')
        );
      }

      function updateFullscreenUI(isActive) {
        const btn = document.getElementById('fullscreenToggleBtn');
        const sidebarBtn = document.getElementById('sidebarFsBtn');
        const iconExpand = document.getElementById('fsIconExpand');
        const iconCompress = document.getElementById('fsIconCompress');

        if (btn) {
          btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
          btn.classList.toggle('active', isActive);
          btn.title = isActive ? 'Keluar dari Layar Penuh (Esc)' : 'Layar Penuh (Fullscreen)';
        }
        if (sidebarBtn) {
          sidebarBtn.classList.toggle('active', isActive);
          const span = sidebarBtn.querySelector('span');
          if (span) span.textContent = isActive ? 'Tutup Layar Penuh' : 'Mode Layar Penuh';
        }
        if (iconExpand && iconCompress) {
          iconExpand.style.display = isActive ? 'none' : 'block';
          iconCompress.style.display = isActive ? 'block' : 'none';
        }
        document.documentElement.classList.toggle('is-fullscreen', isActive);
        document.body.classList.toggle('is-fullscreen', isActive);
      }

      function enablePseudoFullscreen() {
        document.documentElement.classList.add('pseudo-fullscreen');
        document.body.classList.add('pseudo-fullscreen');
        updateFullscreenUI(true);
        showToast('Layar Penuh Aktif', 'Tampilan dimaksimalkan untuk kenyamanan di ponsel.');
      }

      function disablePseudoFullscreen() {
        document.documentElement.classList.remove('pseudo-fullscreen');
        document.body.classList.remove('pseudo-fullscreen');
        updateFullscreenUI(false);
        showToast('Layar Penuh Ditutup', 'Kembali ke tampilan standar.');
      }

      async function toggleFullscreen() {
        const doc = document.documentElement;
        const isFs = isFullscreenActive();

        if (!isFs) {
          try {
            if (doc.requestFullscreen) {
              await doc.requestFullscreen({ navigationUI: 'hide' });
            } else if (doc.webkitRequestFullscreen) {
              await doc.webkitRequestFullscreen();
            } else if (doc.mozRequestFullScreen) {
              await doc.mozRequestFullScreen();
            } else if (doc.msRequestFullscreen) {
              await doc.msRequestFullscreen();
            } else {
              enablePseudoFullscreen();
              return;
            }
            showToast('Layar Penuh Aktif', 'Tampilan dimaksimalkan untuk kenyamanan di ponsel.');
          } catch (err) {
            console.warn('Native Fullscreen tidak didukung atau dibatasi, menggunakan mode imersif:', err);
            enablePseudoFullscreen();
          }
        } else {
          if (document.documentElement.classList.contains('pseudo-fullscreen')) {
            disablePseudoFullscreen();
          } else {
            try {
              if (document.exitFullscreen) {
                await document.exitFullscreen();
              } else if (document.webkitExitFullscreen) {
                await document.webkitExitFullscreen();
              } else if (document.mozCancelFullScreen) {
                await document.mozCancelFullScreen();
              } else if (document.msExitFullscreen) {
                await document.msExitFullscreen();
              }
              showToast('Layar Penuh Ditutup', 'Kembali ke tampilan standar.');
            } catch (err) {
              console.warn('Exit fullscreen error:', err);
              disablePseudoFullscreen();
            }
          }
        }
      }

      // Sync with native browser fullscreen events
      ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
        document.addEventListener(evt, () => {
          const isFs = Boolean(
            document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.mozFullScreenElement ||
            document.msFullscreenElement
          );
          updateFullscreenUI(isFs);
        });
      });

      // Event Listeners
      document.addEventListener('click', event => {
        // Fullscreen toggle
        if (event.target.closest('#fullscreenToggleBtn') || event.target.closest('[data-action="toggle-fullscreen"]')) {
          const sidebar = document.getElementById('sidebar');
          const backdrop = document.getElementById('sidebarBackdrop');
          if (sidebar && sidebar.classList.contains('open')) {
            sidebar.classList.remove('open');
            if (backdrop) backdrop.classList.remove('show');
          }
          toggleFullscreen();
          return;
        }

        // Theme toggle
        if (event.target.closest('#themeToggleBtn') || event.target.closest('[data-action="toggle-theme"]')) {
          toggleTheme();
          return;
        }

        const routeEl = event.target.closest('[data-route]');
        if (routeEl) return navigate(routeEl.dataset.route);

        const roleEl = event.target.closest('[data-role]');
        if (roleEl) {
          state.role = roleEl.dataset.role;
          state.route = 'dashboard';
          closeModal();
          render();
          return showToast(`Mode ${state.role === 'ADMIN' ? 'Admin' : 'Staf Gudang'} Aktif`);
        }

        const removeEl = event.target.closest('[data-remove-line]');
        if (removeEl) {
          state.transactionLines.splice(Number(removeEl.dataset.removeLine), 1);
          return render();
        }

        const removeModalLineEl = event.target.closest('[data-remove-modal-line]');
        if (removeModalLineEl) {
          const idx = Number(removeModalLineEl.dataset.removeModalLine);
          state.transactionLines.splice(idx, 1);
          renderNewTransactionModal();
          return;
        }

        const removeTrfEl = event.target.closest('[data-remove-trf-line]');
        if (removeTrfEl) {
          const idx = Number(removeTrfEl.dataset.removeTrfLine);
          state.transferLines.splice(idx, 1);
          renderNewTransferModal();
          return;
        }

        const removeEditTxLineEl = event.target.closest('[data-remove-edit-tx-line]');
        if (removeEditTxLineEl) {
          const idx = Number(removeEditTxLineEl.dataset.removeEditTxLine);
          state.editTxLines.splice(idx, 1);
          renderEditTransactionModal();
          return;
        }

        const removeEditTrfLineEl = event.target.closest('[data-remove-edit-trf-line]');
        if (removeEditTrfLineEl) {
          const idx = Number(removeEditTrfLineEl.dataset.removeEditTrfLine);
          state.editTransferLines.splice(idx, 1);
          renderEditTransferModal();
          return;
        }

        const actionEl = event.target.closest('[data-action]');
        if (!actionEl) return;
        const action = actionEl.dataset.action;

        // Modal actions
        if (action === 'close-modal') return closeModal();
        if (action === 'nav-and-close') { closeModal(); return navigate(actionEl.dataset.target); }
        if (action === 'switch-tx-tab') {
          if (!state.txTab) state.txTab = {};
          state.txTab[actionEl.dataset.type] = actionEl.dataset.tab;
          return render();
        }

        // Transactions (Pop-up Modal)
        if (action === 'new-transaction') return openNewTransactionModal(actionEl.dataset.kind || 'incoming');
        if (action === 'submit-modal-transaction') return submitModalTransaction(actionEl.dataset.kind);
        if (action === 'submit-transaction') return submitTransaction(actionEl.dataset.kind);
        if (action === 'edit-transaction') return openEditTransactionModal(actionEl.dataset.no || actionEl.dataset.id);
        if (action === 'save-edit-tx-form') return executeSaveEditTransaction();
        if (action === 'delete-transaction') return executeDeleteTransaction(actionEl.dataset.no || actionEl.dataset.id);
        if (action === 'confirm-delete-transaction') return confirmExecuteDeleteTransaction(actionEl.dataset.no || actionEl.dataset.id);


        if (action === 'finish-tx-modal') {
          closeModal();
          state.transactionLines = [];
          state.transactionParty = '';
          state.transactionRef = '';
          state.transactionNotes = '';
          return render();
        }
        if (action === 'clear-form') {
          state.transactionLines = [];
          state.transactionParty = '';
          state.transactionRef = '';
          state.transactionNotes = '';
          return render();
        }
        if (action === 'refresh' || action === 'manual-refresh') {
          const refreshBtn = document.getElementById('topRefreshBtn');
          if (refreshBtn) refreshBtn.classList.add('spinning');
          if (isAppsScriptEnv || storedSheetsUrl) {
            syncFromGoogleSheets(true).finally(() => {
              if (refreshBtn) refreshBtn.classList.remove('spinning');
            });
          } else {
            setTimeout(() => {
              if (refreshBtn) refreshBtn.classList.remove('spinning');
              render();
              showToast('Data Diperbarui', 'Tampilan inventori telah dimuat ulang (Mode Lokal).');
            }, 300);
          }
          return;
        }

        // View Detail & Stock Card
        if (action === 'view-stock-card') {
          if (actionEl.dataset.id) {
            state.stockCardProductId = actionEl.dataset.id;
          }
          navigate('stockcard');
          return;
        }
        if (action === 'view-tx-receipt') {
          const tx = store.transactions.find(t => t.no === actionEl.dataset.no || t.id === actionEl.dataset.no || t.id === actionEl.dataset.id);
          if (tx) {
            const details = tx.details || [];
            const itemsListHtml = details.length > 0
              ? details.map(d => `<div class="receipt-row"><span>${d.name} (${d.sku})</span><strong>${d.qty} ${d.unit || 'unit'}</strong></div>`).join('')
              : `<div class="receipt-row"><span>Kuantitas Total</span><strong>${tx.qty} unit</strong></div>`;

            openModal(`
              <div class="modal-header">
                <div><h2 id="modalTitle">Bukti Transaksi: ${tx.no}</h2><p>${tx.date} · Dicatat oleh: ${tx.user}</p></div>
                <button class="icon-btn" data-action="close-modal">${icon('close')}</button>
              </div>
              <div class="modal-body">
                <div class="receipt">
                  <div class="receipt-row"><span>Nomor Transaksi</span><strong>${tx.no}</strong></div>
                  <div class="receipt-row"><span>Jenis</span><strong>${tx.type}</strong></div>
                  <div class="receipt-row"><span>Lokasi Gudang</span><strong>${tx.warehouse}</strong></div>
                  <div class="receipt-row"><span>Pihak Terkait</span><strong>${tx.party || '—'}</strong></div>
                  <div class="receipt-row"><span>Nomor Referensi</span><strong>${tx.refNo || '—'}</strong></div>
                  <div class="receipt-row"><span>Total Kuantitas</span><strong>${tx.qty} unit (${tx.items || details.length} SKU)</strong></div>
                  <div style="border-top:1px dashed var(--ink-200);margin:8px 0;padding-top:8px">
                    <span style="font-size:11px;font-weight:700;color:var(--ink-600);display:block;margin-bottom:6px">Rincian Barang:</span>
                    ${itemsListHtml}
                  </div>
                  <div class="receipt-row"><span>Catatan</span><span>${tx.notes || '—'}</span></div>
                </div>
                ${tx.photo ? `
                  <div style="margin-top:14px;padding:12px;background:var(--bg-subtle, #f8fafc);border:1px solid var(--border);border-radius:8px;text-align:center;">
                    <div style="font-size:12px;font-weight:600;margin-bottom:8px;color:var(--ink-700);text-align:left;display:flex;align-items:center;gap:6px;">
                      <svg class="icon" style="width:14px;height:14px;color:var(--brand-600)"><use href="#i-camera" /></svg>
                      Bukti Foto Dokumen / Barang:
                    </div>
                    <img src="${escapeHtml(tx.photo)}" alt="Bukti Foto" style="max-width:100%;max-height:220px;object-fit:contain;border-radius:6px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.1);" data-action="view-photo" data-photo="${escapeHtml(tx.photo)}" data-title="Bukti Foto: ${escapeHtml(tx.no)}" title="Klik untuk memperbesar">
                    <div style="margin-top:6px;">
                      <button type="button" class="btn btn-ghost btn-sm photo-zoom-btn no-print" data-action="view-photo" data-photo="${escapeHtml(tx.photo)}" data-title="Bukti Foto: ${escapeHtml(tx.no)}" style="font-size:11px;padding:2px 8px;">
                        ${icon('eye')} Perbesar Foto
                      </button>
                    </div>
                  </div>
                ` : ''}
              </div>
              <div class="modal-footer">
                <button class="btn btn-secondary" onclick="window.print()">${icon('printer')} Cetak</button>
                ${state.role !== 'STAFF' ? `
                  <button class="btn btn-secondary" data-action="edit-transaction" data-no="${tx.no}">${icon('edit')} Edit Transaksi</button>
                  <button class="btn btn-danger" data-action="delete-transaction" data-no="${tx.no}">${icon('trash')} Hapus Transaksi</button>
                ` : ''}
                <button class="btn btn-primary" data-action="close-modal">Tutup</button>
              </div>
            `);
          }
          return;
        }

      // Action Handlers
      function render() {
        const loginEl = document.getElementById('loginScreen');
        const shellEl = document.getElementById('appShell');

        if (!state.isLoggedIn) {
          if (loginEl) {
            loginEl.style.display = 'flex';
            renderLoginScreen();
          }
          if (shellEl) shellEl.style.display = 'none';
          return;
        }

        if (loginEl) loginEl.style.display = 'none';
        if (shellEl) shellEl.style.display = 'block';

        // Staff route protection
        if (state.role === 'STAFF') {
          const forbiddenForStaff = ['incoming', 'damaged', 'products', 'categories', 'warehouses', 'users', 'audit', 'settings'];
          if (forbiddenForStaff.includes(state.route)) {
            state.route = 'dashboard';
            showToast('Akses Dibatasi', 'Menu ini hanya dapat diakses oleh Administrator.', true);
          }
        }

        renderNav();
        updateHeader();
        const pages = {
          dashboard: dashboardPage, stock: stockPage, stockcard: stockCardPage, barcodes: barcodePage, incoming: () => transactionPage('incoming'),
          outgoing: () => transactionPage('outgoing'), damaged: damagedPage, transfer: transferPage, opname: opnamePage,
          reports: reportsPage, products: productsPage, categories: categoriesPage, warehouses: warehousesPage,
          users: usersPage, audit: auditPage, settings: settingsPage, history: historyPage
        };

        const pageRenderer = pages[state.route] || dashboardPage;
        document.getElementById('appContent').innerHTML = pageRenderer();
        updateThemeToggleIcons();
        window.scrollTo({ top: 0, behavior: 'instant' });
      }

      // Print handling: distinguish modal receipts vs full reports
      let isPrintingBarcodes = false;

      window.addEventListener('beforeprint', () => {
        if (isPrintingBarcodes) {
          document.body.classList.add('printing-barcodes');
          document.body.classList.remove('printing-modal', 'printing-report');
          return;
        }
        const modalEl = document.getElementById('modal');
        if (modalEl && modalEl.classList.contains('show')) {
          document.body.classList.add('printing-modal');
          document.body.classList.remove('printing-report');
        } else {
          document.body.classList.add('printing-report');
          document.body.classList.remove('printing-modal');
        }
      });
      window.addEventListener('afterprint', () => {
        isPrintingBarcodes = false;
        document.body.classList.remove('printing-modal', 'printing-report', 'printing-barcodes');
      });

      // Initial Theme, Sheets Status & Render

      // Multi-Device Realtime Auto-Sync (Sinkronisasi Otomatis HP & Komputer)
      let autoSyncInterval = null;
      function startMultiDeviceSync() {
        if (autoSyncInterval) clearInterval(autoSyncInterval);
        autoSyncInterval = setInterval(() => {
          if (!state.isLoggedIn) return;
          if (document.hidden) return; // Hemat resource jika tab diminimalkan
          if (currentSheetsStatus === 'syncing') return;
          // Jangan timpa jika modal input sedang dibuka pengguna
          const modalEl = document.getElementById('modal');
          if (modalEl && modalEl.classList.contains('show')) return;

          if (isAppsScriptEnv || storedSheetsUrl) {
            syncFromGoogleSheets(false);
          }
        }, 25000); // Sinkronisasi otomatis setiap 25 detik
      }

      // Deteksi ketika pengguna kembali membuka tab aplikasi di HP atau Komputer
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && state.isLoggedIn) {
          if (currentSheetsStatus !== 'syncing' && (isAppsScriptEnv || storedSheetsUrl)) {
            const modalEl = document.getElementById('modal');
            if (!modalEl || !modalEl.classList.contains('show')) {
              syncFromGoogleSheets(false);
            }
          }
        }
      });

      window.addEventListener('focus', () => {
        if (state.isLoggedIn && currentSheetsStatus !== 'syncing' && (isAppsScriptEnv || storedSheetsUrl)) {
          const modalEl = document.getElementById('modal');
          if (!modalEl || !modalEl.classList.contains('show')) {
            syncFromGoogleSheets(false);
          }
        }
      });

      startMultiDeviceSync();

      // ================================================================
      // AI CHAT ASSISTANT — StokKita Intelligence Engine
      // ================================================================
      (function initAIChat() {
        const AI_FAQ_KEY = 'stokkita_ai_faq_v1';
        const AI_HISTORY_KEY = 'stokkita_ai_history_v1';
        const MAX_HISTORY = 50;

        // ── FAQ tracker (simpan di localStorage) ──────────────────────
        function loadFAQ() {
          try { return JSON.parse(localStorage.getItem(AI_FAQ_KEY) || '[]'); } catch { return []; }
        }
        function saveFAQ(list) {
          try { localStorage.setItem(AI_FAQ_KEY, JSON.stringify(list)); } catch {}
        }
        function recordQuestion(q) {
          const list = loadFAQ();
          const key = q.trim().toLowerCase();
          const idx = list.findIndex(x => x.key === key);
          if (idx >= 0) { list[idx].count++; list[idx].last = Date.now(); }
          else { list.push({ key, text: q.trim(), count: 1, last: Date.now() }); }
          list.sort((a, b) => b.count - a.count);
          saveFAQ(list.slice(0, MAX_HISTORY));
          return list;
        }
        function getTopFAQ(n = 5) {
          return loadFAQ().slice(0, n);
        }

        // ── Shortcut suggestions (always available) ───────────────────
        const DEFAULT_SUGGESTIONS = [
          'Stok apa yang hampir habis?',
          'Barang apa yang paling banyak keluar bulan ini?',
          'Berapa total nilai stok saat ini?',
          'Produk mana yang belum pernah keluar?',
          'Gudang mana yang paling banyak aktivitasnya?',
        ];

        function getSuggestions() {
          const faq = getTopFAQ(3).map(x => x.text);
          // Gabung FAQ dengan default, hilangkan duplikat
          const all = [...faq, ...DEFAULT_SUGGESTIONS];
          const seen = new Set();
          return all.filter(s => { const k = s.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 5);
        }

        // ── Analisis Engine (pure local data) ─────────────────────────
        function analyzeQuery(q) {
          const Q = (q || '').toLowerCase();

          // Helper
          const products = store.products || [];
          const transactions = store.transactions || [];
          const transfers = store.transfers || [];
          const warehouses = store.warehouses || [];
          const categories = store.categories || [];

          function getStock(p, wh) {
            if (!p.stocks || typeof p.stocks !== 'object') return 0;
            if (!wh || wh === 'Semua Gudang') return Object.values(p.stocks).reduce((s, v) => s + Number(v || 0), 0);
            return Number(p.stocks[wh] || 0);
          }
          function formatRp(n) { return 'Rp\u00A0' + rupiah.format(Math.round(n)); }
          function timeLabel(ms) {
            const d = Date.now() - ms;
            if (d < 86400000) return 'hari ini';
            if (d < 7 * 86400000) return Math.round(d / 86400000) + ' hari lalu';
            if (d < 30 * 86400000) return Math.round(d / 7 / 86400000) + ' minggu lalu';
            return Math.round(d / 30 / 86400000) + ' bulan lalu';
          }

          // ---- TOTAL NILAI STOK ----
          if (/nilai\s*stok|total\s*stok|harga\s*stok|aset|modal/.test(Q)) {
            const total = products.reduce((sum, p) => {
              const qty = getStock(p, 'Semua Gudang');
              const harga = Number(p.price || p.harga || 0);
              return sum + qty * harga;
            }, 0);
            const totalQty = products.reduce((s, p) => s + getStock(p, 'Semua Gudang'), 0);
            return `💰 <strong>Total Nilai Stok</strong><br>Terdapat <b>${products.length}</b> jenis produk dengan total <b>${rupiah.format(totalQty)}</b> unit.<br>Estimasi nilai stok saat ini: <b>${formatRp(total)}</b>${total === 0 ? ' — pastikan harga satuan sudah diisi di Master Barang.' : '.'}`;
          }

          // ---- STOK HAMPIR HABIS / KRITIS ----
          if (/hampir\s*habis|kritis|minim|menipis|low\s*stock|rendah|kurang/.test(Q)) {
            const low = products.filter(p => {
              const qty = getStock(p, 'Semua Gudang');
              const min = Number(p.min || p.minStock || 0);
              return qty <= (min > 0 ? min : 5) && p.active !== false;
            }).sort((a, b) => getStock(a, 'Semua Gudang') - getStock(b, 'Semua Gudang')).slice(0, 10);
            if (!low.length) return '✅ Tidak ada produk dengan stok kritis saat ini. Semua barang masih aman!';
            const rows = low.map(p => `<tr><td>${escapeHtml(p.name || p.nama)}</td><td style="color:var(--danger);font-weight:700">${getStock(p,'Semua Gudang')}</td><td>${escapeHtml(p.min || 0)}</td></tr>`).join('');
            return `⚠️ <strong>${low.length} Produk Stok Kritis:</strong><table class="ai-data-table"><thead><tr><th>Produk</th><th>Stok</th><th>Min</th></tr></thead><tbody>${rows}</tbody></table>`;
          }

          // ---- STOK NOL / HABIS ----
          if (/stok\s*(nol|habis|kosong|0)|barang\s*habis/.test(Q)) {
            const empty = products.filter(p => getStock(p, 'Semua Gudang') <= 0 && p.active !== false);
            if (!empty.length) return '✅ Tidak ada produk dengan stok nol saat ini.';
            const rows = empty.slice(0, 10).map(p => `<tr><td>${escapeHtml(p.name || p.nama)}</td><td>${escapeHtml(p.sku || '-')}</td><td>${escapeHtml(p.category || '-')}</td></tr>`).join('');
            return `📦 <strong>${empty.length} Produk Stok Nol:</strong><table class="ai-data-table"><thead><tr><th>Produk</th><th>SKU</th><th>Kategori</th></tr></thead><tbody>${rows}</tbody></table>`;
          }

          // ---- PRODUK TERLARIS / PALING BANYAK KELUAR ----
          if (/terlaris|paling\s*banyak\s*keluar|top\s*produk|penjualan\s*terbanyak|barang\s*paling\s*laku/.test(Q)) {
            const outTx = transactions.filter(t => (t.type || '').toLowerCase().includes('keluar'));
            const counter = {};
            outTx.forEach(t => {
              const nama = t.nama_barang || t.name || t.product || '';
              const qty = Number(t.qty || t.quantity || 1);
              if (nama) counter[nama] = (counter[nama] || 0) + qty;
            });
            const sorted = Object.entries(counter).sort((a, b) => b[1] - a[1]).slice(0, 8);
            if (!sorted.length) return '📊 Belum ada data barang keluar yang tercatat.';
            const rows = sorted.map(([n, q]) => `<tr><td>${escapeHtml(n)}</td><td><b>${rupiah.format(q)}</b></td></tr>`).join('');
            return `🏆 <strong>Produk Paling Banyak Keluar:</strong><table class="ai-data-table"><thead><tr><th>Produk</th><th>Total Keluar</th></tr></thead><tbody>${rows}</tbody></table>`;
          }

          // ---- PRODUK SLOW MOVING / BELUM PERNAH KELUAR ----
          if (/slow\s*moving|belum\s*pernah\s*keluar|tidak\s*laku|diam|tidak\s*bergerak/.test(Q)) {
            const outNames = new Set(transactions.filter(t => (t.type || '').toLowerCase().includes('keluar')).map(t => (t.nama_barang || t.name || '').toLowerCase()));
            const slow = products.filter(p => !outNames.has((p.name || p.nama || '').toLowerCase()) && p.active !== false);
            if (!slow.length) return '✅ Semua produk aktif sudah pernah keluar!';
            const rows = slow.slice(0, 10).map(p => `<tr><td>${escapeHtml(p.name || p.nama)}</td><td>${escapeHtml(p.sku || '-')}</td><td>${getStock(p,'Semua Gudang')}</td></tr>`).join('');
            return `🐌 <strong>${slow.length} Produk Slow-Moving (belum pernah keluar):</strong><table class="ai-data-table"><thead><tr><th>Produk</th><th>SKU</th><th>Stok</th></tr></thead><tbody>${rows}</tbody></table>`;
          }

          // ---- RINGKASAN GUDANG ----
          if (/gudang|warehouse|lokasi\s*stok/.test(Q)) {
            if (!warehouses.length) return 'Belum ada data gudang.';
            const rows = warehouses.map(w => {
              const totalStok = products.reduce((s, p) => s + getStock(p, w.name), 0);
              const jenis = products.filter(p => getStock(p, w.name) > 0).length;
              return `<tr><td>${escapeHtml(w.name)}</td><td>${rupiah.format(totalStok)}</td><td>${jenis}</td></tr>`;
            }).join('');
            return `🏭 <strong>Ringkasan Per Gudang:</strong><table class="ai-data-table"><thead><tr><th>Gudang</th><th>Total Qty</th><th>Jenis Barang</th></tr></thead><tbody>${rows}</tbody></table>`;
          }

          // ---- TRANSAKSI TERBARU ----
          if (/transaksi\s*terbaru|aktivitas\s*terbaru|terakhir\s*(masuk|keluar)|last\s*transaction/.test(Q)) {
            const recent = transactions.slice(0, 5);
            if (!recent.length) return 'Belum ada transaksi yang dicatat.';
            const rows = recent.map(t => `<tr><td>${escapeHtml(t.transaction_no || t.no || '-')}</td><td>${escapeHtml(t.type || '-')}</td><td>${escapeHtml(t.nama_barang || t.name || '-')}</td><td>${escapeHtml(t.date || '-')}</td></tr>`).join('');
            return `🕒 <strong>5 Transaksi Terbaru:</strong><table class="ai-data-table"><thead><tr><th>No</th><th>Tipe</th><th>Barang</th><th>Tanggal</th></tr></thead><tbody>${rows}</tbody></table>`;
          }

          // ---- CARI BARANG SPESIFIK ----
          const searchKeyword = Q.replace(/^(cari|temukan|stok|berapa\s*stok|stok\s*barang|cek\s*stok)\s*/i, '').trim();
          if (searchKeyword.length > 2) {
            const found = products.filter(p => {
              const n = (p.name || p.nama || '').toLowerCase();
              const s = (p.sku || '').toLowerCase();
              return n.includes(searchKeyword) || s.includes(searchKeyword);
            });
            if (found.length) {
              const rows = found.slice(0, 8).map(p => {
                const totalQty = getStock(p, 'Semua Gudang');
                const whDetail = Object.entries(p.stocks || {}).map(([k, v]) => `${k}:${v}`).join(', ');
                return `<tr><td>${escapeHtml(p.name || p.nama)}</td><td>${escapeHtml(p.sku || '-')}</td><td><b>${totalQty}</b></td><td style="font-size:11px;color:var(--ink-500)">${escapeHtml(whDetail || '-')}</td></tr>`;
              }).join('');
              return `🔍 <strong>Ditemukan ${found.length} produk:</strong><table class="ai-data-table"><thead><tr><th>Produk</th><th>SKU</th><th>Total</th><th>Per Gudang</th></tr></thead><tbody>${rows}</tbody></table>`;
            }
          }

          // ---- STATISTIK UMUM / DASHBOARD ----
          if (/statistik|ringkasan|summary|overview|dashboard|laporan\s*singkat|rekap/.test(Q)) {
            const totalProd = products.length;
            const totalStok = products.reduce((s, p) => s + getStock(p, 'Semua Gudang'), 0);
            const lowCount = products.filter(p => { const q = getStock(p,'Semua Gudang'); const m = Number(p.min||p.minStock||0); return q <= (m > 0 ? m : 5); }).length;
            const txIn = transactions.filter(t => (t.type||'').toLowerCase().includes('masuk')).length;
            const txOut = transactions.filter(t => (t.type||'').toLowerCase().includes('keluar')).length;
            const nilaiTotal = products.reduce((sum, p) => sum + getStock(p,'Semua Gudang') * Number(p.price||p.harga||0), 0);
            return `📊 <strong>Ringkasan Inventori StokKita</strong><br><br>
📦 <b>${totalProd}</b> jenis produk terdaftar<br>
🗂️ <b>${rupiah.format(totalStok)}</b> unit total stok<br>
💰 <b>${formatRp(nilaiTotal)}</b> estimasi nilai stok<br>
⚠️ <b>${lowCount}</b> produk stok kritis<br>
✅ <b>${txIn}</b> transaksi barang masuk<br>
📤 <b>${txOut}</b> transaksi barang keluar<br>
🏭 <b>${warehouses.length}</b> gudang aktif`;
          }

          // ---- KATEGORI ----
          if (/kategori|category|kelompok\s*barang/.test(Q)) {
            if (!categories.length) return 'Belum ada kategori yang terdaftar.';
            const rows = categories.map(c => {
              const count = products.filter(p => (p.category || p.kategori || '') === c.name).length;
              return `<tr><td>${escapeHtml(c.name)}</td><td>${count}</td></tr>`;
            }).join('');
            return `🏷️ <strong>Daftar Kategori (${categories.length}):</strong><table class="ai-data-table"><thead><tr><th>Kategori</th><th>Jumlah Produk</th></tr></thead><tbody>${rows}</tbody></table>`;
          }

          // ---- TRANSFER TERBARU ----
          if (/transfer|pindah\s*stok|mutasi\s*antar\s*gudang/.test(Q)) {
            if (!transfers.length) return 'Belum ada transfer stok yang dicatat.';
            const rows = transfers.slice(0, 5).map(t => `<tr><td>${escapeHtml(t.transaction_no || t.no || '-')}</td><td>${escapeHtml(t.from_warehouse || t.dari || '-')}</td><td>${escapeHtml(t.to_warehouse || t.ke || '-')}</td><td>${escapeHtml(t.date || '-')}</td><td>${escapeHtml(t.status || '-')}</td></tr>`).join('');
            return `🔄 <strong>5 Transfer Terbaru:</strong><table class="ai-data-table"><thead><tr><th>No</th><th>Dari</th><th>Ke</th><th>Tanggal</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table>`;
          }

          // ---- DEFAULT / TIDAK DIMENGERTI ----
          return `🤖 Maaf, saya belum bisa menjawab pertanyaan tersebut secara spesifik. Coba tanyakan:<br>
• <em>Stok apa yang hampir habis?</em><br>
• <em>Cari [nama barang]</em><br>
• <em>Barang paling banyak keluar?</em><br>
• <em>Ringkasan inventori</em><br>
• <em>Total nilai stok?</em>`;
        }

        // ── Chat history (session) ─────────────────────────────────────
        let chatHistory = [];
        let panelOpen = false;

        function timeNow() {
          return new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        }

        function appendMessage(text, role) {
          const msgEl = document.createElement('div');
          msgEl.className = 'aichat-msg ' + role;
          const contentHtml = role === 'user' ? escapeHtml(text) : text;
          msgEl.innerHTML = `<div class="aichat-bubble">${contentHtml}</div><div class="aichat-msg-time">${timeNow()}</div>`;
          const msgsEl = document.getElementById('aiChatMessages');
          msgsEl.appendChild(msgEl);
          msgsEl.scrollTop = msgsEl.scrollHeight;
          return msgEl;
        }

        function showTyping() {
          const el = document.createElement('div');
          el.className = 'aichat-typing';
          el.id = 'aiTypingIndicator';
          el.innerHTML = '<span></span><span></span><span></span>';
          const msgsEl = document.getElementById('aiChatMessages');
          msgsEl.appendChild(el);
          msgsEl.scrollTop = msgsEl.scrollHeight;
        }

        function hideTyping() {
          const el = document.getElementById('aiTypingIndicator');
          if (el) el.remove();
        }

        function sendChat(q) {
          if (!q || !q.trim()) return;
          recordQuestion(q);
          appendMessage(q, 'user');
          chatHistory.push({ role: 'user', text: q });

          showTyping();

          const hasApiKey = store.settings && store.settings.geminiApiKey && String(store.settings.geminiApiKey).trim().length > 10;

          if (hasApiKey) {
            // Buat rangkuman ringkas inventori untuk konteks Gemini AI
            const lowProds = (store.products || []).filter(p => {
              const qty = getStock(p, 'Semua Gudang');
              const min = Number(p.min || p.minStock || 0);
              return qty <= (min > 0 ? min : 5);
            }).slice(0, 10).map(p => `${p.name} (SKU: ${p.sku}, Stok: ${getStock(p, 'Semua Gudang')}, Min: ${p.min || 0})`).join('; ');

            const whList = (store.warehouses || []).map(w => w.name).join(', ');
            const topProds = (store.products || []).slice(0, 15).map(p => `${p.name}: ${getStock(p, 'Semua Gudang')} ${p.unit || 'unit'}`).join('; ');

            const stockContext = `Total Jenis Produk: ${(store.products || []).length}\n` +
              `Gudang: ${whList || 'Gudang Utama'}\n` +
              `Produk Stok Kritis: ${lowProds || 'Tidak ada'}\n` +
              `Sampel Stok Produk: ${topProds}\n` +
              `Total Transaksi Tercatat: ${(store.transactions || []).length}`;

            const handleAiResponse = (res) => {
              hideTyping();
              if (res && res.status === 'success' && res.answer) {
                let formatted = escapeHtml(res.answer)
                  .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                  .replace(/\*(.*?)\*/g, '<em>$1</em>')
                  .replace(/\n\s*[\*\-]\s+(.*)/g, '<br>• $1')
                  .replace(/\n\n/g, '<br><br>')
                  .replace(/\n/g, '<br>');
                appendMessage(formatted, 'bot');
                chatHistory.push({ role: 'bot', text: res.answer });
              } else {
                const fallbackAns = analyzeQuery(q);
                appendMessage(fallbackAns, 'bot');
                chatHistory.push({ role: 'bot', text: fallbackAns });
              }
              renderFAQChips();
            };

            if (isAppsScriptEnv && typeof google !== 'undefined' && google.script && google.script.run) {
              google.script.run
                .withSuccessHandler(handleAiResponse)
                .withFailureHandler(() => {
                  hideTyping();
                  const fallbackAns = analyzeQuery(q);
                  appendMessage(fallbackAns, 'bot');
                  chatHistory.push({ role: 'bot', text: fallbackAns });
                  renderFAQChips();
                })
                .apiAskGemini(q, stockContext);
              return;
            } else if (storedSheetsUrl) {
              fetch(storedSheetsUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'askGemini', query: q, stockContext })
              })
              .then(r => r.json())
              .then(handleAiResponse)
              .catch(() => {
                hideTyping();
                const fallbackAns = analyzeQuery(q);
                appendMessage(fallbackAns, 'bot');
                chatHistory.push({ role: 'bot', text: fallbackAns });
                renderFAQChips();
              });
              return;
            }
          }

          // Analisis cepat offline / fallback
          setTimeout(() => {
            hideTyping();
            const answer = analyzeQuery(q);
            appendMessage(answer, 'bot');
            chatHistory.push({ role: 'bot', text: answer });
            renderFAQChips();
          }, 350 + Math.random() * 200);
        }

        function renderFAQChips() {
          const container = document.getElementById('aiFAQChips');
          if (!container) return;
          const suggestions = getSuggestions();
          const faqTop = getTopFAQ(3).map(x => x.text.toLowerCase());
          container.innerHTML = suggestions.map(s =>
            `<button class="faq-chip${faqTop.includes(s.toLowerCase()) ? ' hot' : ''}" data-q="${s.replace(/"/g, '&quot;')}">${s}</button>`
          ).join('');
        }

        function openPanel() {
          panelOpen = true;
          const panel = document.getElementById('aiChatPanel');
          panel.classList.add('open');
          document.getElementById('aiChatInput').focus();
          // Tampilkan pesan selamat datang jika kosong
          if (chatHistory.length === 0) {
            const bizName = (store.settings && store.settings.businessName) || 'Bisnis Anda';
            appendMessage(`👋 Halo! Saya <b>Asisten AI StokKita</b>.<br>Saya bisa membantu Anda menganalisis data stok <b>${bizName}</b>.<br><br>Silakan tanya apapun tentang inventori Anda, atau pilih pertanyaan di atas! 🚀`, 'bot');
          }
        }

        function closePanel() {
          panelOpen = false;
          document.getElementById('aiChatPanel').classList.remove('open');
        }

        // ── Build DOM ──────────────────────────────────────────────────
        function buildChatWidget() {
          // Chat Panel
          const panel = document.createElement('div');
          panel.id = 'aiChatPanel';
          panel.setAttribute('role', 'dialog');
          panel.setAttribute('aria-label', 'Asisten AI StokKita');
          panel.innerHTML = `
            <div class="aichat-header">
              <div class="aichat-avatar">🤖</div>
              <div class="aichat-title">
                <strong>Asisten AI StokKita</strong>
                <span>Analisis stok cerdas • Selalu online</span>
              </div>
              <button class="aichat-close-btn" id="aiChatCloseBtn" aria-label="Tutup chat">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
              </button>
            </div>
            <div class="aichat-faq-bar">
              <p>🔥 Pertanyaan Populer</p>
              <div class="faq-chips" id="aiFAQChips"></div>
            </div>
            <div class="aichat-messages" id="aiChatMessages"></div>
            <div class="aichat-input-row">
              <textarea id="aiChatInput" placeholder="Tanyakan tentang stok, barang, laporan…" rows="1" aria-label="Pesan ke AI"></textarea>
              <button id="aiChatSendBtn" aria-label="Kirim pesan">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-11 11M22 2l-7 20-4-9-9-4 20-7z"/></svg>
              </button>
            </div>
          `;

          // Floating Button
          const btn = document.createElement('button');
          btn.id = 'aiChatBtn';
          btn.setAttribute('aria-label', 'Buka Asisten AI StokKita');
          btn.title = 'Asisten AI — Analisis Stok';
          btn.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              <circle cx="9" cy="11" r="1" fill="currentColor" stroke="none"/>
              <circle cx="12" cy="11" r="1" fill="currentColor" stroke="none"/>
              <circle cx="15" cy="11" r="1" fill="currentColor" stroke="none"/>
            </svg>
            <span class="ai-chat-badge" id="aiChatBadge">AI</span>
          `;

          document.body.appendChild(panel);
          document.body.appendChild(btn);

          // Render FAQ chips
          renderFAQChips();

          // Events
          btn.addEventListener('click', () => panelOpen ? closePanel() : openPanel());
          document.getElementById('aiChatCloseBtn').addEventListener('click', closePanel);

          document.getElementById('aiChatSendBtn').addEventListener('click', () => {
            const inp = document.getElementById('aiChatInput');
            sendChat(inp.value.trim());
            inp.value = '';
            inp.style.height = 'auto';
          });

          document.getElementById('aiChatInput').addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              const inp = e.target;
              sendChat(inp.value.trim());
              inp.value = '';
              inp.style.height = 'auto';
            }
          });

          // Auto-resize textarea
          document.getElementById('aiChatInput').addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 90) + 'px';
          });

          // FAQ chip clicks (delegasi)
          document.getElementById('aiFAQChips').addEventListener('click', e => {
            const chip = e.target.closest('.faq-chip');
            if (chip) sendChat(chip.dataset.q);
          });
        }

        // Tunggu DOM siap
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', buildChatWidget);
        } else {
          buildChatWidget();
        }

      })(); // end AI Chat init

    })();
  </script>
</body>

</html>
