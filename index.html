    <div id="statusBadge" class="status-badge">Menyiapkan kamera...</div>

    <div class="btn-grid">
      <button type="button" id="captureBtn" class="btn-capture" onclick="takeSnapshot()">📸 Ambil Foto</button>
      <button type="button" id="useBtn" class="btn-use" onclick="confirmAndSendPhoto()">✓ Gunakan Foto Ini</button>
      <button type="button" id="retakeBtn" class="btn-retake" onclick="resetToLiveCamera()">↩ Foto Ulang</button>
      <button type="button" id="switchBtn" class="btn-switch" onclick="switchCameraFacing()">🔄 Ganti Kamera</button>
      <button type="button" id="closeBtn" class="btn-close" onclick="closeCameraWindow()">✕ Batal / Tutup</button>
    </div>
  </div>

  <script>
    var TARGET_PROP = ${safeTargetProp};
    var CONTAINER_ID = ${safeContainerId};
    var STORAGE_KEY = ${storageKey};

    var cameraStream = null;
    var currentFacing = 'environment';
    var capturedDataUrl = '';
    var videoEl = document.getElementById('cameraVideo');
    var canvasEl = document.getElementById('photoCanvas');
    var resultEl = document.getElementById('photoResult');
    var statusEl = document.getElementById('statusBadge');
    var captureBtn = document.getElementById('captureBtn');
    var useBtn = document.getElementById('useBtn');
    var retakeBtn = document.getElementById('retakeBtn');

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = 'status-badge' + (type ? ' ' + type : '');
    }

    function stopTracks() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(function(t) { t.stop(); });
        cameraStream = null;
      }
    }

    async function initCamera() {
      stopTracks();
      resetDisplayUI();
      setStatus('Meminta akses kamera...', '');

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus('Browser Anda tidak mendukung akses media kamera.', 'error');
        return;
      }

      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: currentFacing },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        videoEl.srcObject = cameraStream;
        await videoEl.play();
        setStatus(currentFacing === 'environment' ? 'Kamera belakang aktif.' : 'Kamera depan aktif.', 'success');
      } catch (err) {
        console.error(err);
        var msg = 'Kamera tidak dapat diakses.';
        if (err.name === 'NotAllowedError') msg = 'Izin kamera ditolak. Berikan izin kamera pada browser Anda.';
        else if (err.name === 'NotFoundError') msg = 'Perangkat kamera tidak ditemukan.';
        setStatus(msg, 'error');
      }
    }

    function switchCameraFacing() {
      currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
      initCamera();
    }

    function resetDisplayUI() {
      videoEl.style.display = 'block';
      resultEl.style.display = 'none';
      resultEl.src = '';
      captureBtn.style.display = 'block';
      useBtn.style.display = 'none';
      retakeBtn.style.display = 'none';
      capturedDataUrl = '';
    }

    function takeSnapshot() {
      if (!videoEl.videoWidth || !videoEl.videoHeight) {
        setStatus('Kamera belum siap, tunggu beberapa detik.', 'error');
        return;
      }

      var maxW = 1000;
      var scale = Math.min(1, maxW / videoEl.videoWidth);
      canvasEl.width = Math.round(videoEl.videoWidth * scale);
      canvasEl.height = Math.round(videoEl.videoHeight * scale);

      var ctx = canvasEl.getContext('2d');
      ctx.drawImage(videoEl, 0, 0, canvasEl.width, canvasEl.height);

      capturedDataUrl = canvasEl.toDataURL('image/jpeg', 0.80);
      resultEl.src = capturedDataUrl;

      videoEl.style.display = 'none';
      resultEl.style.display = 'block';
      captureBtn.style.display = 'none';
      useBtn.style.display = 'block';
      retakeBtn.style.display = 'block';

      setStatus('Foto berhasil diambil. Periksa pratinjau sebelum menyimpan.', 'success');
    }

    function resetToLiveCamera() {
      resetDisplayUI();
      setStatus('Silakan bidik kembali lalu tekan Ambil Foto.', '');
    }

    function confirmAndSendPhoto() {
      if (!capturedDataUrl) {
        setStatus('Belum ada foto yang diambil.', 'error');
        return;
      }

      var payload = {
        type: 'STOKKITA_CAMERA_PHOTO_RESULT',
        photoId: 'photo_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
        imageBase64: capturedDataUrl,
        targetProp: TARGET_PROP,
        containerId: CONTAINER_ID,
        timestamp: Date.now()
      };

      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, '*');
        }
      } catch (e) { }

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch (e) { }

      setStatus('Foto berhasil dikirim ke aplikasi StokKita! Menutup jendela...', 'success');
      setTimeout(function() {
        stopTracks();
        window.close();
      }, 400);
    }

    function closeCameraWindow() {
      stopTracks();
      window.close();
    }

    window.addEventListener('beforeunload', stopTracks);
    initCamera();
  <\/script>
</body>
</html>`;
      }

      function openCameraPopup(targetProp = 'transactionPhoto', containerId = 'txPhotoContainer') {
        const width = Math.min(480, screen.availWidth - 24);
        const height = Math.min(760, screen.availHeight - 40);
        const left = Math.max(0, Math.round((screen.availWidth - width) / 2));
        const top = Math.max(0, Math.round((screen.availHeight - height) / 2));

        try {
          localStorage.removeItem(CAMERA_STORAGE_KEY);
        } catch (e) { }

        cameraPopupWindow = window.open(
          '',
          'stokkita_camera_popup',
          `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes`
        );

        if (!cameraPopupWindow) {
          showToast('Popup Diblokir', 'Browser memblokir jendela kamera. Silakan izinkan popup untuk situs ini.', true);
          return;
        }

        const html = createCameraPopupHTML(targetProp, containerId);
        try {
          cameraPopupWindow.document.open();
          cameraPopupWindow.document.write(html);
          cameraPopupWindow.document.close();
          cameraPopupWindow.focus();
        } catch (err) {
          try {
            const blob = new Blob([html], { type: 'text/html' });
            cameraPopupWindow.location.href = URL.createObjectURL(blob);
          } catch (e) {
            console.error('Gagal menulis ke popup kamera:', e);
          }
        }

        startCameraPollingFallback(targetProp, containerId);
        showToast('Kamera Terbuka', 'Jendela kamera mandiri telah dibuka. Ambil foto lalu klik "Gunakan Foto Ini".');
      }

      function handleReceivedCameraPhoto(data) {
        if (!data || data.type !== 'STOKKITA_CAMERA_PHOTO_RESULT' || !data.photoId) return;
        if (processedPhotoIds.has(data.photoId)) return;
        processedPhotoIds.add(data.photoId);

        setTimeout(() => processedPhotoIds.delete(data.photoId), 60000);

        const targetProp = data.targetProp || 'transactionPhoto';
        const containerId = data.containerId || 'txPhotoContainer';
        const base64 = data.imageBase64;

        if (typeof base64 === 'string' && base64.startsWith('data:image/')) {
          state[targetProp] = base64;
          updatePhotoAttachmentContainer(containerId, base64);
          showToast('Foto Berhasil Dilampirkan', 'Foto bukti berhasil diterima dan siap disimpan bersama data.');
        }

        stopCameraPollingFallback();
      }

      function startCameraPollingFallback(expectedProp, expectedContainer) {
        stopCameraPollingFallback();
        let counter = 0;
        cameraPollingInterval = setInterval(() => {
          counter++;
          if (counter > 150 || (cameraPopupWindow && cameraPopupWindow.closed)) {
            stopCameraPollingFallback();
            return;
          }

          try {
            const raw = localStorage.getItem(CAMERA_STORAGE_KEY);
            if (raw) {
              localStorage.removeItem(CAMERA_STORAGE_KEY);
              const data = JSON.parse(raw);
              if (data && data.imageBase64) {
                handleReceivedCameraPhoto(data);
              }
            }
          } catch (e) { }
        }, 400);
      }

      function stopCameraPollingFallback() {
        if (cameraPollingInterval) {
          clearInterval(cameraPollingInterval);
          cameraPollingInterval = null;
        }
      }

      window.addEventListener('message', function (event) {
        if (event.data && event.data.type === 'STOKKITA_CAMERA_PHOTO_RESULT') {
          handleReceivedCameraPhoto(event.data);
        }
        if (event.data && event.data.type === 'STOKKITA_BARCODE_SCAN_RESULT') {
          handleReceivedBarcodeScan(event.data);
        }
      });

      // Triple-redundant BroadcastChannel for 0ms cross-tab scanner messaging
      try {
        if (typeof BroadcastChannel !== 'undefined') {
          const barcodeBC = new BroadcastChannel('stokkita_barcode_channel');
          barcodeBC.onmessage = function (event) {
            if (event.data && event.data.type === 'STOKKITA_BARCODE_SCAN_RESULT') {
              handleReceivedBarcodeScan(event.data);
            }
          };
        }
      } catch (e) { }

      // Web Audio API Synthesizer for instant scanner beep (no external audio required)
      function playBeepSound() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.12);
        } catch (e) { }
      }

      // Barcode & QR Scanner Popup (Bypass Apps Script Sandbox)

      background: #78350f;
      color: #fcd34d;
      border: 1px solid #d97706;
    }
    .code-pill {
      font-family: monospace;
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.08);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .product-summary-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .product-name {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .product-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }
    .meta-chip {
      font-size: 11px;
      color: var(--ink-muted);
      background: rgba(0, 0, 0, 0.25);
      padding: 2px 7px;
      border-radius: 5px;
    }
    .product-stock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      padding-top: 8px;
      font-size: 12px;
    }
    .stock-val {
      font-weight: 800;
      color: #34d399;
    }

    .notfound-card {
      background: rgba(120, 53, 15, 0.18);
      border: 1px solid rgba(217, 119, 6, 0.35);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      margin-bottom: 8px;
    }
    .notfound-code {
      font-family: monospace;
      font-size: 18px;
      font-weight: 800;
      color: #fef3c7;
      margin: 4px 0;
    }
    .notfound-hint {
      font-size: 12px;
      color: #fde68a;
      line-height: 1.4;
    }

    .actions-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: auto;
    }
    #scanFeedbackSheet .btn {
      width: 100%;
      min-height: 44px;
      border-radius: 11px;
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    #scanFeedbackSheet .btn:active { transform: translateY(1px) scale(0.99); }
    #scanFeedbackSheet .btn-primary {
      background: #059669;
      color: #ffffff;
      border-color: rgba(4, 120, 87, 0.9);
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.35);
    }
    #scanFeedbackSheet .btn-primary:hover {
      background: #047857;
    }
    #scanFeedbackSheet .btn-secondary {
      background: var(--surface-card, #1e293b);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.12));
      color: #ffffff;
    }
    #scanFeedbackSheet .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .counter-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #34d399;
      font-weight: 700;
      text-align: center;
      justify-content: center;
      padding: 2px 8px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"><\/script>
</head>
<body>
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-left">
      <button type="button" class="close-btn" onclick="closeScannerWindow()">✕ Tutup</button>
      <div class="context-tag" id="contextTag">🔍 Scan Barcode</div>
    </div>
    <div class="top-actions">
      <button type="button" class="tool-btn" id="torchBtn" onclick="toggleTorch()" title="Nyalakan Lampu Senter">🔦 Senter</button>
      <button type="button" class="tool-btn" id="flipCamBtn" onclick="switchCamera()" title="Ganti Kamera">🔄 Balik</button>
    </div>
  </div>

  <!-- Camera Viewport -->
  <div class="viewport-container">
    <div id="scannerReader"></div>
    <div class="target-overlay" id="targetOverlay">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>
      <div class="laser-line"></div>
      <div class="target-label">Bidikan Barcode / QR</div>
    </div>
  </div>

  <!-- Mode Switcher -->
  <div class="mode-bar">
    <button type="button" class="mode-btn" id="mode1xBtn" onclick="setMode(false)">⚡ 1x Scan (Pencarian)</button>
    <button type="button" class="mode-btn" id="modeMultiBtn" onclick="setMode(true)">🔁 Multi-Scan (Input Cepat)</button>
  </div>

  <!-- Result / Interaction Sheet -->
  <div class="result-sheet">
    <!-- Standby View -->
    <div id="standbyView" class="standby-box">
      <div class="standby-icon">📷</div>
      <div class="standby-title">Kamera Siap Memindai</div>
      <div class="standby-desc">Arahkan kamera ke barcode 1D atau QR code barang. Informasi barang otomatis terdeteksi di sini.</div>
      <div class="standby-tip">💡 Jarak ideal 15–25 cm. Hindari pantulan cahaya langsung pada barcode.</div>
      <div id="multiScanCounter" class="counter-badge" style="display:none;margin-top:4px;">✓ 0 barang telah discan</div>

      <button type="button" class="manual-toggle-btn" onclick="toggleManualInput()">⌨️ Barcode buram/rusak? Ketik manual</button>
      <div id="manualForm" class="manual-form">
        <input type="text" id="manualInput" class="manual-input" placeholder="Ketik SKU atau kode barcode..." onkeydown="if(event.key==='Enter')submitManualCode()">
        <button type="button" class="manual-btn" onclick="submitManualCode()">Cari</button>
      </div>
    </div>

    <!-- Detected View -->
    <div id="detectedView" class="detected-box" style="display:none;">
      <div>
        <div class="detected-badge-row">
          <span id="statusPill" class="status-pill success">✓ BARANG TERDAFTAR</span>
          <span id="codePill" class="code-pill"></span>
        </div>
        <div id="detectedBody"></div>
      </div>
      <div class="actions-stack">
        <button type="button" id="primaryActionBtn" class="btn btn-primary">🚀 Lanjutkan Proses Barang Ini ➔</button>
        <button type="button" class="btn btn-secondary" onclick="resumeScanning()">🔄 Scan Barang Lain</button>
      </div>
    </div>
  </div>

  <script>
    var CONTEXT = ${safeContext};
    var STORAGE_KEY = ${storageKey};
    var PRODUCTS = ${safeCatalog};
    var html5QrCode = null;
    var currentCameraId = null;
    var cameraList = [];
    var isTorchOn = false;
    var isSearchContext = (CONTEXT === 'stockSearch' || CONTEXT === 'productSearch' || CONTEXT === 'global' || CONTEXT === 'stockCard' || CONTEXT === 'damaged' || CONTEXT === 'productFormBarcode');
    var isContinuous = !isSearchContext;
    var scannedCount = 0;
    var lastScannedCode = '';
    var lastScannedTime = 0;
    var autoSubmitTimer = null;

    var CONTEXT_TITLES = {
      'stockSearch': '🔍 Cari Stok',
      'productSearch': '📦 Master Barang',
      'global': '⚡ Scan Cepat',
      'transaction': '📝 Transaksi',
      'transfer': '🚚 Transfer Gudang',
      'damaged': '⚠️ Barang Rusak',
      'opname': '📋 Stok Opname',
      'stockCard': '👁️ Kartu Stok',
      'productFormBarcode': '🏷️ Input Barcode',
      'barcodePage': '🖨️ Cetak Label',
      'general': '🔍 Scan Barcode'
    };

    function updateContextTag() {
      var tag = document.getElementById('contextTag');
      if (tag) tag.textContent = CONTEXT_TITLES[CONTEXT] || '🔍 Scan Barcode';
    }

    function updateModeUI() {
      var btn1x = document.getElementById('mode1xBtn');
      var btnMulti = document.getElementById('modeMultiBtn');
      var counterEl = document.getElementById('multiScanCounter');
      if (btn1x && btnMulti) {
        if (isContinuous) {
          btnMulti.classList.add('active');
          btn1x.classList.remove('active');
          if (counterEl) {
            counterEl.style.display = scannedCount > 0 ? 'inline-flex' : 'none';
            counterEl.textContent = '✓ ' + scannedCount + ' barang berhasil discan';
          }
        } else {
          btn1x.classList.add('active');
          btnMulti.classList.remove('active');
          if (counterEl) counterEl.style.display = 'none';
        }
      }
    }

    function setMode(continuous) {
      isContinuous = continuous;
      updateModeUI();
    }

    function toggleManualInput() {
      var form = document.getElementById('manualForm');
      if (form) {
        var isOpen = form.style.display === 'flex';
        form.style.display = isOpen ? 'none' : 'flex';
        if (!isOpen) {
          var inp = document.getElementById('manualInput');
          if (inp) inp.focus();
        }
      }
    }

    function submitManualCode() {
      var inp = document.getElementById('manualInput');
      if (!inp) return;
      var code = String(inp.value || '').trim();
      if (!code) return;
      handleScanSuccess(code);
    }

    function playSuccessChime() {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var now = ctx.currentTime;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1320, now + 0.12);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.18);
      } catch(e) {}
    }

    function toggleTorch() {
      try {
        var video = document.querySelector('#scannerReader video');
        if (video && video.srcObject) {
          var track = video.srcObject.getVideoTracks()[0];
          if (track && track.applyConstraints) {
            isTorchOn = !isTorchOn;
            track.applyConstraints({ advanced: [{ torch: isTorchOn }] })
              .then(function() {
                var btn = document.getElementById('torchBtn');
                if (btn) {
                  if (isTorchOn) {
                    btn.classList.add('active');
                    btn.innerHTML = '💡 Senter NYALA';
                  } else {
                    btn.classList.remove('active');
                    btn.innerHTML = '🔦 Senter';
                  }
                }
              })
              .catch(function(err) {
                alert('Lampu senter tidak didukung pada browser/kamera ini.');
              });
          } else {
            alert('Lampu senter tidak didukung pada kamera ini.');
          }
        }
      } catch(e) {}
    }

    function handleScanSuccess(decodedText) {
      var raw = String(decodedText || '').trim();
      // Filter out glitch noise / false positive partials (less than 2 characters)
      if (!raw || raw.length < 2) return;

      var now = Date.now();
      if (raw === lastScannedCode && (now - lastScannedTime) < 1600) return;
      lastScannedCode = raw;
      lastScannedTime = now;
      scannedCount++;

      playSuccessChime();
      if (navigator.vibrate) navigator.vibrate([80, 40, 80]);

      var target = document.getElementById('targetOverlay');
      if (target) {
        target.classList.add('detected');
        setTimeout(function() { target.classList.remove('detected'); }, 800);
      }

      var cleanCode = raw.toLowerCase();
      var p = PRODUCTS.find(function(x) {
        var s = String(x.sku || '').trim().toLowerCase();
        var b = String(x.barcode || '').trim().toLowerCase();
        var id = String(x.id || '').trim().toLowerCase();
        return (s && s === cleanCode) || (b && b === cleanCode) || (id && id === cleanCode);
      });

      sendScanPayload(raw);

      displayScanResult(raw, p);
    }

    function sendScanPayload(code) {
      var payload = {
        type: 'STOKKITA_BARCODE_SCAN_RESULT',
        code: code,
        context: CONTEXT,
        time: Date.now()
      };

      // 1. Instant 0ms BroadcastChannel
      try {
        if (typeof BroadcastChannel !== 'undefined') {
          var bc = new BroadcastChannel('stokkita_barcode_channel');
          bc.postMessage(payload);
          bc.close();
        }
      } catch(e) {}

      // 2. Direct Window Opener PostMessage
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, '*');
        }
      } catch(e) {}

      // 3. LocalStorage Polling Fallback
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
      } catch(e) {}
    }

    function displayScanResult(code, p) {
      if (autoSubmitTimer) clearTimeout(autoSubmitTimer);

      var standbyEl = document.getElementById('standbyView');
      var detectedEl = document.getElementById('detectedView');
      if (standbyEl) standbyEl.style.display = 'none';
      if (detectedEl) detectedEl.style.display = 'flex';

      var badgePill = document.getElementById('statusPill');
      var codePill = document.getElementById('codePill');
      var cardBody = document.getElementById('detectedBody');
      var primaryBtn = document.getElementById('primaryActionBtn');

      if (codePill) codePill.textContent = code;

      if (p) {
        if (badgePill) {
          badgePill.className = 'status-pill success';
          badgePill.innerHTML = '✓ BARANG DITEMUKAN';
        }
        if (cardBody) {
          cardBody.innerHTML =
            '<div class="product-summary-card">' +
              '<div class="product-name">' + escapeHtml(p.name) + '</div>' +
              '<div class="product-meta-row">' +
                '<span class="meta-chip">SKU: ' + escapeHtml(p.sku) + '</span>' +
                (p.barcode && p.barcode !== p.sku ? '<span class="meta-chip">Barcode: ' + escapeHtml(p.barcode) + '</span>' : '') +
                '<span class="meta-chip">' + escapeHtml(p.category || 'Umum') + '</span>' +
              '</div>' +
              '<div class="product-stock-row">' +
                '<span>Saldo Stok Tersedia:</span>' +
                '<span class="stock-val">' + (p.totalStock || 0) + ' ' + escapeHtml(p.unit || 'PCS') + '</span>' +
              '</div>' +
            '</div>';
        }
        if (primaryBtn) {
          primaryBtn.innerHTML = '🚀 Lanjutkan Proses Barang Ini ➔';
          primaryBtn.onclick = function() {
            sendScanPayload(code);
            closeScannerWindow();
          };
        }

        if (!isContinuous) {
          autoSubmitTimer = setTimeout(function() {
            closeScannerWindow();
          }, 850);
        } else {
          updateModeUI();
        }
      } else {
        if (badgePill) {
          badgePill.className = 'status-pill warning';
          badgePill.innerHTML = '⚠️ KODE BELUM TERDAFTAR';
        }
        if (cardBody) {
          cardBody.innerHTML =
            '<div class="notfound-card">' +
              '<div style="font-size:11px;color:#cbd5e1;">Kode Barcode Terbaca:</div>' +
              '<div class="notfound-code">' + escapeHtml(code) + '</div>' +
              '<div class="notfound-hint">Kode ini belum tercatat pada Master Data Barang StokKita.</div>' +
            '</div>';
        }
        if (primaryBtn) {
          primaryBtn.innerHTML = '➕ Tambah Jadi Barang Baru';
          primaryBtn.onclick = function() {
            sendScanPayload(code);
            closeScannerWindow();
          };
        }
      }
    }

    function resumeScanning() {
      if (autoSubmitTimer) clearTimeout(autoSubmitTimer);
      var standbyEl = document.getElementById('standbyView');
      var detectedEl = document.getElementById('detectedView');
      if (standbyEl) standbyEl.style.display = 'flex';
      if (detectedEl) detectedEl.style.display = 'none';
      updateModeUI();
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function initScanner() {
      updateContextTag();
      updateModeUI();
      try {
        var cameras = await Html5Qrcode.getCameras();
        if (!cameras || !cameras.length) {
          alert('Tidak ada kamera terdeteksi pada perangkat.');
          return;
        }
        cameraList = cameras;
        var backCam = cameras.find(function(c) {
          var label = (c.label || '').toLowerCase();
          return label.indexOf('back') !== -1 || label.indexOf('rear') !== -1 || label.indexOf('belakang') !== -1 || label.indexOf('environment') !== -1;
        });
        currentCameraId = backCam ? backCam.id : cameras[0].id;

        // Supported format filter to prevent ZXing ITF/Codabar screen moiré false positives (e.g. 66an)
        var supportedFormats = undefined;
        if (typeof Html5QrcodeSupportedFormats !== 'undefined') {
          supportedFormats = [
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.QR_CODE,
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_39
          ];
        }

        html5QrCode = new Html5Qrcode('scannerReader', {
          formatsToSupport: supportedFormats,
          verbose: false,
          experimentalFeatures: {
            useBarCodeDetectorIfSupported: true
          }
        });
        startReading(currentCameraId);
      } catch(err) {
        console.error('Kamera init error:', err);
      }
    }

    function startReading(cameraId) {
      if (!html5QrCode) return;
      var config = {
        fps: 24,
        qrbox: function(w, h) {
          var boxW = Math.min(340, Math.floor(w * 0.90));
          var boxH = Math.min(220, Math.floor(h * 0.65));
          return { width: Math.max(200, boxW), height: Math.max(140, boxH) };
        },
        aspectRatio: 1.333333,
        videoConstraints: {
          deviceId: cameraId ? { exact: cameraId } : undefined,
          facingMode: cameraId ? undefined : { ideal: 'environment' },
          width: { min: 640, ideal: 1920, max: 2560 },
          height: { min: 480, ideal: 1080, max: 1440 },
          focusMode: { ideal: 'continuous' }
        }
      };

      html5QrCode.start(
        cameraId || { facingMode: 'environment' },
        config,
        handleScanSuccess,
        function(err) {}
      ).catch(function(err) {
        console.warn('Camera start with videoConstraints failed, retrying simple mode:', err);
        html5QrCode.start(
          cameraId || { facingMode: 'environment' },
          { fps: 20 },
          handleScanSuccess,
          function(e) {}
        ).catch(function(e2) {
          console.error('Final camera start error:', e2);
          alert('Kamera gagal dimulai: ' + (e2.message || e2));
        });
      });
    }

    async function switchCamera() {
      if (!html5QrCode || cameraList.length < 2) {
        alert('Hanya 1 kamera yang terdeteksi di perangkat ini.');
        return;
      }
      try {
        await html5QrCode.stop();
        var curIdx = cameraList.findIndex(function(c) { return c.id === currentCameraId; });
        var nextIdx = (curIdx + 1) % cameraList.length;
        currentCameraId = cameraList[nextIdx].id;
        startReading(currentCameraId);
      } catch(e) {
        console.error(e);
      }
    }

    function closeScannerWindow() {
      if (autoSubmitTimer) clearTimeout(autoSubmitTimer);
      if (html5QrCode) {
        try { html5QrCode.stop(); } catch(e) {}
      }
      window.close();
    }

    window.addEventListener('beforeunload', function() {
      if (autoSubmitTimer) clearTimeout(autoSubmitTimer);
      if (html5QrCode) {
        try { html5QrCode.stop(); } catch(e) {}
      }
    });

    window.addEventListener('DOMContentLoaded', initScanner);
  <\/script>
</body>
</html>`;
      }

      function openBarcodeScannerPopup(context = 'general') {
        const width = Math.min(500, screen.availWidth - 24);
        const height = Math.min(740, screen.availHeight - 40);
        const left = Math.max(0, Math.round((screen.availWidth - width) / 2));
        const top = Math.max(0, Math.round((screen.availHeight - height) / 2));

        try { localStorage.removeItem(SCANNER_STORAGE_KEY); } catch (e) {}

        barcodeScannerWindow = window.open(
          '',
          'stokkita_barcode_scanner',
          `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes`
        );

        if (!barcodeScannerWindow) {
          showToast('Popup Diblokir', 'Browser memblokir jendela scanner. Silakan izinkan popup untuk situs ini.', true);
          return;
        }

        const catalog = (store.products || []).map(p => ({
          id: p.id,
          name: p.name,
          sku: p.sku || '',
          barcode: p.barcode || '',
          category: p.category || '',
          unit: p.unit || 'PCS',
          min: getProductMin(p),
          totalStock: totalStock(p),
          price: p.buyPrice || p.price || 0,
          photo: p.photo || p.foto || ''
        }));

        const html = createBarcodeScannerPopupHTML(context, catalog);
        try {
          barcodeScannerWindow.document.open();
          barcodeScannerWindow.document.write(html);
          barcodeScannerWindow.document.close();
          barcodeScannerWindow.focus();
        } catch (err) {
          try {
            const blob = new Blob([html], { type: 'text/html' });
            barcodeScannerWindow.location.href = URL.createObjectURL(blob);
          } catch (e) {
            console.error('Gagal menulis popup scanner:', e);
          }
        }

        startBarcodeScannerPolling(context);
        showToast('Scanner Kamera Aktif', 'Arahkan kamera HP ke barcode atau QR code barang.');
      }

      function handleReceivedBarcodeScan(data) {
        if (!data || data.type !== 'STOKKITA_BARCODE_SCAN_RESULT' || !data.code) return;
        const rawCode = String(data.code).trim();
        if (!rawCode) return;

        playBeepSound();

        const p = store.products.find(x =>
          (x.sku && x.sku.toLowerCase() === rawCode.toLowerCase()) ||
          (x.barcode && x.barcode.toLowerCase() === rawCode.toLowerCase()) ||
          (x.id && x.id.toLowerCase() === rawCode.toLowerCase())
        );

        const ctx = data.context || 'global';

        // 1. Context: Transaksi Masuk / Keluar (Modal)
        if (ctx === 'transaction') {
          if (p) {
            if (!state.transactionLines) state.transactionLines = [];
            const existing = state.transactionLines.find(l => l.productId === p.id);
            if (existing) {
              existing.qty = Number(existing.qty || 1) + 1;
            } else {
              state.transactionLines.push({ productId: p.id, qty: 1 });
            }
            // Preserve current form inputs
            const pVal = document.getElementById('modalTxParty')?.value;
            const rVal = document.getElementById('modalTxRef')?.value;
            const nVal = document.getElementById('modalTxNotes')?.value;
            if (pVal !== undefined) state.transactionParty = pVal;
            if (rVal !== undefined) state.transactionRef = rVal;
            if (nVal !== undefined) state.transactionNotes = nVal;

            renderNewTransactionModal();
            showToast('✓ Barang Berhasil Terbaca!', `+1 ${p.name} (${p.sku}) ditambahkan ke transaksi.`);
            setTimeout(() => {
              const qtyInputs = document.querySelectorAll('.tx-line-qty');
              if (qtyInputs && qtyInputs.length) {
                const lastInp = qtyInputs[qtyInputs.length - 1];
                lastInp?.focus();
                lastInp?.select();
              }
            }, 80);
          } else {
            showToast('Barang Tidak Ditemukan', `Kode "${rawCode}" tidak cocok dengan SKU atau barcode produk manapun.`, true);
          }
          return;
        }

        // 2. Context: Transfer Antar Gudang (Modal)
        if (ctx === 'transfer') {
          if (p) {
            if (!state.transferLines) state.transferLines = [];
            const existing = state.transferLines.find(l => l.productId === p.id);
            if (existing) {
              existing.qty = Number(existing.qty || 1) + 1;
            } else {
              state.transferLines.push({ productId: p.id, qty: 1 });
            }
            const rVal = document.getElementById('trfRef')?.value;
            const nVal = document.getElementById('trfNotes')?.value;
            if (rVal !== undefined) state.transferRefNo = rVal;
            if (nVal !== undefined) state.transferNotes = nVal;

            renderNewTransferModal();
            showToast('✓ Barang Berhasil Terbaca!', `+1 ${p.name} (${p.sku}) ditambahkan ke transfer.`);
            setTimeout(() => {
              const qtyInputs = document.querySelectorAll('.trf-line-qty');
              if (qtyInputs && qtyInputs.length) {
                const lastInp = qtyInputs[qtyInputs.length - 1];
                lastInp?.focus();
                lastInp?.select();
              }
            }, 80);

            showToast('Barang Tidak Ditemukan', `Kode "${rawCode}" tidak cocok dengan produk manapun.`, true);
          }
          return;

        // 3. Context: Input Barcode di Form Tambah / Edit Barang

          const barcodeInput = document.getElementById('prodFormBarcode');

        // 6. Context: Buka Kartu Stok Langsung
        if (ctx === 'stockCard') {

        // 8. Context: Hitung Fisik Stok Opname

      function startBarcodeScannerPolling(context) {
        stopBarcodeScannerPolling();

        barcodeScannerInterval = setInterval(() => {
          counter++;
          if (counter > 300 || (barcodeScannerWindow && barcodeScannerWindow.closed)) {
            stopBarcodeScannerPolling();
            return;
          }

          try {
            const raw = localStorage.getItem(SCANNER_STORAGE_KEY);
            if (raw) {
              localStorage.removeItem(SCANNER_STORAGE_KEY);
              const data = JSON.parse(raw);
              if (data && data.code) {
                handleReceivedBarcodeScan(data);
              }
            }
          } catch (e) { }
        }, 350);
      }

      function stopBarcodeScannerPolling() {
        if (barcodeScannerInterval) {
          clearInterval(barcodeScannerInterval);
          barcodeScannerInterval = null;
        }
      }

      // Professional Spreadsheet & CSV Export Utilities
      function exportCSV(filename, headers, rows) {
        const escapeCell = val => {
          if (val === null || val === undefined) return '""';
          const str = String(val).replace(/"/g, '""');
          return `"${str}"`;
        };
        // Menambahkan direktif sep=, agar Microsoft Excel otomatis membagi kolom tanpa menumpuk di kolom A
        const csvContent = '\uFEFFsep=,\r\n' + [headers.map(escapeCell).join(','), ...rows.map(r => r.map(escapeCell).join(','))].join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        addAuditLog('EXPORT', 'Laporan CSV', filename, `Mengekspor data ke file ${filename}`);
        saveStore();
        showToast('Ekspor Berhasil', `File ${filename} telah diunduh.`);
      }

      function exportToExcel(filename, reportTitle, headers, rows, meta = {}) {
        const cleanFilename = (filename || 'Laporan').replace(/\.csv$/i, '').replace(/\.xlsx$/i, '').replace(/\.xls$/i, '');
        const title = reportTitle || cleanFilename.replace(/_/g, ' ');

        // 1. Ekspor Native Excel (.xlsx) via SheetJS jika tersedia
        if (typeof XLSX !== 'undefined') {
          try {
            const wb = XLSX.utils.book_new();
            const wsData = [];

            // Baris 1: Identitas Bisnis
            const bizName = (store.settings && store.settings.businessName) || 'StokKita — Inventori Multi Gudang';
            wsData.push([bizName.toUpperCase()]);

            // Baris 2: Judul Resmi Laporan
            wsData.push([title.toUpperCase()]);

            // Baris 3: Informasi Filter & Tanggal
            const metaTokens = [];
            if (meta.warehouse) metaTokens.push(`Lokasi: ${meta.warehouse}`);
            if (meta.category) metaTokens.push(`Kategori: ${meta.category}`);
            if (meta.period) metaTokens.push(`Periode: ${meta.period}`);
            metaTokens.push(`Tanggal: ${getNowFormatted()}`);
            const curUser = state.currentUser ? state.currentUser.name : (state.role === 'ADMIN' ? 'Administrator' : 'Staf');
            metaTokens.push(`Diekspor Oleh: ${curUser}`);
            wsData.push([metaTokens.join('   |   ')]);

            // Baris 4: Baris Pemisah Kosong
            wsData.push([]);

            // Baris 5: Header Tabel
            wsData.push(headers);

            // Baris 6+: Data Baris dengan tipe data angka numerik murni
            rows.forEach(r => {
              const rowArr = r.map((val, colIdx) => {
                if (val === null || val === undefined) return '';
                if (typeof val === 'number') return val;
                const hName = (headers[colIdx] || '').toLowerCase();
                const isNumericCol = hName.includes('stok') || hName.includes('qty') || hName.includes('kuantitas') ||
                  hName.includes('minimum') || hName.includes('saldo') || hName.includes('selisih') ||
                  hName.includes('total') || hName.includes('gudang');
                const str = String(val).trim();
                if (isNumericCol && str !== '' && !isNaN(Number(str)) && !str.startsWith('+') && !str.includes('-') && (!str.startsWith('0') || str === '0')) {
                  return Number(str);
                }
                return str;
              });
              wsData.push(rowArr);
            });

            const ws = XLSX.utils.aoa_to_sheet(wsData);

            // Lebar kolom otomatis proporsional (Auto Column Widths)
            const colWidths = headers.map((h, colIdx) => {
              let maxLen = String(h).length;
              rows.forEach(r => {
                const cellVal = r[colIdx];
                if (cellVal !== null && cellVal !== undefined) {
                  maxLen = Math.max(maxLen, String(cellVal).length);
                }
              });
              return { wch: Math.min(Math.max(maxLen + 4, 14), 45) };
            });
            ws['!cols'] = colWidths;

            // Mengaktifkan AutoFilter pada header tabel (baris ke-5)
            const lastColCode = XLSX.utils.encode_col(headers.length - 1);
            ws['!autofilter'] = { ref: `A5:${lastColCode}${wsData.length}` };

            const sheetName = title.slice(0, 31).replace(/[\\/?*[\]:]/g, '');
            XLSX.utils.book_append_sheet(wb, ws, sheetName);

            const outFilename = `${cleanFilename}.xlsx`;
            XLSX.writeFile(wb, outFilename);

            addAuditLog('EXPORT', 'Excel (.xlsx)', outFilename, `Mengekspor laporan ke file Excel ${outFilename}`);
            saveStore();
            showToast('Ekspor Berhasil', `File spreadsheet ${outFilename} berhasil diunduh.`);
            return;
          } catch (err) {
            console.warn('Gagal memproses via SheetJS, beralih ke format Excel XML/HTML fallback:', err);
          }
        }

        // 2. Fallback: Format Excel XML / HTML Spreadsheet (.xls)
        exportExcelHtmlFallback(cleanFilename, title, headers, rows, meta);
      }

      // Date Filter Parsing & Evaluation Utility
      function parseDateStr(str) {
        if (!str) return null;
        if (str.includes('/')) {
          const parts = str.split(' ')[0].split('/');
          if (parts.length === 3) {
            return new Date(Number(parts[2]), Number(parts[1]) - 1, Number(parts[0]));
          }
        }
        if (str.includes('-')) {
          const parts = str.split(' ')[0].split('-');
          if (parts.length === 3) {
            return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
          }
        }
        const d = new Date(str);
        return isNaN(d.getTime()) ? null : d;
      }

      function isTxInPeriod(txDateStr, period, customFrom, customTo) {
        if (!period || period === 'all') return true;
        const d = parseDateStr(txDateStr);
        if (!d) return true;

        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59, 999);

        if (period === 'today') {
          return d >= startOfToday && d <= endOfToday;
        }
        if (period === '7days') {
          const past7 = new Date(startOfToday);
          past7.setDate(past7.getDate() - 7);
          return d >= past7 && d <= endOfToday;
        }
        if (period === '30days') {
          const past30 = new Date(startOfToday);
          past30.setDate(past30.getDate() - 30);
          return d >= past30 && d <= endOfToday;
        }
        if (period === 'this-month') {
          const isCurrentMonth = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
          return isCurrentMonth || (d.getFullYear() === 2026 && (d.getMonth() === 7 || d.getMonth() === 8));
        }
        if (period === 'custom') {
          if (customFrom) {
            const f = new Date(customFrom + 'T00:00:00');
            if (d < f) return false;
          }
          if (customTo) {
            const t = new Date(customTo + 'T23:59:59');
            if (d > t) return false;
          }
          return true;
        }
        return true;
      }

      function lineChart() {
        const incoming = [42, 58, 44, 76, 65, 88, 72];
        const outgoing = [35, 41, 62, 48, 71, 59, 82];
        const max = 100, width = 700, height = 220, padX = 35, padY = 18;
        const point = (v, i) => `${padX + i * ((width - padX * 2) / 6)},${height - padY - v / max * (height - padY * 2)}`;
        const labels = ['24 Agu', '25 Agu', '26 Agu', '27 Agu', '28 Agu', '29 Agu', '30 Agu'];
        return `<svg class="chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-label="Grafik barang masuk dan keluar 7 hari">
          <defs><linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#72ccb0" stop-opacity=".35"/><stop offset="1" stop-color="#72ccb0" stop-opacity="0"/></linearGradient></defs>
          ${[0, 25, 50, 75, 100].map(v => { const y = height - padY - v / max * (height - padY * 2); return `<line class="chart-grid" x1="${padX}" x2="${width - padX}" y1="${y}" y2="${y}"/><text class="chart-label" x="1" y="${y + 4}">${v}</text>` }).join('')}
          <path class="chart-area" d="M ${point(incoming[0], 0)} ${incoming.slice(1).map((v, i) => `L ${point(v, i + 1)}`).join(' ')} L ${width - padX},${height - padY} L ${padX},${height - padY} Z"/>
          <polyline class="chart-line-in" points="${incoming.map(point).join(' ')}"/><polyline class="chart-line-out" points="${outgoing.map(point).join(' ')}"/>
          ${labels.map((l, i) => `<text class="chart-label" x="${padX + i * ((width - padX * 2) / 6)}" y="${height - 1}" text-anchor="middle">${l}</text>`).join('')}

      }

      function stockCardPage() {
        const staffWh = (state.currentUser && state.currentUser.warehouse && state.currentUser.warehouse !== 'Semua Gudang') ? state.currentUser.warehouse : 'Gudang Utama';
        const allowedWarehouse = state.role === 'STAFF' ? staffWh : (state.stockCardWarehouse || 'Semua Gudang');

        const activeProducts = store.products.filter(p => p.active !== false);
        if (activeProducts.length === 0) {
          return `${toolbar('Kartu Stok', 'Buku mutasi pergerakan barang.', '')}
            <div class="card" style="padding:40px;text-align:center;">${emptyState('package', 'Belum Ada Barang', 'Silakan tambahkan data produk terlebih dahulu di Master Barang.')}</div>`;
        }

        let selProdId = state.stockCardProductId;
        let prod = activeProducts.find(p => p.id === selProdId);
        if (!prod) {
          prod = activeProducts[0];
          selProdId = prod.id;
          state.stockCardProductId = selProdId;
        }

        const period = state.stockCardPeriod || 'all';
        const dFrom = state.stockCardDateFrom;
        const dTo = state.stockCardDateTo;
        const periodLabels = {
          all: 'Semua Waktu',
          today: 'Hari Ini',
          '7days': '7 Hari Terakhir',
          '30days': '30 Hari Terakhir',
          'this-month': 'Bulan Ini',
          custom: 'Rentang Kustom'
        };

        const whOptions = state.role === 'STAFF'
          ? [staffWh]
          : ['Semua Gudang', ...store.warehouses.map(w => w.name)];

        // Get full ledger for this product sorted chronologically (oldest to newest)
        const rawLedger = (store.stockLedger || []).filter(l => l.productId === prod.id);
        const sortedChronologicalLedger = [...rawLedger].sort((a, b) => parseDateTimeToSort(a.date) - parseDateTimeToSort(b.date));

        // Filter by warehouse
        const whLedger = allowedWarehouse === 'Semua Gudang'
          ? sortedChronologicalLedger
          : sortedChronologicalLedger.filter(l => l.warehouse === allowedWarehouse);

        let runningBalance = 0;
        let saldoAwal = 0;
        let totalMasuk = 0;
        let totalKeluar = 0;
        const processedRows = [];

        whLedger.forEach(l => {
          const isPlus = ['IN', 'TRANSFER_IN', 'ADJUSTMENT_PLUS', 'OPENING'].includes(l.type);
          const isMinus = ['OUT', 'TRANSFER_OUT', 'DAMAGE', 'ADJUSTMENT_MINUS'].includes(l.type);
          const qty = Number(l.qty || 0);

          const inPeriod = isTxInPeriod(l.date, period, dFrom, dTo);

          if (!inPeriod && period !== 'all') {
            const txTime = parseDateTimeToSort(l.date);
            let periodStartTime = 0;
            const now = new Date();
            if (period === 'today') {
              const s = new Date(now.getFullYear(), now.getMonth(), now.getDate());
              periodStartTime = s.getTime();
            } else if (period === '7days') {
              periodStartTime = now.getTime() - (7 * 86400000);
            } else if (period === '30days') {
              periodStartTime = now.getTime() - (30 * 86400000);
            } else if (period === 'this-month') {
              const s = new Date(now.getFullYear(), now.getMonth(), 1);
              periodStartTime = s.getTime();
            } else if (period === 'custom' && dFrom) {
              periodStartTime = new Date(dFrom + 'T00:00:00').getTime();
            }
            if (txTime < periodStartTime) {
              if (isPlus) saldoAwal += qty;
              else if (isMinus) saldoAwal -= qty;
            }
          }

          if (isPlus) runningBalance += qty;
          else if (isMinus) runningBalance -= qty;

          if (inPeriod) {
            if (isPlus) totalMasuk += qty;
            if (isMinus) totalKeluar += qty;

            processedRows.push({
              id: l.id,
              date: l.date,
              warehouse: l.warehouse,
              type: l.type,
              qtyIn: isPlus ? qty : 0,
              qtyOut: isMinus ? qty : 0,
              balance: runningBalance,
              refNo: l.refNo || '-',
              user: l.user || 'Sistem',
              notes: l.notes || '',
              photo: l.photo || ''
            });
          }
        });

        const displayRows = [...processedRows].reverse();
        const saldoAkhir = (period === 'all') ? runningBalance : (saldoAwal + totalMasuk - totalKeluar);
        const currentPhysStock = totalStock(prod, allowedWarehouse);
        const [stStateName, stBadgeClass] = stockState(prod, allowedWarehouse);

        const typeBadge = (type) => {
          switch(type) {
            case 'IN': return '<span class="badge success">Barang Masuk</span>';
            case 'OUT': return '<span class="badge danger">Barang Keluar</span>';
            case 'TRANSFER_IN': return '<span class="badge info">Transfer Masuk</span>';
            case 'TRANSFER_OUT': return '<span class="badge warning">Transfer Keluar</span>';
            case 'DAMAGE': return '<span class="badge danger">Barang Rusak</span>';
            case 'OPNAME':
            case 'ADJUSTMENT_PLUS':
            case 'ADJUSTMENT_MINUS': return '<span class="badge neutral">Penyesuaian Opname</span>';
            case 'OPENING': return '<span class="badge neutral">Saldo Awal</span>';
            default: return `<span class="badge neutral">${escapeHtml(type)}</span>`;
          }
        };

        const prodPhoto = prod.photo || prod.foto || '';

        return `${toolbar('Kartu Stok Barang', 'Buku besar mutasi fisik barang dan rincian transaksi masuk / keluar.', `

          <button class="btn btn-primary" data-action="export-stock-card">${icon('download')} Ekspor Excel (.xlsx)</button>
        `)}

                  ${activeProducts.map(p => `
                    <option value="${p.id}" ${p.id === prod.id ? 'selected' : ''}>${escapeHtml(p.name)} [${escapeHtml(p.sku)}] — Total: ${totalStock(p)} ${escapeHtml(p.unit)}</option>
                  `).join('')}
                </select>
                <button type="button" class="btn btn-secondary" data-action="open-barcode-scanner" data-context="stockCard" style="flex:none;gap:5px;white-space:nowrap;" title="Scan Barcode untuk beralih barang">
                  ${icon('scan')} Scan

                <option value="30days" ${period === '30days' ? 'selected' : ''}>30 Hari Terakhir</option>
                <option value="this-month" ${period === 'this-month' ? 'selected' : ''}>Bulan Ini</option>

              `}
              <div>
                <div style="display:flex;align-items:center;gap:8px;">
                  <h2 style="margin:0;font-size:18px;">${escapeHtml(prod.name)}</h2>

                <div style="margin-top:4px;font-size:12px;color:var(--ink-500);">

                </div>

            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">

      // Live Graphic Renderer (JsBarcode & QRCode)
      function renderBarcodePreviewGraphics() {
        const isCustom = state.barcodeTab === 'custom';
        const codeType = state.barcodeType || 'barcode';

        let codeText = '';
        if (isCustom) {
          codeText = (state.barcodeCustomText || '').trim();
        } else {
          const selId = (state.barcodeSelectedProductIds || [])[0];
          const p = store.products.find(x => x.id === selId);
          if (p) codeText = p.sku || p.barcode || p.id;
        }

        if (!codeText) return;

        if (codeType === 'barcode') {
          const svgEl = document.getElementById('barcodePreviewGraphic');
          if (svgEl && typeof JsBarcode === 'function') {
            try {
              JsBarcode(svgEl, codeText, {
                format: 'CODE128',
                width: 2,
                height: 48,
                displayValue: false,
                margin: 0
              });
            } catch (err) {
              console.warn('JsBarcode render fallback:', err);
              renderSvgBarcodeFallback(svgEl, codeText);
            }
          }
        } else if (codeType === 'qrcode') {
          const container = document.getElementById('qrcodePreviewContainer');
          const canvasEl = document.getElementById('qrcodePreviewGraphic');
          let rendered = false;

          // 1. Primary: qrcode-generator (Pure vector SVG with clean margin)
          if (typeof qrcode === 'function') {
            try {
              const qr = qrcode(0, 'M');
              qr.addData(codeText);
              qr.make();
              if (container) {
                container.innerHTML = qr.createSvgTag(3.5, 4);
                const svg = container.querySelector('svg');
                if (svg) {
                  svg.style.maxWidth = '110px';
                  svg.style.maxHeight = '110px';
                  svg.style.display = 'block';
                  svg.style.margin = '0 auto';
                }
                rendered = true;
              }
            } catch (err) {
              console.warn('qrcode-generator error:', err);
            }
          }

          // 2. Secondary: QRious canvas with white quiet zone
          if (!rendered && canvasEl && typeof QRious === 'function') {
            try {
              new QRious({
                element: canvasEl,
                value: codeText,
                size: 110,
                padding: 6,
                level: 'M'
              });
              rendered = true;
            } catch (err) {
              console.warn('QRious render error:', err);
            }
          }
        }
      }

      // Clean SVG Barcode Fallback if CDN delayed
      function renderSvgBarcodeFallback(svgEl, text) {
        if (!svgEl) return;
        svgEl.innerHTML = '';
        let hash = 0;
        for (let i = 0; i < text.length; i++) hash = (hash << 5) - hash + text.charCodeAt(i);
        let barsHtml = '';
        let x = 10;
        for (let i = 0; i < 40; i++) {
          const isBar = (Math.abs(hash * (i + 1)) % 10) > 3;
          const w = (i % 3 === 0) ? 3 : 2;
          if (isBar) {
            barsHtml += `<rect x="${x}" y="2" width="${w}" height="44" fill="#000" />`;
          }
          x += w + 1;
        }
        svgEl.setAttribute('viewBox', `0 0 ${x + 10} 48`);
        svgEl.innerHTML = barsHtml;
      }

      // Generate & Print Barcode Labels (Supports combining multiple labels in 1 page!)
      function printBarcodeLabels() {
        const isCustom = state.barcodeTab === 'custom';
        const codeType = state.barcodeType || 'barcode';
        const textUnder = state.barcodeTextDisplay || 'code';
        const printMode = state.barcodePrintMode || 'sheet';
        const labelWidth = Number(state.barcodeLabelWidth || 84);
        const labelHeight = Number(state.barcodeLabelHeight || 48);
        const labelQty = Math.max(1, Number(state.barcodeLabelQty || 1));

        let itemsToPrint = [];
        if (isCustom) {
          const txt = (state.barcodeCustomText || '').trim();
          if (!txt) return showToast('Peringatan', 'Silakan ketik teks kode kustom terlebih dahulu.', true);
          itemsToPrint.push({
            name: txt,
            sku: txt,
            barcode: txt,
            price: 0,
            unit: 'PCS',
            qty: labelQty
          });
        } else {
          const selIds = state.barcodeSelectedProductIds || [];
          if (!selIds.length) return showToast('Peringatan', 'Silakan pilih minimal 1 barang untuk dicetak.', true);
          itemsToPrint = selIds.map(id => {
            const p = store.products.find(x => x.id === id);
            return p ? {
              name: p.name,
              sku: p.sku || p.id,
              barcode: p.barcode || p.sku || p.id,
              price: p.buyPrice || 0,
              unit: p.unit || 'PCS',
              qty: labelQty
            } : null;
          }).filter(Boolean);
        }

        // Generate printable container
        let printContainer = document.getElementById('printableBarcodeLabels');
        if (!printContainer) {
          printContainer = document.createElement('div');
          printContainer.id = 'printableBarcodeLabels';
          document.body.appendChild(printContainer);
        }

        printContainer.className = printMode === 'sheet' ? 'printable-sheet-grid' : 'printable-individual';

        let labelsHtml = '';
        let labelIndex = 0;

        itemsToPrint.forEach(item => {
          for (let q = 0; q < item.qty; q++) {
            labelIndex++;
            const codeText = item.barcode || item.sku || item.name;
            const svgId = `printBarcodeSvg_${labelIndex}`;
            const qrBoxId = `printQrBox_${labelIndex}`;
            const canvasId = `printQrCanvas_${labelIndex}`;

            // Sheet mode: no page-break-after, allow multiple labels per page!
            const breakStyle = printMode === 'sheet'
              ? 'page-break-inside:avoid;break-inside:avoid;page-break-after:auto;break-after:auto;margin:1.5mm;'
              : 'page-break-after:always;break-after:page;margin:0 auto;';

            labelsHtml += `
              <div class="print-label-item" style="width:${labelWidth}mm;height:${labelHeight}mm;${breakStyle}display:inline-flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;padding:2.5mm;text-align:center;overflow:hidden;border:1px dashed #bbb;background:#fff;border-radius:4px;">
                <div style="font-size:7.5pt;font-weight:800;letter-spacing:0.5px;color:#444;text-transform:uppercase;margin-bottom:0.8mm;">
                  ${escapeHtml(store.settings?.companyName || 'STOKKITA')}
                </div>
                <div style="font-size:9.5pt;font-weight:700;color:#000;line-height:1.2;margin-bottom:1.2mm;max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                  ${escapeHtml(item.name)}
                </div>

                <div style="display:flex;justify-content:center;align-items:center;margin:0.8mm 0;min-height:16mm;">
                  ${codeType === 'barcode' ? `
                    <svg id="${svgId}" style="max-width:95%;height:16mm;"></svg>
                  ` : `
                    <div id="${qrBoxId}" style="display:flex;justify-content:center;align-items:center;">
                      <canvas id="${canvasId}" style="max-width:22mm;max-height:22mm;"></canvas>
                    </div>
                  `}
                </div>

                ${textUnder !== 'none' ? `
                  <div style="font-size:8pt;font-weight:700;font-family:monospace;margin-top:0.8mm;color:#111;">
                    ${textUnder === 'code' ? escapeHtml(codeText) : ''}
                    ${textUnder === 'name' ? escapeHtml(item.name) : ''}
                    ${textUnder === 'both' ? `${escapeHtml(item.sku || codeText)} · ${escapeHtml(item.name)}` : ''}
                  </div>
                ` : ''}

                ${item.price ? `
                  <div style="font-size:8.5pt;font-weight:800;color:#111;margin-top:0.4mm;">
                    Rp ${rupiah.format(item.price)}
                  </div>
                ` : ''}
              </div>
            `;
          }
        });

        printContainer.innerHTML = labelsHtml;

        // Render graphics onto generated SVG/Canvas
        labelIndex = 0;
        itemsToPrint.forEach(item => {
          for (let q = 0; q < item.qty; q++) {
            labelIndex++;
            const codeText = item.barcode || item.sku || item.name;
            if (codeType === 'barcode') {
              const svgEl = document.getElementById(`printBarcodeSvg_${labelIndex}`);
              if (svgEl && typeof JsBarcode === 'function') {
                try {
                  JsBarcode(svgEl, codeText, {
                    format: 'CODE128',
                    width: 2,
                    height: 44,
                    displayValue: false,
                    margin: 0
                  });
                } catch (e) {
                  renderSvgBarcodeFallback(svgEl, codeText);
                }
              }
            } else if (codeType === 'qrcode') {
              const qrBoxEl = document.getElementById(`printQrBox_${labelIndex}`);
              const canvasEl = document.getElementById(`printQrCanvas_${labelIndex}`);
              let qrRendered = false;

              // 1. Vector SVG (Print razor sharp with clean margin)
              if (qrBoxEl && typeof qrcode === 'function') {
                try {
                  const qr = qrcode(0, 'M');
                  qr.addData(codeText);
                  qr.make();
                  qrBoxEl.innerHTML = qr.createSvgTag(2.5, 3);
                  const svg = qrBoxEl.querySelector('svg');
                  if (svg) {
                    svg.style.maxWidth = '22mm';
                    svg.style.maxHeight = '22mm';
                    svg.style.display = 'block';
                  }
                  qrRendered = true;
                } catch (err) {
                  console.warn('Print QR generator error:', err);
                }
              }

              // 2. Canvas fallback
              if (!qrRendered && canvasEl && typeof QRious === 'function') {
                try {
                  new QRious({
                    element: canvasEl,
                    value: codeText,
                    size: 90,
                    padding: 4,
                    level: 'M'
                  });
                } catch (e) { }
              }
            }
          }
        });

        // Trigger print after brief graphic rendering delay
        setTimeout(() => {
          isPrintingBarcodes = true;
          window.print();
        }, 140);
      }

      // Download Single Label as High-Resolution PNG
      function downloadBarcodeLabel() {
        const isCustom = state.barcodeTab === 'custom';
        const codeType = state.barcodeType || 'barcode';
        const textUnder = state.barcodeTextDisplay || 'code';
        const labelWidthMm = Number(state.barcodeLabelWidth || 84);
        const labelHeightMm = Number(state.barcodeLabelHeight || 48);

        let item = null;
        if (isCustom) {
          const txt = (state.barcodeCustomText || '').trim();
          if (!txt) return showToast('Peringatan', 'Ketik teks kode terlebih dahulu.', true);
          item = { name: txt, sku: txt, barcode: txt, price: 0, unit: 'PCS' };
        } else {
          const selId = (state.barcodeSelectedProductIds || [])[0];
          item = store.products.find(p => p.id === selId);
          if (!item) return showToast('Peringatan', 'Silakan pilih minimal 1 barang untuk didownload.', true);
        }

        const codeText = item.barcode || item.sku || item.name;

        // Render onto 300 DPI high-res canvas
        const scale = 4; // High-res scale factor
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(labelWidthMm * scale);
        canvas.height = Math.round(labelHeightMm * scale);
        const ctx = canvas.getContext('2d');

        // White background
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Border
        ctx.strokeStyle = '#cccccc';
        ctx.lineWidth = Math.round(1.5 * scale);
        ctx.strokeRect(scale * 2, scale * 2, canvas.width - (scale * 4), canvas.height - (scale * 4));

        // Header: Company Name
        ctx.fillStyle = '#475569';
        ctx.font = `bold ${Math.round(8 * scale)}px Inter, Arial, sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText((store.settings?.companyName || 'STOKKITA').toUpperCase(), canvas.width / 2, Math.round(10 * scale));

        // Product Name
        ctx.fillStyle = '#0f172a';
        ctx.font = `bold ${Math.round(10 * scale)}px Inter, Arial, sans-serif`;
        const maxTextWidth = canvas.width - (scale * 8);
        ctx.fillText(item.name, canvas.width / 2, Math.round(18 * scale), maxTextWidth);

        const finalizeAndDownload = (imgElement, codeW, codeH) => {
          if (imgElement) {
            const cx = (canvas.width - codeW) / 2;
            const cy = Math.round(20 * scale);
            ctx.drawImage(imgElement, cx, cy, codeW, codeH);
          }

          // Text Under Code
          if (textUnder !== 'none') {
            ctx.fillStyle = '#1e293b';
            ctx.font = `bold ${Math.round(8.5 * scale)}px monospace, monospace`;
            let displayTxt = '';
            if (textUnder === 'code') displayTxt = codeText;
            else if (textUnder === 'name') displayTxt = item.name;
            else if (textUnder === 'both') displayTxt = `${item.sku || codeText} · ${item.name}`;
            ctx.fillText(displayTxt, canvas.width / 2, Math.round(canvas.height - (item.buyPrice || item.price ? 12 * scale : 6 * scale)), maxTextWidth);
          }

          // Price & Unit
          const pr = item.buyPrice || item.price;
          if (pr) {
            ctx.fillStyle = '#125646';
            ctx.font = `bold ${Math.round(9 * scale)}px Inter, Arial, sans-serif`;
            ctx.fillText(`Rp ${rupiah.format(pr)} / ${item.unit || 'PCS'}`, canvas.width / 2, canvas.height - Math.round(5 * scale));
          }

          // Trigger download
          canvas.toBlob(blob => {
            if (!blob) return;
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const safeName = (item.sku || item.name || 'label').replace(/[^a-zA-Z0-9_-]/g, '_');
            a.download = `Label_${safeName}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 4000);
            showToast('Label Diunduh', `Gambar label ${item.name} berhasil disimpan.`);
          }, 'image/png');
        };

        if (codeType === 'barcode') {
          const barCanvas = document.createElement('canvas');
          try {
            JsBarcode(barCanvas, codeText, {
              format: 'CODE128',
              width: 2.2 * (scale / 3),
              height: 48 * (scale / 3),
              displayValue: false,
              margin: 0
            });
            const bWidth = Math.min(canvas.width - (scale * 12), barCanvas.width);
            const bHeight = Math.round(18 * scale);
            finalizeAndDownload(barCanvas, bWidth, bHeight);
          } catch (e) {
            finalizeAndDownload(null, 0, 0);
          }
        } else {
          let qrDataUrl = '';
          if (typeof qrcode === 'function') {
            try {
              const qr = qrcode(0, 'M');
              qr.addData(codeText);
              qr.make();
              qrDataUrl = qr.createDataURL(4, 4);
            } catch (e) { }
          }
          if (!qrDataUrl && typeof QRious === 'function') {
            try {
              const qr = new QRious({ value: codeText, size: 160, padding: 8, level: 'M' });
              qrDataUrl = qr.toDataURL();
            } catch (e) { }
          }

          if (qrDataUrl) {
            const qrImg = new Image();
            qrImg.onload = () => {
              const qrSize = Math.round(23 * scale);
              finalizeAndDownload(qrImg, qrSize, qrSize);
            };
            qrImg.src = qrDataUrl;
          } else {
            finalizeAndDownload(null, 0, 0);
          }
        }
      }

      // Download All Selected Labels Combined into 1 Printable Sheet Grid Image (PNG)
      function downloadBarcodeSheet() {
        const isCustom = state.barcodeTab === 'custom';
        const codeType = state.barcodeType || 'barcode';
        const textUnder = state.barcodeTextDisplay || 'code';
        const labelWidthMm = Number(state.barcodeLabelWidth || 84);
        const labelHeightMm = Number(state.barcodeLabelHeight || 48);

        const selIds = state.barcodeSelectedProductIds || [];
        if (!selIds.length) return showToast('Peringatan', 'Silakan pilih minimal 1 barang.', true);

        const items = selIds.map(id => store.products.find(p => p.id === id)).filter(Boolean);
        if (!items.length) return;

        showToast('Menyiapkan Lembar', `Menggabungkan ${items.length} label barcode ke dalam 1 halaman PNG...`);

        // Standard sheet width 1654px (~200 DPI A4)
        const sheetWidth = 1654;
        const scale = 2.5;
        const itemW = Math.round(labelWidthMm * scale);
        const itemH = Math.round(labelHeightMm * scale);
        const gap = Math.round(4 * scale);
        const cols = Math.max(1, Math.floor((sheetWidth - gap * 2) / (itemW + gap)));
        const rows = Math.ceil(items.length / cols);
        const sheetHeight = Math.max(1200, (rows * (itemH + gap)) + 120);

        const canvas = document.createElement('canvas');
        canvas.width = sheetWidth;
        canvas.height = sheetHeight;
        const ctx = canvas.getContext('2d');

        // White background
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Header Title
        ctx.fillStyle = '#125646';
        ctx.font = 'bold 22px Inter, Arial, sans-serif';
        ctx.fillText(`LEMBAR LABEL BARCODE STOKKITA — ${items.length} ITEM`, 24, 38);
        ctx.fillStyle = '#64748b';
        ctx.font = '12px Inter, Arial, sans-serif';
        ctx.fillText(`Digenerate otomatis pada ${new Date().toLocaleString('id-ID')} · Mode: ${codeType === 'barcode' ? 'Barcode (Code 128)' : 'QR Code'}`, 24, 58);
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(24, 70);
        ctx.lineTo(sheetWidth - 24, 70);
        ctx.stroke();

        items.forEach((item, idx) => {
          const col = idx % cols;
          const row = Math.floor(idx / cols);
          const x = 24 + (col * (itemW + gap));
          const y = 85 + (row * (itemH + gap));
          const codeText = item.barcode || item.sku || item.name;

          ctx.save();
          ctx.translate(x, y);

          // Card
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, itemW, itemH);
          ctx.strokeStyle = '#cbd5e1';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(0, 0, itemW, itemH);

          // Header
          ctx.fillStyle = '#64748b';
          ctx.font = `bold ${Math.round(7.5 * scale)}px Inter, Arial, sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText((store.settings?.companyName || 'STOKKITA').toUpperCase(), itemW / 2, Math.round(9 * scale));

          // Name
          ctx.fillStyle = '#0f172a';
          ctx.font = `bold ${Math.round(9.5 * scale)}px Inter, Arial, sans-serif`;
          ctx.fillText(item.name, itemW / 2, Math.round(17 * scale), itemW - 20);

          // Code
          if (codeType === 'barcode') {
            const barCanvas = document.createElement('canvas');
            try {
              JsBarcode(barCanvas, codeText, { format: 'CODE128', width: 2, height: 40, displayValue: false, margin: 0 });
              const bWidth = Math.min(itemW - 20, barCanvas.width);
              const bHeight = Math.round(18 * scale);
              ctx.drawImage(barCanvas, (itemW - bWidth) / 2, Math.round(20 * scale), bWidth, bHeight);
            } catch (e) { }
          } else {
            let qrDataUrl = '';
            if (typeof qrcode === 'function') {
              try { const qr = qrcode(0, 'M'); qr.addData(codeText); qr.make(); qrDataUrl = qr.createDataURL(4, 4); } catch (e) { }
            }
            if (!qrDataUrl && typeof QRious === 'function') {
              try { const qr = new QRious({ value: codeText, size: 120, padding: 6, level: 'M' }); qrDataUrl = qr.toDataURL(); } catch (e) { }
            }
            if (qrDataUrl) {
              const img = new Image();
              img.src = qrDataUrl;
              const qrSize = Math.round(22 * scale);
              ctx.drawImage(img, (itemW - qrSize) / 2, Math.round(20 * scale), qrSize, qrSize);
            }
          }

          if (textUnder !== 'none') {
            ctx.fillStyle = '#1e293b';
            ctx.font = `bold ${Math.round(8 * scale)}px monospace, monospace`;
            ctx.fillText(codeText, itemW / 2, Math.round(itemH - 12 * scale), itemW - 16);
          }

          if (item.buyPrice) {
            ctx.fillStyle = '#125646';
            ctx.font = `bold ${Math.round(8.5 * scale)}px Inter, Arial, sans-serif`;
            ctx.fillText(`Rp ${rupiah.format(item.buyPrice)} / ${item.unit || 'PCS'}`, itemW / 2, itemH - Math.round(4 * scale));
          }

          ctx.restore();
        });

        canvas.toBlob(blob => {
          if (!blob) return;
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `Lembar_Label_StokKita_${items.length}_Item.png`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 4000);
          showToast('Lembar Label Diunduh', `Gambar lembaran ${items.length} label berhasil disimpan.`);
        }, 'image/png');
      }
