    body[data-theme="dark"] .login-form .control::placeholder,
    body.dark-mode .login-form .control::placeholder {
      color: rgba(255, 255, 255, 0.45) !important;
    }

    body[data-theme="dark"] .login-form .input-icon,
    body.dark-mode .login-form .input-icon {
      color: #34d399 !important;
    }

    body[data-theme="dark"] .login-quick-label,
    body.dark-mode .login-quick-label {
      color: rgba(255, 255, 255, 0.75) !important;
    }

    body[data-theme="dark"] .quick-chip-btn,
    body.dark-mode .quick-chip-btn {
      background: rgba(255, 255, 255, 0.07) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      color: #6ee7b7 !important;
    }

    body[data-theme="dark"] .quick-chip-btn strong,
    body.dark-mode .quick-chip-btn strong {
      color: #ffffff !important;
    }

    body[data-theme="dark"] .quick-chip-btn:hover,
    body.dark-mode .quick-chip-btn:hover {
      background: rgba(16, 185, 129, 0.2) !important;
      border-color: #34d399 !important;
      color: #a7f3d0 !important;
    }

    body[data-theme="dark"] .pw-toggle-btn,
    body.dark-mode .pw-toggle-btn {
      color: rgba(255, 255, 255, 0.6) !important;
    }

    body[data-theme="dark"] .pw-toggle-btn:hover,
    body.dark-mode .pw-toggle-btn:hover {
      color: #ffffff !important;
      background: rgba(255, 255, 255, 0.1) !important;
    }

    body[data-theme="dark"] .login-footer-security,
    body.dark-mode .login-footer-security {
      color: rgba(255, 255, 255, 0.6) !important;
    }

    /* LIGHT MODE STYLES FOR LOGIN */
    body:not([data-theme="dark"]):not(.dark-mode) .login-split-card {
      background: #ffffff !important;
      border: 1px solid rgba(0, 0, 0, 0.08) !important;
      box-shadow: 0 25px 80px -10px rgba(0, 0, 0, 0.25) !important;
    }

    body:not([data-theme="dark"]):not(.dark-mode) .login-form-section {
      background: #ffffff !important;
      color: #0f172a !important;
      border-left: 1px solid #f1f5f9 !important;
    }

    body:not([data-theme="dark"]):not(.dark-mode) .login-form-header h2 {
      color: #0f172a !important;
    }

    body:not([data-theme="dark"]):not(.dark-mode) .login-form-header p {
      color: #475569 !important;
    }

    body:not([data-theme="dark"]):not(.dark-mode) .login-form-badge {
      color: #059669 !important;
    }

    body:not([data-theme="dark"]):not(.dark-mode) .login-form .field label {
      color: #1e293b !important;
    }

    body:not([data-theme="dark"]):not(.dark-mode) .login-form .control {
      background: #f8fafc !important;
      border: 1px solid #cbd5e1 !important;
      color: #0f172a !important;
    }

    body:not([data-theme="dark"]):not(.dark-mode) .login-form .control:focus {
      border-color: #10b981 !important;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2) !important;
      background: #ffffff !important;
    }

    body:not([data-theme="dark"]):not(.dark-mode) .login-form .control::placeholder {
      color: #94a3b8 !important;
    }

    body:not([data-theme="dark"]):not(.dark-mode) .login-form .input-icon {
      color: #0d9488 !important;
    }

    body:not([data-theme="dark"]):not(.dark-mode) .login-quick-label {
      color: #475569 !important;
    }

    body:not([data-theme="dark"]):not(.dark-mode) .quick-chip-btn {
      background: #f1f5f9 !important;
      border: 1px solid #cbd5e1 !important;
      color: #0f766e !important;
    }

    body:not([data-theme="dark"]):not(.dark-mode) .quick-chip-btn strong {
      color: #0f172a !important;
    }

    body:not([data-theme="dark"]):not(.dark-mode) .quick-chip-btn:hover {
      background: #e6fffa !important;
      border-color: #0d9488 !important;
      color: #047857 !important;
    }

    body:not([data-theme="dark"]):not(.dark-mode) .pw-toggle-btn {
      color: #64748b !important;
    }

    body:not([data-theme="dark"]):not(.dark-mode) .pw-toggle-btn:hover {
      color: #0f172a !important;
      background: #f1f5f9 !important;
    }

    body:not([data-theme="dark"]):not(.dark-mode) .login-footer-security {
      color: #64748b !important;
    }

    /* Common Form Elements */
    .login-form-header {
      margin-bottom: 24px;
      position: relative;
    }

    .login-form-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .login-form-header h2 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .login-form-header p {
      margin: 4px 0 0;
      font-size: 13px;
    }

    .login-form {
      display: grid;
      gap: 16px;
    }

    .login-form .field label {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
      display: block;
    }

    .login-form .control {
      height: 46px;
      font-size: 13px;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .pw-input-wrap {
      position: relative;
    }

    .pw-toggle-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 0;
      padding: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }

    /* Quick Access / Demo Account Chips */
    .login-quick-chips {
      margin-top: -4px;
      margin-bottom: 4px;
    }

    .login-quick-label {
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .login-chips-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .quick-chip-btn {
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-login {
      height: 48px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
      width: 100%;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff !important;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.45);
      transform: translateY(-1px);
    }

    .login-footer-security {
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      text-align: center;
    }

    .login-theme-toggle {
      position: absolute;
      top: 0;
      right: 0;
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    body[data-theme="dark"] .login-theme-toggle,
    body.dark-mode .login-theme-toggle {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #34d399;
    }

    body:not([data-theme="dark"]):not(.dark-mode) .login-theme-toggle {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      color: #475569;
    }

    body[data-theme="dark"] .login-theme-toggle:hover,
    body.dark-mode .login-theme-toggle:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }

    body:not([data-theme="dark"]):not(.dark-mode) .login-theme-toggle:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    @keyframes loginShake {

      0%,
      100% {
        transform: translateX(0);
      }

      20%,
      60% {
        transform: translateX(-6px);
      }

      40%,
      80% {
        transform: translateX(6px);
      }
    }

    .input-error {
      border-color: var(--danger) !important;
      box-shadow: 0 0 0 3px rgba(201, 60, 74, 0.25) !important;
    }

    /* Mobile Responsive for Split Login */
    @media (max-width: 880px) {
      .login-split-card {
        grid-template-columns: 1fr;
        max-width: 480px;
        min-height: auto;
      }

      .login-info-section {
        padding: 30px 24px;
      }

      .login-feature-list {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .login-form-section {
        padding: 32px 24px;
      }
    }

    /* Topbar Logout Button & Sidebar User Chip */
    .logout-btn-top {
      color: var(--ink-500);
    }

    .logout-btn-top:hover {
      color: var(--danger) !important;
      background: var(--danger-soft) !important;
    }

    .sidebar-user-card {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sidebar-user-info {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .sidebar-user-info .avatar {
      width: 32px;
      height: 32px;
      font-size: 12px;
      flex: none;
    }

    .sidebar-user-text {
      min-width: 0;
    }

    .sidebar-user-text strong {
      display: block;
      font-size: 12px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-user-text span {
      display: block;
      font-size: 10px;
      color: #a0bfb5;
    }

    .sidebar-logout-icon-btn {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 8px;
      background: rgba(201, 60, 74, 0.2);
      color: #ff9da6;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      flex: none;
    }

    .sidebar-logout-icon-btn:hover {
      background: var(--danger);
      color: #fff;
    }

    .cat-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--brand-50);
      color: var(--brand-700);
      font-weight: 600;
      font-size: 11px;
    }

    .mobile-bottom-nav {
      display: none;
    }

    .sidebar-backdrop {
      display: none;
    }

    /* Google Sheets Status Pill */
    .sheets-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-700, var(--ink-800));
      white-space: nowrap;
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }

    .sheets-status-pill:hover {
      background: var(--surface);
      color: var(--brand-700);
    }

    .sheets-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      flex-shrink: 0;
    }

    .sheets-status-dot.connected {
      background: #10b981;
    }

    .sheets-status-dot.syncing {
      background: #3b82f6;
    }

    .sheets-status-dot.offline {
      background: #f59e0b;
    }

    .sheets-status-dot.error {
      background: #ef4444;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .spinning svg,
    svg.spinning,
    .icon-btn.spinning svg,
    .icon-btn.spinning .icon {
      animation: spin 0.75s linear infinite;
    }

    .icon-btn.refresh-cloud-btn {
      color: var(--brand-600);
      position: relative;
    }

    .icon-btn.refresh-cloud-btn:hover {
      background: var(--brand-50);
      color: var(--brand-700);
    }

    /* Responsive Application Layout (Unified & Pure Responsive) */
    .app-shell {
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      max-width: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--canvas);
      overflow-x: hidden;
    }

    .sidebar-close-btn {
      display: none;
    }

    @media (max-width: 1180px) {
      .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .report-grid,
      .warehouse-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      .sidebar-close-btn {
        display: inline-flex;
        margin-left: auto;
        color: #dceae5;
        background: rgba(255, 255, 255, .1);
        border: none;
        border-radius: 8px;
        width: 32px;
        height: 32px;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .sidebar-close-btn .icon {
        width: 16px;
        height: 16px;
      }

      .sidebar {
        position: fixed !important;
        transform: translateX(-100%);
        z-index: 60;
        box-shadow: 15px 0 45px rgba(0, 0, 0, .25);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-backdrop {

      opacity: 0;
      transform: translateY(14px) scale(.98);
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }

    #aiChatPanel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: all;
    }

    @media (max-width: 900px) {
      #aiChatPanel {
        bottom: calc(70px + env(safe-area-inset-bottom, 0px));
        right: 10px;
        left: 10px;
        width: auto;
        max-width: none;
        max-height: calc(100dvh - 86px);
        border-radius: 14px;
      }
    }

    .aichat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 12px;

      color: #fff;
      flex: none;
    }

    .aichat-avatar {

      height: 36px;
      border-radius: 50%;
      background: rgba(52, 211, 153, .2);
      border: 1.5px solid rgba(52, 211, 153, .4);

      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex: none;
    }

    .aichat-title {
      flex: 1;
    }

    .aichat-title strong {
      display: block;
      font-size: 14px;
      font-weight: 700;
    }

    .aichat-title span {
      font-size: 11px;
      color: #a7f3d0;
    }

    .aichat-close-btn {
      background: rgba(255, 255, 255, .12);
      border: none;
      color: #fff;
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
    }

    .aichat-close-btn:hover {
      background: rgba(255, 255, 255, .22);
    }

    .aichat-faq-bar {
      padding: 10px 12px 8px;
      background: var(--canvas);
      border-bottom: 1px solid var(--ink-200);
      flex: none;
    }

      margin: 0 0 7px;

      font-weight: 700;
      color: var(--ink-500);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .faq-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;

    .faq-chip {
      border: 1px solid var(--ink-300);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      min-height: 38px;

      background: var(--surface);
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;

      color: #fff;

      color: var(--ink-800);

    .aichat-typing span:nth-child(3) {
      animation-delay: .3s;
    }

      100% {

      }

      40% {

        opacity: 1;
      }

      align-items: center;
      justify-content: center;

      height: 18px;

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'stokkita_inventory_app_v2';
      const rupiah = new Intl.NumberFormat('id-ID');
      const icon = (name, className = 'icon') => `<svg class="${className}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

      // Data Awal Bersih (Bebas dari Data Demo)
      const defaultData = {
        categories: [],
        products: [],
        warehouses: [
          { id: 'W01', code: 'GDG-01', name: 'Gudang Utama', address: '', active: true }
        ],
        users: [
          { id: 'U01', username: 'admin', code: 'ADM', name: 'Administrator', role: 'ADMIN', warehouse: 'Semua Gudang', password: 'admin', active: true, lastLogin: '' }
        ],
        transactions: [],
        damagedItems: [],
        transfers: [],
        opnames: [],
        stockLedger: [],
        auditLogs: [],
        settings: {
          businessName: 'StokKita Inventori',
          phone: '',
          address: '',
          timezone: 'Asia/Jakarta (WIB)',
          rejectNegativeStock: true,
          autoLogoutEnabled: true,
          autoLogoutMinutes: 15,
          aiProvider: 'gemini',
          aiBaseUrl: '',
          geminiApiKey: '',
          geminiModel: 'gemini-2.5-flash',
          geminiTone: 'casual',
          geminiCustomPrompt: '',
          hasGeminiKey: false
        }
      };

      const AI_PROVIDER_PRESETS = {
        gemini: {
          label: 'Google Gemini',
          placeholder: 'Masukkan API Key Google Gemini (AIzaSy...)',
          defaultModel: 'gemini-2.5-flash',
          models: ['gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash', 'gemini-2.5-pro'],
          hintUrl: 'https://aistudio.google.com/app/apikey',
          hintText: 'Google AI Studio (aistudio.google.com)'
        },
        openai: {
          label: 'OpenAI (ChatGPT)',
          placeholder: 'Masukkan API Key OpenAI (sk-...)',
          defaultModel: 'gpt-4o-mini',
          models: ['gpt-4o-mini', 'gpt-4o', 'gpt-4.1-mini', 'gpt-4.1'],
          hintUrl: 'https://platform.openai.com/api-keys',
          hintText: 'OpenAI Platform (platform.openai.com)'
        },
        groq: {
          label: 'Groq (Llama / Mixtral)',
          placeholder: 'Masukkan API Key Groq (gsk_...)',
          defaultModel: 'llama-3.3-70b-versatile',
          models: ['llama-3.3-70b-versatile', 'llama-3.1-8b-instant', 'mixtral-8x7b-32768'],
          hintUrl: 'https://console.groq.com/keys',
          hintText: 'Groq Console (console.groq.com)'
        },
        openrouter: {
          label: 'OpenRouter (Multi-Model)',
          placeholder: 'Masukkan API Key OpenRouter (sk-or-...)',
          defaultModel: 'google/gemini-2.5-flash',
          models: ['google/gemini-2.5-flash', 'openai/gpt-4o-mini', 'anthropic/claude-3.5-sonnet', 'meta-llama/llama-3.3-70b-instruct:free'],
          hintUrl: 'https://openrouter.ai/keys',
          hintText: 'OpenRouter (openrouter.ai)'
        },
        deepseek: {
          label: 'DeepSeek',
          placeholder: 'Masukkan API Key DeepSeek (sk-...)',
          defaultModel: 'deepseek-chat',
          models: ['deepseek-chat', 'deepseek-reasoner'],
          hintUrl: 'https://platform.deepseek.com/api_keys',
          hintText: 'DeepSeek Platform (platform.deepseek.com)'
        },
        custom: {
          label: 'Endpoint Kustom (OpenAI-Compatible)',
          placeholder: 'Masukkan API Key provider eksternal...',
          defaultModel: '',
          models: [],
          hintUrl: '',
          hintText: ''
        }
      };

      function resolveAiEndpointClient(provider, baseUrl) {
        const p = String(provider || 'gemini').trim().toLowerCase();
        const map = {
          openai: 'https://api.openai.com/v1/chat/completions',
          groq: 'https://api.groq.com/openai/v1/chat/completions',
          openrouter: 'https://openrouter.ai/api/v1/chat/completions',
          deepseek: 'https://api.deepseek.com/chat/completions'
        };
        if (map[p]) return map[p];
        if (p === 'custom') {
          let url = String(baseUrl || '').trim();
          if (!url) return '';
          if (!/\/chat\/completions\/?$/i.test(url)) {
            url = url.replace(/\/+$/, '') + '/chat/completions';
          }
          return url;
        }
        return '';
      }

      // Inisialisasi Data Store Langsung dari Database Cloud (Tanpa Menyimpan Database di LocalStorage)
      const LOCAL_CACHE_KEY = 'stokkita_offline_cache_v2';
      const OFFLINE_QUEUE_KEY = 'stokkita_offline_outbox_v2';

      function saveStoreLocalOnly() {
        try {
          localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(store));
          localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(store.offlineQueue || []));
        } catch(e) {
          console.warn('Gagal menyimpan cache offline:', e);
        }
      }

      function loadStore() {
        let d = null;
        try {
          const cached = localStorage.getItem(LOCAL_CACHE_KEY);
          if (cached) {
            d = JSON.parse(cached);
          }
        } catch (e) {
          console.warn('Gagal membaca cache lokal offline:', e);
        }

        if (!d || !d.products) {
          d = JSON.parse(JSON.stringify(defaultData));
        }

        // Muat antrean transaksi offline yang belum disinkronkan
        d.offlineQueue = [];
        try {
          const savedQueue = localStorage.getItem(OFFLINE_QUEUE_KEY);
          if (savedQueue) {
            d.offlineQueue = JSON.parse(savedQueue);
          }
        } catch(e) {}

        // Inisialisasi daftar catatan yang dihapus (Tombstones) agar tidak muncul kembali
        if (!d.deletedRecords || typeof d.deletedRecords !== 'object') {
          d.deletedRecords = {
            transactions: [],
            products: [],
            categories: [],
            warehouses: [],
            transfers: [],
            opnames: [],
            damagedItems: [],
            users: []
          };
        }

        try {
          const savedProv = localStorage.getItem('stokkita_ai_provider');
          if (savedProv) d.settings.aiProvider = savedProv;
          const savedBaseUrl = localStorage.getItem('stokkita_ai_base_url');
          if (savedBaseUrl !== null) d.settings.aiBaseUrl = savedBaseUrl;
          const savedKey = localStorage.getItem('stokkita_gemini_api_key');
          if (savedKey) {
            d.settings.geminiApiKey = savedKey;
            d.settings.hasGeminiKey = true;
          }
          const savedTone = localStorage.getItem('stokkita_gemini_tone');
          if (savedTone) d.settings.geminiTone = savedTone;
          const savedPrompt = localStorage.getItem('stokkita_gemini_prompt');
          if (savedPrompt) d.settings.geminiCustomPrompt = savedPrompt;
        } catch(e) {}
        return d;
      }

      const store = loadStore();

      // ---
      // Tombstone Tracker (Anti-Resurrection System)
      // Menjamin penghapusan permanen: data yang sengaja dihapus tidak akan dihidupkan kembali
      // oleh sinkronisasi latar belakang atau saat rekonsiliasi kembali online.
      // ---
      function markRecordDeleted(entity, id, secondaryKey) {
        if (!store.deletedRecords) store.deletedRecords = {};
        if (!Array.isArray(store.deletedRecords[entity])) store.deletedRecords[entity] = [];
        const k1 = String(id || '').trim().toUpperCase();
        const k2 = secondaryKey ? String(secondaryKey).trim().toUpperCase() : '';
        if (!k1 && !k2) return;
        store.deletedRecords[entity].push({
          k1: k1,
          k2: k2,
          at: Date.now()
        });
        if (store.deletedRecords[entity].length > 300) {
          store.deletedRecords[entity] = store.deletedRecords[entity].slice(-300);
        }
      }

      function isRecordDeleted(entity, id, secondaryKey) {
        if (!store.deletedRecords || !Array.isArray(store.deletedRecords[entity])) return false;
        const k1 = String(id || '').trim().toUpperCase();
        const k2 = secondaryKey ? String(secondaryKey).trim().toUpperCase() : '';
        if (!k1 && !k2) return false;
        return store.deletedRecords[entity].some(item => {
          if (k1 && (item.k1 === k1 || item.k2 === k1)) return true;
          if (k2 && (item.k1 === k2 || item.k2 === k2)) return true;
          return false;
        });
      }

      const SHEETS_URL_KEY = 'stokkita_sheets_url_v2';

      // Google Sheets Realtime State & Environment Detection
      const isAppsScriptEnv = (typeof google !== 'undefined' && google && google.script && typeof google.script.run !== 'undefined');
      const defaultSheetsUrl = 'https://script.google.com/macros/s/AKfycbz_SAMPLE_DEPLOYMENT_ID/exec';
      let storedSheetsUrl = '';
      try {
        storedSheetsUrl = (localStorage.getItem(SHEETS_URL_KEY) || (store.settings && store.settings.googleSheetsUrl) || '').trim();
      } catch (e) { }

      let currentSheetsStatus = (isAppsScriptEnv || storedSheetsUrl) ? 'idle' : 'unconfigured';
      let lastSheetsSyncTime = null;
      let sheetsSyncTimer = null;

      function parseDateTimeToSort(str) {
        if (!str) return 0;
        if (typeof str === 'number') return str;
        const s = String(str).trim();
        const dmyMatch = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})(?:\s+(\d{1,2})[:\.](\d{1,2})(?:[:\.](\d{1,2}))?)?/);
        if (dmyMatch) {
          const day = parseInt(dmyMatch[1], 10);
          const month = parseInt(dmyMatch[2], 10) - 1;
          const year = parseInt(dmyMatch[3], 10);
          const hour = dmyMatch[4] ? parseInt(dmyMatch[4], 10) : 0;
          const min = dmyMatch[5] ? parseInt(dmyMatch[5], 10) : 0;
          const sec = dmyMatch[6] ? parseInt(dmyMatch[6], 10) : 0;
          return new Date(year, month, day, hour, min, sec).getTime();
        }
        const ymdMatch = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})(?:\s+(\d{1,2})[:\.](\d{1,2})(?:[:\.](\d{1,2}))?)?/);
        if (ymdMatch) {
          const year = parseInt(ymdMatch[1], 10);
          const month = parseInt(ymdMatch[2], 10) - 1;
          const day = parseInt(ymdMatch[3], 10);
          const hour = ymdMatch[4] ? parseInt(ymdMatch[4], 10) : 0;
          const min = ymdMatch[5] ? parseInt(ymdMatch[5], 10) : 0;
          const sec = ymdMatch[6] ? parseInt(ymdMatch[6], 10) : 0;
          return new Date(year, month, day, hour, min, sec).getTime();
        }
        const fallback = new Date(s).getTime();
        return isNaN(fallback) ? 0 : fallback;
      }

      function sortLatestFirst(list) {
        if (!Array.isArray(list)) return [];
        return [...list].sort((a, b) => {
          const timeA = parseDateTimeToSort(a.date || a.time || a.createdAt || a.approvalDate || '');
          const timeB = parseDateTimeToSort(b.date || b.time || b.createdAt || b.approvalDate || '');
          if (timeA !== timeB) return timeB - timeA;
          return String(b.transaction_no || b.no || b.id || '').localeCompare(String(a.transaction_no || a.no || a.id || ''), undefined, { numeric: true });
        });
      }

      function updateSheetsStatusUI() {
        const dot = document.getElementById('sheetsStatusDot');
        const text = document.getElementById('sheetsStatusText');
        const syncEl = document.getElementById('syncTime');
        const refreshBtn = document.getElementById('topRefreshBtn');
        if (refreshBtn) {
          if (currentSheetsStatus === 'syncing') {
            refreshBtn.classList.add('spinning');
          } else {
            refreshBtn.classList.remove('spinning');
          }
        }
        if (!dot || !text) return;

        dot.className = 'sheets-status-dot';
        const isNetOffline = (typeof navigator !== 'undefined' && navigator.onLine === false);
        const qLen = (store && store.offlineQueue && store.offlineQueue.length) || 0;

        if (isNetOffline || currentSheetsStatus === 'offline') {
          dot.classList.add('offline');
          text.textContent = qLen > 0 ? ('Offline (' + qLen + ' Antrean)') : 'Mode Offline';
          if (syncEl) {
            syncEl.textContent = qLen > 0
              ? ('Mode Offline: ' + qLen + ' transaksi tersimpan di antrean perangkat, siap disinkronkan.')
              : 'Mode Offline: Transaksi tersimpan lokal di perangkat.';
          }
        } else if (!isAppsScriptEnv && !storedSheetsUrl) {
          dot.classList.add('error');
          text.textContent = 'Hubungkan Sheets';
          if (syncEl) syncEl.textContent = 'Mode Lokal (Google Sheets Belum Terhubung)';
        } else if (currentSheetsStatus === 'syncing') {
          dot.classList.add('syncing');
          text.textContent = qLen > 0 ? ('Sinkron Antrean (' + qLen + ')…') : 'Menyinkronkan…';
          if (syncEl) syncEl.textContent = qLen > 0
            ? ('Sedang mengunggah ' + qLen + ' transaksi antrean offline ke Google Spreadsheet…')
            : 'Menyinkronkan ke Google Spreadsheet…';
        } else if (currentSheetsStatus === 'connected' || currentSheetsStatus === 'idle') {
          dot.classList.add('connected');
          if (isAppsScriptEnv) {
            text.textContent = qLen > 0 ? `Cloud (${qLen} Antrean)` : (lastSheetsSyncTime ? `Cloud (${lastSheetsSyncTime})` : 'Cloud Aktif');
            if (syncEl) syncEl.textContent = `Tersinkron Langsung Google Apps Script ${lastSheetsSyncTime || ''}`;
          } else {
            text.textContent = qLen > 0 ? `Sheets (${qLen} Antrean)` : (lastSheetsSyncTime ? `Sheets (${lastSheetsSyncTime})` : 'Sheets Aktif');
            if (syncEl) syncEl.textContent = `Tersinkron Google Sheets ${lastSheetsSyncTime || ''}`;
          }
        } else if (currentSheetsStatus === 'error') {
          dot.classList.add('error');
          text.textContent = 'Gagal Sinkron';
          if (syncEl) syncEl.textContent = 'Gagal terhubung ke Google Sheets. Periksa kembali URL database Anda.';
        }
      }

      let isSavingToSheets = false;

      function applyFetchedSpreadsheetData(d, isManual) {
        if (!d) return;

        // 1. SMART MERGE PRODUK: Filter produk yang telah dihapus dan pertahankan saldo lokal jika antrean pending
        if (Array.isArray(d.products)) {
          const filteredServerProds = d.products.filter(p => !isRecordDeleted('products', p.id, p.sku));
          const serverSkuSet = new Set(filteredServerProds.map(p => String(p.sku || p.id || '').trim().toUpperCase()));
          
          // Produk lokal yang belum ada di server (dibuat saat offline) dan tidak pernah dihapus
          const pendingLocalProds = (store.products || []).filter(p => {
            const sku = String(p.sku || p.id || '').trim().toUpperCase();
            return sku && !serverSkuSet.has(sku) && !isRecordDeleted('products', p.id, p.sku);
          });

          const hasPendingQueue = (store.offlineQueue && store.offlineQueue.length > 0);

          const mappedServerProds = filteredServerProds.map(p => {
            const min = p.min !== undefined ? Number(p.min) : (p.minStock !== undefined ? Number(p.minStock) : 0);
            const active = p.active !== undefined ? (p.active === true || p.active === 'true' || p.active === 1 || p.active === '1') : true;
            let stocks = (p.stocks && typeof p.stocks === 'object') ? { ...p.stocks } : {};

            // Jika masih ada antrean transaksi offline yang belum terunggah, pertahankan saldo lokal
            if (hasPendingQueue) {
              const localMatch = (store.products || []).find(lp => lp.sku === p.sku || lp.id === p.id);
              if (localMatch && localMatch.stocks) {
                stocks = { ...localMatch.stocks };
              }
            }

            return {
              ...p,
              min,
              minStock: min,
              active,
              stocks
            };
          });

          store.products = [...pendingLocalProds, ...mappedServerProds];
        }

        if (Array.isArray(d.categories)) {
          store.categories = d.categories
            .filter(c => !isRecordDeleted('categories', c.id, c.code || c.name))
            .map(c => ({
              ...c,
              description: c.description || c.desc || ''
            }));
        }
        if (Array.isArray(d.warehouses) && d.warehouses.length > 0) {
          store.warehouses = d.warehouses.filter(w => !isRecordDeleted('warehouses', w.id, w.code || w.name));
        }

        if (Array.isArray(d.users) && d.users.length > 0) {
          store.users = d.users
            .filter(u => !isRecordDeleted('users', u.id, u.username))
            .map(u => ({
              ...u,
              role: String(u.role || 'STAFF').trim().toUpperCase(),
              username: String(u.username || '').trim().toLowerCase(),
              active: u.active !== undefined ? (u.active === true || u.active === 'true' || u.active === 1 || u.active === '1') : true
            }));
        }

        // 2. SMART MERGE TRANSAKSI: Filter transaksi yang telah dihapus & pertahankan transaksi offline
        if (Array.isArray(d.transactions)) {
          const filteredServerTx = d.transactions.filter(t => !isRecordDeleted('transactions', t.transaction_no || t.no, t.id));
          const serverTxNoSet = new Set(filteredServerTx.map(t => String(t.transaction_no || t.no || '').trim().toUpperCase()));

          // Transaksi lokal yang baru dibuat saat offline (belum tercatat di server) dan tidak dihapus
          const pendingLocalTx = (store.transactions || []).filter(t => {
            const no = String(t.transaction_no || t.no || '').trim().toUpperCase();
            return no && !serverTxNoSet.has(no) && !isRecordDeleted('transactions', no, t.id);
          });

          store.transactions = sortLatestFirst([
            ...pendingLocalTx,
            ...filteredServerTx.map(t => {
              const no = t.transaction_no || t.no || '';
              return { ...t, transaction_no: no, no };
            })
          ]);
        }

        // 3. SMART MERGE MUTASI LAINNYA (Transfers, Opnames, Damaged, Ledger)
        if (Array.isArray(d.transfers)) {
          const filteredTr = d.transfers.filter(tr => !isRecordDeleted('transfers', tr.transaction_no || tr.no, tr.id));
          const sTrSet = new Set(filteredTr.map(tr => String(tr.transaction_no || tr.no || '').trim().toUpperCase()));
          const pendingTr = (store.transfers || []).filter(tr => {
            const no = String(tr.transaction_no || tr.no || '').trim().toUpperCase();
            return no && !sTrSet.has(no) && !isRecordDeleted('transfers', no, tr.id);
          });
          store.transfers = sortLatestFirst([...pendingTr, ...filteredTr.map(tr => ({ ...tr, transaction_no: tr.transaction_no || tr.no || '', no: tr.transaction_no || tr.no || '' }))]);
        }

        if (Array.isArray(d.opnames)) {
          const filteredOp = d.opnames.filter(op => !isRecordDeleted('opnames', op.transaction_no || op.no, op.id));
          const sOpSet = new Set(filteredOp.map(op => String(op.transaction_no || op.no || '').trim().toUpperCase()));
          const pendingOp = (store.opnames || []).filter(op => {
            const no = String(op.transaction_no || op.no || '').trim().toUpperCase();
            return no && !sOpSet.has(no) && !isRecordDeleted('opnames', no, op.id);
          });
          store.opnames = sortLatestFirst([...pendingOp, ...filteredOp.map(op => ({
            ...op,
            transaction_no: op.transaction_no || op.no || '',
            no: op.transaction_no || op.no || '',
            itemsCount: op.itemsCount !== undefined ? op.itemsCount : (op.itemsChecked || (op.items ? op.items.length : 0)),
            totalDiff: op.totalDiff !== undefined ? op.totalDiff : (op.differenceTotal || 0),
            items: (op.items || op.lines || []).map(it => {
              const sys = it.sys !== undefined ? Number(it.sys) : Number(it.systemQty || 0);
              const phys = it.phys !== undefined ? Number(it.phys) : Number(it.physicalQty || 0);
              const diff = it.diff !== undefined ? Number(it.diff) : (phys - sys);
              return { ...it, sys, phys, systemQty: sys, physicalQty: phys, diff };
            })
          }))]);
        }

        if (Array.isArray(d.damagedItems)) {
          const filteredDmg = d.damagedItems.filter(dmg => !isRecordDeleted('damagedItems', dmg.transaction_no || dmg.no, dmg.id));
          const sDmgSet = new Set(filteredDmg.map(dmg => String(dmg.transaction_no || dmg.no || '').trim().toUpperCase()));
          const pendingDmg = (store.damagedItems || []).filter(dmg => {
            const no = String(dmg.transaction_no || dmg.no || '').trim().toUpperCase();
            return no && !sDmgSet.has(no) && !isRecordDeleted('damagedItems', no, dmg.id);
          });
          store.damagedItems = sortLatestFirst([...pendingDmg, ...filteredDmg.map(dmg => ({ ...dmg, transaction_no: dmg.transaction_no || dmg.no || '', no: dmg.transaction_no || dmg.no || '' }))]);
        }

        if (Array.isArray(d.stockLedger)) {
          const sLedgerSet = new Set(d.stockLedger.map(l => String(l.id || (l.refNo + l.productId)).trim()));
          const pendingLedger = (store.stockLedger || []).filter(l => {
            const key = String(l.id || (l.refNo + l.productId)).trim();
            return key && !sLedgerSet.has(key);
          });
          store.stockLedger = sortLatestFirst([...pendingLedger, ...d.stockLedger]);
          pruneExpiredStockLedger();
        }
        if (Array.isArray(d.auditLogs)) {
          store.auditLogs = sortLatestFirst(d.auditLogs);
          pruneExpiredAuditLogs();
        }
        if (d.settings && typeof d.settings === 'object' && Object.keys(d.settings).length) {
          store.settings = { ...store.settings, ...d.settings };
          if (store.settings.geminiApiKey) store.settings.hasGeminiKey = true;
        }

        currentSheetsStatus = 'connected';
        const now = new Date();
        lastSheetsSyncTime = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        updateSheetsStatusUI();

        // Simpan hasil rekonsiliasi terbaru secara instan ke LocalStorage
        saveStoreLocalOnly();

        if (isManual) showToast('Sinkronisasi Sukses', 'Seluruh data berhasil diambil langsung dari database Google Spreadsheet.');
        // Cegah re-render paksa jika user sedang di menu Pengaturan atau sedang aktif mengetik di input form
        const isEditingForm = document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
        if (!isManual && (state.route === 'settings' || isEditingForm)) {
          updateHeader();
          return;
        }
        render();
      }

      async function syncFromGoogleSheets(isManual = false) {
        if (!isAppsScriptEnv && !storedSheetsUrl) {
          if (isManual) openSheetsConfigModal();
          return;
        }

        // Jangan timpa data jika penyimpanan lokal ke Google Sheets sedang berjalan
        if (isSavingToSheets && !isManual) {
          return;
        }

        currentSheetsStatus = 'syncing';
        updateSheetsStatusUI();

        // Jika berjalan langsung di dalam Web App Google Apps Script
        if (isAppsScriptEnv) {
          google.script.run
            .withSuccessHandler(function (result) {
              if (typeof result === 'string') {
                try { result = JSON.parse(result); } catch (e) { }
              }
              if (result && result.status === 'success' && result.data) {
                applyFetchedSpreadsheetData(result.data, isManual);
              } else {
                currentSheetsStatus = 'error';
                updateSheetsStatusUI();
                if (isManual) showToast('Koneksi Gagal', result?.message || 'Gagal memuat data dari Spreadsheet.', true);
              }
            })
            .withFailureHandler(function (err) {
              console.warn('Gagal memuat dari Google Apps Script:', err);
              currentSheetsStatus = 'error';
              updateSheetsStatusUI();
              if (isManual) showToast('Koneksi Gagal', 'Gagal memuat: ' + (err?.message || err), true);
            })
            .apiReadAll();
          return;
        }

        // Jika berjalan di browser lokal/eksternal via HTTP Fetch
        try {
          const fetchUrl = storedSheetsUrl + (storedSheetsUrl.includes('?') ? '&' : '?') + 'action=readAll&t=' + Date.now();
          const response = await fetch(fetchUrl);
          const result = await response.json();

          if (result && result.status === 'success' && result.data) {
            applyFetchedSpreadsheetData(result.data, isManual);
          } else {
            throw new Error(result?.message || 'Data tidak valid');
          }
        } catch (err) {
          console.warn('Gagal memuat dari Google Sheets:', err);
          currentSheetsStatus = 'error';
          updateSheetsStatusUI();
          if (isManual) {
            const errStr = err.toString();
            const isCorsOrAuth = errStr.includes('Unexpected token') || errStr.includes('Failed to fetch') || errStr.includes('NetworkError');
            const msg = isCorsOrAuth
              ? 'Tidak dapat mengakses Google Sheets. Pastikan deployment Web App diatur ke "Who has access: Anyone (Siapa saja)".'
              : 'Tidak dapat menghubungi Google Sheets. Periksa URL Web App Anda.';
            showToast('Koneksi Gagal', msg, true);
          }
        }
      }

      function triggerGoogleSheetsSync() {
        if (!isAppsScriptEnv && !storedSheetsUrl) return;
        currentSheetsStatus = 'syncing';
        updateSheetsStatusUI();

        clearTimeout(sheetsSyncTimer);
        sheetsSyncTimer = setTimeout(async () => {
          isSavingToSheets = true;
          // Jika berjalan di dalam Google Apps Script langsung
          if (isAppsScriptEnv) {
            google.script.run
              .withSuccessHandler(function (res) {
                isSavingToSheets = false;
                currentSheetsStatus = 'connected';
                const now = new Date();
                lastSheetsSyncTime = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                updateSheetsStatusUI();
              })
              .withFailureHandler(function (err) {
                isSavingToSheets = false;
                console.error('Gagal menyimpan via google.script.run:', err);
                currentSheetsStatus = 'error';
                updateSheetsStatusUI();
              })
              .apiSaveAll(JSON.stringify(store));
            return;
          }

          // Jika via HTTP fetch (eksternal)
          try {
            await fetch(storedSheetsUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'saveAll', data: store })
            });

            isSavingToSheets = false;
            currentSheetsStatus = 'connected';
            const now = new Date();
            lastSheetsSyncTime = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            updateSheetsStatusUI();
          } catch (err) {
            console.error('Gagal menyimpan ke Google Sheets:', err);
            currentSheetsStatus = 'error';
            updateSheetsStatusUI();
          }
        }, 600);
      }

      function enqueueOfflineTransaction(transaction, ledgerEntries) {
        store.offlineQueue = store.offlineQueue || [];
        const txNo = transaction.transaction_no || transaction.no || ('TX-' + Date.now());
        const existingIdx = store.offlineQueue.findIndex(q => q.txNo === txNo);
        const qItem = {
          id: 'Q_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          txNo: txNo,
          type: transaction.type || 'Transaksi',
          date: transaction.date || new Date().toISOString(),
          transaction: transaction,
          ledgerEntries: ledgerEntries || [],
          createdAt: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
        };
        if (existingIdx !== -1) {
          store.offlineQueue[existingIdx] = qItem;
        } else {
          store.offlineQueue.push(qItem);
        }
        saveStoreLocalOnly();
        currentSheetsStatus = 'offline';
        updateSheetsStatusUI();
        showToast('Tersimpan di Antrean Offline', 'Transaksi ' + txNo + ' tersimpan di perangkat.');
      }

      function removeOfflineQueueItem(txNo) {
        if (!store.offlineQueue || !txNo) return;
        store.offlineQueue = store.offlineQueue.filter(q => q.txNo !== txNo);
        saveStoreLocalOnly();
        updateSheetsStatusUI();
      }

      let isSyncingOfflineQueue = false;

      function syncOfflineQueueToServer(isManual) {
        if (isSyncingOfflineQueue) {
          if (isManual) showToast('Sedang Memproses', 'Sinkronisasi antrean sedang berlangsung...');
          return;
        }
        if (!store.offlineQueue || store.offlineQueue.length === 0) {
          if (isManual) showToast('Antrean Bersih', 'Tidak ada transaksi tertunda yang perlu disinkronkan.');
          return;
        }
        if (typeof navigator !== 'undefined' && navigator.onLine === false) {
          if (isManual) showToast('Masih Offline', 'Perangkat belum terhubung ke internet.');
          return;
        }

        isSyncingOfflineQueue = true;
        currentSheetsStatus = 'syncing';
        updateSheetsStatusUI();

        const pendingCount = store.offlineQueue.length;
        if (isManual) {
          showToast('Menyinkronkan Antrean...', 'Sedang mengunggah ' + pendingCount + ' transaksi ke Google Spreadsheet...');
        }

        function onSyncSuccess() {
          isSyncingOfflineQueue = false;
          store.offlineQueue = [];
          currentSheetsStatus = 'connected';
          const now = new Date();
          lastSheetsSyncTime = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
          saveStoreLocalOnly();
          updateSheetsStatusUI();
          render();
          if (document.getElementById('offlineModalBody')) openOfflineStatusModal();
          showToast('Sinkronisasi Sukses', pendingCount + ' transaksi offline berhasil diunggah ke Google Spreadsheet.');
          // Segarkan data dari Google Spreadsheet
          syncFromGoogleSheets(false);
        }

        function onSyncFailure(err) {
          console.error('Gagal sinkron antrean offline:', err);
          isSyncingOfflineQueue = false;
          currentSheetsStatus = 'error';
          updateSheetsStatusUI();
          render();
          const errDetail = (err && typeof err === 'object' && err.message) ? err.message : String(err || 'Terjadi kendala koneksi cloud');
          showToast('Gagal Sinkronisasi', 'Gagal mengunggah ke Google Sheets: ' + errDetail, true);
        }

        if (isAppsScriptEnv) {
          google.script.run
            .withSuccessHandler(function (res) {
              if (res && res.status === 'error') {
                onSyncFailure(res.message);
              } else {
                onSyncSuccess();
              }
            })
            .withFailureHandler(function (err) {
              onSyncFailure(err);
            })
            .apiSaveAll(JSON.stringify(store));
          return;
        }

        if (storedSheetsUrl) {
          fetch(storedSheetsUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'saveAll', data: store })
          })
            .then(r => r.json())
            .then(res => {
              if (res && res.status === 'error') {
                onSyncFailure(res.message);
              } else {
                onSyncSuccess();
              }
            })
            .catch(err => {
              onSyncFailure(err);
            });
          return;
        }

        isSyncingOfflineQueue = false;
        if (isManual) showToast('Perhatian', 'URL Google Spreadsheet belum terkonfigurasi.', true);
      }

      function syncGranularTransaction(transaction, ledgerEntries) {
        // 1. Simpan selalu ke LocalStorage (Local-First Anti-Data Loss)
        saveStoreLocalOnly();

        // 2. Jika offline secara fisik di browser, simpan ke antrean offline
        if (typeof navigator !== 'undefined' && navigator.onLine === false) {
          enqueueOfflineTransaction(transaction, ledgerEntries);
          return;
        }

        if (!isAppsScriptEnv && !storedSheetsUrl) {
          enqueueOfflineTransaction(transaction, ledgerEntries);
          return;
        }

        const payload = {
          action: 'appendTransaction',
          data: {
            transaction: transaction,
            ledgerEntries: ledgerEntries || []
          }
        };

        if (isAppsScriptEnv) {
          google.script.run
            .withSuccessHandler(function (res) {
              if (res && res.status === 'success') {
                currentSheetsStatus = 'connected';
                const now = new Date();
                lastSheetsSyncTime = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                removeOfflineQueueItem(transaction.transaction_no || transaction.no);
                updateSheetsStatusUI();
                render();
              } else {
                console.warn('Granular sync gagal di server:', res);
                enqueueOfflineTransaction(transaction, ledgerEntries);
              }
            })
            .withFailureHandler(function (err) {
              console.warn('Granular sync gagal kirim:', err);
              enqueueOfflineTransaction(transaction, ledgerEntries);
            })
            .apiAppendTransaction(JSON.stringify(payload.data));
          return;
        }

        if (storedSheetsUrl) {
          fetch(storedSheetsUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          })
            .then(r => r.json())
            .then(res => {
              if (res && res.status === 'success') {
                currentSheetsStatus = 'connected';
                const now = new Date();
                lastSheetsSyncTime = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                removeOfflineQueueItem(transaction.transaction_no || transaction.no);
                updateSheetsStatusUI();
                render();
              } else {
                enqueueOfflineTransaction(transaction, ledgerEntries);
              }
            })
            .catch(err => {
              console.warn('Granular fetch gagal, simpan ke antrean offline:', err);
              enqueueOfflineTransaction(transaction, ledgerEntries);
            });
        }
      }

      // Generator Nomor Transaksi Kustom
      function generateCustomTransactionNo(type, dateInput = null) {
        const settings = store.settings || {};
        let prefix = 'TRX';
        let counter = 1;

        if (type === 'in' || type === 'incoming') {
          prefix = settings.txPrefixIn || 'IN';
          counter = (store.transactions || []).filter(t => (t.type || '').toLowerCase().includes('masuk')).length + 1;
        } else if (type === 'out' || type === 'outgoing') {
          prefix = settings.txPrefixOut || 'OUT';
          counter = (store.transactions || []).filter(t => (t.type || '').toLowerCase().includes('keluar')).length + 1;
        } else if (type === 'transfer') {
          prefix = settings.txPrefixTransfer || 'TRF';
          counter = (store.transfers || []).length + 1;
        } else if (type === 'opname') {
          prefix = settings.txPrefixOpname || 'SO';
          counter = (store.opnames || []).length + 1;
        } else if (type === 'damaged') {
          prefix = settings.txPrefixDamaged || 'DMG';
          counter = (store.damagedItems || []).length + 1;
        }

        const d = dateInput ? new Date(dateInput) : new Date();
        const validD = isNaN(d.getTime()) ? new Date() : d;
        const YYYY = String(validD.getFullYear());
        const MM = String(validD.getMonth() + 1).padStart(2, '0');
        const DD = String(validD.getDate()).padStart(2, '0');
        const YYYYMMDD = `${YYYY}${MM}${DD}`;
        const XXXX = String(counter).padStart(4, '0');

        const pattern = settings.txNumberFormat || '[PREFIX]-YYYYMMDD-XXXX';

        return pattern
          .replace('[PREFIX]', prefix)
          .replace('YYYYMMDD', YYYYMMDD)
          .replace('YYYY', YYYY)
          .replace('MM', MM)
          .replace('DD', DD)
          .replace('XXXX', XXXX);
      }

            const parsed = typeof raw === 'string' ? JSON.parse(raw) : raw;
            if (parsed && typeof parsed === 'object') custom = parsed;
          } catch (e) {}
        }
        const merged = {};
        merged.ADMIN = { ...DEFAULT_ROLE_DEFINITIONS.ADMIN };
        const staffCustom = custom.STAFF || {};
        merged.STAFF = {
          ...DEFAULT_ROLE_DEFINITIONS.STAFF,
          ...staffCustom,

          isAdmin: false,
          menus: Array.isArray(staffCustom.menus) ? staffCustom.menus : [...DEFAULT_ROLE_DEFINITIONS.STAFF.menus],

          const item = custom[k] || {};

      function getProductWarehouseStock(product, warehouse = 'Semua Gudang') {
        if (!product || !product.stocks || typeof product.stocks !== 'object') return 0;
        if (!warehouse || warehouse === 'Semua Gudang') {
          return Object.values(product.stocks).reduce((sum, qty) => sum + Number(qty || 0), 0);
        }
        if (product.stocks[warehouse] !== undefined) return Number(product.stocks[warehouse]) || 0;
        const targetClean = String(warehouse).trim().toLowerCase();
        for (const [k, v] of Object.entries(product.stocks)) {
          if (String(k).trim().toLowerCase() === targetClean) {
            return Number(v) || 0;
          }
        }
        return 0;
      }

      // Helper Functions
      function totalStock(product, warehouse = 'Semua Gudang') {
        return getProductWarehouseStock(product, warehouse);

      function escapeHtml(str) {

      function getProductMin(product) {
        if (product && product.min !== undefined && product.min !== null && product.min !== '' && !isNaN(Number(product.min))) {
          return Math.max(0, Number(product.min));
        }
        return 0;
      }

      function stockState(product, warehouse = 'Semua Gudang') {
        const qty = totalStock(product, warehouse);
        if (qty <= 0) return ['Habis', 'danger'];
        const minVal = getProductMin(product);
        if (minVal > 0 && qty <= minVal) return ['Menipis', 'warning'];
        return ['Aman', 'success'];
      }

      function getCriticalProducts() {
        return store.products.filter(p => {
          if (!p.active) return false;
          const [st] = stockState(p);
          return st === 'Habis' || st === 'Menipis';
        }).sort((a, b) => {
          const stockA = totalStock(a);
          const stockB = totalStock(b);
          if (stockA <= 0 && stockB > 0) return -1;
          if (stockB <= 0 && stockA > 0) return 1;
          return stockA - stockB;
        });
      }

      function parseAuditLogTimestamp(entry) {
        if (!entry) return null;
        const raw = String(entry.time || '').trim();
        if (raw) {
          // Format: DD/MM/YYYY [HH.mm] or DD-MM-YYYY [HH:mm]
          const dmy = raw.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})(?:[T\s]+(\d{1,2})[.:](\d{2}))?/);
          if (dmy) {
            const ts = new Date(Number(dmy[3]), Number(dmy[2]) - 1, Number(dmy[1]), Number(dmy[4] || 0), Number(dmy[5] || 0)).getTime();
            if (!isNaN(ts)) return ts;
          }
          // Format: YYYY-MM-DD [THH:mm:ss]
          const ymd = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
          if (ymd) {
            const ts = new Date(Number(ymd[1]), Number(ymd[2]) - 1, Number(ymd[3]), Number(ymd[4] || 0), Number(ymd[5] || 0), Number(ymd[6] || 0)).getTime();
            if (!isNaN(ts)) return ts;
          }
          const nativeTs = new Date(raw).getTime();
          if (!isNaN(nativeTs)) return nativeTs;
        }
        if (entry.id && /^A\d{12,13}$/.test(String(entry.id))) {
          return Number(String(entry.id).slice(1));
        }
        return null;
      }

      function pruneExpiredAuditLogs(force = false) {
        if (!Array.isArray(store.auditLogs) || store.auditLogs.length === 0) return 0;
        const enabled = force || (store.settings && store.settings.auditLogAutoPurge !== false);
        if (!enabled) return 0;
        const days = Math.max(1, Math.min(365, Number(store.settings?.auditLogRetentionDays) || 30));
        const cutoff = Date.now() - days * 86400000;
        const before = store.auditLogs.length;
        store.auditLogs = store.auditLogs.filter(entry => {
          const ts = parseAuditLogTimestamp(entry);
          return ts === null || ts >= cutoff;
        });
        return before - store.auditLogs.length;
      }

      function pruneExpiredStockLedger(force = false, batchLimit = null) {
        if (!Array.isArray(store.stockLedger) || store.stockLedger.length === 0) {
          return { removed: 0, remainingExpired: 0 };
        }
        const enabled = force || (store.settings && store.settings.stockLedgerAutoPurge !== false);
        if (!enabled) return { removed: 0, remainingExpired: 0 };

        const days = Math.max(1, Math.min(730, Number(store.settings?.stockLedgerRetentionDays) || 90));
        const limit = Math.max(10, Math.min(500, Number(batchLimit || store.settings?.stockLedgerPurgeBatchSize) || 100));
        const cutoff = Date.now() - days * 86400000;

        // Kumpulkan entri yang melewati batas retensi, urutkan dari yang paling lama (bertahap)
        const expiredEntries = [];
        store.stockLedger.forEach((entry, idx) => {
          const ts = parseAuditLogTimestamp({ time: entry.date, id: entry.id });
          if (ts !== null && ts < cutoff) {
            expiredEntries.push({ idx, ts });
          }
        });

        if (expiredEntries.length === 0) {
          return { removed: 0, remainingExpired: 0 };
        }

        expiredEntries.sort((a, b) => a.ts - b.ts);
        const batchIndices = new Set(expiredEntries.slice(0, limit).map(x => x.idx));
        store.stockLedger = store.stockLedger.filter((_, idx) => !batchIndices.has(idx));

        const removed = batchIndices.size;
        const remainingExpired = Math.max(0, expiredEntries.length - removed);
        return { removed, remainingExpired };
      }

      // Image Compression & Processing Helper
      function compressImageFile(file, maxWidth = 800, quality = 0.58) {
        return new Promise((resolve, reject) => {
          if (!file || !file.type || !file.type.startsWith('image/')) {
            return reject(new Error('File yang dipilih bukan gambar yang valid.'));
          }
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              let width = img.width;
              let height = img.height;
              const maxDim = maxWidth;
              if (width > maxDim || height > maxDim) {
                if (width >= height) {
                  height = Math.round((height * maxDim) / width);
                  width = maxDim;
                } else {
                  width = Math.round((width * maxDim) / height);
                  height = maxDim;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);

              let curQuality = quality;
              let dataUrl = canvas.toDataURL('image/jpeg', curQuality);

              // Jaminan string Base64 <= 42.000 karakter agar tidak melebihi batas sel Google Spreadsheet (50.000 karakter)
              if (dataUrl.length > 42000) {
                dataUrl = canvas.toDataURL('image/jpeg', 0.45);
              }
              if (dataUrl.length > 42000) {
                const c2 = document.createElement('canvas');
                c2.width = Math.round(width * 0.75);
                c2.height = Math.round(height * 0.75);
                const ctx2 = c2.getContext('2d');
                ctx2.drawImage(canvas, 0, 0, c2.width, c2.height);
                dataUrl = c2.toDataURL('image/jpeg', 0.45);
              }

              resolve(dataUrl);
            };
            img.onerror = () => reject(new Error('Gagal memproses file gambar.'));
            img.src = e.target.result;
          };
          reader.onerror = () => reject(new Error('Gagal membaca file gambar.'));
          reader.readAsDataURL(file);
        });
      }

        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: {

        });

      canvasEl.height = Math.round(videoEl.videoHeight * scale);

        const width = Math.min(480, screen.availWidth - 24);
        const height = Math.min(760, screen.availHeight - 40);
        const left = Math.max(0, Math.round((screen.availWidth - width) / 2));
        const top = Math.max(0, Math.round((screen.availHeight - height) / 2));

        try {
          localStorage.removeItem(CAMERA_STORAGE_KEY);
        } catch (e) { }

        cameraPopupWindow = window.open(
          '',
          'stokkita_camera_popup',
          `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes`
        );

        if (!cameraPopupWindow) {
          showToast('Popup Diblokir', 'Browser memblokir jendela kamera. Silakan izinkan popup untuk situs ini.', true);
          return;
        }

        const html = createCameraPopupHTML(targetProp, containerId);
        try {
          cameraPopupWindow.document.open();
          cameraPopupWindow.document.write(html);
          cameraPopupWindow.document.close();
          cameraPopupWindow.focus();
        } catch (err) {
          try {
            const blob = new Blob([html], { type: 'text/html' });
            cameraPopupWindow.location.href = URL.createObjectURL(blob);
          } catch (e) {
            console.error('Gagal menulis ke popup kamera:', e);
          }
        }

        startCameraPollingFallback(targetProp, containerId);
        showToast('Kamera Terbuka', 'Jendela kamera mandiri telah dibuka. Ambil foto lalu klik "Gunakan Foto Ini".');
      }

      function handleReceivedCameraPhoto(data) {
        if (!data || data.type !== 'STOKKITA_CAMERA_PHOTO_RESULT' || !data.photoId) return;
        if (processedPhotoIds.has(data.photoId)) return;
        processedPhotoIds.add(data.photoId);

        setTimeout(() => processedPhotoIds.delete(data.photoId), 60000);

        const targetProp = data.targetProp || 'transactionPhoto';
        const containerId = data.containerId || 'txPhotoContainer';
        const base64 = data.imageBase64;

        if (typeof base64 === 'string' && base64.startsWith('data:image/')) {
          state[targetProp] = base64;
          updatePhotoAttachmentContainer(containerId, base64);
          showToast('Foto Berhasil Dilampirkan', 'Foto bukti berhasil diterima dan siap disimpan bersama data.');
        }
